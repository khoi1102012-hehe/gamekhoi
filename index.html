<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Trạm Không Gian - Săn Sát Nhân</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#05070d;color:#e8ecf4;font-family:system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden;user-select:none}
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:16px;
 background:radial-gradient(ellipse at 30% 20%,#1b2a4d 0,#080b16 70%)}
.screen.on{display:flex}
h1{margin:0;font-size:clamp(28px,6vw,54px);letter-spacing:2px;text-align:center;text-shadow:0 0 24px #4aa3ff88}
h1 span{color:#ff4b5c}
.sub{opacity:.7;margin-top:-8px;text-align:center}
.panel{background:#121a2fcc;border:1px solid #2c3b66;border-radius:16px;padding:18px;width:min(460px,100%);display:flex;flex-direction:column;gap:12px}
input[type=text]{background:#0a1022;border:1px solid #34467a;color:#fff;border-radius:10px;padding:12px;font-size:16px;width:100%;outline:none}
input[type=text]:focus{border-color:#4aa3ff}
label{font-size:13px;opacity:.75}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 16px;background:#2d6cdf;color:#fff;font-weight:700}
button:hover{filter:brightness(1.15)}button:disabled{opacity:.4;cursor:not-allowed}
button.red{background:#d6334a}button.green{background:#2e9d57}button.gray{background:#38425f}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw.sel{border-color:#fff;box-shadow:0 0 10px #fff8}
.code{font-size:40px;font-weight:800;letter-spacing:8px;text-align:center;color:#ffd84a;background:#0a1022;border-radius:12px;padding:8px}
.plist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pl{display:flex;align-items:center;gap:8px;background:#0a1022;border-radius:10px;padding:8px 10px;font-size:14px}
.dot{width:16px;height:16px;border-radius:50%;flex:none}
#game{position:fixed;inset:0;display:none;background:#000}
#game.on{display:block}
canvas{display:block;width:100%;height:100%}
#hudTop{position:absolute;left:10px;top:10px;width:min(300px,55vw);pointer-events:none}
#bar{height:16px;background:#0008;border:2px solid #fff6;border-radius:10px;overflow:hidden}
#barf{height:100%;width:0;background:linear-gradient(90deg,#3ddc84,#c9ff6b);transition:width .4s}
#tasks{margin-top:8px;background:#000a;border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.5}
#tasks .d{text-decoration:line-through;opacity:.5;color:#6f6}
#roleTag{position:absolute;right:10px;top:10px;padding:6px 12px;border-radius:10px;background:#000a;font-weight:700;font-size:14px}
#btns{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
#btns button{width:96px;height:96px;border-radius:50%;font-size:15px;box-shadow:0 4px 14px #000a;border:3px solid #fff5}
#btns button[hidden]{display:none}
#btnUse{background:#2e9d57}#btnRep{background:#e08a1e}#btnKill{background:#d6334a}
#joy{position:absolute;left:18px;bottom:18px;width:130px;height:130px;border-radius:50%;background:#fff1;border:2px solid #fff3;touch-action:none;display:none}
#knob{position:absolute;left:35px;top:35px;width:60px;height:60px;border-radius:50%;background:#fff6}
@media (pointer:coarse){#joy{display:block}}
#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#000c;padding:8px 18px;border-radius:20px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none}
#hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:12px;opacity:.55;pointer-events:none;text-align:center}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:20;background:#000d;text-align:center;padding:16px}
.ov.on{display:flex}
#revealT{font-size:clamp(30px,7vw,64px);font-weight:900;text-shadow:0 0 30px currentColor}
#modal .box{background:#18213a;border:2px solid #4a5d99;border-radius:16px;padding:18px;min-width:min(380px,94vw);display:flex;flex-direction:column;gap:12px;align-items:center}
.wire{width:56px;height:34px;border-radius:8px;border:3px solid #fff3}
.wire.sel{border-color:#fff}.wire.ok{opacity:.35;pointer-events:none}
.keypad{display:grid;grid-template-columns:repeat(3,64px);gap:8px}
.keypad button{height:52px;font-size:20px;background:#2b3a66}
.scr{font-size:32px;letter-spacing:10px;background:#000;color:#6ff;padding:6px 16px;border-radius:8px;min-width:160px;text-align:center;height:48px}
.pbar{width:280px;height:22px;background:#0a1022;border-radius:12px;overflow:hidden}.pbar>div{height:100%;width:0;background:#4aa3ff}
#orderBox{position:relative;width:300px;height:200px;background:#0a1022;border-radius:12px}
#orderBox b{position:absolute;width:38px;height:38px;border-radius:50%;background:#e08a1e;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px}
#meet{display:none;position:fixed;inset:0;z-index:30;background:radial-gradient(ellipse,#1a2646,#070a14);flex-direction:column;padding:12px;gap:10px}
#meet.on{display:flex}
#mtHead{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:18px}
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{display:flex;align-items:center;gap:8px;background:#16213d;border:2px solid #2c3b66;border-radius:10px;padding:8px;cursor:pointer;font-size:14px;position:relative}
.card.dead{opacity:.35;filter:grayscale(1);cursor:default}
.card.me{border-color:#4aa3ff}.card.pick{border-color:#ffd84a;background:#3a3a18}
.card .vt{margin-left:auto;font-weight:900;color:#ffd84a}
#mtMsg{text-align:center;font-weight:800;font-size:20px;min-height:28px;color:#ffd84a}
#chatLog{flex:1;overflow:auto;background:#0a1022;border-radius:10px;padding:8px;font-size:14px;line-height:1.5;min-height:90px}
#chatLog b{margin-right:6px}
</style>
</head>
<body>

<!-- MENU -->
<div id="menu" class="screen on">
  <h1>TRẠM <span>KHÔNG GIAN</span></h1>
  <div class="sub">Tìm ra kẻ sát nhân trước khi quá muộn</div>
  <div class="panel">
    <div><label>Tên của bạn</label><input id="name" type="text" maxlength="12" placeholder="Nhập tên..."></div>
    <div><label>Chọn màu</label><div class="colors" id="colors"></div></div>
    <button class="green" id="bCreate">🚀 Tạo phòng</button>
    <div class="row"><input id="joinCode" type="text" maxlength="5" placeholder="Mã phòng" style="text-transform:uppercase"><button id="bJoin">Vào phòng</button></div>
    <button class="gray" id="bQuick">⚡ Chơi nhanh</button>
  </div>
  <div class="sub" style="font-size:12px;max-width:460px">Tạo phòng → gửi mã 5 ký tự cho bạn bè (online thật, chủ phòng giữ tab mở). Chơi nhanh = offline với bot. Điều khiển: WASD/phím mũi tên • E dùng • R báo cáo • Q giết</div>
</div>

<!-- LOBBY -->
<div id="lobby" class="screen">
  <h1>PHÒNG CHỜ</h1>
  <div class="panel">
    <label>Mã phòng</label><div class="code" id="roomCode">-----</div>
    <div class="plist" id="plist"></div>
    <div id="lobbyMsg" class="sub" style="margin:0;font-size:13px"></div>
    <div class="row"><label style="flex:2">Số bot: <b id="nbV">6</b></label><input type="range" id="nb" min="0" max="9" value="6" style="flex:3"></div>
    <div class="row"><label style="flex:2">Sát nhân</label><select id="ni" style="flex:3;padding:8px;border-radius:8px;background:#0a1022;color:#fff;border:1px solid #34467a"><option value="1">1</option><option value="2">2</option></select></div>
    <div class="row"><button class="gray" id="bBack">⬅ Rời phòng</button><button class="green" id="bStart">▶ Bắt đầu</button></div>
  </div>
</div>

<!-- GAME -->
<div id="game">
  <canvas id="cv"></canvas>
  <div id="hudTop"><div id="bar"><div id="barf"></div></div><div id="tasks"></div></div>
  <div id="roleTag"></div>
  <div id="toast"></div>
  <div id="hint">WASD/mũi tên di chuyển • E dùng • R báo cáo • Q giết</div>
  <div id="joy"><div id="knob"></div></div>
  <div id="btns">
    <button id="btnKill" hidden>GIẾT<br>(Q)</button>
    <button id="btnRep" hidden>BÁO CÁO<br>(R)</button>
    <button id="btnUse" hidden>DÙNG<br>(E)</button>
  </div>
</div>

<div id="reveal" class="ov"><div id="revealT"></div><div id="revealS" style="font-size:18px"></div></div>
<div id="modal" class="ov"><div class="box" id="mbox"></div></div>

<div id="meet">
  <div id="mtHead"><span id="mtTitle">HỌP KHẨN</span><span id="mtTimer"></span></div>
  <div id="cards"></div>
  <div id="mtMsg"></div>
  <div id="chatLog"></div>
  <div class="row"><input id="chatIn" type="text" maxlength="80" placeholder="Nhắn tin..."><button id="chatSend" style="flex:none">Gửi</button><button id="skipBtn" class="gray" style="flex:none">Bỏ qua</button></div>
</div>

<div id="end" class="ov"><div id="endT" style="font-size:clamp(28px,6vw,54px);font-weight:900"></div><div id="endS" style="max-width:520px;line-height:1.7"></div><button id="endBtn">Về menu</button></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const COLORS=['#e53935','#1e88e5','#43a047','#fdd835','#8e24aa','#fb8c00','#00acc1','#ec407a','#8d6e63','#cfd8dc'];
const BOTN=['Bảo','Linh','Minh','Hùng','Trang','Nam','Mai','Khoa','Vy','Phúc','An','Dũng'];
const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ===== MAP ===== */
const ROOMS=[
 {n:'Nhà ăn',r:[600,50,500,300],node:[830,180]},
 {n:'Vũ khí',r:[1300,50,300,260],node:[1450,180]},
 {n:'Động cơ',r:[100,50,300,260],node:[250,180]},
 {n:'Quản lý',r:[650,450,400,260],node:[830,500]},
 {n:'Kho',r:[650,820,400,230],node:[830,935]},
 {n:'Điều hướng',r:[1300,700,300,300],node:[1450,935]},
 {n:'Y tế',r:[100,370,300,240],node:[250,500]},
 {n:'Điện',r:[100,700,300,300],node:[250,935]}];
const CORR=[[1100,150,200,60],[400,150,200,60],[220,310,60,60],[220,610,60,90],[800,350,60,100],[800,710,60,110],[1420,310,60,390],[400,470,250,60],[400,900,250,60],[1050,900,250,60]];
const EDGES=[[0,1],[0,2],[0,3],[3,4],[1,5],[2,6],[6,7],[3,6],[4,7],[4,5]];
const ADJ=ROOMS.map(()=>[]);EDGES.forEach(([a,b])=>{ADJ[a].push(b);ADJ[b].push(a)});
const ALLR=ROOMS.map(r=>r.r).concat(CORR);
const MEETBTN=[850,200];
const TASKDEFS=[
 {n:'Tải dữ liệu',t:'download',x:680,y:100},{n:'Xếp trình tự',t:'order',x:1000,y:300},
 {n:'Nối dây',t:'wires',x:1500,y:100},{n:'Nhập mã',t:'code',x:1350,y:250},
 {n:'Nối dây',t:'wires',x:150,y:100},{n:'Tải dữ liệu',t:'download',x:350,y:260},
 {n:'Nhập mã',t:'code',x:700,y:670},{n:'Xếp trình tự',t:'order',x:1000,y:500},
 {n:'Nối dây',t:'wires',x:700,y:1000},{n:'Nhập mã',t:'code',x:1000,y:870},
 {n:'Tải dữ liệu',t:'download',x:1550,y:780},{n:'Nối dây',t:'wires',x:1350,y:950},
 {n:'Xếp trình tự',t:'order',x:150,y:420},{n:'Tải dữ liệu',t:'download',x:350,y:570},
 {n:'Nối dây',t:'wires',x:150,y:760},{n:'Nhập mã',t:'code',x:350,y:960}];
TASKDEFS.forEach(t=>t.room=roomAt(t.x,t.y));
function inRect(x,y,r){return x>=r[0]&&x<=r[0]+r[2]&&y>=r[1]&&y<=r[1]+r[3]}
function walk(x,y){return ALLR.some(r=>inRect(x,y,r))}
function canMove(x,y){const d=13;return walk(x-d,y-d)&&walk(x+d,y-d)&&walk(x-d,y+d)&&walk(x+d,y+d)}
function roomAt(x,y){let i=ROOMS.findIndex(r=>inRect(x,y,r.r));if(i>=0)return i;let b=0,bd=1e9;ROOMS.forEach((r,k)=>{const d=Math.hypot(r.node[0]-x,r.node[1]-y);if(d<bd){bd=d;b=k}});return b}
function route(a,b){if(a===b)return[];const prev={},q=[a];prev[a]=-1;while(q.length){const c=q.shift();if(c===b)break;for(const n of ADJ[c])if(!(n in prev)){prev[n]=c;q.push(n)}}const p=[];let c=b;while(c!==-1&&c!==undefined){p.unshift(c);c=prev[c]}return p}
function randInRoom(i){const r=ROOMS[i].r;return[rnd(r[0]+40,r[0]+r[2]-40),rnd(r[1]+40,r[1]+r[3]-40)]}

/* ===== AUDIO ===== */
let AC=null;
function beep(f=440,d=.15,type='sine',v=.08){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}

/* ===== MENU / LOBBY ===== */
let S={name:'',color:0,code:'',nb:6,ni:1};
try{S.name=localStorage.getItem('tkg_name')||'';S.color=+localStorage.getItem('tkg_color')||0}catch(e){}
$('name').value=S.name;
function drawSwatches(){$('colors').innerHTML='';COLORS.forEach((c,i)=>{const d=document.createElement('div');d.className='sw'+(i===S.color?' sel':'');d.style.background=c;d.onclick=()=>{S.color=i;drawSwatches()};$('colors').appendChild(d)})}
drawSwatches();
function saveProfile(){S.name=($('name').value.trim()||'Người chơi').slice(0,12);try{localStorage.setItem('tkg_name',S.name);localStorage.setItem('tkg_color',S.color)}catch(e){}}
function show(id){['menu','lobby'].forEach(k=>$(k).classList.toggle('on',k===id));$('game').classList.remove('on')}
function genCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=a[Math.floor(Math.random()*a.length)];return s}
const NET={role:'offline',peer:null,hostConn:null,lobby:[],nextLid:1,view:null};
function send(c,m){try{if(c&&c.open)c.send(m)}catch(e){}}
function conns(){return G?G.players.map(p=>p.conn).filter(Boolean):NET.lobby.map(l=>l.conn).filter(Boolean)}
function bcast(m){if(NET.role!=='host')return;conns().forEach(c=>send(c,m))}
function sendHost(m){if(NET.role==='client')send(NET.hostConn,m)}
function leaveNet(){try{NET.peer&&NET.peer.destroy()}catch(e){}NET.role='offline';NET.peer=null;NET.hostConn=null;NET.lobby=[];NET.view=null}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function botCount(h){return Math.max(0,Math.max(Math.min(S.nb,10-h),5-h))}
function openLobby(code){saveProfile();S.code=code;$('roomCode').textContent=code;show('lobby');renderLobby()}

/* --- menu --- */
const NOPEER='Không tải được thư viện online (PeerJS). Hãy kiểm tra Internet rồi tải lại trang.';
$('bCreate').onclick=()=>{saveProfile();if(typeof Peer==='undefined'){alert(NOPEER);return}hostOpen(genCode(),0)};
function hostOpen(code,tries){
  $('bCreate').disabled=true;
  let peer;try{peer=new Peer('tkg-'+code)}catch(e){$('bCreate').disabled=false;alert('Lỗi tạo phòng');return}
  NET.peer=peer;
  peer.on('open',()=>{$('bCreate').disabled=false;NET.role='host';NET.lobby=[{lid:0,name:S.name,ci:S.color,conn:null}];NET.nextLid=1;openLobby(code)});
  peer.on('connection',onHostConn);
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
  peer.on('error',e=>{
    if(e.type==='unavailable-id'&&tries<5){try{peer.destroy()}catch(x){}hostOpen(genCode(),tries+1);return}
    $('bCreate').disabled=false;if(NET.role==='host'&&e.type==='network')return;alert('Lỗi kết nối: '+e.type);
  });
}
$('bJoin').onclick=()=>{
  const c=$('joinCode').value.trim().toUpperCase();
  if(c.length<4){alert('Nhập mã phòng (5 ký tự)');return}
  saveProfile();
  if(typeof Peer==='undefined'){alert(NOPEER);return}
  $('bJoin').disabled=true;
  let done=false;
  const fail=m=>{if(done)return;done=true;clearTimeout(to);$('bJoin').disabled=false;leaveNet();alert(m)};
  const peer=new Peer();NET.peer=peer;
  const to=setTimeout(()=>fail('Không tìm thấy phòng "'+c+'" (hoặc mạng chặn kết nối).'),12000);
  peer.on('error',e=>fail(e.type==='peer-unavailable'?'Không tìm thấy phòng "'+c+'".':'Lỗi kết nối: '+e.type));
  peer.on('open',()=>{
    const conn=peer.connect('tkg-'+c,{reliable:true});NET.hostConn=conn;
    conn.on('open',()=>{if(done)return;done=true;clearTimeout(to);$('bJoin').disabled=false;NET.role='client';S.code=c;conn.send({t:'join',name:S.name,ci:S.color})});
    conn.on('data',clientMsg);
    conn.on('close',()=>{if(NET.role==='client'){leaveNet();G=null;$('game').classList.remove('on');['meet','modal','end','reveal'].forEach(i=>$(i).classList.remove('on'));show('menu');alert('Đã mất kết nối với chủ phòng.')}});
  });
};
$('bQuick').onclick=()=>{saveProfile();NET.role='offline';openLobby(genCode());startGame()};
$('bBack').onclick=()=>{leaveNet();show('menu')};
$('nb').oninput=()=>{S.nb=+$('nb').value;$('nbV').textContent=S.nb;NET.role==='host'?broadcastLobby():renderLobby()};
$('ni').onchange=()=>{S.ni=+$('ni').value;NET.role==='host'?broadcastLobby():renderLobby()};

/* --- lobby --- */
let lobbyBotNames=[];
function renderLobby(){
  const cl=NET.role==='client',v=NET.view;
  $('bStart').style.display=cl?'none':'';$('nb').disabled=cl;$('ni').disabled=cl;
  let humans,nbots;
  if(cl&&v){humans=v.players;nbots=v.bots;$('nb').value=v.nb;$('nbV').textContent=v.nb;$('ni').value=v.ni}
  else if(NET.role==='host'){humans=NET.lobby.map(l=>({name:l.name,ci:l.ci}));nbots=botCount(humans.length)}
  else{humans=[{name:S.name,ci:S.color}];nbots=botCount(1)}
  const used=humans.map(h=>h.ci);
  const free=shuffle(COLORS.map((c,i)=>i).filter(i=>!used.includes(i)));
  lobbyBotNames=shuffle(BOTN).slice(0,nbots);
  let h='';
  humans.forEach((p,i)=>{const me=cl?(v&&i===v.you):i===0;h+=`<div class="pl"><span class="dot" style="background:${COLORS[p.ci]}"></span>${esc(p.name)}${me?' (bạn)':''}${NET.role!=='offline'&&i===0?' 👑':''}</div>`});
  lobbyBotNames.forEach((n,i)=>h+=`<div class="pl"><span class="dot" style="background:${COLORS[free[i%free.length]]}"></span>${n} 🤖</div>`);
  $('plist').innerHTML=h;
  $('lobbyMsg').textContent=cl?'Đang chờ chủ phòng bắt đầu...':(NET.role==='host'?'Gửi mã phòng cho bạn bè • '+humans.length+' người thật + '+nbots+' bot • giữ tab này mở khi chơi':'Chế độ offline: người chơi khác là bot');
}
function broadcastLobby(){
  const players=NET.lobby.map(l=>({name:l.name,ci:l.ci}));
  const bots=botCount(players.length);
  NET.lobby.forEach((l,i)=>{if(l.conn)send(l.conn,{t:'lobby',players,you:i,nb:S.nb,ni:S.ni,bots})});
  renderLobby();
}

/* --- host side --- */
function onHostConn(conn){
  conn.on('data',d=>hostMsg(conn,d));
  conn.on('close',()=>hostLeft(conn));
  conn.on('error',()=>hostLeft(conn));
}
function hostLeft(conn){
  if(G){
    const p=G.players.find(q=>q.conn===conn);
    if(p){p.conn=null;p.isBot=true;p.path=[];p.wait=1;if(G.mt)G.mt.botVoteAt[p.id]=rnd(1,6);toast(p.name+' đã thoát (bot tiếp quản)')}
    return;
  }
  const i=NET.lobby.findIndex(l=>l.conn===conn);
  if(i>0){NET.lobby.splice(i,1);broadcastLobby()}
}
function hostMsg(conn,d){
  if(!d||!d.t)return;
  if(d.t==='join'){
    if(G||NET.lobby.length>=10){send(conn,{t:'err',m:G?'Phòng đang trong trận.':'Phòng đã đầy.'});setTimeout(()=>{try{conn.close()}catch(e){}},300);return}
    if(NET.lobby.some(l=>l.conn===conn))return;
    let ci=+d.ci;
    if(!(ci>=0&&ci<COLORS.length)||NET.lobby.some(l=>l.ci===ci)){ci=COLORS.map((c,i)=>i).filter(i=>!NET.lobby.some(l=>l.ci===i))[0]}
    let nm=String(d.name||'Người chơi').slice(0,12);
    while(NET.lobby.some(l=>l.name===nm))nm=nm.slice(0,10)+Math.floor(Math.random()*90+10);
    NET.lobby.push({lid:NET.nextLid++,name:nm,ci,conn});
    broadcastLobby();return;
  }
  if(!G)return;
  const p=G.players.find(q=>q.conn===conn);if(!p)return;
  switch(d.t){
    case 'pos':
      if(G.state!=='meeting'&&typeof d.x==='number'&&typeof d.y==='number'&&walk(d.x,d.y)){p.tx=d.x;p.ty=d.y;p.face=d.f>=0?1:-1}
      break;
    case 'task':{
      const t=p.tasks.find(t=>t.di===d.di&&!t.done);
      if(t&&Math.hypot(t.x-p.x,t.y-p.y)<140)completeTask(p,t);
      break}
    case 'kill': if(G.state==='play')hostKill(p);break;
    case 'report':{
      if(G.state!=='play'||!p.alive)break;
      const b=G.bodies.find(b=>Math.hypot(b.x-p.x,b.y-p.y)<110);
      if(b)startMeeting(p,b);
      break}
    case 'meet':
      if(G.state==='play'&&p.alive&&p.meetings>0&&Math.hypot(MEETBTN[0]-p.x,MEETBTN[1]-p.y)<85){p.meetings--;startMeeting(p,null)}
      break;
    case 'vote': hostVote(p,d.target);break;
    case 'chat':
      if(G.mt&&G.mt.phase==='discuss'&&p.alive&&typeof d.text==='string'){const tx=d.text.slice(0,80);addChat(p,tx);bcast({t:'chat',id:p.id,text:tx})}
      break;
  }
}

/* --- client side --- */
function clientMsg(d){
  if(!d||!d.t)return;
  switch(d.t){
    case 'err': leaveNet();show('menu');alert(d.m);break;
    case 'lobby':
      NET.view=d;S.nb=d.nb;S.ni=d.ni;
      if(!$('lobby').classList.contains('on'))openLobby(S.code);else renderLobby();
      break;
    case 'start': clientStart(d);break;
    case 's':
      if(!G)break;
      d.p.forEach((a,i)=>{const p=G.players[i];if(!p)return;if(p!==G.me){p.tx=a[0];p.ty=a[1];p.face=a[2]}p.alive=!!a[3]});
      G.bodies=d.b.map(b=>({x:b[0],y:b[1],color:b[2],name:b[3]}));
      G.done=d.d;G.me.cd=d.c;G.me.meetings=d.mt;
      break;
    case 'tp': if(G){G.me.x=d.x;G.me.y=d.y}break;
    case 'killed': if(G){closeModal();G.flash=1;G.shake=1;beep(120,.25,'square',.12);toast('💀 Bạn đã bị giết! Bạn có thể tiếp tục làm nhiệm vụ (hồn ma).')}break;
    case 'meetStart': if(G)clientMeetStart(d);break;
    case 'voted': if(G&&G.mt){if(G.mt.votes[d.id]===undefined)G.mt.votes[d.id]='x';renderCards()}break;
    case 'phase': if(G&&G.mt){G.mt.phase='vote';G.mt.t=22;$('chatIn').disabled=true;toast('Bắt đầu bỏ phiếu!')}break;
    case 'chat': if(G&&G.mt&&G.players[d.id])addChat(G.players[d.id],d.text);break;
    case 'result': if(G&&G.mt)clientResult(d);break;
    case 'meetEnd': if(G){$('meet').classList.remove('on');G.mt=null;G.state='play'}break;
    case 'end': if(G)endGame(!!d.impWin,d.why,d.roles);break;
  }
}$('bStart').onclick=startGame;

/* ===== ACTIONS ===== */
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,2200)}
function nearTask(){const m=G.me;return m.tasks.find(t=>!t.done&&Math.hypot(t.x-m.x,t.y-m.y)<48)}
function nearMeetBtn(){const m=G.me;return m.alive&&m.meetings>0&&Math.hypot(MEETBTN[0]-m.x,MEETBTN[1]-m.y)<55}
function nearBody(){const m=G.me;return m.alive&&G.bodies.find(b=>Math.hypot(b.x-m.x,b.y-m.y)<85)}
function canAct(){return G&&G.state==='play'&&!G.busy}
function doUse(){
  if(!canAct())return;
  const t=nearTask();
  if(t){openTask(t);return}
  if(nearMeetBtn()){
    if(NET.role==='client')sendHost({t:'meet'});
    else{G.me.meetings--;startMeeting(G.me,null)}
  }
}
function doReport(){
  if(!canAct())return;
  const b=nearBody();if(!b)return;
  if(NET.role==='client')sendHost({t:'report'});else startMeeting(G.me,b);
}
function doKill(){
  if(!canAct())return;
  const m=G.me;if(!m.imp||!m.alive)return;
  if(m.cd>0){toast('Chờ hồi chiêu '+Math.ceil(m.cd)+'s');return}
  if(NET.role==='client')sendHost({t:'kill'});else hostKill(m);
}
function hostKill(k){
  if(!k.imp||!k.alive||k.cd>0)return;
  let v=null,bd=95;
  G.players.forEach(q=>{if(q.alive&&!q.imp){const d=dist(q,k);if(d<bd){bd=d;v=q}}});
  if(v)kill(k,v);
}
function kill(k,v){
  v.alive=false;G.bodies.push({x:v.x,y:v.y,color:v.color,name:v.name,id:v.id,killer:k.id});
  k.x=v.x;k.y=v.y;k.tx=v.x;k.ty=v.y;k.cd=20;beep(120,.25,'square',.12);
  if(k.conn)send(k.conn,{t:'tp',x:v.x,y:v.y});
  if(v.conn)send(v.conn,{t:'killed'});
  if(v===G.me){closeModal();G.flash=1;G.shake=1;toast('💀 Bạn đã bị giết! Bạn có thể tiếp tục làm nhiệm vụ (hồn ma).')}
  if(k===G.me){toast('Đã hạ gục '+v.name)}
  checkWin();
}
function completeTask(p,t){
  if(t.done)return;t.done=true;
  if(NET.role==='client'){
    if(p===G.me){sendHost({t:'task',di:t.di});beep(660,.2);if(p.imp)toast('Nhiệm vụ giả hoàn tất (để ngụy trang)')}
    return;
  }
  if(!p.imp){G.done++;}
  if(p===G.me){beep(660,.2);if(p.imp)toast('Nhiệm vụ giả hoàn tất (để ngụy trang)');}
  checkWin();
}
function checkWin(){
  if(!G||G.state==='end'||NET.role==='client')return;
  const imps=G.players.filter(p=>p.imp&&p.alive).length;
  const crew=G.players.filter(p=>!p.imp&&p.alive).length;
  if(imps===0)return endGame(false,'Tất cả sát nhân đã bị loại!');
  if(G.done>=G.total)return endGame(false,'Hoàn thành mọi nhiệm vụ!');
  if(imps>=crew)return endGame(true,'Sát nhân áp đảo phi hành đoàn!');
}
function endGame(impWin,why,roles){
  if(!G||G.state==='end')return;
  G.state='end';closeModal();
  if(roles)G.players.forEach((p,i)=>p.imp=!!roles[i]);
  if(NET.role==='host')bcast({t:'end',impWin,why,roles:G.players.map(p=>p.imp?1:0)});
  const mi=G.me.imp;const win=(impWin===mi);

    G.players.map(p=>`<span style="color:${p.imp?'#ff6b7a':'#aee'}">${esc(p.name)}${p.imp?' (sát nhân)':''}</span>`).join(' • ')+'</div>';
  setTimeout(()=>{$('meet').classList.remove('on');$('end').classList.add('on')},600);
  beep(win?880:150,.6,'triangle');

function botChat(){
  const al=G.players.filter(p=>p.isBot&&p.alive);if(!al.length)return;const b=pick(al);
  const others=G.players.filter(p=>p.alive&&p!==b);const o=others.length?pick(others):b;
  const room=ROOMS[roomAt(b.lastX||b.x,b.lastY||b.y)].n;
  let lines;
  if(b.imp)lines=[`Mình đang ở ${room} làm nhiệm vụ nãy giờ.`,`Mình nghi ${o.name} đó.`,`${o.name} cư xử hơi lạ nha.`,`Đừng vội, chưa có bằng chứng gì cả.`,`Mình thấy ${o.name} đi một mình ở ${pick(ROOMS).n}.`];
  else lines=[`Mình làm nhiệm vụ ở ${room}.`,`Có ai thấy gì không?`,`Mình nghi ${o.name}.`,`${o.name} đang ở đâu lúc nãy?`,`Mình thấy ${o.name} ở gần ${pick(ROOMS).n}.`,`Ai vừa đi cùng ${o.name}?`,`Cẩn thận, đừng vote bừa nhé.`];
  const text=pick(lines);
  addChat(b,text);bcast({t:'chat',id:b.id,text});
}
function botVote(b){
  const mt=G.mt;const al=G.players.filter(p=>p.alive&&p!==b);
  if(b.imp){const t=al.filter(p=>!p.imp);return Math.random()<.2?'skip':(t.length?pick(t).id:'skip')}
  if(mt.killerId!==null&&mt.killerId!==undefined&&G.players[mt.killerId].alive&&Math.random()<.35)return mt.killerId;
  const r=Math.random();if(r<.35||!al.length)return'skip';return pick(al).id;
}
function updateMeet(){const mt=G.mt;if(!mt)return;$('mtTimer').textContent=(mt.phase==='discuss'?'Thảo luận ':mt.phase==='vote'?'Bỏ phiếu ':'')+Math.max(0,Math.ceil(mt.t))+'s'}
function meetingTick(dt){
  const mt=G.mt;if(!mt)return;
  mt.t-=dt;
  if(NET.role==='client'){if(mt.phase!=='result')updateMeet();return}
  if(mt.phase==='result'){if(mt.t<=0)endMeeting();return}
  if(mt.phase==='discuss'){
    mt.nextChat-=dt;if(mt.nextChat<=0){botChat();mt.nextChat=rnd(1.5,3.5)}
    if(mt.t<=0){mt.phase='vote';mt.t=22;mt.vt=0;$('chatIn').disabled=true;bcast({t:'phase'});toast('Bắt đầu bỏ phiếu!')}
  }else if(mt.phase==='vote'){
    mt.vt+=dt;
    G.players.forEach(p=>{if(p.isBot&&p.alive&&mt.votes[p.id]===undefined&&mt.vt>=(mt.botVoteAt[p.id]===undefined?3:mt.botVoteAt[p.id])-2)hostVote(p,botVote(p))});
    const all=G.players.filter(p=>p.alive).every(p=>mt.votes[p.id]!==undefined);
    if(mt.t<=0||all)tally();
  }
  if(G.mt&&G.mt.phase!=='result')updateMeet();
}
function tally(){
  const mt=G.mt;mt.phase='result';mt.t=5;$('chatIn').disabled=false;
  const cnt={};Object.values(mt.votes).forEach(v=>cnt[v]=(cnt[v]||0)+1);
  let best=null,bc=0,tie=false;
  Object.entries(cnt).forEach(([k,c])=>{if(k==='skip')return;if(c>bc){bc=c;best=+k;tie=false}else if(c===bc)tie=true});
  const sk=cnt['skip']||0;
  let msg;
  if(best===null||tie||sk>=bc){msg='Không ai bị đuổi ra ngoài.'}
  else{const p=G.players[best];p.alive=false;msg=`${p.name} đã bị đuổi. ${p.name} ${p.imp?'LÀ':'KHÔNG phải là'} sát nhân.`;beep(p.imp?700:150,.5,'triangle')}
  renderCards(true,cnt);$('mtMsg').textContent=msg;$('mtTimer').textContent='';
  bcast({t:'result',cnt,msg,alive:G.players.map(p=>p.alive?1:0)});
}
function clientResult(d){
  const mt=G.mt;mt.phase='result';mt.t=5;
  d.alive.forEach((a,i)=>{if(G.players[i])G.players[i].alive=!!a});
  $('chatIn').disabled=false;
  renderCards(true,d.cnt);$('mtMsg').textContent=d.msg;$('mtTimer').textContent='';
}
function endMeeting(){
  $('meet').classList.remove('on');G.mt=null;
  G.players.forEach(p=>{if(p.imp)p.cd=Math.max(p.cd,15)});
  G.state='play';
  bcast({t:'meetEnd'});
  checkWin();
}

/* ===== BOT AI ===== */
function goTo(b,pt){
  const from=roomAt(b.x,b.y),to=roomAt(pt[0],pt[1]);
  const rt=route(from,to);b.path=rt.map(i=>ROOMS[i].node.slice());b.path.push(pt);
}
function botUpdate(b,dt){
  if(!b.alive)return;
  b.lastX=b.x;b.lastY=b.y;
  if(b.cd>0)b.cd-=dt;
  if(b.imp&&b.cd<=0&&b.path){
    const vs=G.players.filter(p=>p.alive&&!p.imp&&dist(p,b)<85);
    if(vs.length){const v=vs[0];
      const wit=G.players.filter(p=>p.alive&&p!==b&&p!==v&&!p.imp&&dist(p,b)<280);
      if(wit.length===0||Math.random()<.002){kill(b,v);b.path=[];b.wait=1.5;return}}
  }
  if(!b.imp){
    const bd=G.bodies.find(x=>Math.hypot(x.x-b.x,x.y-b.y)<170);
    if(bd&&Math.random()<dt*1.3&&G.state==='play'){startMeeting(b,bd);return}
  }
  if(b.wait>0){b.wait-=dt;if(b.wait<=0&&b.atTask){completeTask(b,b.atTask);b.atTask=null}return}
  if(b.path.length){
    const t=b.path[0],dx=t[0]-b.x,dy=t[1]-b.y,d=Math.hypot(dx,dy),sp=150*dt;
    if(d<=sp){b.x=t[0];b.y=t[1];b.path.shift();if(!b.path.length){if(b.goalTask){b.atTask=b.goalTask;b.goalTask=null;b.wait=rnd(2.5,5.5)}else b.wait=rnd(1,3.5)}}
    else{b.x+=dx/d*sp;b.y+=dy/d*sp;if(Math.abs(dx)>1)b.face=dx>0?1:-1}
    return;
  }
  if(b.imp){goTo(b,randInRoom(Math.floor(Math.random()*8)));return}
  const t=b.tasks.find(t=>!t.done);
  if(t){b.goalTask=t;goTo(b,[t.x,t.y])}else goTo(b,randInRoom(Math.floor(Math.random()*8)));
}

/* ===== UPDATE / DRAW ===== */
let last=performance.now();
function update(dt){
  if(!G)return;
  G.time+=dt;
  const net=NET.role;
  if(G.state==='meeting'){meetingTick(dt);return}
  if(G.state==='play'||G.state==='reveal'){
    const m=G.me;
    if(G.state==='play'&&!G.busy){
      let dx=(keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0)+joy.x;
      let dy=(keys['s']||keys['arrowdown']?1:0)-(keys['w']||keys['arrowup']?1:0)+joy.y;
      const l=Math.hypot(dx,dy);
      if(l>.05){if(l>1){dx/=l;dy/=l}const sp=(m.alive?200:240)*dt;
        if(canMove(m.x+dx*sp,m.y))m.x+=dx*sp;if(canMove(m.x,m.y+dy*sp))m.y+=dy*sp;if(Math.abs(dx)>.1)m.face=dx>0?1:-1}
    }
    if(m.cd>0)m.cd-=dt;
    const k=Math.min(1,dt*14);
    if(net!=='client'){
      if(G.state==='play')G.players.forEach(p=>{if(p.isBot&&G&&G.state==='play')botUpdate(p,dt)});
      G.players.forEach(p=>{if(!p.isBot&&p!==m){if(p.cd>0)p.cd-=dt;p.x+=(p.tx-p.x)*k;p.y+=(p.ty-p.y)*k}});
      if(net==='host'){G.snapT-=dt;if(G.snapT<=0){G.snapT=.066;snapshot()}}
    }else{
      G.players.forEach(p=>{if(p!==m){p.x+=(p.tx-p.x)*k;p.y+=(p.ty-p.y)*k}});
      G.posT-=dt;
      if(G.posT<=0&&G.state==='play'){G.posT=.05;sendHost({t:'pos',x:Math.round(m.x),y:Math.round(m.y),f:m.face})}
    }
    G.flash=Math.max(0,G.flash-dt);G.shake=Math.max(0,G.shake-dt*2);
  }
  updateHUD();
}
function snapshot(){
  const base={t:'s',p:G.players.map(p=>[Math.round(p.x),Math.round(p.y),p.face,p.alive?1:0]),
    b:G.bodies.map(b=>[Math.round(b.x),Math.round(b.y),b.color,b.name]),d:G.done};
  G.players.forEach(p=>{if(p.conn)send(p.conn,Object.assign({c:Math.ceil(Math.max(0,p.cd)),mt:p.meetings},base))});
}
function updateHUD(){
  const m=G.me;
  $('barf').style.width=Math.min(100,G.done/G.total*100)+'%';
  $('tasks').innerHTML='<b>'+(m.imp?'Nhiệm vụ giả:':'Nhiệm vụ:')+'</b><br>'+m.tasks.map(t=>`<div class="${t.done?'d':''}">${ROOMS[t.room].n}: ${t.n}</div>`).join('');
  const play=G.state==='play'&&!G.busy;
  $('btnUse').hidden=!(play&&(nearTask()||nearMeetBtn()));
  $('btnRep').hidden=!(play&&nearBody());
  $('btnKill').hidden=!(m.imp&&m.alive&&play);
  if(m.imp)$('btnKill').innerHTML=m.cd>0?`${Math.ceil(m.cd)}s`:'GIẾT<br>(Q)';
  $('btnKill').style.opacity=m.cd>0?.45:1;
}
function drawChar(x,y,color,face,alpha,name,dead,nameCol){
  ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);
  if(dead){
    ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(0,6,20,10,0,Math.PI,0);ctx.fill();
    ctx.fillStyle='#fff';ctx.fillRect(-3,-6,6,14);
    ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-10,-1);ctx.lineTo(-4,5);ctx.moveTo(-4,-1);ctx.lineTo(-10,5);ctx.stroke();
    ctx.restore();return}
  ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(0,16,15,5,0,0,7);ctx.fill();
  ctx.strokeStyle='#222';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(0,-27);ctx.stroke();
  ctx.fillStyle='#ffd84a';ctx.beginPath();ctx.arc(0,-28,3.5,0,7);ctx.fill();
  ctx.fillStyle=color;ctx.strokeStyle='#000a';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.arc(0,-2,17,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='#0003';ctx.beginPath();ctx.arc(0,-2,17,0.1,Math.PI-0.1);ctx.fill();
  ctx.fillStyle=color;ctx.fillRect(-12,12,9,6);ctx.fillRect(3,12,9,6);ctx.strokeRect(-12,12,9,6);ctx.strokeRect(3,12,9,6);
  ctx.fillStyle='#e8f4ff';[-7,6].forEach(ex=>{ctx.beginPath();ctx.ellipse(ex+face*2,-5,5,6.5,0,0,7);ctx.fill()});
  ctx.fillStyle='#111';[-7,6].forEach(ex=>{ctx.beginPath();ctx.arc(ex+face*4,-4,2.6,0,7);ctx.fill()});
  ctx.restore();
  if(name){ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillStyle=nameCol||'#fff';ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.strokeText(name,x,y-36);ctx.fillText(name,x,y-36)}
}
function draw(){
  const W=cv.width,H=cv.height;ctx.fillStyle='#05070d';ctx.fillRect(0,0,W,H);
  if(!G)return;
  const m=G.me;
  let sx=0,sy=0;if(G.shake>0){sx=rnd(-6,6)*G.shake;sy=rnd(-6,6)*G.shake}
  const cx=m.x-W/2+sx,cy=m.y-H/2+sy;
  ctx.save();ctx.translate(-cx,-cy);
  // walls & floors
  ctx.fillStyle='#10141f';ALLR.forEach(r=>ctx.fillRect(r[0]-10,r[1]-10,r[2]+20,r[3]+20));
  ALLR.forEach((r,i)=>{ctx.fillStyle=i<8?'#2b3550':'#252d44';ctx.fillRect(r[0],r[1],r[2],r[3])});
  ctx.strokeStyle='#ffffff08';ctx.lineWidth=1;
  ALLR.forEach(r=>{for(let x=r[0];x<=r[0]+r[2];x+=50){ctx.beginPath();ctx.moveTo(x,r[1]);ctx.lineTo(x,r[1]+r[3]);ctx.stroke()}for(let y=r[1];y<=r[1]+r[3];y+=50){ctx.beginPath();ctx.moveTo(r[0],y);ctx.lineTo(r[0]+r[2],y);ctx.stroke()}});
  ROOMS.forEach(rm=>{ctx.font='bold 20px system-ui';ctx.fillStyle='#ffffff30';ctx.textAlign='left';ctx.fillText(rm.n.toUpperCase(),rm.r[0]+12,rm.r[1]+28)});
  // rug in cafeteria
  ctx.fillStyle='#3a4670';ctx.beginPath();ctx.arc(MEETBTN[0],MEETBTN[1],110,0,7);ctx.fill();
  // emergency button
  ctx.fillStyle='#600';ctx.beginPath();ctx.arc(MEETBTN[0],MEETBTN[1],26,0,7);ctx.fill();
  ctx.fillStyle=m.meetings>0?'#f33':'#733';ctx.beginPath();ctx.arc(MEETBTN[0],MEETBTN[1],20,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText('HỌP',MEETBTN[0],MEETBTN[1]+4);
  // task stations
  const tcol={wires:'#4aa3ff',code:'#b06bff',download:'#3ddc84',order:'#ff9f3a'};
  m.tasks.forEach(t=>{
    ctx.fillStyle=t.done?'#444':tcol[t.type];ctx.globalAlpha=t.done?.5:1;
    ctx.beginPath();ctx.roundRect?ctx.roundRect(t.x-18,t.y-18,36,36,8):ctx.rect(t.x-18,t.y-18,36,36);ctx.fill();ctx.globalAlpha=1;
    if(!t.done){ctx.fillStyle='#ffd84a';ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.fillText('!',t.x,t.y-26+Math.sin(G.time*5)*3);
      ctx.fillStyle='#000a';ctx.font='bold 14px system-ui';ctx.fillText(t.type==='wires'?'≋':t.type==='code'?'#':t.type==='download'?'⇩':'123',t.x,t.y+5)}
  });
  // bodies
  G.bodies.forEach(b=>drawChar(b.x,b.y,b.color,1,1,null,true));
  // players
  const vis=G.players.slice().sort((a,b)=>a.y-b.y);
  vis.forEach(p=>{
    if(p===m)return;
    if(!p.alive&&m.alive)return;
    const d=dist(p,m);if(d>R_VIEW(m)+20)return;
    const nc=(m.imp&&p.imp)?'#ff5a6a':'#fff';
    drawChar(p.x,p.y,p.color,p.face,p.alive?1:.4,p.name,false,nc);
  });
  drawChar(m.x,m.y,m.color,m.face,m.alive?1:.45,m.name,false,m.imp?'#ff5a6a':'#fff');
  ctx.restore();
  // fog
  if(m.alive||true){
    const R=R_VIEW(m),px=W/2-sx,py=H/2-sy;
    const g=ctx.createRadialGradient(px,py,R*.35,px,py,R);
    g.addColorStop(0,'rgba(3,5,10,0)');g.addColorStop(.75,'rgba(3,5,10,.55)');g.addColorStop(1,'rgba(3,5,10,.97)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(3,5,10,.97)';
    ctx.fillRect(0,0,W,py-R);ctx.fillRect(0,py+R,W,H);ctx.fillRect(0,py-R,px-R,R*2);ctx.fillRect(px+R,py-R,W,R*2);
  }
  if(G.flash>0){ctx.fillStyle=`rgba(200,0,20,${G.flash*.5})`;ctx.fillRect(0,0,W,H)}
  // mini map
  drawMini(W,H);
}
function R_VIEW(m){return m.alive?(m.imp?420:320):900}
function drawMini(W,H){
  const sc=.08,mw=1700*sc,mh=1100*sc,ox=W-mw-12,oy=52;
  ctx.fillStyle='#000a';ctx.fillRect(ox-4,oy-4,mw+8,mh+8);
  ctx.fillStyle='#4a5a88';ALLR.forEach(r=>ctx.fillRect(ox+r[0]*sc,oy+r[1]*sc,r[2]*sc,r[3]*sc));
  const m=G.me;ctx.fillStyle='#ffd84a';ctx.beginPath();ctx.arc(ox+m.x*sc,oy+m.y*sc,3,0,7);ctx.fill();
  m.tasks.forEach(t=>{if(!t.done){ctx.fillStyle='#ffd84a';ctx.fillRect(ox+t.x*sc-2,oy+t.y*sc-2,4,4)}});
}
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  try{update(dt);draw()}catch(e){console.error(e)}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
