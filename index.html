<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khoi Chide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Be Vietnam Pro",system-ui,sans-serif;
    color:#fff;background:#0b0b14;overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  /* Nền động */
  .bg{position:fixed;inset:0;z-index:-2}
  .bg video{width:100%;height:100%;object-fit:cover}
  .shade{position:fixed;inset:0;z-index:-1;
    background:linear-gradient(180deg,rgba(8,8,20,.35) 0%,rgba(8,8,20,.55) 55%,rgba(8,8,20,.85) 100%)}

  /* Màn hình chạm để vào */
  .gate{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;cursor:pointer;
    background:rgba(8,8,20,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    transition:opacity .6s ease, visibility .6s}
  .gate.hide{opacity:0;visibility:hidden}
  .gate h1{font-size:clamp(28px,7vw,44px);font-weight:800;letter-spacing:.5px}
  .gate p{font-size:15px;opacity:.85;animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}

  /* Nội dung */
  main{max-width:460px;margin:0 auto;padding:56px 20px 40px;
    display:flex;flex-direction:column;gap:26px}
  header{text-align:center}
  .avatar{width:96px;height:96px;border-radius:50%;margin:0 auto 14px;
    background:linear-gradient(135deg,#ff6a88,#7c5cff);display:grid;place-items:center;
    font-size:36px;font-weight:800;border:3px solid rgba(255,255,255,.85);
    box-shadow:0 8px 30px rgba(124,92,255,.45)}
  header h2{font-size:26px;font-weight:800}
  header p{margin-top:6px;font-size:14px;opacity:.85}

  section h3{font-size:13px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;
    opacity:.8;margin:0 4px 10px}
  .list{display:flex;flex-direction:column;gap:10px}
  .item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;
    text-decoration:none;color:#fff;
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    transition:transform .15s ease, background .15s ease}
  a.item:hover{transform:translateY(-2px);background:rgba(255,255,255,.2)}
  a.item:active{transform:scale(.98)}
  .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
  .ico svg{width:22px;height:22px;fill:#fff}
  .tt{background:#111;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
  .yt{background:#ff0033}
  .fb{background:#1877f2}
  .gm{background:linear-gradient(135deg,#22c55e,#0ea5e9)}
  .txt{flex:1;min-width:0}
  .txt b{display:block;font-size:16px;font-weight:600}
  .txt span{display:block;font-size:13px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .arrow{opacity:.7;font-size:20px}
  .item.soon{opacity:.7}
  .badge{font-size:11px;font-weight:600;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.2)}

  footer{text-align:center;font-size:12px;opacity:.6;margin-top:6px}

  /* Nút nhạc */
  .music{position:fixed;right:16px;bottom:16px;z-index:10;width:52px;height:52px;border-radius:50%;
    border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.15);color:#fff;cursor:pointer;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center}
  .music svg{width:22px;height:22px;fill:#fff}
  .music.on{animation:spin 4s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="bg">
  <video autoplay muted loop playsinline poster="poster.jpg">
    <source src="bg.mp4" type="video/mp4">
  </video>
</div>
<div class="shade"></div>

<div class="gate" id="gate">
  <h1>Khoi Chide</h1>
  <p>✨ Chạm để vào ✨</p>
</div>

<main>
  <header>
    <div class="avatar">K</div>
    <h2>Khoi Chide</h2>
    <p>Video • Game • Giải trí 🎮</p>
  </header>

  <section>
    <h3>Kênh của tôi</h3>
    <div class="list">
      <a class="item" href="https://www.tiktok.com/@nhantin123" target="_blank" rel="noopener">
        <div class="ico tt"><svg viewBox="0 0 24 24"><path d="M16.6 5.82A4.28 4.28 0 0 1 15.54 3h-3.09v12.4a2.59 2.59 0 0 1-2.59 2.5c-1.42 0-2.6-1.16-2.6-2.6 0-1.72 1.66-3.01 3.37-2.48V9.66c-3.45-.46-6.47 2.22-6.47 5.64 0 3.33 2.76 5.7 5.69 5.7 3.14 0 5.69-2.55 5.69-5.7V9.01a7.35 7.35 0 0 0 4.3 1.38V7.3s-1.88.09-3.24-1.48z"/></svg></div>
        <div class="txt"><b>TikTok</b><span>@nhantin123</span></div>
        <div class="arrow">›</div>
      </a>
      <a class="item" href="https://www.youtube.com/channel/UCOBov8IPdRpdJuUdEEUuwVg" target="_blank" rel="noopener">
        <div class="ico yt"><svg viewBox="0 0 24 24"><path d="M9.5 15.6V8.4l6.3 3.6-6.3 3.6z"/></svg></div>
        <div class="txt"><b>YouTube</b><span>Đăng ký kênh nhé!</span></div>
        <div class="arrow">›</div>
      </a>
      <a class="item" href="https://www.facebook.com/people/Khoi-Chide/pfbid0MrpsxGaPWUSef31TCLVfXXckdqB18WgwMGu1pF1Vnx6iCexof3knaedCzZfMTufbl/?locale=vi_VN" target="_blank" rel="noopener">
        <div class="ico fb"><svg viewBox="0 0 24 24"><path d="M14 8.5V6.8c0-.8.2-1.3 1.4-1.3H17V2.6c-.3 0-1.2-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4v2H8.3v3.2h2.5V22H14v-10.3h2.5l.4-3.2H14z"/></svg></div>
        <div class="txt"><b>Facebook</b><span>Khoi Chide</span></div>
        <div class="arrow">›</div>
      </a>
    </div>
  </section>

  <section>
    <h3>Game của tôi</h3>
    <div class="list" id="games">
      <div class="item soon">
        <div class="ico gm"><svg viewBox="0 0 24 24"><path d="M21 6H3a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1zM10 13H8v2H6v-2H4v-2h2V9h2v2h2v2zm4.5 2a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm4-3a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg></div>
        <div class="txt"><b>Game 1</b><span>Đang làm, sắp ra mắt</span></div>
        <span class="badge">Sắp có</span>
      </div>
    </div>
  </section>

  <footer>© 2026 Khoi Chide</footer>
</main>

<button class="music" id="musicBtn" aria-label="Bật/tắt nhạc">
  <svg id="icoOn" viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
</button>

<audio id="bgm" src="music.mp3" loop preload="auto"></audio>

<script>
  const bgm = document.getElementById('bgm');
  const btn = document.getElementById('musicBtn');
  const gate = document.getElementById('gate');
  bgm.volume = 0.6;

  function setState(on){
    btn.classList.toggle('on', on);
    btn.style.opacity = on ? '1' : '.6';
  }
  async function play(){
    try { await bgm.play(); setState(true); } catch(e){ setState(false); }
  }
  gate.addEventListener('click', () => {
    gate.classList.add('hide');
    play();
  });
  btn.addEventListener('click', () => {
    if (bgm.paused) play(); else { bgm.pause(); setState(false); }
  });
</script>
</body>
</html>
