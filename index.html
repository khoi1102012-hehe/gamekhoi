<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Game Khôi Làm</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  width:100vw; height:100vh;
  overflow:hidden;
  touch-action:none;
}
#gameCanvas {
  display:block;
  cursor:default;
  touch-action:none;
}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
// ================================================================
//  RED VS SHADOW — Full 2026 v2 + Mobile/PC Mode
// ================================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Running via file:// triggers stricter browser security policies (blocked
// touch/gesture handling in some mobile browsers, blocked module/script
// features in others). Surface this instead of letting controls silently
// fail with no explanation.
const _runningFromFile = location.protocol === 'file:';
if (_runningFromFile) {
  window.addEventListener('DOMContentLoaded', () => {
    const warn = document.createElement('div');
    warn.textContent = '⚠️ Đang mở trực tiếp từ file (file://) — một số trình duyệt di động sẽ chặn cảm ứng/tương tác. Hãy chạy qua một local server (vd: "npx serve" hoặc mở qua http://) để game hoạt động đầy đủ.';
    warn.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#552200;color:#ffcc66;font:12px Arial;padding:6px 10px;text-align:center;';
    document.body.appendChild(warn);
  });
}

// ================================================================
//  GLOBAL STATE
// ================================================================
const _isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
let platformMode = _isTouchDevice ? "MOBILE" : "PC"; // "PC" or "MOBILE" - auto-detected, user can override in Settings
let gameState    = "MENU";
let gameMode     = "PVE"; // PVP mode has been removed — always bot/PVE now
const MAP_SCALE  = 1;     // world width multiplier for GAMEPLAY/CHALLENGE arenas (Road mode has its own, already-scrolling world)
const CHAR_VISUAL_SCALE = 1/1.5; // visual shrink for character bodies + attached skill FX (1.5x smaller), anchored at their feet
const SR = CHAR_VISUAL_SCALE;    // "skill range" scale — shrinks skill hit/AOE ranges by the same factor so tiny characters don't keep giant-sized hitboxes
let campX        = 0;     // camera x offset shared by GAMEPLAY & CHALLENGE (only one active at a time)
let botLevel     = 0;
let MAX_HP       = 200;
let showSettings = false;
let selectedP1   = "red";
let selectedP2   = "shadow";
let selectingPlayer = 1;
let screenShake  = 0;
let projectiles  = [];
let puppets      = [];
let frameCount   = 0;

// ---------- Combat feel: combo counter, crit hits, floating damage numbers ----------
let dmgNumbers        = [];   // floating damage number popups
let comboCount         = 0;   // consecutive hits landed by the human player (p1) without a timeout/being-hit reset
let comboTimer         = 0;   // frames left before the combo decays back to 0
let comboMaxThisRun    = 0;   // best combo reached in the current run (shown on victory/defeat screens)
let _hitSfxCooldown    = 0;   // throttles the hit "thwack" sound so multi-tick ultimates don't machine-gun the audio
const CRIT_CHANCE      = 0.15;
const CRIT_MULT        = 1.6;

// ---------- Road mode session stats (in-memory only, resets on page reload) ----------
let roadBestDistance   = 0;   // longest distance reached this session across all runs
let roadNewRecord      = false;
let roadKillCount      = 0;   // trash enemies defeated in the current run
let roadRunStartFrame  = 0;   // frameCount when the current run began, for an elapsed-time stat

// Challenge
let challengeState    = "IDLE";
let challengeStage    = 1;
let challengeEnemies  = [];
let challengeBosses   = [];
let challengeWaveIdx  = 0;
let challengeWaveSched = [];
let challengeBossSpawned = false;
let challengeResult   = "";
let challengeBossIntroState = "IDLE"; // INTRO_RUNNING, INTRO_DONE, BATTLE

// ================================================================
//  BOSS INTRO MANAGER — FROST KING CINEMATIC (Boss 1 only)
//  ----------------------------------------------------------------
//  This does NOT draw any placeholder. The doomed character in the
//  cinematic is a real `new Fighter(x,y,"frost",dir)` — the exact
//  same class, same reset(), same draw()/_drawInner() code path the
//  playable Frost fighter uses. Its rendering is 100% identical to
//  the player's Frost character because it IS a Frost character,
//  just with player input disabled and its position driven by this
//  manager instead of the keyboard/touch controls.
//
//  The revealed boss is the real `Boss` class (bossId 1), which
//  already has a full hand-drawn "Frost King" body (crown, horns,
//  crystal shoulders, glowing core, aura, footstep-frost trail) —
//  also not a placeholder.
// ================================================================

// ---- small fixed-capacity object pool for ice shards / snow / mist FX ----
// Reused every intro instead of allocating/discarding particle objects,
// so long cinematics never cause GC/frame hitching.
class IceFxPool {
  constructor(size) {
    this.items = new Array(size).fill(null).map(() => ({ active: false }));
  }
  spawn(props) {
    for (const it of this.items) {
      if (!it.active) {
        for (const k in it) delete it[k];
        Object.assign(it, props);
        it.maxLife = props.life;
        it.active = true;
        return it;
      }
    }
    return null; // pool full — drop silently, never grow unbounded
  }
  update() {
    for (const it of this.items) {
      if (!it.active) continue;
      it.x += it.vx || 0;
      it.y += it.vy || 0;
      if (it.grav) it.vy = (it.vy || 0) + it.grav;
      if (it.rotSpeed) it.rot = (it.rot || 0) + it.rotSpeed;
      if (it.drag) { it.vx *= it.drag; it.vy *= it.drag; }
      it.life--;
      if (it.life <= 0) it.active = false;
    }
  }
  forEachActive(fn) { for (const it of this.items) if (it.active) fn(it); }
  clear() { for (const it of this.items) it.active = false; }
}

class BossIntroManager {
  constructor(spawnX, spawnY) {
    this.spawnX = spawnX;
    this.spawnY = spawnY;
    this.state = "IDLE";
    this.stateTimer = 0;
    this.internalFrame = 0;

    this.iceCharacter = null;      // the real playable Fighter("frost") stand-in
    this.magicCircleAlpha = 0;
    this.prison = { visible: false, formProgress: 0, crackList: [], crackProgress: 0, glow: 0 };
    this.shockwave = null;
    this.boss = null;              // the real Boss(1,...) — Frost King
    this.mistAlpha = 0;
    this.bossRevealAlpha = 0;
    this.auraBurst = 0;
    this.flash = null;
    this.showTitle = false;
    this.titleAlpha = 0;
    this.titleDelay = 0;

    this.zoom = 1.0;
    this.focusX = spawnX;

    this.pool = new IceFxPool(140);
    this._audioThrottle = 0;

    // Finite State Machine — durations in frames (~60fps, this codebase's
    // existing frame-counter convention doubles as its delta-time system;
    // no setTimeout anywhere here, everything advances via update()).
    this.FSM = {
      Walking:      { duration: 120, next: "Pause" },        // ~2.0s
      Pause:        { duration: 30,  next: "Freezing" },     // ~0.5s
      Freezing:     { duration: 180, next: "IcePrison" },    // ~3.0s
      IcePrison:    { duration: 90,  next: "Cracking" },     // form + 1s tension
      Cracking:     { duration: 144, next: "Explosion" },    // ~2.4s shaking/cracking
      Explosion:    { duration: 36,  next: "Mist" },         // violent shatter beat
      Mist:         { duration: 80,  next: "BossEntrance" }, // ~1.3s cold fog
      BossEntrance: { duration: 90,  next: "Roar" },         // 3 steps
      Roar:         { duration: 170, next: "BattleStart" },  // roar + title card
      BattleStart:  { duration: 20,  next: "COMPLETE" }
    };
  }

  start() {
    this.state = "Walking";
    this.stateTimer = 0;
    const walkSpeed = 4.3125 * 0.4; // exactly 40% of the playable movement speed
    const dist = walkSpeed * this.FSM.Walking.duration;
    // Reuse the EXACT playable Fighter class/draw code for charType "frost".
    this.iceCharacter = new Fighter(this.spawnX - dist, this.spawnY, "frost", 1);
    this.iceCharacter.targetX = this.spawnX;
    this.iceCharacter.walkSpeed = walkSpeed;
    this.iceCharacter.walking = true;
    this.iceCharacter.frozenProgress = 0;
    this.focusX = this.iceCharacter.x;
  }

  update() {
    this.internalFrame++;
    this.stateTimer++;
    if (this.state !== "IDLE" && this.state !== "COMPLETE") {
      const cfg = this.FSM[this.state];
      if (cfg && this.stateTimer >= cfg.duration) {
        this.state = cfg.next;
        this.stateTimer = 0;
        this._onEnterState(this.state);
        if (this.state === "COMPLETE") return { finished: true };
      }
    }
    switch (this.state) {
      case "Walking":      this._updateWalking(); break;
      case "Pause":        this._updatePause(); break;
      case "Freezing":     this._updateFreezing(); break;
      case "IcePrison":    this._updateIcePrison(); break;
      case "Cracking":     this._updateCracking(); break;
      case "Explosion":    this._updateExplosion(); break;
      case "Mist":         this._updateMist(); break;
      case "BossEntrance": this._updateBossEntrance(); break;
      case "Roar":         this._updateRoar(); break;
      case "BattleStart":  this._updateBattleStart(); break;
    }
    this.pool.update();
    if (this._audioThrottle > 0) this._audioThrottle--;
    return { finished: this.state === "COMPLETE" };
  }

  _onEnterState(state) {
    if (state === "Pause") {
      if (this.iceCharacter) this.iceCharacter.walking = false;
    } else if (state === "IcePrison") {
      this.prison.visible = true;
      sfxIceCrystallize?.();
    } else if (state === "Explosion") {
      this._triggerExplosion();
    } else if (state === "Mist") {
      this._spawnBoss();
    } else if (state === "BossEntrance") {
      // boss already placed by mist, just start walking him in
      if (this.boss) this.boss.entranceStartX = this.boss.x;
    } else if (state === "Roar") {
      this._triggerRoarBurst();
    } else if (state === "BattleStart") {
      sfxBossBattleStart?.();
      this.zoom = 1.0;
      screenShake = 0;
    }
  }

  // ---------------- per-state update logic ----------------
  _updateWalking() {
    const ic = this.iceCharacter;
    if (!ic) return;
    if (ic.walking) {
      const dx = ic.targetX - ic.x;
      if (Math.abs(dx) > 2) ic.x += Math.sign(dx) * ic.walkSpeed;
      else { ic.x = ic.targetX; ic.walking = false; }
    }
    this.focusX = ic.x;
    if (this.internalFrame % 14 === 0 && this._audioThrottle === 0) {
      sfxStep?.(); this._audioThrottle = 8;
    }
  }

  _updatePause() {
    // Stage 3 — the character stops and looks slightly downward. Silence.
  }

  _updateFreezing() {
    const ic = this.iceCharacter;
    if (!ic) return;
    const p = this.stateTimer / this.FSM.Freezing.duration;
    ic.frozenProgress = Math.min(1, p);
    this.magicCircleAlpha = Math.min(1, this.stateTimer / 20);
    if (this.stateTimer === 1) sfxIceFreeze?.();
    if (this.internalFrame % 9 === 0) {
      this.pool.spawn({ type: "snow", x: ic.x + rndInt(-50, 50), y: ic.y - 160, vx: (rng() - 0.5) * 0.6, vy: rng() * 1 + 0.6, life: 90, size: rndInt(2, 4), color: "white" });
    }
    screenShake = Math.max(screenShake, 1.2);
  }

  _updateIcePrison() {
    const dur = this.FSM.IcePrison.duration;
    const p = this.stateTimer / dur;
    this.prison.formProgress = Math.min(1, p * 2.2); // fast formation, then holds
    this.prison.glow = 0.45 + Math.sin(this.internalFrame * 0.05) * 0.15;
    if (this.stateTimer > dur * 0.4) screenShake = Math.max(screenShake, 0.4); // Stage 6 tension
  }

  _updateCracking() {
    const dur = this.FSM.Cracking.duration;
    const progress = this.stateTimer / dur;
    this.prison.crackProgress = progress;
    this.prison.glow = 0.5 + progress * 0.5 + Math.sin(this.internalFrame * 0.2) * 0.1 * progress;
    if (this.stateTimer % 24 === 0) screenShake = Math.max(screenShake, 3 + progress * 5); // every 0.4s
    if (this.stateTimer % 12 === 0) { // every 0.2s — a new crack appears
      const targetCracks = Math.floor(progress * 16) + 2;
      while (this.prison.crackList.length < targetCracks) {
        this.prison.crackList.push({ angle: rng() * Math.PI * 2, len: 40 + rng() * 95, seed: rng() * 1.4 - 0.7 });
      }
      sfxIceCrack?.();
    }
    if (rng() < 0.3 + progress * 0.4) {
      this.pool.spawn({ type: "frag", x: this.spawnX + rndInt(-45, 45), y: this.spawnY - rndInt(60, 480), vx: (rng() - 0.5) * 0.5, vy: rng() * 1.2 + 0.4, life: 40, size: rndInt(2, 5), rot: rng() * Math.PI, rotSpeed: (rng() - 0.5) * 0.2, color: "#bfe9ff" });
    }
  }

  _triggerExplosion() {
    this.prison.visible = false;
    this.iceCharacter = null; // Stage 9 — completely destroyed, never becomes the boss
    screenShake = Math.max(screenShake, 26);
    this.flash = { alpha: 0.9, duration: 14 };
    sfxIceExplode?.();
    sfxIceShatter?.();
    for (let i = 0; i < 16; i++) { // large shards
      const ang = rng() * Math.PI * 2, spd = rng() * 7 + 4;
      this.pool.spawn({ type: "shard_big", x: this.spawnX, y: this.spawnY - 120, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 3, grav: 0.25, life: 70, size: 18 + rng() * 20, rot: rng() * Math.PI * 2, rotSpeed: (rng() - 0.5) * 0.3, color: rndChoice(["#bfe9ff", "#eaffff", "#8fd3ff"]) });
    }
    for (let i = 0; i < 50; i++) { // small shards
      const ang = rng() * Math.PI * 2, spd = rng() * 10 + 3;
      this.pool.spawn({ type: "shard_small", x: this.spawnX, y: this.spawnY - 120, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 2, grav: 0.2, life: 55, size: 4 + rng() * 6, rot: rng() * Math.PI * 2, rotSpeed: (rng() - 0.5) * 0.5, color: "white" });
    }
    for (let i = 0; i < 14; i++) { // cold fog
      this.pool.spawn({ type: "fog", x: this.spawnX + rndInt(-60, 60), y: this.spawnY - rndInt(20, 100), vx: (rng() - 0.5) * 1.2, vy: -rng() * 0.6, life: 110, size: 40 + rng() * 40, color: "#c8ebff" });
    }
    for (let i = 0; i < 30; i++) { // snow burst
      const ang = rng() * Math.PI * 2, spd = rng() * 3 + 1;
      this.pool.spawn({ type: "snow", x: this.spawnX, y: this.spawnY - 100, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, life: 80, size: rndInt(2, 4), color: "white" });
    }
    this.shockwave = { r: 10, alpha: 1 };
  }

  _updateExplosion() {
    if (this.shockwave) {
      this.shockwave.r += 15;
      this.shockwave.alpha -= 0.045;
      if (this.shockwave.alpha <= 0) this.shockwave = null;
    }
  }

  _spawnBoss() {
    // Stage 10 — the real Frost King boss, hidden inside the mist. The
    // player never sees this happen; he simply fades into visibility.
    this.boss = new Boss(1, this.spawnX + 130, this.spawnY);
    this.boss.direction = -1;
    this.mistAlpha = 1.0;
    this.bossRevealAlpha = 0;
  }

  _updateMist() {
    const p = this.stateTimer / this.FSM.Mist.duration;
    this.mistAlpha = Math.max(0, 1 - p * 1.15);
    this.bossRevealAlpha = Math.min(1, p * 1.3);
    if (this.boss) { this.boss.anim++; this.boss._updateFrostKingFX(this.spawnY, 999999); }
    if (rng() < 0.5) this.pool.spawn({ type: "fog", x: this.spawnX + rndInt(-70, 70), y: this.spawnY - rndInt(0, 130), vx: (rng() - 0.5) * 0.8, vy: -rng() * 0.4, life: 60, size: 50 + rng() * 30, color: "#d2ebff" });
  }

  _updateBossEntrance() {
    const dur = this.FSM.BossEntrance.duration, stepDur = dur / 3;
    if (this.boss) {
      const stepIdx = Math.min(2, Math.floor(this.stateTimer / stepDur));
      const stepLocalT = Math.min(1, (this.stateTimer % stepDur) / stepDur);
      const totalGap = 130;
      const walked = (stepIdx + stepLocalT) * (totalGap / 3);
      this.boss.x = (this.boss.entranceStartX ?? this.spawnX + totalGap) - walked;
      this.boss.anim++;
      this.boss._updateFrostKingFX(this.spawnY, 999999);
      if (this.stateTimer % Math.round(stepDur) === 1) { sfxIceCrack?.(); screenShake = Math.max(screenShake, 4); }
    }
    this.bossRevealAlpha = 1;
    this.mistAlpha = Math.max(0, this.mistAlpha - 0.012);
  }

  _triggerRoarBurst() {
    screenShake = Math.max(screenShake, 14);
    this.zoom = 1.18;
    sfxBossRoar?.();
    this.auraBurst = 1.0;
    for (let i = 0; i < 20; i++) {
      const ang = (i / 20) * Math.PI * 2, spd = rng() * 5 + 4;
      this.pool.spawn({ type: "aura", x: this.spawnX, y: this.spawnY - 110, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, life: 40, size: 4 + rng() * 4, color: "#aeeaff" });
    }
    this.titleDelay = 15;
  }

  _updateRoar() {
    if (this.auraBurst > 0) this.auraBurst = Math.max(0, this.auraBurst - 0.02);
    if (this.boss) { this.boss.anim++; this.boss._updateFrostKingFX(this.spawnY, 999999); }
    if (this.titleDelay > 0) { this.titleDelay--; return; }
    const t = this.stateTimer - 15;
    const showDur = this.FSM.Roar.duration - 15;
    if (t >= 0) {
      this.showTitle = true;
      if (t < 20) this.titleAlpha = t / 20;
      else if (t > showDur - 25) this.titleAlpha = Math.max(0, (showDur - t) / 25);
      else this.titleAlpha = 1;
      if (t > showDur - 25 && rng() < 0.6) { // title dissolves into snow
        this.pool.spawn({ type: "snow", x: this.spawnX + rndInt(-90, 90), y: this.spawnY - 260 + rndInt(-20, 20), vx: (rng() - 0.5) * 1.5, vy: rng() * 1 + 0.5, life: 60, size: rndInt(2, 4), color: "white" });
      }
    }
    if (this.stateTimer > showDur * 0.6) this.zoom += (1.0 - this.zoom) * 0.02;
  }

  _updateBattleStart() {
    this.zoom += (1.0 - this.zoom) * 0.15;
    screenShake *= 0.5;
  }

  // ---------------- drawing ----------------
  // World-space visuals (must be called INSIDE the camera translate/zoom).
  drawWorld(ctx, W, H) {
    if (this.state === "IDLE" || !ctx) return;
    if ((this.state === "Pause" || this.state === "Freezing") && this.magicCircleAlpha > 0) {
      this._drawMagicCircle(ctx);
    }
    if (this.iceCharacter) {
      // EXACT same draw() call the playable Frost Fighter uses — no
      // separate/simplified drawing path exists for this character.
      this.iceCharacter.draw(0, 0);
      if (this.iceCharacter.frozenProgress > 0) this._drawFreezeOverlay(ctx, this.iceCharacter);
    }
    if (this.prison.visible) this._drawPrison(ctx);
    this._drawPool(ctx);
    if (this.shockwave) this._drawShockwave(ctx);
    if (this.boss && (this.state === "Mist" || this.state === "BossEntrance" || this.state === "Roar")) {
      this._drawBossReveal(ctx);
    }
  }

  // Screen-space overlays (must be called OUTSIDE the camera translate — a
  // fixed full-screen flash / title card should not drift with the camera).
  drawScreen(ctx, W, H) {
    if (this.state === "IDLE" || !ctx) return;
    if (this.flash && this.flash.alpha > 0) {
      ctx.save();
      ctx.fillStyle = `rgba(255,255,255,${this.flash.alpha})`;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
      this.flash.alpha -= 1 / this.flash.duration;
    }
    if (this.showTitle && this.titleAlpha > 0) this._drawTitle(ctx, W, H);
  }

  _drawMagicCircle(ctx) {
    const x = this.spawnX, y = this.spawnY;
    ctx.save();
    ctx.globalAlpha = this.magicCircleAlpha * 0.85;
    const R = 70;
    ctx.strokeStyle = "#8fe0ff"; ctx.lineWidth = 2; ctx.shadowColor = "#aeeaff"; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.ellipse(x, y + 4, R, R * 0.32, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(x, y + 4, R * 0.7, R * 0.22, 0, 0, Math.PI * 2); ctx.stroke();
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2 + this.internalFrame * 0.01;
      const rx1 = Math.cos(a) * R, ry1 = Math.sin(a) * R * 0.32;
      ctx.beginPath(); ctx.moveTo(x, y + 4); ctx.lineTo(x + rx1, y + 4 + ry1); ctx.stroke();
    }
    ctx.restore();
  }

  // Renders the freeze visibly climbing the body feet→head. This is an
  // actual rendered overlay (clipped rect + gradient + crystal spikes at
  // the boundary), not a hidden variable — the player can watch it rise.
  _drawFreezeOverlay(ctx, ic) {
    const p = ic.frozenProgress || 0;
    if (p <= 0) return;
    const feetY = ic.y, topY = ic.y - 140;
    const freezeTop = feetY - (feetY - topY) * p;
    ctx.save();
    ctx.translate(ic.x, ic.y); ctx.scale(CHAR_VISUAL_SCALE, CHAR_VISUAL_SCALE); ctx.translate(-ic.x, -ic.y);
    ctx.save();
    ctx.beginPath(); ctx.rect(ic.x - 42, freezeTop, 84, feetY - freezeTop); ctx.clip();
    const grad = ctx.createLinearGradient(0, freezeTop, 0, feetY);
    grad.addColorStop(0, "rgba(255,255,255,0.9)");
    grad.addColorStop(0.18, "rgba(205,240,255,0.55)");
    grad.addColorStop(1, "rgba(140,205,255,0.32)");
    ctx.fillStyle = grad; ctx.fillRect(ic.x - 42, freezeTop, 84, feetY - freezeTop);
    ctx.restore();
    if (p < 1) {
      ctx.strokeStyle = "white"; ctx.lineWidth = 3; ctx.shadowColor = "#8fe0ff"; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.moveTo(ic.x - 42, freezeTop); ctx.lineTo(ic.x + 42, freezeTop); ctx.stroke();
      for (let i = -3; i <= 3; i++) {
        const sx = ic.x + i * 12, spike = 9 + Math.abs(i) * 1.6;
        ctx.beginPath(); ctx.moveTo(sx - 4, freezeTop); ctx.lineTo(sx, freezeTop - spike); ctx.lineTo(sx + 4, freezeTop); ctx.closePath();
        ctx.fillStyle = "rgba(215,246,255,0.92)"; ctx.fill();
      }
    }
    ctx.restore();
  }

  // The enormous ice prison — roughly 4x the fighter's height, translucent
  // so the frozen character stays visible inside, with an internal glow,
  // growing cracks, and a stroked crystalline outline.
  _drawPrison(ctx) {
    const cx = this.spawnX, baseY = this.spawnY;
    const h = 560 * this.prison.formProgress;
    const w = 170;
    const topY = baseY - h;
    ctx.save();
    const grad = ctx.createLinearGradient(0, topY, 0, baseY);
    grad.addColorStop(0, `rgba(150,225,255,${0.25 + this.prison.glow * 0.25})`);
    grad.addColorStop(0.5, `rgba(120,205,255,${0.35 + this.prison.glow * 0.3})`);
    grad.addColorStop(1, `rgba(90,180,255,${0.45 + this.prison.glow * 0.25})`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(cx, topY);
    ctx.lineTo(cx + w * 0.55, topY + h * 0.18);
    ctx.lineTo(cx + w * 0.5, baseY);
    ctx.lineTo(cx - w * 0.5, baseY);
    ctx.lineTo(cx - w * 0.55, topY + h * 0.18);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = `rgba(230,250,255,${0.7 + this.prison.crackProgress * 0.3})`;
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.save();
    ctx.shadowColor = "#7eebff"; ctx.shadowBlur = 20 + this.prison.glow * 30;
    ctx.fillStyle = `rgba(140,230,255,${this.prison.glow * 0.45})`;
    ctx.beginPath(); ctx.ellipse(cx, baseY - h * 0.45, w * 0.28, h * 0.35, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = `rgba(255,255,255,${0.5 + this.prison.crackProgress * 0.5})`;
    ctx.lineWidth = 1.6;
    this.prison.crackList.forEach(c => {
      const ox = cx + Math.cos(c.angle) * 10, oy = baseY - h * 0.5 + Math.sin(c.angle) * 10;
      const ex = ox + Math.cos(c.angle + c.seed) * c.len * this.prison.crackProgress;
      const ey = oy + Math.sin(c.angle + c.seed) * c.len * 0.6 * this.prison.crackProgress;
      ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ex, ey); ctx.stroke();
    });
    ctx.restore();
  }

  _drawShockwave(ctx) {
    const sw = this.shockwave;
    ctx.save();
    ctx.globalAlpha = Math.max(0, sw.alpha);
    ctx.strokeStyle = "white"; ctx.lineWidth = 6; ctx.shadowColor = "#aeeaff"; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.ellipse(this.spawnX, this.spawnY - 40, sw.r, sw.r * 0.4, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  _drawPool(ctx) {
    this.pool.forEachActive(it => {
      const a = Math.max(0, it.life / (it.maxLife || it.life || 1));
      ctx.save();
      if (it.type === "snow" || it.type === "aura") {
        ctx.globalAlpha = Math.min(1, a + 0.15);
        ctx.fillStyle = it.color || "white";
        ctx.beginPath(); ctx.arc(it.x, it.y, it.size, 0, Math.PI * 2); ctx.fill();
      } else if (it.type === "frag") {
        ctx.globalAlpha = a;
        ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.rot || 0);
        ctx.fillStyle = it.color; ctx.fillRect(-it.size / 2, -it.size / 2, it.size, it.size);
        ctx.restore();
      } else if (it.type === "shard_big" || it.type === "shard_small") {
        ctx.globalAlpha = a;
        ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.rot || 0);
        ctx.fillStyle = it.color; ctx.strokeStyle = "white"; ctx.lineWidth = 1;
        const s = it.size;
        ctx.beginPath(); ctx.moveTo(0, -s); ctx.lineTo(s * 0.6, 0); ctx.lineTo(0, s); ctx.lineTo(-s * 0.6, 0); ctx.closePath();
        ctx.fill(); ctx.stroke();
        ctx.restore();
      } else if (it.type === "fog") {
        ctx.globalAlpha = a * 0.35;
        ctx.fillStyle = it.color || "#c8ebff";
        ctx.beginPath(); ctx.arc(it.x, it.y, it.size, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    });
  }

  _drawBossReveal(ctx) {
    const b = this.boss;
    const revealAlpha = this.state === "Mist" ? (this.bossRevealAlpha ?? 0) : 1;
    ctx.save(); ctx.globalAlpha = revealAlpha;
    b._drawFrostKingFrostTrail();
    b._drawFrostKingAura(b.x, b.y);
    ctx.restore();
    b._drawFrostKingBody(b.x, b.y, 1, revealAlpha, b.anim); // real Frost King body — no HP bar drawn yet
    if (this.auraBurst > 0) {
      ctx.save();
      ctx.globalAlpha = this.auraBurst * 0.6;
      ctx.strokeStyle = "#aeeaff"; ctx.lineWidth = 4; ctx.shadowColor = "#eaffff"; ctx.shadowBlur = 25;
      ctx.beginPath(); ctx.arc(b.x, b.y - 110, 90 + (1 - this.auraBurst) * 90, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
    if (this.state === "Mist" && this.mistAlpha > 0) {
      ctx.save();
      ctx.globalAlpha = this.mistAlpha * 0.6;
      ctx.fillStyle = "#c8ebff";
      ctx.beginPath(); ctx.ellipse(this.spawnX, this.spawnY - 90, 140, 170, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  _drawTitle(ctx, W, H) {
    ctx.save();
    ctx.globalAlpha = this.titleAlpha;
    ctx.fillStyle = "#00eaff";
    ctx.font = "bold 48px Arial";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.shadowColor = "rgba(120,220,255,0.85)"; ctx.shadowBlur = 18;
    ctx.fillText("❄ FROST KING ❄", W / 2, H / 2 - 30);
    ctx.font = "bold 22px Arial";
    ctx.fillText("THE FROZEN EMPEROR", W / 2, H / 2 + 20);
    ctx.restore();
  }
}

let W, H;
function resizeCanvas() {
  if (platformMode === "MOBILE") {
    // Fixed design resolution (same one the game/UI was built for), scaled
    // via CSS to fit the phone screen. This keeps character size, HUD, and
    // text proportions consistent on every device instead of shrinking the
    // whole game world down to the phone's tiny actual pixel dimensions.
    const DESIGN_W = 1200, DESIGN_H = 700;
    canvas.width  = DESIGN_W;
    canvas.height = DESIGN_H;

    canvas.style.width  = Math.round(DESIGN_W*scale) + "px";

  } else {

    canvas.width  = vw;
    canvas.height = vh;
    canvas.style.width  = vw + "px";
    canvas.style.height = vh + "px";
  }
  W = canvas.width;
  H = canvas.height;
}

const touch2 = { left:false, right:false, up:false, down:false, s1:false, s2:false, s3:false, s4:false, shield:false, v4:false, _joyActive:false };

let mobileLayoutCfg = {
  joystick:{dx:0,dy:0,scale:1},
  s1:{dx:0,dy:0,scale:1}, s2:{dx:0,dy:0,scale:1}, s3:{dx:0,dy:0,scale:1}, s4:{dx:0,dy:0,scale:1},

};
let touchMoveStyle = "joystick"; // "joystick" (drag circle) | "dpad" (Minecraft PE style directional buttons)
let mobileLayoutVersion = 0; // bump whenever mobileLayoutCfg changes to force buildVBtns() to recompute

let touchEditorSelKey = null; // which button is currently selected in the touch editor

let _editorMouseDown = false;

// Virtual button layout (recalculated each draw)
let vBtns1 = {}; // P1 controls (joystick + skills) — always bottom-left joystick
let vBtns2 = {}; // P2 controls (PVP only) — bottom-right joystick

// MOBA-style layout: circular drag joystick for movement + a fan of skill
// buttons with a distinct larger "BIẾN HÌNH" (ultimate/transform) button.
let _vBtnsLayoutKey = null;
function _applyMobileCfg(btn, key) {
  const c = mobileLayoutCfg[key];
  if (!btn || !c) return;
  btn.x += c.dx; btn.y += c.dy;
  if (btn.r !== undefined) btn.r *= c.scale;
}
function buildVBtns() {
  const layoutKey = W+"x"+H+"_"+gameMode+"_"+platformMode+"_"+mobileLayoutVersion;
  if (layoutKey === _vBtnsLayoutKey && vBtns1.joystick) return;
  _vBtnsLayoutKey = layoutKey;
  const isPVP = gameMode === "PVP";
  const joyR  = Math.floor(Math.min(W,H) * 0.075);
  const joyY  = Math.floor(H * 0.76);
  const sR    = Math.floor(Math.min(W,H) * 0.044);

  // ---------- Player 1 joystick (always bottom-left) ----------
  const joyX1 = Math.floor(W * 0.13);
  if (!vBtns1.joystick) vBtns1.joystick = { knobX: joyX1, knobY: joyY };
  vBtns1.joystick.x = joyX1; vBtns1.joystick.y = joyY; vBtns1.joystick.r = joyR;
  _applyMobileCfg(vBtns1.joystick, "joystick");

  // ---------- Player 1 skill cluster (single set — no duplicates) ----------
  let scX1, dir1, fanScale, ultiScale;
  if (isPVP) { scX1 = Math.floor(W*0.32); dir1 = 1;  fanScale = 2.0; ultiScale = 3.6; }
  else       { scX1 = Math.floor(W*0.82); dir1 = -1; fanScale = 2.6; ultiScale = 4.6; }
  const scY1 = Math.floor(H*0.70);
  vBtns1.s1     = { x: scX1,                       y: scY1,               r: sR*1.15, label:"C1" };
  vBtns1.s3     = { x: scX1 + dir1*sR*fanScale,     y: scY1 - sR*0.2,      r: sR,      label:"C3" };
  vBtns1.s2     = { x: scX1 + dir1*sR*fanScale*0.5, y: scY1 - sR*2.0,      r: sR,      label:"C2" };
  vBtns1.shield = { x: scX1 + dir1*sR*0.2,          y: scY1 + sR*2.1,      r: sR*0.95, label:"KHIÊN" };
  vBtns1.s4     = { x: scX1 + dir1*sR*fanScale,     y: scY1 + sR*2.3,      r: sR,      label:"C4" };
  vBtns1.v4     = { x: scX1 + dir1*sR*ultiScale,    y: scY1 + sR*0.2,      r: sR*1.4,  label:"BIẾN\nHÌNH" };
  ["s1","s2","s3","s4","shield","v4"].forEach(k => _applyMobileCfg(vBtns1[k], k));

  if (isPVP) {
    const joyX2 = Math.floor(W * 0.87);
    if (!vBtns2.joystick) vBtns2.joystick = { knobX: joyX2, knobY: joyY };
    vBtns2.joystick.x = joyX2; vBtns2.joystick.y = joyY; vBtns2.joystick.r = joyR;

    const scX2 = Math.floor(W*0.68), dir2 = -1, scY2 = scY1;
    vBtns2.s1     = { x: scX2,                y: scY2,          r: sR*1.15, label:"C1" };
    vBtns2.s3     = { x: scX2 + dir2*sR*2.0,   y: scY2 - sR*0.2, r: sR,      label:"C3" };
    vBtns2.s2     = { x: scX2 + dir2*sR*1.0,   y: scY2 - sR*2.0, r: sR,      label:"C2" };
    vBtns2.shield = { x: scX2 + dir2*sR*0.2,   y: scY2 + sR*2.1, r: sR*0.95, label:"KHIÊN" };
    vBtns2.s4     = { x: scX2 + dir2*sR*2.0,   y: scY2 + sR*2.3, r: sR,      label:"C4" };
    vBtns2.v4     = { x: scX2 + dir2*sR*3.6,   y: scY2 + sR*0.2, r: sR*1.4,  label:"BIẾN\nHÌNH" };
  } else {
    vBtns2 = {};
  }
}

function drawJoystick(j, active) {
  ctx.save();
  ctx.beginPath(); ctx.arc(j.x, j.y, j.r, 0, Math.PI*2);
  ctx.fillStyle = "rgba(255,255,255,0.10)"; ctx.fill();
  ctx.strokeStyle = active ? "rgba(255,255,255,0.65)" : "rgba(255,255,255,0.35)";
  ctx.lineWidth = 2.5; ctx.stroke();
  const kx = active ? j.knobX : j.x, ky = active ? j.knobY : j.y;
  ctx.beginPath(); ctx.arc(kx, ky, j.r*0.42, 0, Math.PI*2);
  ctx.fillStyle = active ? "rgba(255,255,255,0.60)" : "rgba(255,255,255,0.25)";
  ctx.fill();
  ctx.strokeStyle = "white"; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.restore();
}

// Minecraft-PE-style 4-button directional pad, anchored on the same spot as
// the joystick (reuses vb.joystick.x/y/r so the touch editor's drag/scale
// controls work for either style without extra bookkeeping).
function _dpadButtons(vb) {
  const j = vb.joystick; if (!j) return null;
  const s = j.r * 0.78;
  const off = j.r * 1.08;
  return {
    up:    { x: j.x,       y: j.y - off, s },
    down:  { x: j.x,       y: j.y + off, s },
    left:  { x: j.x - off, y: j.y,       s },
    right: { x: j.x + off, y: j.y,       s },
  };
}
function _drawDpadBtn(b, active, arrow) {
  ctx.save();
  ctx.beginPath(); _roundRectPath(b.x-b.s/2, b.y-b.s/2, b.s, b.s, 6);
  ctx.fillStyle = active ? "rgba(255,255,255,0.55)" : "rgba(255,255,255,0.15)";
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = "white";
  ctx.font = `bold ${Math.floor(b.s*0.5)}px Arial`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(arrow, b.x, b.y);
  ctx.restore();
}
function _roundRectPath(x,y,w,h,r){
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function drawDpad(vb, tstate) {
  const d = _dpadButtons(vb); if (!d) return;
  _drawDpadBtn(d.up,    tstate.up,    "▲");
  _drawDpadBtn(d.down,  tstate.down,  "▼");
  _drawDpadBtn(d.left,  tstate.left,  "◀");
  _drawDpadBtn(d.right, tstate.right, "▶");
}
function _applyDpadTouch(pt, tstate, vb) {
  const d = _dpadButtons(vb); if (!d) return false;
  let hit = false;
  Object.keys(d).forEach(dir => {
    const b = d[dir];
    if (Math.abs(pt.x-b.x) <= b.s/2*1.15 && Math.abs(pt.y-b.y) <= b.s/2*1.15) { tstate[dir] = true; hit = true; }
  });
}

function drawSkillBtn(btn, state, skillKey) {
  const { x, y, r, label } = btn;
  const active = state && state[skillKey];
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.fillStyle = active ? "rgba(255,255,255,0.5)" : "rgba(255,255,255,0.15)";
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = "white";
  ctx.font = `bold ${Math.floor(r*0.55)}px Arial`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(label, x, y);
}

function drawUltiBtn(btn, active, ready, transforming) {
  const { x, y, r, label } = btn;
  ctx.save();
  if (ready) { ctx.shadowColor = "gold"; ctx.shadowBlur = 16; }
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.fillStyle = transforming ? "rgba(255,70,0,0.8)"
                : active       ? "rgba(255,215,0,0.7)"
                : ready        ? "rgba(255,215,0,0.35)"
                                : "rgba(110,85,0,0.25)";
  ctx.fill();
  ctx.strokeStyle = ready ? "gold" : "rgba(180,150,60,0.6)";
  ctx.lineWidth = 3; ctx.stroke();
  ctx.restore();
  ctx.fillStyle = ready ? "white" : "rgba(255,255,255,0.55)";
  const lines = label.split("\n");
  ctx.font = `bold ${Math.floor(r*0.24)}px Arial`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  lines.forEach((ln,i) => ctx.fillText(ln, x, y + (i - (lines.length-1)/2) * r*0.3));
}

function drawMobileControls() {
  if (platformMode !== "MOBILE") return;
  buildVBtns();
  ctx.save();
  if (touchMoveStyle === "dpad") { if (vBtns1.joystick) drawDpad(vBtns1, touch1); }
  else if (vBtns1.joystick) drawJoystick(vBtns1.joystick, touch1._joyActive);
  ["s1","s2","s3","s4","shield"].forEach(k => { if (vBtns1[k]) drawSkillBtn(vBtns1[k], touch1, k); });
  if (vBtns1.v4) drawUltiBtn(vBtns1.v4, touch1.v4, p1.cds.s5<=0, p1.transformActive);
  if (gameMode === "PVP") {
    if (touchMoveStyle === "dpad") { if (vBtns2.joystick) drawDpad(vBtns2, touch2); }
    else if (vBtns2.joystick) drawJoystick(vBtns2.joystick, touch2._joyActive);
    ["s1","s2","s3","s4","shield"].forEach(k => { if (vBtns2[k]) drawSkillBtn(vBtns2[k], touch2, k); });
    if (vBtns2.v4) drawUltiBtn(vBtns2.v4, touch2.v4, p2.cds.s5<=0, p2.transformActive);
  }
  ctx.restore();
}

// ================================================================
//  TOUCH INPUT HANDLING
// ================================================================
function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W/rect.width, scaleY = H/rect.height;
  if (e.touches) {
    return Array.from(e.touches).map(t => ({
      x: (t.clientX - rect.left)*scaleX,
      y: (t.clientY - rect.top)*scaleY
    }));
  }
  return [{ x:(e.clientX-rect.left)*scaleX, y:(e.clientY-rect.top)*scaleY }];
}

// Turns a touch point into joystick movement flags if it falls inside that
// joystick's (generous) drag zone. Returns true if the point was consumed.
function _applyJoystickTouch(pt, tstate, vb) {
  if (!vb.joystick) return false;
  const j = vb.joystick;
  const dxp = pt.x - j.x, dyp = pt.y - j.y;
  const distP = Math.hypot(dxp, dyp);
  const activeRadius = j.r * 2.4; // finger can drift outside the ring and still steer
  if (distP > activeRadius) return false;
  tstate._joyActive = true;
  const clamped = Math.min(distP, j.r);
  const ang = Math.atan2(dyp, dxp);
  j.knobX = j.x + Math.cos(ang) * clamped;
  j.knobY = j.y + Math.sin(ang) * clamped;
  const deadzone = j.r * 0.25;
  if (distP > deadzone) {
    const nx = Math.cos(ang), ny = Math.sin(ang);
    if (nx < -0.35) tstate.left  = true;
    if (nx >  0.35) tstate.right = true;
    if (ny < -0.5)  tstate.up    = true;
    if (ny >  0.5)  tstate.down  = true;
  }
  return true;
}

function updateTouchState(touches) {
  // Reset
  Object.keys(touch1).forEach(k => touch1[k] = false);
  Object.keys(touch2).forEach(k => touch2[k] = false);
  if (platformMode !== "MOBILE") return;
  buildVBtns();
  touches.forEach(pt => {
    const {x, y} = pt;
    // Joystick/D-pad drag takes priority over the skill cluster for this finger
    if (touchMoveStyle === "dpad") {
      if (_applyDpadTouch(pt, touch1, vBtns1)) return;
      if (gameMode === "PVP" && _applyDpadTouch(pt, touch2, vBtns2)) return;
    } else {
      if (_applyJoystickTouch(pt, touch1, vBtns1)) return;
      if (gameMode === "PVP" && _applyJoystickTouch(pt, touch2, vBtns2)) return;
    }

    // P1 skills + ulti ("BIẾN HÌNH")
    ["s1","s2","s3","s4","shield"].forEach(k => {
      const btn = vBtns1[k];
      if (btn && Math.hypot(x-btn.x, y-btn.y) <= btn.r) touch1[k] = true;
    });

// For casting skills on touch (one-shot on press)
let prevTouch1 = {};
let prevTouch2 = {};
function processTouchSkills() {
  if (platformMode !== "MOBILE") return;
  if ((gameState==="GAMEPLAY"||gameState==="CHALLENGE"||gameState==="ROAD") && p1.hp>0) {
    if (touch1.s1 && !prevTouch1.s1) { if(gameState==="GAMEPLAY") castSkill(p1,p2,1); else castSkill(p1,null,1); }
    if (touch1.s2 && !prevTouch1.s2) { if(gameState==="GAMEPLAY") castSkill(p1,p2,2); else castSkill(p1,null,2); }
    if (touch1.s3 && !prevTouch1.s3) { if(gameState==="GAMEPLAY") castSkill(p1,p2,3); else castSkill(p1,null,3); }
    if (touch1.s4 && !prevTouch1.s4) { if(gameState==="GAMEPLAY") castSkill(p1,p2,4); else castSkill(p1,null,4); }
    if (touch1.v4 && !prevTouch1.v4) { if(gameState==="GAMEPLAY") castSkill(p1,p2,5); else castSkill(p1,null,5); }
    p1.isShielding = !!touch1.shield;
    if (gameMode==="PVP" && p2.hp>0) {
      if (touch2.s1 && !prevTouch2.s1) castSkill(p2,p1,1);
      if (touch2.s2 && !prevTouch2.s2) castSkill(p2,p1,2);
      if (touch2.s3 && !prevTouch2.s3) castSkill(p2,p1,3);
      if (touch2.s4 && !prevTouch2.s4) castSkill(p2,p1,4);
      if (touch2.v4 && !prevTouch2.v4) castSkill(p2,p1,5);
      p2.isShielding = !!touch2.shield;
    }
  }
  Object.keys(touch1).forEach(k => prevTouch1[k] = touch1[k]);
  Object.keys(touch2).forEach(k => prevTouch2[k] = touch2[k]);
}

function onMobileTap(points) {
  if (platformMode !== "MOBILE") return;
  const {x:mx, y:my} = points[0];
  // ESC button
  const escR = Math.floor(W*0.04);
  const escX = W - escR - Math.floor(W*0.02);
  const escY = Math.floor(H*0.04) + escR;
  if (Math.hypot(mx-escX, my-escY) <= escR) { gameState="MENU"; showSettings=false; return; }
  // Game-over / challenge-result screens have no virtual buttons of their own;
  // let a tap do what R/SPACE would do on keyboard so mobile players aren't stuck.
  if (gameState === "GAMEPLAY" && (p1.hp<=0 || p2.hp<=0)) { startMatch(); return; }
  if (gameState === "ROAD" && (roadState==="WON" || roadState==="LOST")) { startRoadMode(); return; }
  if (gameState === "CHALLENGE" && challengeState === "DONE") {
    if (challengeResult === "WIN") {
      if (challengeStage < 4) { challengeStage++; gameState = "CHALLENGE_CHAR_SELECT"; }
    } else {
      startChallengeMode(challengeStage);
    }
    return;
  }
  // Forward to menu click if in non-gameplay state
  if (!["GAMEPLAY","CHALLENGE","ROAD"].includes(gameState)) {
    handleMenuClick(mx, my);
  }
}

function hsvToRgb(h,s,v){
  let r,g,b;
  const i=Math.floor(h*6),f=h*6-i,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);
  switch(i%6){case 0:r=v;g=t;b=p;break;case 1:r=q;g=v;b=p;break;case 2:r=p;g=v;b=t;break;
    case 3:r=p;g=q;b=v;break;case 4:r=t;g=p;b=v;break;case 5:r=v;g=p;b=q;break;}
  return [Math.round(r*255),Math.round(g*255),Math.round(b*255)];
}
function hsvHex(h,s,v){const[r,g,b]=hsvToRgb(h,s,v);return`#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;}
function rng(){return Math.random();}
function rndInt(a,b){return Math.floor(rng()*(b-a+1))+a;}
function rndChoice(arr){return arr[Math.floor(rng()*arr.length)];}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
// Skill/dash/teleport code (castSkill, aoePush) historically clamped the
// mover's x to the fixed screen-space range [40, W-40]. That's correct in
// GAMEPLAY/CHALLENGE, where the arena is a bounded worldW starting at 0.
// But in ROAD mode the player's x keeps growing with roadDistanceM and the
// camera (roadCameraX) scrolls forward indefinitely, so [40, W-40] is only
// valid near the very start of the road. Any teleport/dash/knockback that
// clamped to that fixed range in ROAD mode would silently snap the mover
// back toward x≈0..W — i.e. yank them 100-200m backward — the moment they
// were far enough down the road. These two helpers give the *current*
// valid on-screen x range for whichever mode is active, so movement clamps
// stay correct as the road camera scrolls.
function moveBoundLo(){return gameState==="ROAD"?roadCameraX+40:40;}
function moveBoundHi(){return gameState==="ROAD"?roadCameraX+W-40:W-40;}
function dist(ax,ay,bx,by){return Math.sqrt((ax-bx)**2+(ay-by)**2);}
function getHPDisplay(hp){const v=Math.floor(hp);return v>0||hp<=0?v:1;}

// ---------- Low-HP warning vignette (screen-space; call outside the camera transform) ----------
function drawLowHpVignette(){
  if(!p1||p1.hp<=0)return;
  const frac=p1.hp/MAX_HP;
  if(frac>0.25)return;
  const pulse=0.25+0.20*Math.abs(Math.sin(frameCount*0.09));
  const grad=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.75);

}

function updateAndDrawHitEffects(){
  hitEffects=hitEffects.filter(fx=>fx.life>0);
  hitEffects.forEach(fx=>{
    fx.life--;

      fx.x+=fx.vx;fx.y+=fx.vy;fx.vy+=0.02;
      const t=1-fx.life/fx.maxLife,r=fx.r0+t*14,a=Math.max(0,fx.life/fx.maxLife)*0.55;
      ctx.save();ctx.globalAlpha=a;ctx.fillStyle=fx.color;
      ctx.beginPath();ctx.arc(fx.x,fx.y,r,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }else if(fx.particle){

      ctx.save();ctx.globalAlpha=a;
      _oval(fx.x-3,fx.y-3,6,6,fx.color,null);
      ctx.restore();
    }else if(fx.ring){
      const a=Math.max(0,fx.life/fx.maxLife);

      const r=(1-a)*maxR+10;
      ctx.save();ctx.globalAlpha=a*0.8;ctx.strokeStyle=fx.color;ctx.lineWidth=fx.big?5:3;
      ctx.beginPath();ctx.arc(fx.x,fx.y,r,0,Math.PI*2);ctx.stroke();
      if(!fx.big){ctx.globalAlpha=a;ctx.fillStyle="white";ctx.beginPath();ctx.arc(fx.x,fx.y,4,0,Math.PI*2);ctx.fill();}

  });
}
function _dashCapture(f,oldX,oldY){
  if(!f.afterImages)f.afterImages=[];
  const col=(f.charType==="red"&&f.transformActive)?"#00AEFF":(ELEMENT_COLORS[f.charType]||"white");
  const steps=5;
  for(let i=1;i<=steps;i++){
    const t=i/steps;
    f.afterImages.push({x:oldX+(f.x-oldX)*t,y:oldY+(f.y-oldY)*t,dir:f.direction,life:18,maxLife:18,color:col});
  }
}

    this.dmgReduceTimer=0;
    this.boulderY=-320;this.boulderLanded=false;
    this.waterCloudTimer=0;this.waterCloudTick=0;this.waterCloudDrops=[];
    this.auraParticles=[];this.afterImages=[];this.transformBurstTimer=0;
    this.transformWindupTimer=0;this.transformLandingTimer=0;this._ringAngle=0;

    this._icePrisoned=false;this._icePrisonTimer=0;
  }
  applyGravity(floorY){
    if(this.stunTimer>0)this.stunTimer--;
    if(this.thunderDashTimer>0)this.thunderDashTimer--;
    // Thunder Prison: while caged, periodically zap + snap the victim back
    // toward the cage center the instant they try to drift away.
    if(this.thunderPrisonTimer>0){
      this.thunderPrisonTimer--;
      const dxp=this.x-(this.thunderPrisonCenterX||this.x);
      if(Math.abs(dxp)>70*SR){
        this.x=(this.thunderPrisonCenterX||this.x)+Math.sign(dxp)*70*SR;
        spawnHitEffect(this.x,this.y-60,"#FFFFFF");
        screenShake=Math.max(screenShake,6);
      }
      if(this.thunderPrisonTimer%20===0)applyDamage(this,3,this._thunderPrisonCaster);
    }
    if(this.transformWindupTimer>0){
      // 3-phase V4 transform: rise (2s), hover+burst (2s), descend (1.5s)
      this.transformWindupTimer--;
      this._windupFloorY=floorY;
      const remaining=this.transformWindupTimer;
      const total=360;
      if(remaining>240){
        // Phase 1: Rise up slowly (frames 360->240, ~2s)
        this.y-=1.8;
        if(this.y<floorY-160)this.y=floorY-160;
      }else if(remaining>90){
        // Phase 2: Hover in air with elemental burst (frames 240->90, ~2.5s)
        // Gentle bobbing motion while hovering
        this.y=floorY-160+Math.sin(frameCount*0.08)*3;
      }else{
        // Phase 3: Descend (frames 90->0, ~1.5s)
        this.y+=3.2;
        // Use the actual ground level at current x (accounts for terrain dips)
        const actualFloor = this._windupFloorY;
        if(this.y>=actualFloor){this.y=actualFloor;this.transformWindupTimer=0;this._finalizeTransform(actualFloor);return;}
      }
      this.vy=0;this.onGround=false;
      // If windup reaches 0 but we haven't landed yet, finalize anyway
      if(this.transformWindupTimer===0&&this.y>=this._windupFloorY-5)this._finalizeTransform(this._windupFloorY);
      return;
    }
    if(this.transformLandingTimer>0){
      this.transformLandingTimer--;
      this.vy=0; // Không dùng trọng lực bình thường
      this.y+=3.5; // Đáp xuống từ từ
      if(this.y>=floorY){this.y=floorY;this.transformLandingTimer=0;this.onGround=true;}
      return;
    }
    if(this.transformActive&&this.charType==="frost"&&this.isFlying){
      this.vy*=0.8;this.y+=this.vy;
      if(this.y<60)this.y=60;
      if(this.y>=floorY){this.y=floorY;this.vy=0;}
      this.onGround=false;return;
    }
    this.vy+=GRAVITY;this.y+=this.vy;
    if(this.y>=floorY){this.y=floorY;this.vy=0;this.onGround=true;this.jumpsUsed=0;}
    else this.onGround=false;
  }
  // Fires once the transform windup (stand-still + rise-up) finishes: this is

    for(let i=0;i<12;i++){
      const ang=(i/12)*Math.PI*2,spd=rng()*6+8;

    if(this.charType==="red"){
      for(let i=0;i<10;i++){const fx=this.x+rndInt(-60,60),fy=this.y+rndInt(-10,20);hitEffects.push({x:fx,y:fy,vx:(rng()-0.5)*2,vy:-rng()*4-2,life:30,maxLife:30,particle:true,color:rndChoice(["#FF6600","#FF4400","orange","yellow"])});}

  // Charge-up visual while the V4 transform winds up: energy spirals inward
  // and upward around the still-frozen, rising fighter, building in intensity
  // until the moment it detonates into the finishing spark explosion.
  _drawTransformWindup(rx,ry){
    const af=this.animFrame,total=360,t=Math.max(0,this.transformWindupTimer),age=total-t,prog=age/total;
    const _h=this.charType==="red";

    const glow=_h?"#AEEFFF":"#FFEE99";
    if(_h&&!this._windupCrackled&&prog>0.4){this._windupCrackled=true;sfxFireCrackle();}
    if(t===0)this._windupCrackled=false;
    if(this.charType==="thunder"){
      // THUNDER V4 WINDUP: screen dims, sky-bolts crash down around the
      // fighter as they rise, then one huge column of lightning strikes them.
      ctx.save();

      ctx.setTransform(1,0,0,1,0,0);
      ctx.globalAlpha=Math.min(0.5,prog*0.6);ctx.fillStyle="#000010";ctx.fillRect(0,0,W,H);
      ctx.restore();

        ctx.beginPath();let cy3=b.y0,cx3=b.x;ctx.moveTo(cx3,cy3);

      });
      if(prog>0.5){
        // giant strike column right on top of the fighter as the windup finishes
        // Cải tiến: tia sét tụ lại rồi phình to gấp 3 (từ prog 0.5 đến 1.0)
        const boltProg = (prog - 0.5) / 0.5; // 0.0 -> 1.0
        const baseWidth = 4;
        const targetWidth = 30; // To gấp 3 lần bình thường (10 * 3)
        const currentWidth = baseWidth + (targetWidth - baseWidth) * boltProg;
        
        ctx.save();
        ctx.globalAlpha=Math.min(1, boltProg * 1.5);
        ctx.strokeStyle="white";ctx.shadowColor="white";ctx.shadowBlur=30 + boltProg * 20;
        ctx.lineWidth=currentWidth;

        ctx.strokeStyle="#FFD700";
        ctx.lineWidth=currentWidth * 0.4;

    if(this.charType==="earth"){

      if(prog>0.3)screenShake=Math.max(screenShake,15);

        for(let c=0;c<3;c++){

      const rockCount=Math.floor(prog*15)+3;
      for(let i=0;i<rockCount;i++){
        const ang=(af*3+i*24)*Math.PI/180;
        const dist2=180-(prog*160)+Math.sin(af*0.1+i)*20;
        const rsx=rx+Math.cos(ang)*dist2,rsy=ry-20+Math.sin(ang)*dist2*0.4;

        ctx.beginPath();ctx.moveTo(rsx-rs,rsy+rs*0.5);ctx.lineTo(rsx-rs*0.3,rsy-rs*0.7);ctx.lineTo(rsx+rs*0.5,rsy-rs*0.8);ctx.lineTo(rsx+rs,rsy);ctx.lineTo(rsx+rs*0.4,rsy+rs*0.6);ctx.closePath();ctx.fill();ctx.stroke();
        ctx.restore();

        for(let i=0;i<8;i++){
          const ang=(af*5+i*45)*Math.PI/180;

          const mx=rx+Math.cos(ang)*mdist,my=ry-20+Math.sin(ang)*mdist*0.5;

      ctx.restore();
    }
    ctx.save();
    ctx.globalAlpha=0.55+prog*0.4;
    ctx.shadowColor=glow;ctx.shadowBlur=14+prog*20;

    ctx.beginPath();ctx.ellipse(rx,ry-15,40+prog*15,60+prog*20,0,0,Math.PI*2*prog+0.2);ctx.stroke();

  _drawEnergyRing(cx,cy,outerCol,glowCol){

class Boss {
  constructor(bossId,x,y){
    this.bossId=bossId;this.x=x;this.y=y;this.vy=0;
    this.onGround=false;this.direction=-1;this.anim=0;
    this.skillTimer={};this.phase=1;this.dead=false;
    this.summonEnemies=[];this.stunTimer=0;
    this._init();
  }
  _init(){
    if(this.bossId===1){this.hp=this.maxHp=320;this.phase=1;this.phase2Entered=false;this.targetX=this.x;this.targetY=this.y;this.hoverTimer=0;
      // ========== FROST KING v2 SKILL STATES ==========
      this.skillTimer={s1:0,s2:0,s3:0,s4:0,s5:0,s6:0};this.skillCd={s1:420,s2:720,s3:1080,s4:600,s5:2100,s6:0};
      this.lastSkillUsed="";this.breatheTimer=0;this.actionState="idle"; // idle, breathing, preparing
      
      // === Skill 1: Frozen Spears ===
      this.frozenSpears=[];this.spearChargeTimer=0;this.spearChargePhase=0;
      
      // === Skill 2: Ice Prison ===
      this.icePrisonTarget=null;this.icePrisonWarningTimer=0;this.icePrisonWarningX=0;this.icePrisonWarningY=0;
      
      // === Skill 3: Blizzard ===
      this.blizzardActive=false;this.blizzardTimer=0;this.meteorSpawns=[];this.meteorWarnings=[];
      
      // === Skill 4: Frost Dash ===
      this.dashActive=false;this.dashPhase=0;this.dashTargetX=0;this.dashCount=0;this.dashIceTrails=[];
      
      // === Skill 5: Absolute Zero ===
      this.absoluteZeroCharging=false;this.absoluteZeroTimer=0;this.heatCrystals=[];this.battlefieldFrozen=false;
      
      // === Phase 2: Frost King's Wrath ===
      this.phase2SpeedMult=1.0;this.phase2AttackMult=1.0;
      
      // --- Visuals (additive-only, never affects logic) ---
      this.auraParticles=[];this._floorY=this.y;this.lastFootX=this.x;this.frostTrail=[];
      this.wingFlap=0;this.iceshardFX=[];this.breathingEffect=0;
      for(let i=0;i<32;i++)this.auraParticles.push({ang:rng()*Math.PI*2,rad:60+rng()*95,spd:0.008+rng()*0.02,size:2+rng()*4,type:rndChoice(["snow","crystal","mist"]),bob:rng()*Math.PI*2});
    }
    else if(this.bossId===2){this.hp=this.maxHp=360;this.skillTimer={s1:0,summon_anim:0};this.smokeParticles=[];this.chargeMode=false;this.chargeVx=0;this.chargeHitDone=false;this.chargeTargetX=0;this.summonAnimParticles=[];this.dodgeTimer=0;}
    else if(this.bossId===3){this.hp=this.maxHp=200;this.phase=1;this.phase2Hp=100;this.skillTimer={s1:0,s2:0,s3:0};this.rainbowHue=0;this.currentElement="fire";this.elementTimer=180;this.chainActive=false;this.chainX=this.x;this.chainY=this.y;this.chainDir=1;this.chainVx=0;this.clones=[];this.cloneSpawnDone=false;this.screenTint=null;}
    else if(this.bossId===4){this.hp=this.maxHp=480;this.phase=1;this.skillTimer={s1:0,s2:0,s3:0,s4:0,warn:0};this.fireBalls=[];this.wingAngle=0;this.wingVel=4;this.roarTimer=0;this.roarWarning=0;this.diveActive=false;this.diveTargetX=0;this.diveTargetY=0;this.diveHitDone=false;this.diveWarning=0;this.tailWhipActive=false;this.tailWhipTimer=0;this.tailWhipHitDone=false;this.fireBurnZones=[];this.deadAnim=0;this.hoverYOffset=0;this.strafeDir=1;this.strafeTimer=0;this.comboStage=0;}
  }
  applyGravity(floorY){if(this.bossId===1)return;this.vy+=GRAVITY;this.y+=this.vy;if(this.y>=floorY){this.y=floorY;this.vy=0;this.onGround=true;}else this.onGround=false;}
  update(player,floorY,w){
    this.anim++;this.applyGravity(floorY);
    if(this.stunTimer>0){this.stunTimer--;return;}
    for(const k in this.skillTimer)if(this.skillTimer[k]>0)this.skillTimer[k]--;
    if(this.bossId===1)this._updateBoss1(player,floorY,w);
    else if(this.bossId===2)this._updateBoss2(player,floorY,w);
    else if(this.bossId===3)this._updateBoss3(player,floorY,w);
    else if(this.bossId===4)this._updateBoss4(player,floorY,w);
  }
  _updateBoss1(player,floorY,w){
    // ======= PHASE 2 CHECK =======
    if(this.phase===1 && this.hp<=this.maxHp*0.3 && !this.phase2Entered){
      this.phase=2;
      this.phase2Entered=true;
      this.phase2SpeedMult=1.15;
      this.phase2AttackMult=1.15;
      screenShake=Math.max(screenShake,35);
      // Reset some cooldowns to prepare phase 2
      this.skillTimer.s1=Math.min(this.skillTimer.s1,200);
    }

    // ======= COOLDOWN MANAGEMENT =======
    for(const k in this.skillTimer) if(this.skillTimer[k]>0) this.skillTimer[k]--;

    // ======= BREATHING / IDLE BEHAVIOR =======
    this.breatheTimer--;
    if(this.breatheTimer<=0){
      if(this.actionState==="idle" && rng()<0.35){
        this.actionState="breathing";
        this.breatheTimer=rndInt(120,200);
      }else{
        this.actionState="idle";
        this.breatheTimer=rndInt(60,140);
      }
    }
    this.breathingEffect+=0.03;

    // ======= HOVERING & POSITIONING =======
    this.hoverTimer++;
    this.wingFlap=(this.wingFlap+2+this.phase2SpeedMult*0.5)%360;
    if(this.hoverTimer>=150){
      this.hoverTimer=0;
      this.targetX=clamp(player.x+rndInt(-180,180),80,w-80);
      this.targetY=clamp(player.y-rndInt(120,200),100,floorY-150);
    }
    const moveSpeed=(this.actionState!=="preparing")?0.035:0.02;
    this.x+=(this.targetX-this.x)*moveSpeed;
    this.y+=(this.targetY-this.y)*moveSpeed;
    this.direction=this.x>player.x?-1:1;

    // ======= INTELLIGENT AI SKILL DECISION SYSTEM =======
    const dx=player.x-this.x, dy=player.y-this.y, dist=Math.sqrt(dx*dx+dy*dy);
    const playerMoving=Math.abs(player.vx)>1;
    
    // Skill availability check
    const canUseS1=this.skillTimer.s1<=0 && this.lastSkillUsed!=="s1";
    const canUseS2=this.skillTimer.s2<=0 && this.lastSkillUsed!=="s2";
    const canUseS3=this.skillTimer.s3<=0 && this.lastSkillUsed!=="s3";
    const canUseS4=this.skillTimer.s4<=0 && this.lastSkillUsed!=="s4";
    const canUseS5=this.skillTimer.s5<=0 && this.lastSkillUsed!=="s5" && this.phase===2;
    const canUseS6=this.skillTimer.s6<=0 && this.phase===2 && this.lastSkillUsed!=="s6";

    // Weighted AI decision
    let decision=rng()*100;
    let selectedSkill=null;

    // Skill weights based on distance & situation
    let weights={s1:35,s2:20,s3:15,s4:15,s5:10,s6:5};
    
    // Adjust weights based on context
    if(dist<150) weights.s4=30; // Frost Dash more likely when close
    if(Math.abs(dx)<50) weights.s2=30; // Ice Prison when directly above/below
    if(playerMoving) weights.s3=25; // Blizzard when player is mobile
    if(this.phase===2) weights.s5=15; // More likely to use ultimate in phase 2

    // Normalize weights
    let totalWeight=0;
    if(canUseS1) totalWeight+=weights.s1;
    if(canUseS2) totalWeight+=weights.s2;
    if(canUseS3) totalWeight+=weights.s3;
    if(canUseS4) totalWeight+=weights.s4;
    if(canUseS5) totalWeight+=weights.s5;
    if(canUseS6) totalWeight+=weights.s6;

    if(totalWeight>0){
      decision=rng()*totalWeight;
      let acc=0;
      if(canUseS1){acc+=weights.s1;if(decision<acc){selectedSkill="s1";}}
      else if(canUseS2){acc+=weights.s2;if(decision<acc){selectedSkill="s2";}}
      else if(canUseS3){acc+=weights.s3;if(decision<acc){selectedSkill="s3";}}
      else if(canUseS4){acc+=weights.s4;if(decision<acc){selectedSkill="s4";}}
      else if(canUseS5){acc+=weights.s5;if(decision<acc){selectedSkill="s5";}}
      else if(canUseS6){acc+=weights.s6;if(decision<acc){selectedSkill="s6";}}
    }

    // ======= SKILL EXECUTION =======
    if(selectedSkill==="s1" && canUseS1) this._boss1SkillFrozenSpears(player,w);
    else if(selectedSkill==="s2" && canUseS2) this._boss1SkillIcePrison(player);
    else if(selectedSkill==="s3" && canUseS3) this._boss1SkillBlizzard(player,w,floorY);
    else if(selectedSkill==="s4" && canUseS4) this._boss1SkillFrostDash(player,w);
    else if(selectedSkill==="s5" && canUseS5) this._boss1SkillAbsoluteZero(player,w,floorY);
    else if(selectedSkill==="s6" && canUseS6) this._boss1SkillWrathPhase2();

    // ======= ACTIVE SKILL UPDATES =======
    this._updateBoss1FrozenSpears(player,w);
    this._updateBoss1IcePrison();
    this._updateBoss1Blizzard(player,w,floorY);
    this._updateBoss1FrostDash(player,w);
    this._updateBoss1AbsoluteZero(player,w);

    this._floorY=floorY;
    this._updateFrostKingFX(floorY,w);
  }

  // ===== SKILL 1: FROZEN SPEARS =====
  _boss1SkillFrozenSpears(player,w){
    this.skillTimer.s1=this.skillCd.s1;
    this.lastSkillUsed="s1";
    this.actionState="preparing";
    this.spearChargeTimer=72; // 1.2 seconds at 60fps
    this.spearChargePhase=0;
  }

  _updateBoss1FrozenSpears(player,w){
    if(this.spearChargeTimer>0){
      this.spearChargeTimer--;
      this.spearChargePhase=1-(this.spearChargeTimer/72); // 0 to 1
      
      if(this.spearChargeTimer===0){
        // Launch spears in a fan
        const spearCount=Math.floor(6+rng()*5); // 6-10 spears
        const spreadAngle=Math.PI*0.8; // 144 degrees wide
        const baseAngle=-spreadAngle/2;
        
        for(let i=0;i<spearCount;i++){
          const angle=baseAngle+(spreadAngle/(spearCount-1))*i + rndInt(-15,15)*Math.PI/180;
          const spd=9+rng()*2;
          projectiles.push({
            x:this.x,y:this.y,
            vx:Math.cos(angle)*spd,vy:Math.sin(angle)*spd,
            owner:this,target:player,damage:12,
            color:"cyan",type:"ice_spear",size:2,
            lifetime:180,life:180
          });
        }
        screenShake=Math.max(screenShake,8);
        this.actionState="idle";
      }
    }
  }

  // ===== SKILL 2: ICE PRISON =====
  _boss1SkillIcePrison(player){
    this.skillTimer.s2=this.skillCd.s2;
    this.lastSkillUsed="s2";
    this.icePrisonTarget=player;
    this.icePrisonWarningTimer=90; // 1.5 seconds warning
    this.icePrisonWarningX=player.x;
    this.icePrisonWarningY=player.y;
    this.actionState="preparing";
  }

  _updateBoss1IcePrison(){
    if(this.icePrisonWarningTimer>0){
      this.icePrisonWarningTimer--;
      
      if(this.icePrisonWarningTimer===0 && this.icePrisonTarget){
        // Check if player is still in zone (update to current position)
        if(!this.icePrisonTarget._icePrisoned){
          const dist=Math.sqrt(Math.pow(this.icePrisonTarget.x-this.icePrisonWarningX,2)+Math.pow(this.icePrisonTarget.y-this.icePrisonWarningY,2));
          if(dist<60){ // Hit radius
            this.icePrisonTarget._icePrisoned=true;
            this.icePrisonTarget._icePrisonTimer=120; // 2 seconds frozen
            screenShake=Math.max(screenShake,10);
          }
        }
        this.actionState="idle";
      }
    }

    // Update ice prison effect on player
    if(this.icePrisonTarget && this.icePrisonTarget._icePrisoned){
      this.icePrisonTarget._icePrisonTimer--;
      if(this.icePrisonTarget._icePrisonTimer<=0){
        this.icePrisonTarget._icePrisoned=false;
      }
    }
  }

  // ===== SKILL 3: BLIZZARD =====
  _boss1SkillBlizzard(player,w,floorY){
    this.skillTimer.s3=this.skillCd.s3;
    this.lastSkillUsed="s3";
    this.blizzardActive=true;
    this.blizzardTimer=480; // 8 seconds
    this.meteorSpawns=[];
    this.meteorWarnings=[];
    screenShake=Math.max(screenShake,12);
    this.actionState="idle";
  }

  _updateBoss1Blizzard(player,w,floorY){
    if(this.blizzardActive && this.blizzardTimer>0){
      this.blizzardTimer--;
      
      // Spawn meteors every 30 frames (0.5 seconds)
      if(this.blizzardTimer%30===0){
        const meteorX=50+rng()*(w-100);
        const fallY=floorY-300;
        // First warn, then spawn
        this.meteorWarnings.push({x:meteorX,y:fallY,warningTimer:45,life:45});
      }

      // Update warnings and convert to actual meteors
      for(let i=this.meteorWarnings.length-1;i>=0;i--){
        this.meteorWarnings[i].warningTimer--;
        if(this.meteorWarnings[i].warningTimer<=0){
          const mw=this.meteorWarnings[i];
          this.meteorSpawns.push({x:mw.x,y:mw.y-100,vy:0,radius:35,damage:18,life:180});
          this.meteorWarnings.splice(i,1);
        }
      }

      // Update falling meteors & check collisions
      for(let i=this.meteorSpawns.length-1;i>=0;i--){
        const meteor=this.meteorSpawns[i];
        meteor.vy+=0.4; // gravity
        meteor.y+=meteor.vy;
        meteor.life--;
        
        if(meteor.y>=floorY-20){
          this.meteorSpawns.splice(i,1);
        }else if(player.hp>0){
          const d=Math.sqrt(Math.pow(meteor.x-player.x,2)+Math.pow(meteor.y-player.y,2));
          if(d<meteor.radius+20){
            applyDamage(player,meteor.damage*0.4,this);
            this.meteorSpawns.splice(i,1);
          }
        }
      }
    }else if(this.blizzardTimer<=0 && this.blizzardActive){
      this.blizzardActive=false;
      this.meteorSpawns=[];
      this.meteorWarnings=[];
    }
  }

  // ===== SKILL 4: FROST DASH =====
  _boss1SkillFrostDash(player,w){
    this.skillTimer.s4=this.skillCd.s4;
    this.lastSkillUsed="s4";
    this.dashActive=true;
    this.dashPhase=0;
    this.dashCount=0;
    this.dashTargetX=player.x;
    this.dashIceTrails=[];
    this.actionState="preparing";
  }

  _updateBoss1FrostDash(player,w){
    if(this.dashActive){
      if(this.dashPhase===0){ // Phase 0: Charge up
        if(this.dashCount<2){
          this.dashPhase=1; // Start dash
          this.dashCount++;
        }else{
          this.dashActive=false; // Done with dashes
          this.actionState="idle";
        }
      }else if(this.dashPhase===1){ // Phase 1: Dashing
        const dashSpd=(20+this.phase2SpeedMult*2)*this.phase2SpeedMult;
        const dirToDash=this.dashTargetX>this.x?1:-1;
        this.x+=dashSpd*dirToDash;
        this.x=clamp(this.x,60,w-60);
        
        // Leave ice trail
        this.dashIceTrails.push({x:this.x,y:this.y,life:90});
        
        // Check hit on player
        if(Math.abs(this.x-player.x)<70 && Math.abs(this.y-player.y)<80 && player.hp>0){
          applyDamage(player,14,this);
          screenShake=Math.max(screenShake,8);
          player.slowTimer=Math.max(player.slowTimer||0,30);
          player._slowPct=0.4;
        }

        // Dash complete
        if(Math.abs(this.x-this.dashTargetX)<50 || this.x<=60 || this.x>=w-60){
          this.dashPhase=0; // Return to charge phase
          this.dashTargetX=player.x; // Re-target
        }
      }
    }

    // Update ice trails
    this.dashIceTrails=this.dashIceTrails.filter(t=>{t.life--;return t.life>0;});
  }

  // ===== SKILL 5: ABSOLUTE ZERO (ULTIMATE) =====
  _boss1SkillAbsoluteZero(player,w,floorY){
    this.skillTimer.s5=this.skillCd.s5;
    this.lastSkillUsed="s5";
    this.absoluteZeroCharging=true;
    this.absoluteZeroTimer=150; // 2.5 seconds charge
    this.heatCrystals=[];
    this.battlefieldFrozen=false;
    screenShake=Math.max(screenShake,15);
    this.actionState="preparing";
  }

  _updateBoss1AbsoluteZero(player,w){
    if(this.absoluteZeroCharging && this.absoluteZeroTimer>0){
      this.absoluteZeroTimer--;
      
      // Spawn heat crystals at 2 second mark (before release)
      if(this.absoluteZeroTimer===60){
        // Create 3 safe zones
        const safeZones=[w*0.25, w*0.5, w*0.75];
        this.heatCrystals=safeZones.map(zx=>({
          x:zx, y:this.y+150, life:300, maxLife:300, radius:50
        }));
        screenShake=Math.max(screenShake,20);
      }

      if(this.absoluteZeroTimer===0){
        // Release freeze wave
        this.battlefieldFrozen=true;
        const freezeLifetime=180;
        
        // Damage player based on distance to nearest crystal
        if(player.hp>0){
          let minDistToCrystal=999;
          for(const crystal of this.heatCrystals){
            const d=Math.sqrt(Math.pow(player.x-crystal.x,2)+Math.pow(player.y-crystal.y,2));
            minDistToCrystal=Math.min(minDistToCrystal,d);
          }

          if(minDistToCrystal<50){
            // In safe zone
            applyDamage(player,25,this); // Reduced damage
            // No freeze
          }else{
            // Outside safe zone
            applyDamage(player,60,this); // Heavy damage
            player._icePrisoned=true;
            player._icePrisonTimer=120; // Freeze status
          }
        }

        screenShake=Math.max(screenShake,25);
        this.absoluteZeroCharging=false;

        // Clear after effect
        setTimeout(()=>{this.battlefieldFrozen=false;},freezeLifetime);
      }
    }
