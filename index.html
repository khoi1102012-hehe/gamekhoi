<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Game Khôi Làm</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  width:100vw; height:100vh;
  overflow:hidden;
  touch-action:none;
}
#gameCanvas {
  display:block;
  cursor:default;
  touch-action:none;
}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
// ================================================================
//  RED VS SHADOW — Full 2026 v2 + Mobile/PC Mode
// ================================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Running via file:// triggers stricter browser security policies (blocked
// touch/gesture handling in some mobile browsers, blocked module/script
// features in others). Surface this instead of letting controls silently
// fail with no explanation.
const _runningFromFile = location.protocol === 'file:';
if (_runningFromFile) {
  window.addEventListener('DOMContentLoaded', () => {
    const warn = document.createElement('div');
    warn.textContent = '⚠️ Đang mở trực tiếp từ file (file://) — một số trình duyệt di động sẽ chặn cảm ứng/tương tác. Hãy chạy qua một local server (vd: "npx serve" hoặc mở qua http://) để game hoạt động đầy đủ.';
    warn.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#552200;color:#ffcc66;font:12px Arial;padding:6px 10px;text-align:center;';
    document.body.appendChild(warn);
  });
}

// ================================================================
//  GLOBAL STATE
// ================================================================
const _isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
let platformMode = _isTouchDevice ? "MOBILE" : "PC"; // "PC" or "MOBILE" - auto-detected, user can override in Settings
let gameState    = "MENU";
let gameMode     = "PVE"; // PVP mode has been removed — always bot/PVE now
const MAP_SCALE  = 1;     // world width multiplier for GAMEPLAY/CHALLENGE arenas (Road mode has its own, already-scrolling world)
const CHAR_VISUAL_SCALE = 1/1.5; // visual shrink for character bodies + attached skill FX (1.5x smaller), anchored at their feet
const SR = CHAR_VISUAL_SCALE;    // "skill range" scale — shrinks skill hit/AOE ranges by the same factor so tiny characters don't keep giant-sized hitboxes
let campX        = 0;     // camera x offset shared by GAMEPLAY & CHALLENGE (only one active at a time)
let botLevel     = 0;
let MAX_HP       = 200;
let showSettings = false;
let selectedP1   = "red";
let selectedP2   = "shadow";
let selectingPlayer = 1;
let screenShake  = 0;
let projectiles  = [];
let puppets      = [];
let frameCount   = 0;

// Challenge
let challengeState    = "IDLE";
let challengeStage    = 1;
let challengeEnemies  = [];
let challengeBosses   = [];
let challengeWaveIdx  = 0;
let challengeWaveSched = [];
let challengeBossSpawned = false;
let challengeResult   = "";

const CHALLENGE_ENEMY_CFG = {
  1:{hp:30, spd:2.5, dmg:0.75},
  2:{hp:45, spd:3.0, dmg:1.1},
  3:{hp:65, spd:3.5, dmg:1.4},
  4:{hp:85, spd:4.0, dmg:1.75},
};

// ================================================================
//  ROAD MODE ("ĐƯỜNG ĐI") STATE
// ================================================================
const ROAD_METER_PX = 15; // pixels per in-game meter
let roadState        = "RUN"; // RUN | BOSS | WON | LOST
let roadDistanceM     = 0;
let roadCameraX       = 0;
let roadWalls         = [];
let roadTraps         = [];
let roadEnemies       = [];
let roadBoss          = null;
let roadBossZoneIndex = 0; // 0,1,2 -> which of the 3 main bosses is next
let roadBossTriggersPx = [];
let roadEnemySpawnTimer = 90;
let roadTerrain = null;       // { segLen, heights[] } elevation profile for the whole run
let roadEnemyPlan = [];       // pre-planned {x, caster, elite, spawned} — fixed total count, not endless spam
let roadWallPlan  = [];       // pre-planned {x, hp, spawned} gates
let roadTrapPlan  = [];       // pre-planned {x, type, spawned} hazards

// Physics
const GRAVITY    = 0.7;
const JUMP_POWER = -14;
const FLOOR_Y_RATIO = 0.67;

// ================================================================
//  CANVAS SIZING
// ================================================================
let W, H;
function resizeCanvas() {
  if (platformMode === "MOBILE") {
    // Fixed design resolution (same one the game/UI was built for), scaled
    // via CSS to fit the phone screen. This keeps character size, HUD, and
    // text proportions consistent on every device instead of shrinking the
    // whole game world down to the phone's tiny actual pixel dimensions.
    const DESIGN_W = 1200, DESIGN_H = 700;
    canvas.width  = DESIGN_W;
    canvas.height = DESIGN_H;
    const vw = window.innerWidth, vh = window.innerHeight;
    const scale = Math.min(vw/DESIGN_W, vh/DESIGN_H);
    canvas.style.width  = Math.round(DESIGN_W*scale) + "px";
    canvas.style.height = Math.round(DESIGN_H*scale) + "px";
  } else {
    const vw = window.innerWidth, vh = window.innerHeight;
    canvas.width  = vw;
    canvas.height = vh;
    canvas.style.width  = vw + "px";
    canvas.style.height = vh + "px";
  }
  W = canvas.width;
  H = canvas.height;
}
resizeCanvas();
window.addEventListener('resize', () => {
  resizeCanvas();
  if (p1) p1.y = H*FLOOR_Y_RATIO;
  if (p2) p2.y = H*FLOOR_Y_RATIO;
});

// ================================================================
//  TOUCH / VIRTUAL BUTTON STATE
// ================================================================
const touch1 = { left:false, right:false, up:false, down:false, s1:false, s2:false, s3:false, s4:false, shield:false, v4:false, _joyActive:false };
const touch2 = { left:false, right:false, up:false, down:false, s1:false, s2:false, s3:false, s4:false, shield:false, v4:false, _joyActive:false };

// ---------- PC key rebinding ----------
let keyBindings = {left:"a", right:"d", up:"w", down:"s", s1:"e", s2:"f", s3:"t", s4:"g", v4:"y", shield:"r"};
const KEY_ACTION_LABELS = {left:"◀ Trái", right:"▶ Phải", up:"▲ Nhảy", down:"▼ Né/Xuống", s1:"Chiêu 1", s2:"Chiêu 2", s3:"Chiêu 3", s4:"Chiêu 4", v4:"Biến Hình", shield:"Khiên"};
const KEY_ACTION_ORDER = ["left","right","up","down","s1","s2","s3","s4","shield","v4"];
let rebindingAction = null; // when set, the next physical key press is captured into keyBindings[rebindingAction]

// ---------- Mobile virtual-button layout customization ----------
let mobileLayoutCfg = {
  joystick:{dx:0,dy:0,scale:1},
  s1:{dx:0,dy:0,scale:1}, s2:{dx:0,dy:0,scale:1}, s3:{dx:0,dy:0,scale:1}, s4:{dx:0,dy:0,scale:1},
  shield:{dx:0,dy:0,scale:1}, v4:{dx:0,dy:0,scale:1}
};
let mobileLayoutVersion = 0; // bump whenever mobileLayoutCfg changes to force buildVBtns() to recompute
let touchEditorSelKey = null; // which button is currently selected in the touch editor
let touchEditorDrag = null;   // {key, startX, startY, baseDx, baseDy} while dragging
let _editorMouseDown = false;

// Virtual button layout (recalculated each draw)
let vBtns1 = {}; // P1 controls (joystick + skills) — always bottom-left joystick
let vBtns2 = {}; // P2 controls (PVP only) — bottom-right joystick

// MOBA-style layout: circular drag joystick for movement + a fan of skill
// buttons with a distinct larger "BIẾN HÌNH" (ultimate/transform) button.
let _vBtnsLayoutKey = null;
function _applyMobileCfg(btn, key) {
  const c = mobileLayoutCfg[key];
  if (!btn || !c) return;
  btn.x += c.dx; btn.y += c.dy;
  if (btn.r !== undefined) btn.r *= c.scale;
}
function buildVBtns() {
  const layoutKey = W+"x"+H+"_"+gameMode+"_"+platformMode+"_"+mobileLayoutVersion;
  if (layoutKey === _vBtnsLayoutKey && vBtns1.joystick) return;
  _vBtnsLayoutKey = layoutKey;
  const isPVP = gameMode === "PVP";
  const joyR  = Math.floor(Math.min(W,H) * 0.075);
  const joyY  = Math.floor(H * 0.76);
  const sR    = Math.floor(Math.min(W,H) * 0.044);

  // ---------- Player 1 joystick (always bottom-left) ----------
  const joyX1 = Math.floor(W * 0.13);
  if (!vBtns1.joystick) vBtns1.joystick = { knobX: joyX1, knobY: joyY };
  vBtns1.joystick.x = joyX1; vBtns1.joystick.y = joyY; vBtns1.joystick.r = joyR;
  _applyMobileCfg(vBtns1.joystick, "joystick");

  // ---------- Player 1 skill cluster (single set — no duplicates) ----------
  let scX1, dir1, fanScale, ultiScale;
  if (isPVP) { scX1 = Math.floor(W*0.32); dir1 = 1;  fanScale = 2.0; ultiScale = 3.6; }
  else       { scX1 = Math.floor(W*0.82); dir1 = -1; fanScale = 2.6; ultiScale = 4.6; }
  const scY1 = Math.floor(H*0.70);
  vBtns1.s1     = { x: scX1,                       y: scY1,               r: sR*1.15, label:"C1" };
  vBtns1.s3     = { x: scX1 + dir1*sR*fanScale,     y: scY1 - sR*0.2,      r: sR,      label:"C3" };
  vBtns1.s2     = { x: scX1 + dir1*sR*fanScale*0.5, y: scY1 - sR*2.0,      r: sR,      label:"C2" };
  vBtns1.shield = { x: scX1 + dir1*sR*0.2,          y: scY1 + sR*2.1,      r: sR*0.95, label:"KHIÊN" };
  vBtns1.s4     = { x: scX1 + dir1*sR*fanScale,     y: scY1 + sR*2.3,      r: sR,      label:"C4" };
  vBtns1.v4     = { x: scX1 + dir1*sR*ultiScale,    y: scY1 + sR*0.2,      r: sR*1.4,  label:"BIẾN\nHÌNH" };
  ["s1","s2","s3","s4","shield","v4"].forEach(k => _applyMobileCfg(vBtns1[k], k));

  if (isPVP) {
    const joyX2 = Math.floor(W * 0.87);
    if (!vBtns2.joystick) vBtns2.joystick = { knobX: joyX2, knobY: joyY };
    vBtns2.joystick.x = joyX2; vBtns2.joystick.y = joyY; vBtns2.joystick.r = joyR;

    const scX2 = Math.floor(W*0.68), dir2 = -1, scY2 = scY1;
    vBtns2.s1     = { x: scX2,                y: scY2,          r: sR*1.15, label:"C1" };
    vBtns2.s3     = { x: scX2 + dir2*sR*2.0,   y: scY2 - sR*0.2, r: sR,      label:"C3" };
    vBtns2.s2     = { x: scX2 + dir2*sR*1.0,   y: scY2 - sR*2.0, r: sR,      label:"C2" };
    vBtns2.shield = { x: scX2 + dir2*sR*0.2,   y: scY2 + sR*2.1, r: sR*0.95, label:"KHIÊN" };
    vBtns2.s4     = { x: scX2 + dir2*sR*2.0,   y: scY2 + sR*2.3, r: sR,      label:"C4" };
    vBtns2.v4     = { x: scX2 + dir2*sR*3.6,   y: scY2 + sR*0.2, r: sR*1.4,  label:"BIẾN\nHÌNH" };
  } else {
    vBtns2 = {};
  }
}

function drawJoystick(j, active) {
  ctx.save();
  ctx.beginPath(); ctx.arc(j.x, j.y, j.r, 0, Math.PI*2);
  ctx.fillStyle = "rgba(255,255,255,0.10)"; ctx.fill();
  ctx.strokeStyle = active ? "rgba(255,255,255,0.65)" : "rgba(255,255,255,0.35)";
  ctx.lineWidth = 2.5; ctx.stroke();
  const kx = active ? j.knobX : j.x, ky = active ? j.knobY : j.y;
  ctx.beginPath(); ctx.arc(kx, ky, j.r*0.42, 0, Math.PI*2);
  ctx.fillStyle = active ? "rgba(255,255,255,0.60)" : "rgba(255,255,255,0.25)";
  ctx.fill();
  ctx.strokeStyle = "white"; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.restore();
}

function drawSkillBtn(btn, state, skillKey) {
  const { x, y, r, label } = btn;
  const active = state && state[skillKey];
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.fillStyle = active ? "rgba(255,255,255,0.5)" : "rgba(255,255,255,0.15)";
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = "white";
  ctx.font = `bold ${Math.floor(r*0.55)}px Arial`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(label, x, y);
}

function drawUltiBtn(btn, active, ready, transforming) {
  const { x, y, r, label } = btn;
  ctx.save();
  if (ready) { ctx.shadowColor = "gold"; ctx.shadowBlur = 16; }
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.fillStyle = transforming ? "rgba(255,70,0,0.8)"
                : active       ? "rgba(255,215,0,0.7)"
                : ready        ? "rgba(255,215,0,0.35)"
                                : "rgba(110,85,0,0.25)";
  ctx.fill();
  ctx.strokeStyle = ready ? "gold" : "rgba(180,150,60,0.6)";
  ctx.lineWidth = 3; ctx.stroke();
  ctx.restore();
  ctx.fillStyle = ready ? "white" : "rgba(255,255,255,0.55)";
  const lines = label.split("\n");
  ctx.font = `bold ${Math.floor(r*0.24)}px Arial`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  lines.forEach((ln,i) => ctx.fillText(ln, x, y + (i - (lines.length-1)/2) * r*0.3));
}

function drawMobileControls() {
  if (platformMode !== "MOBILE") return;
  buildVBtns();
  ctx.save();
  if (vBtns1.joystick) drawJoystick(vBtns1.joystick, touch1._joyActive);
  ["s1","s2","s3","s4","shield"].forEach(k => { if (vBtns1[k]) drawSkillBtn(vBtns1[k], touch1, k); });
  if (vBtns1.v4) drawUltiBtn(vBtns1.v4, touch1.v4, p1.cds.s5<=0, p1.transformActive);
  if (gameMode === "PVP") {
    if (vBtns2.joystick) drawJoystick(vBtns2.joystick, touch2._joyActive);
    ["s1","s2","s3","s4","shield"].forEach(k => { if (vBtns2[k]) drawSkillBtn(vBtns2[k], touch2, k); });
    if (vBtns2.v4) drawUltiBtn(vBtns2.v4, touch2.v4, p2.cds.s5<=0, p2.transformActive);
  }
  ctx.restore();
}

// ================================================================
//  TOUCH INPUT HANDLING
// ================================================================
function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W/rect.width, scaleY = H/rect.height;
  if (e.touches) {
    return Array.from(e.touches).map(t => ({
      x: (t.clientX - rect.left)*scaleX,
      y: (t.clientY - rect.top)*scaleY
    }));
  }
  return [{ x:(e.clientX-rect.left)*scaleX, y:(e.clientY-rect.top)*scaleY }];
}

// Turns a touch point into joystick movement flags if it falls inside that
// joystick's (generous) drag zone. Returns true if the point was consumed.
function _applyJoystickTouch(pt, tstate, vb) {
  if (!vb.joystick) return false;
  const j = vb.joystick;
  const dxp = pt.x - j.x, dyp = pt.y - j.y;
  const distP = Math.hypot(dxp, dyp);
  const activeRadius = j.r * 2.4; // finger can drift outside the ring and still steer
  if (distP > activeRadius) return false;
  tstate._joyActive = true;
  const clamped = Math.min(distP, j.r);
  const ang = Math.atan2(dyp, dxp);
  j.knobX = j.x + Math.cos(ang) * clamped;
  j.knobY = j.y + Math.sin(ang) * clamped;
  const deadzone = j.r * 0.25;
  if (distP > deadzone) {
    const nx = Math.cos(ang), ny = Math.sin(ang);
    if (nx < -0.35) tstate.left  = true;
    if (nx >  0.35) tstate.right = true;
    if (ny < -0.5)  tstate.up    = true;
    if (ny >  0.5)  tstate.down  = true;
  }
  return true;
}

function updateTouchState(touches) {
  // Reset
  Object.keys(touch1).forEach(k => touch1[k] = false);
  Object.keys(touch2).forEach(k => touch2[k] = false);
  if (platformMode !== "MOBILE") return;
  buildVBtns();
  touches.forEach(pt => {
    const {x, y} = pt;
    // Joystick drag takes priority over the skill cluster for this finger
    if (_applyJoystickTouch(pt, touch1, vBtns1)) return;
    if (gameMode === "PVP" && _applyJoystickTouch(pt, touch2, vBtns2)) return;

    // P1 skills + ulti ("BIẾN HÌNH")
    ["s1","s2","s3","s4","shield"].forEach(k => {
      const btn = vBtns1[k];
      if (btn && Math.hypot(x-btn.x, y-btn.y) <= btn.r) touch1[k] = true;
    });
    if (vBtns1.v4 && Math.hypot(x-vBtns1.v4.x, y-vBtns1.v4.y) <= vBtns1.v4.r) touch1.v4 = true;

    if (gameMode === "PVP") {
      ["s1","s2","s3","s4","shield"].forEach(k => {
        const btn = vBtns2[k];
        if (btn && Math.hypot(x-btn.x, y-btn.y) <= btn.r) touch2[k] = true;
      });
      if (vBtns2.v4 && Math.hypot(x-vBtns2.v4.x, y-vBtns2.v4.y) <= vBtns2.v4.r) touch2.v4 = true;
    }
  });
}

canvas.addEventListener('touchstart',  e => {
  e.preventDefault();
  const pts = getCanvasPos(e);
  if (gameState === "TOUCH_EDITOR") { handleTouchEditorPointer(pts[0].x, pts[0].y, "down"); return; }
  updateTouchState(pts); onMobileTap(pts);
}, { passive:false });
canvas.addEventListener('touchmove',   e => {
  e.preventDefault();
  const pts = getCanvasPos(e);
  if (gameState === "TOUCH_EDITOR") { handleTouchEditorPointer(pts[0].x, pts[0].y, "move"); return; }
  updateTouchState(pts);
}, { passive:false });
canvas.addEventListener('touchend',    e => {
  e.preventDefault();
  if (gameState === "TOUCH_EDITOR") { handleTouchEditorPointer(0, 0, "up"); return; }
  updateTouchState(getCanvasPos(e));
}, { passive:false });
canvas.addEventListener('touchcancel', e => {
  e.preventDefault();
  if (gameState === "TOUCH_EDITOR") { handleTouchEditorPointer(0, 0, "up"); return; }
  updateTouchState([]);
}, { passive:false });

// For casting skills on touch (one-shot on press)
let prevTouch1 = {};
let prevTouch2 = {};
function processTouchSkills() {
  if (platformMode !== "MOBILE") return;
  if ((gameState==="GAMEPLAY"||gameState==="CHALLENGE"||gameState==="ROAD") && p1.hp>0) {
    if (touch1.s1 && !prevTouch1.s1) { if(gameState==="GAMEPLAY") castSkill(p1,p2,1); else castSkill(p1,null,1); }
    if (touch1.s2 && !prevTouch1.s2) { if(gameState==="GAMEPLAY") castSkill(p1,p2,2); else castSkill(p1,null,2); }
    if (touch1.s3 && !prevTouch1.s3) { if(gameState==="GAMEPLAY") castSkill(p1,p2,3); else castSkill(p1,null,3); }
    if (touch1.s4 && !prevTouch1.s4) { if(gameState==="GAMEPLAY") castSkill(p1,p2,4); else castSkill(p1,null,4); }
    if (touch1.v4 && !prevTouch1.v4) { if(gameState==="GAMEPLAY") castSkill(p1,p2,5); else castSkill(p1,null,5); }
    p1.isShielding = !!touch1.shield;
    if (gameMode==="PVP" && p2.hp>0) {
      if (touch2.s1 && !prevTouch2.s1) castSkill(p2,p1,1);
      if (touch2.s2 && !prevTouch2.s2) castSkill(p2,p1,2);
      if (touch2.s3 && !prevTouch2.s3) castSkill(p2,p1,3);
      if (touch2.s4 && !prevTouch2.s4) castSkill(p2,p1,4);
      if (touch2.v4 && !prevTouch2.v4) castSkill(p2,p1,5);
      p2.isShielding = !!touch2.shield;
    }
  }
  Object.keys(touch1).forEach(k => prevTouch1[k] = touch1[k]);
  Object.keys(touch2).forEach(k => prevTouch2[k] = touch2[k]);
}

function onMobileTap(points) {
  if (platformMode !== "MOBILE") return;
  const {x:mx, y:my} = points[0];
  // ESC button
  const escR = Math.floor(W*0.04);
  const escX = W - escR - Math.floor(W*0.02);
  const escY = Math.floor(H*0.04) + escR;
  if (Math.hypot(mx-escX, my-escY) <= escR) { gameState="MENU"; showSettings=false; return; }
  // Game-over / challenge-result screens have no virtual buttons of their own;
  // let a tap do what R/SPACE would do on keyboard so mobile players aren't stuck.
  if (gameState === "GAMEPLAY" && (p1.hp<=0 || p2.hp<=0)) { startMatch(); return; }
  if (gameState === "ROAD" && (roadState==="WON" || roadState==="LOST")) { startRoadMode(); return; }
  if (gameState === "CHALLENGE" && challengeState === "DONE") {
    if (challengeResult === "WIN") {
      if (challengeStage < 4) { challengeStage++; gameState = "CHALLENGE_CHAR_SELECT"; }
    } else {
      startChallengeMode(challengeStage);
    }
    return;
  }
  // Forward to menu click if in non-gameplay state
  if (!["GAMEPLAY","CHALLENGE","ROAD"].includes(gameState)) {
    handleMenuClick(mx, my);
  }
}

// ================================================================
//  KEYBOARD INPUT
// ================================================================
const keys = new Set();
document.addEventListener('keydown', e => {
  if (rebindingAction) {
    e.preventDefault();
    if (e.key.toLowerCase() !== "escape") keyBindings[rebindingAction] = e.key.toLowerCase();
    rebindingAction = null;
    return;
  }
  keys.add(e.key.toLowerCase()); onKeyPress(e);
});
document.addEventListener('keyup',   e => {
  keys.delete(e.key.toLowerCase());
  if (e.key.toLowerCase()===keyBindings.shield) p1.isShielding = false;
  if (e.key==="2") p2.isShielding = false;
});
canvas.addEventListener('mousedown', e => { const {x,y}=getCanvasPosM(e); handleMenuClick(x,y); });

function getCanvasPosM(e) {
  const rect = canvas.getBoundingClientRect();
  return { x:(e.clientX-rect.left)*(W/rect.width), y:(e.clientY-rect.top)*(H/rect.height) };
}

// ================================================================
//  HELPERS
// ================================================================
function hsvToRgb(h,s,v){
  let r,g,b;
  const i=Math.floor(h*6),f=h*6-i,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);
  switch(i%6){case 0:r=v;g=t;b=p;break;case 1:r=q;g=v;b=p;break;case 2:r=p;g=v;b=t;break;
    case 3:r=p;g=q;b=v;break;case 4:r=t;g=p;b=v;break;case 5:r=v;g=p;b=q;break;}
  return [Math.round(r*255),Math.round(g*255),Math.round(b*255)];
}
function hsvHex(h,s,v){const[r,g,b]=hsvToRgb(h,s,v);return`#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;}
function rng(){return Math.random();}
function rndInt(a,b){return Math.floor(rng()*(b-a+1))+a;}
function rndChoice(arr){return arr[Math.floor(rng()*arr.length)];}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
function dist(ax,ay,bx,by){return Math.sqrt((ax-bx)**2+(ay-by)**2);}
function getHPDisplay(hp){const v=Math.floor(hp);return v>0||hp<=0?v:1;}

// ================================================================
//  VISUAL FX: elemental colors, hit effects, dash trails, bursts
// ================================================================
const ELEMENT_COLORS={red:"#ff5533",shadow:"#bb44ff",thunder:"#ffee55",frost:"#66ccff",earth:"#c68a4a",water:"#44bbff",wind:"#a6f0a6"};
// The fire (red) fighter automatically switches every fire visual to a blue
// "hellfire" palette for the whole duration of its V4 transform, then reverts
// to normal red/orange the instant the transform ends. No toggle, no persistent
// mode — it's purely driven by `fighter.transformActive && fighter.charType==="red"`.

// ----- Lightweight procedural SFX (no audio files needed) -----
let _actx=null;
function _getActx(){ if(!_actx){try{_actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){_actx=null;}} return _actx; }
function _noiseBuffer(ac,dur){
  const buf=ac.createBuffer(1,Math.floor(ac.sampleRate*dur),ac.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  return buf;
}
function sfxEnergyCharge(){ // rising whoosh while V4 windup charges up
  const ac=_getActx(); if(!ac)return;
  const o=ac.createOscillator(),g=ac.createGain();
  o.type="sawtooth";o.frequency.setValueAtTime(140,ac.currentTime);
  o.frequency.exponentialRampToValueAtTime(680,ac.currentTime+0.8);
  g.gain.setValueAtTime(0.0001,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.18,ac.currentTime+0.5);
  g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+0.8);
  o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+0.85);
}
function sfxExplosion(){ // the 20-spark hellfire explosion
  const ac=_getActx(); if(!ac)return;
  const src=ac.createBufferSource();src.buffer=_noiseBuffer(ac,0.5);
  const g=ac.createGain();g.gain.setValueAtTime(0.35,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.5);
  const filt=ac.createBiquadFilter();filt.type="lowpass";filt.frequency.setValueAtTime(2200,ac.currentTime);filt.frequency.exponentialRampToValueAtTime(200,ac.currentTime+0.5);
  src.connect(filt);filt.connect(g);g.connect(ac.destination);src.start();
  const o=ac.createOscillator(),og=ac.createGain();o.type="sine";o.frequency.setValueAtTime(90,ac.currentTime);o.frequency.exponentialRampToValueAtTime(30,ac.currentTime+0.4);
  og.gain.setValueAtTime(0.3,ac.currentTime);og.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.4);
  o.connect(og);og.connect(ac.destination);o.start();o.stop(ac.currentTime+0.4);
}
function sfxFireCrackle(){ // ambient fire-catching sound as the flame ignites
  const ac=_getActx(); if(!ac)return;
  const src=ac.createBufferSource();src.buffer=_noiseBuffer(ac,0.35);
  const filt=ac.createBiquadFilter();filt.type="bandpass";filt.frequency.value=1400;filt.Q.value=0.6;
  const g=ac.createGain();g.gain.setValueAtTime(0.001,ac.currentTime);g.gain.linearRampToValueAtTime(0.22,ac.currentTime+0.05);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.35);
  src.connect(filt);filt.connect(g);g.connect(ac.destination);src.start();
}
function sfxTransformEnd(){ // distinct sound when V4 wears off and fire returns to red
  const ac=_getActx(); if(!ac)return;
  const o=ac.createOscillator(),g=ac.createGain();
  o.type="triangle";o.frequency.setValueAtTime(500,ac.currentTime);
  o.frequency.exponentialRampToValueAtTime(120,ac.currentTime+0.45);
  g.gain.setValueAtTime(0.2,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.45);
  o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+0.5);
}

let hitEffects=[];
function spawnHitEffect(x,y,color){
  color=color||"white";
  hitEffects.push({x,y,color,life:16,maxLife:16,ring:true});
  for(let i=0;i<7;i++){
    hitEffects.push({x:x+rndInt(-8,8),y:y+rndInt(-8,8),vx:(rng()-0.5)*6,vy:-rng()*4-1,life:20,maxLife:20,particle:true,color});
  }
}
function spawnBossDeathBurst(x,y){
  screenShake=Math.max(screenShake,40);
  for(let i=0;i<32;i++){
    const ang=rng()*Math.PI*2,spd=rng()*8+3;
    hitEffects.push({x,y:y-60,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-2,life:52,maxLife:52,particle:true,color:rndChoice(["orange","red","yellow","white","#ffaa33"])});
  }
  hitEffects.push({x,y:y-60,life:42,maxLife:42,color:"gold",ring:true,big:true});
  hitEffects.push({x,y:y-60,life:60,maxLife:60,color:"white",ring:true,big:true,delay:6});
}
function updateAndDrawHitEffects(){
  hitEffects=hitEffects.filter(fx=>fx.life>0);
  hitEffects.forEach(fx=>{
    fx.life--;
    if(fx.particle){
      fx.x+=fx.vx;fx.y+=fx.vy;fx.vy+=0.22;
      const a=Math.max(0,fx.life/fx.maxLife);
      ctx.save();ctx.globalAlpha=a;
      _oval(fx.x-3,fx.y-3,6,6,fx.color,null);
      ctx.restore();
    }else if(fx.ring){
      const a=Math.max(0,fx.life/fx.maxLife);
      const maxR=fx.big?160:40;
      const r=(1-a)*maxR+10;
      ctx.save();ctx.globalAlpha=a*0.8;ctx.strokeStyle=fx.color;ctx.lineWidth=fx.big?5:3;
      ctx.beginPath();ctx.arc(fx.x,fx.y,r,0,Math.PI*2);ctx.stroke();
      if(!fx.big){ctx.globalAlpha=a;ctx.fillStyle="white";ctx.beginPath();ctx.arc(fx.x,fx.y,4,0,Math.PI*2);ctx.fill();}
      ctx.restore();
    }
  });
}
function _dashCapture(f,oldX,oldY){
  if(!f.afterImages)f.afterImages=[];
  const col=(f.charType==="red"&&f.transformActive)?"#00AEFF":(ELEMENT_COLORS[f.charType]||"white");
  const steps=5;
  for(let i=1;i<=steps;i++){
    const t=i/steps;
    f.afterImages.push({x:oldX+(f.x-oldX)*t,y:oldY+(f.y-oldY)*t,dir:f.direction,life:18,maxLife:18,color:col});
  }
}

// ================================================================

class Fighter {
  constructor(x,y,charType,direction){
    this.charType=charType;
    this.reset(x,y,direction);
  }
  reset(x,y,direction){
    this.x=x;this.y=y;this.vy=0;this.onGround=false;
    this.jumpsUsed=0;this._upPrevInput=false;this._ambient=null;
    this.hp=MAX_HP;this.direction=direction;
    this.isAttacking=false;this.attackCooldown=0;this.activeSkill=null;
    this.isShielding=false;
    this.cds={s1:0,s2:0,s3:0,s4:0,s5:0};
    this.animFrame=0;this.ultiTimer=0;this.ultiPulse=0;
    this.rainDrops=[];this.lightningBolts=[];
    this.slowTimer=0;this.earthPillars=[];
    this.targetSpikeX=0;this.thunderBoltX=0;this.thunderBoltXs=[];
    this.thunderFCount=0;this.thunderFTimer=0;
    this.waterShieldHp=0;this.tsunamiActive=false;
    this.tsunamiWaveXL=0;this.tsunamiWaveXR=0;
    this.windBoostTimer=0;this.windTornadoX=null;
    this.windTornadoActive=false;this.windTornadoDir=1;
    this.stunTimer=0;
    this.transformTimer=0;this.transformActive=false;
    this.transformInvisTimer=0;this.transformInvisActive=false;
    this.ghostHp=0;this.thunderAuraTick=0;
    this.waterRegenTick=0;this.windMiniTornadoTick=0;
    this.crowAngle=0;this.isFlying=false;
    this.v4InvisScheduled=false;this.v4LifestealPct=0;
    this.waterSlowAuraTick=0;this._slowPct=0.5;
    this._tornadoHitTargets=new Set();
    this._dashSmoke=[];
    this.dmgReduceTimer=0;
    this.boulderY=-320;this.boulderLanded=false;
    this.waterCloudTimer=0;this.waterCloudTick=0;this.waterCloudDrops=[];
    this.auraParticles=[];this.afterImages=[];this.transformBurstTimer=0;
    this.transformWindupTimer=0;this._ringAngle=0;
    this._runTrailTick=0;this._lastX=x;
  }
  applyGravity(floorY){
    if(this.stunTimer>0)this.stunTimer--;
    if(this.transformWindupTimer>0){
      // Stand perfectly still and float upward while the V4 transformation charges up.
      this.transformWindupTimer--;
      this._windupFloorY=floorY;
      const capY=floorY-72;
      this.y-=1.7;
      if(this.y<capY)this.y=capY;
      this.vy=0;this.onGround=false;
      if(this.transformWindupTimer===0)this._finalizeTransform(floorY);
      return;
    }
    if(this.transformActive&&this.charType==="frost"&&this.isFlying){
      this.vy*=0.8;this.y+=this.vy;
      if(this.y<60)this.y=60;
      if(this.y>=floorY){this.y=floorY;this.vy=0;}
      this.onGround=false;return;
    }
    this.vy+=GRAVITY;this.y+=this.vy;
    if(this.y>=floorY){this.y=floorY;this.vy=0;this.onGround=true;this.jumpsUsed=0;}
    else this.onGround=false;
  }
  // Fires once the transform windup (stand-still + rise-up) finishes: this is
  // the moment the powerful 20-ray spark explosion happens and the V4 skin
  // actually switches on.
  _finalizeTransform(floorY){
    this.y=floorY;this.vy=0;this.onGround=true;
    this.transformActive=true;this.transformTimer=600;this.attackCooldown=20;
    const buffs=this.getTransformBuffs();
    if(this.charType==="frost")this.isFlying=buffs.can_fly||false;
    if(this.charType==="shadow")this.v4LifestealPct=buffs.lifesteal||0;
    if(this.charType==="red"){this.v4InvisScheduled=true;this.transformInvisActive=false;this.transformInvisTimer=0;}
    if(this.charType==="earth")this.ghostHp=130;
    this.transformBurstTimer=30;
    screenShake=Math.max(screenShake,26);
    const _tCol=this.charType==="red"?"#00AEFF":(ELEMENT_COLORS[this.charType]||"white");
    sfxExplosion();
    const _rays=20; // "tia lửa cực mạnh 20 dạng sóng" — 20 strong spark rays bursting outward
    for(let i=0;i<_rays;i++){
      const ang=(i/_rays)*Math.PI*2,spd=rng()*7+12;
      hitEffects.push({x:this.x,y:this.y-60,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-4,life:44,maxLife:44,particle:true,color:_tCol});
    }
    for(let i=0;i<24;i++){const ang=rng()*Math.PI*2,spd=rng()*7+3;hitEffects.push({x:this.x,y:this.y-60,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-3,life:36,maxLife:36,particle:true,color:_tCol});}
  }
  jump(){
    if(this.stunTimer>0||this.transformWindupTimer>0)return;
    if(this.transformActive&&this.charType==="frost"&&this.isFlying){this.vy=-10;return;}
    if(this.onGround){this.vy=JUMP_POWER;this.onGround=false;this.jumpsUsed=1;}
    else if(this.jumpsUsed<2){this.vy=JUMP_POWER*0.92;this.jumpsUsed=2;}
  }
  getTransformBuffs(){
    if(!this.transformActive)return{};
    switch(this.charType){
      case"red":    return{dmg_mult:1.5,speed:1.2};
      case"shadow": return{dmg_mult:1.6,lifesteal:0.25,speed:1.3};
      case"thunder":return{dmg_mult:1.4,speed:1.5};
      case"frost":  return{dmg_mult:1.3,can_fly:true};
      case"water":  return{dmg_mult:1.3,shield_regen:3};
      case"earth":  return{dmg_mult:1.4,slow_aura:true};
      case"wind":   return{dmg_mult:1.2,speed:2.0};

    return{};
  }
  draw(ox=0,oy=0){
    // Anchor the shrink at the character's feet (ground contact point) so it

    const _gx=this.x+ox, _gy=this.y+oy;
    ctx.save();
    ctx.translate(_gx,_gy);
    ctx.scale(CHAR_VISUAL_SCALE,CHAR_VISUAL_SCALE);

  _drawInner(ox=0,oy=0){

      }
    }
    this._lastX=this.x;
    this._drawAfterImages(ox,oy);
    this._drawLivingAura(rx,ry);

    if(isRedV4){ctx.save();ctx.shadowColor="#00AEFF";ctx.shadowBlur=16;}
    _rect(rx-28,ry,56,52,cFill,cOut,2);
    _rect(rx-12,ry-20,24,20,cFill,cOut,1);
    _rect(rx-20,ry-60,40,40,cFill,cOut,2);
    if(isRedV4)ctx.restore();
    const eyeX=rx+(10*this.direction);
    _oval(eyeX-3,ry-44,6,6,this.charType==="shadow"?"red":"white",null);
    let hatFill="black";
    _rect(rx-36,ry-64,72,4,hatFill,cOut,1);

    if(this.transformWindupTimer>0) _text(rx,ry-105,this.charType==="red"?"🔥 TRIỆU HỒI HỎA NGỤC 🔥":"⚡ ĐANG BIẾN HÌNH ⚡","white","9px Arial bold");
    else if(this.stunTimer>0) _text(rx,ry-105,"⛓ STUNNED ⛓","orange","9px Arial bold");
    else if(this.slowTimer>0) _text(rx,ry-105,"❄️ SLOWED ❄️","deepskyblue","9px Arial bold");
    if(this.charType==="wind"&&this.windBoostTimer>0){
      for(let i=0;i<4;i++){
        const ang=(this.animFrame*8+i*90)%360*(Math.PI/180);

      ctx.strokeStyle=sc;ctx.lineWidth=3;

      ctx.beginPath();ctx.moveTo(rx+55,ry-20);ctx.lineTo(rx+55,ry+55);ctx.stroke();
      ctx.beginPath();ctx.moveTo(rx-55,ry+55);ctx.lineTo(rx+55,ry+55);ctx.stroke();
    }

  // Charge-up visual while the V4 transform winds up: energy spirals inward
  // and upward around the still-frozen, rising fighter, building in intensity
  // until the moment it detonates into the finishing spark explosion.
  _drawTransformWindup(rx,ry){
    const af=this.animFrame,total=48,t=Math.max(0,this.transformWindupTimer),age=total-t,prog=age/total;
    const _h=this.charType==="red";
    const col=_h?"#00AEFF":(ELEMENT_COLORS[this.charType]||"#FFAA33");
    const glow=_h?"#AEEFFF":"#FFEE99";
    if(_h&&!this._windupCrackled&&prog>0.4){this._windupCrackled=true;sfxFireCrackle();}
    if(t===0)this._windupCrackled=false;
    ctx.save();
    ctx.globalAlpha=0.55+prog*0.4;
    ctx.shadowColor=glow;ctx.shadowBlur=14+prog*20;
    for(let i=0;i<10;i++){
      const spinSpeed=6+prog*10;
      const ang=(af*spinSpeed+i*36)*Math.PI/180;
      const rad=(1-prog)*90+8;
      const px=rx+rad*Math.cos(ang);
      const py=ry-15+rad*Math.sin(ang)*0.6-prog*30;
      const s=3+prog*4;
      _oval(px-s,py-s,s*2,s*2,i%2===0?col:glow,null);
    }
    ctx.strokeStyle=col;ctx.lineWidth=2+prog*2;
    ctx.beginPath();ctx.ellipse(rx,ry-15,40+prog*15,60+prog*20,0,0,Math.PI*2*prog+0.2);ctx.stroke();
    ctx.restore();
  }
  _drawAfterImages(ox,oy){
    if(!this.afterImages||!this.afterImages.length)return;
    this.afterImages=this.afterImages.filter(a=>a.life>0);
    this.afterImages.forEach(a=>{
      a.life--;
      const ax=a.x+ox,ay=a.y+oy-52;
      const alpha=Math.max(0,a.life/a.maxLife)*0.32;
      ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=a.color||(ELEMENT_COLORS[this.charType]||"white");
      ctx.fillRect(ax-28,ay,56,52);
      ctx.fillRect(ax-20,ay-60,40,40);
      ctx.restore();
    });
  }
  _drawLivingAura(rx,ry){
    const col=(this.charType==="red"&&this.transformActive)?"#00AEFF":(ELEMENT_COLORS[this.charType]||"white");
    const af=this.animFrame;
    ctx.save();
    for(let l=0;l<4;l++){
      const wobble=Math.sin(af*0.08+l*1.3)*6;
      const rBase=32+l*11+wobble;

      this.auraParticles.push({x:rx+rndInt(-24,24),y:ry+22,vy:-(rng()*1.1+0.6),life:38,maxLife:38,r:rndInt(2,4)});
    }
    this.auraParticles=this.auraParticles.filter(p=>p.life>0);
    this.auraParticles.forEach(p=>{
      p.y+=p.vy;p.life--;
      ctx.save();ctx.globalAlpha=Math.max(0,p.life/p.maxLife)*0.65;
      _oval(p.x-p.r,p.y-p.r,p.r*2,p.r*2,col,null);
      ctx.restore();
    });
  }
  // Per-character ambient idle FX so silhouettes read differently at a glance
  // even without new sprites: fire licks the fists, shadow trails dark wisps
  // and hovers, thunder crackles with tiny arcs, frost has snow drifting down,
  // earth has small rocks orbiting, water drips gentle droplets, wind trails
  // a flowing ribbon/scarf. Skipped while V4-transformed (that has its own FX).
  _drawAmbientFX(rx,ry){
    if(this.transformActive||this.transformWindupTimer>0)return;
    const af=this.animFrame;
    if(!this._ambient)this._ambient={parts:[]};
    const amb=this._ambient;
    if(this.charType==="red"){

// ================================================================
class ChallengeEnemy {
  constructor(x,y,stage){
    const cfg=CHALLENGE_ENEMY_CFG[stage];
    this.x=x;this.y=y;this.vy=0;this.onGround=false;
    this.hp=cfg.hp;this.maxHp=cfg.hp;this.spd=cfg.spd;this.dmg=cfg.dmg;
    this.stage=stage;this.direction=1;this.attackTimer=0;this.anim=0;
    this.slowTimer=0;this._slowPct=0.5;this.stunTimer=0;
  }
  applyGravity(floorY){this.vy+=GRAVITY;this.y+=this.vy;if(this.y>=floorY){this.y=floorY;this.vy=0;this.onGround=true;}else this.onGround=false;}
  update(player,floorY,w){
    this.anim++;this.applyGravity(floorY);
    if(this.stunTimer>0){this.stunTimer--;return;}
    const dx=player.x-this.x;this.direction=dx>0?1:-1;
    if(Math.abs(dx)>60)this.x+=this.spd*this.direction;
    this.x=clamp(this.x,40,w-40);
    this.attackTimer--;
    if(this.attackTimer<=0&&Math.abs(dx)<80){applyDamage(player,player.isShielding?this.dmg*0.2:this.dmg,null);this.attackTimer=70;}
  }
  draw(){
    const COLS={1:"#884400",2:"#aa2200",3:"#cc0055",4:"#8800cc"},col=COLS[this.stage]||"gray";
    _rect(this.x-20,this.y-40,40,40,col,"white",2);_rect(this.x-15,this.y-65,30,30,col,"white",2);
    _oval(this.x+8*this.direction-4,this.y-57,8,8,"red",null);
    const bw=60*(this.hp/this.maxHp);
    _rect(this.x-30,this.y-80,60,7,"#333",null,0);_rect(this.x-30,this.y-80,bw,7,"#ff4444",null,0);
    _text(this.x,this.y-90,`S${this.stage} ${this.direction>0?">":"<"}`,"yellow","8px Arial bold");
  }
}

    if(this.slowTimer>0)_text(rx,ry-90,"❄️","deepskyblue","10px Arial");
    const bw=36*(this.hp/this.maxHp);
    _rect(rx-18,ry-78,36,5,"#333",null,0);_rect(rx-18,ry-78,Math.max(0,bw),5,this.elite?"#ff4444":"#ffaa33",null,0);

  _drawRabbit(){

// ================================================================
//  ROAD MODE — 3 MAIN BOSSES (MA THÚ)

class RoadBoss{
  constructor(type,x,floorY){
    this.type=type;this.x=x;this.y=floorY;this.floorY=floorY;this.vy=0;
    this.anim=0;this.dead=false;this.direction=-1;this.stunTimer=0;this.phase=1;
    this.summonQueue=[];this.hitFlash=0;this.skillTimer={};
    this._init();
  }
  _init(){
    if(this.type===1){
      this.hp=this.maxHp=320;this.skillTimer={summon:260};this.bobPhase=0;
    }else if(this.type===2){
      this.hp=this.maxHp=420;this.state="SURFACE";this.stateTimer=120;
      this.skillTimer={action:150,summon:560,rain:340};
      this.projectilesOut=[];this.spikeTelegraphs=[];this.visible=true;
      this.sandRainActive=0;this.sandRainCenterX=this.x;this.targetSpikeX=this.x;
    }else{
      this.hp=this.maxHp=520;this.phase=1;
      this.skillTimer={spike:280,dive:360,roar:540};
      this.wingAngle=0;this.diveActive=false;this.diveHitDone=false;
      this.diveTargetX=this.x;this.diveTargetY=this.floorY-30;
      this.bloodSpikes=[];this.roarActive=0;this.roarWarn=0;this.hoverOffset=0;
      this.y=this.floorY-140;
    }
  }
  update(player){
    this.anim++;
    if(this.hitFlash>0)this.hitFlash--;
    if(this.stunTimer>0){this.stunTimer--;return;}
    for(const k in this.skillTimer)if(this.skillTimer[k]>0)this.skillTimer[k]--;
    if(this.type===1)this._update1(player);
    else if(this.type===2)this._update2(player);
    else this._update3(player);
    this.x=clamp(this.x,roadCameraX+50,roadCameraX+W-50);
  }
  _update1(player){
    this.y=this.floorY;this.bobPhase+=0.05;
    if(Math.abs(player.x-this.x)<75&&player.hp>0&&rng()<0.015)applyDamage(player,3,null);
    if(this.skillTimer.summon<=0){
      this.skillTimer.summon=420;
      for(let i=0;i<2;i++)this.summonQueue.push(new RoadEnemy(this.x+rndInt(-150,150),this.floorY,3,false,false,true));
      this.hitFlash=Math.max(this.hitFlash,10);screenShake=Math.max(screenShake,10);
    }
  }
  _update2(player){
    const s=this.skillTimer,isP2=this.hp<=this.maxHp*0.5;
    if(this.state==="SURFACE"){
      this.y=this.floorY;
      const dx=player.x-this.x;this.x+=1.5*(dx>0?1:-1);this.direction=dx>0?1:-1;
      if(s.action<=0){
        s.action=isP2?110:150;
        if(rng()<0.5&&player.hp>0){
          for(let i=-1;i<=1;i++){
            const rad=Math.atan2(player.y-this.y,player.x-this.x)+i*0.15;
            this.projectilesOut.push({x:this.x,y:this.y-40,vx:Math.cos(rad)*8,vy:Math.sin(rad)*8,life:120,dmg:5});
          }
        }else{this.state="BURROWING";this.stateTimer=40;this.targetSpikeX=player.x;}
      }
      if(s.summon<=0){s.summon=560;this.summonQueue.push(new RoadEnemy(this.x+rndInt(-160,160),this.floorY,3,true,false));}
    }else if(this.state==="BURROWING"){
      this.y+=6;this.stateTimer--;
      if(this.stateTimer<=0){this.state="BURROWED";this.stateTimer=45;this.visible=false;}
    }else if(this.state==="BURROWED"){
      this.stateTimer--;
      if(this.stateTimer<=0){
        const ex=this.targetSpikeX;
        this.spikeTelegraphs=[];
        for(let i=-2;i<=2;i++)this.spikeTelegraphs.push({x:ex+i*45,timer:30});
        this.state="ERUPT_WAIT";this.stateTimer=32;
      }
    }else if(this.state==="ERUPT_WAIT"){
      this.stateTimer--;this.spikeTelegraphs.forEach(t=>t.timer--);
      if(this.stateTimer<=0){
        this.spikeTelegraphs.forEach(t=>{if(player.hp>0&&Math.abs(t.x-player.x)<30)applyDamage(player,7,null);});
        this.eruptFlash={x:this.targetSpikeX,timer:14};
        this.spikeTelegraphs=[];
        this.x=clamp(player.x+rndInt(-60,60),roadCameraX+80,roadCameraX+W-80);
        this.y=this.floorY;this.visible=true;this.state="SURFACE";this.stateTimer=150;
        screenShake=Math.max(screenShake,14);
      }
    }
    if(s.rain<=0){s.rain=420;this.sandRainActive=90;this.sandRainCenterX=player.x;}
    if(this.sandRainActive>0){
      this.sandRainActive--;
      if(this.sandRainActive%12===0&&player.hp>0&&Math.abs(player.x-this.sandRainCenterX)<160)applyDamage(player,1,null);
    }
    this.projectilesOut=this.projectilesOut.filter(p=>{
      p.x+=p.vx;p.y+=p.vy;p.life--;
      if(player.hp>0&&Math.abs(p.x-player.x)<40&&Math.abs(p.y-player.y)<70){applyDamage(player,p.dmg,null);return false;}
      return p.life>0;
    });
    if(this.eruptFlash&&this.eruptFlash.timer>0)this.eruptFlash.timer--;
  }
  _update3(player){
    this.wingAngle=(this.wingAngle+5)%360;
    this.hoverOffset=Math.sin(this.anim*0.04)*14;
    if(this.hp<=this.maxHp*0.5&&this.phase===1){this.phase=2;screenShake=Math.max(screenShake,30);}
    const isP2=this.phase===2,s=this.skillTimer;
    if(!this.diveActive){
      const dx=player.x-this.x,spd=isP2?3.2:2.2,ideal=240;
      if(Math.abs(dx)>ideal+60)this.x+=spd*(dx>0?1:-1);
      this.direction=dx>0?1:-1;
      this.y=this.floorY-140+this.hoverOffset;
    }
    if(s.spike<=0){
      s.spike=isP2?210:300;
      for(let i=0;i<(isP2?4:2);i++)this.bloodSpikes.push({x:player.x+rndInt(-140,140),y:-30,vy:0,warnTimer:35,fell:false});
    }
    this.bloodSpikes=this.bloodSpikes.filter(sp=>{
      if(sp.warnTimer>0){sp.warnTimer--;return true;}
      sp.vy+=0.9;sp.y+=sp.vy;
      if(!sp.fell&&sp.y>=this.floorY-4){
        sp.fell=true;
        if(player.hp>0&&Math.abs(sp.x-player.x)<34)applyDamage(player,isP2?9:7,null);
        return false;
      }
      return sp.y<this.floorY;
    });
    if(!this.diveActive&&s.dive<=0){
      s.dive=isP2?330:400;this.diveActive=true;this.diveHitDone=false;
      this.diveTargetX=player.x;this.diveTargetY=this.floorY-30;
    }
    if(this.diveActive){
      const dx=this.diveTargetX-this.x,dy=this.diveTargetY-this.y,d=Math.max(1,Math.hypot(dx,dy)),spd=isP2?13:10;
      this.x+=dx/d*spd;this.y+=dy/d*spd;
      if(d<40){
        this.diveActive=false;screenShake=Math.max(screenShake,20);
        if(!this.diveHitDone){
          this.diveHitDone=true;
          if(player.hp>0&&Math.abs(this.x-player.x)<90){applyDamage(player,isP2?13:10,null);player.x=clamp(player.x+(player.x>this.x?1:-1)*160,roadCameraX+40,roadCameraX+W-40);}
        }
      }
    }
    if(s.roar<=0&&this.roarWarn<=0&&this.roarActive<=0){s.roar=isP2?460:580;this.roarWarn=50;}
    if(this.roarWarn>0){
      this.roarWarn--;
      if(this.roarWarn===0){
        this.roarActive=40;
        if(player.hp>0&&Math.abs(this.x-player.x)<600){applyDamage(player,isP2?10:7,null);player.stunTimer=Math.max(player.stunTimer,60);}
        screenShake=Math.max(screenShake,26);
      }
    }
    if(this.roarActive>0)this.roarActive--;
  }
  draw(){if(this.type===1)this._draw1();else if(this.type===2)this._draw2();else this._draw3();}
  _draw1(){
    const rx=this.x,ry=this.y,pulse=Math.sin(this.bobPhase)*6;
    ctx.save();
    ctx.shadowColor="#7CFC00";ctx.shadowBlur=this.hitFlash>0?30:14;
    const grad=ctx.createRadialGradient(rx-20,ry-140,10,rx,ry-100,140);
    grad.addColorStop(0,"#e8ffcc");grad.addColorStop(0.5,"#9ecb5c");grad.addColorStop(1,"#3f5c1e");
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.ellipse(rx,ry-100,100+pulse*0.3,140+pulse,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="#2b3d10";ctx.lineWidth=4;ctx.stroke();
    ctx.restore();
    for(let i=0;i<5;i++){
      const ang=(i/5)*Math.PI*2+this.anim*0.003;
      ctx.strokeStyle=`rgba(120,200,60,${0.5+0.3*Math.sin(this.anim*0.05+i)})`;ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(rx,ry-100);ctx.lineTo(rx+Math.cos(ang)*80,ry-100+Math.sin(ang)*110);ctx.stroke();
    }
    const embryoPulse=0.4+0.3*Math.sin(this.anim*0.08);
    ctx.save();ctx.globalAlpha=embryoPulse;ctx.fillStyle="#ffee88";ctx.beginPath();ctx.ellipse(rx,ry-110,26,36,0,0,Math.PI*2);ctx.fill();ctx.restore();

  else if(skillType==="shadow"){const dx=player.x-boss.x;boss.x=clamp(player.x-(dx>0?80:-80),60,w-60);applyDamage(player,6,boss);screenShake=Math.max(screenShake,10);}
  else if(skillType==="ice"){projectiles.push({x:boss.x,y:boss.y-30,vx:10*(player.x>boss.x?1:-1),vy:0,owner:boss,target:player,damage:4,slow:150,slow_pct:0.45,color:"cyan",type:"ice_arrow"});}
  else if(skillType==="thunder"){if(Math.abs(boss.x-player.x)<500){applyDamage(player,7,boss);screenShake=Math.max(screenShake,15);}}
  else if(skillType==="earth"){if(Math.abs(boss.x-player.x)<400){applyDamage(player,8,boss);player.vy=-10;}}
  else if(skillType==="water"){if(Math.abs(boss.x-player.x)<450){const push=player.x>boss.x?1:-1;player.x=clamp(player.x+push*200,40,w-40);applyDamage(player,5,boss);}}
  else if(skillType==="wind"){if(Math.abs(boss.x-player.x)<500){const pull=player.x>boss.x?-1:1;player.x=clamp(player.x+pull*150,40,w-40);applyDamage(player,4,boss);}}
}

function _rect(x,y,w,h,fill,stroke,lw=1){if(w<0){x+=w;w=-w;}if(h<0){y+=h;h=-h;}ctx.fillStyle=fill;ctx.fillRect(x,y,w,h);if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.strokeRect(x,y,w,h);}}
function _rectOutline(x,y,w,h,stroke,lw){if(w<0){x+=w;w=-w;}if(h<0){y+=h;h=-h;}ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.strokeRect(x,y,w,h);}
function _oval(x,y,w,h,fill,stroke,lw=1){ctx.beginPath();ctx.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}}
function _line(x1,y1,x2,y2,stroke,lw){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function _text(x,y,txt,fill,font){ctx.fillStyle=fill;ctx.font=font;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(txt,x,y);}

function getAllEnemies(attacker){
  if(gameState==="GAMEPLAY"){
    const fighters=[p1,p2].filter(p=>p!==attacker&&p.hp>0);
    const oppPuppets=puppets.filter(pu=>pu.owner!==attacker&&pu.hp>0);
    return[...fighters,...oppPuppets];
  }
  if(gameState==="ROAD"){
    const arr=[...roadEnemies.filter(e=>e.hp>0)];
    const fw=getFrontWall();if(fw)arr.push(fw);
    if(roadBoss&&!roadBoss.dead&&roadBoss.hp>0&&!(roadBoss.type===2&&roadBoss.visible===false))arr.push(roadBoss);
    return arr;
  }
  return[...challengeEnemies.filter(e=>e.hp>0),...challengeBosses.filter(b=>!b.dead&&b.hp>0)];
}
function getFrontWall(){const ahead=roadWalls.filter(w=>w.hp>0&&w.x>=p1.x-80);if(!ahead.length)return null;return ahead.reduce((a,b)=>a.x<b.x?a:b);}
// Fixed obstacles (gates) and the 3 major road bosses are anchored set-pieces —
// knockback/push effects should still damage them but must never reposition them.
function isPushable(t){return !(t instanceof RoadWall) && !(t instanceof RoadBoss);}
function getRoadTarget(attacker){const cands=getAllEnemies(attacker);if(!cands.length)return null;return cands.reduce((best,c)=>Math.abs(c.x-attacker.x)<Math.abs(best.x-attacker.x)?c:best);}
function applyDamage(target,damage,attacker){
  if(attacker&&attacker.charType==="red")damage*=1.2;
  if(attacker&&attacker.transformActive){const buffs=attacker.getTransformBuffs();damage*=buffs.dmg_mult||1;const ls=buffs.lifesteal||0;if(ls>0&&attacker.hp!==undefined)attacker.hp=Math.min(MAX_HP,attacker.hp+damage*ls);}
  if(target instanceof Fighter){
    if(target.hp<=0)return;
    if(target.charType==="red"&&target.transformInvisActive)return;
    if(target.charType==="earth"&&target.ghostHp>0){target.ghostHp-=damage;if(target.ghostHp<0){const ov=-target.ghostHp;target.ghostHp=0;target.hp-=target.isShielding?ov*0.2:ov;target.hp=Math.max(0,target.hp);}return;}
    if(target.charType==="water"&&target.waterShieldHp>0){target.waterShieldHp-=damage;if(target.waterShieldHp<0){const ov=-target.waterShieldHp;target.waterShieldHp=0;target.hp-=target.isShielding?ov*0.2:ov;target.hp=Math.max(0,target.hp);}return;}
    if(target.charType==="earth"&&target.activeSkill==="earth_s3"&&attacker){const ref=damage*0.8;if(attacker.hp!==undefined)attacker.hp=Math.max(0,attacker.hp-(attacker.isShielding?ref*0.2:ref));return;}
    let finalDmg=damage;
    if(target.dmgReduceTimer&&target.dmgReduceTimer>0)finalDmg*=0.3;
    target.hp-=target.isShielding?finalDmg*0.2:finalDmg;
    target.hp=Math.max(0,target.hp);
    spawnHitEffect(target.x,target.y-70,ELEMENT_COLORS[attacker&&attacker.charType]||"white");
  }else if(target instanceof IcePuppet){if(target.hp<=0)return;target.hp=Math.max(0,target.hp-damage);spawnHitEffect(target.x,target.y-40,"white");}
  else if(target instanceof ChallengeEnemy){if(target.hp<=0)return;target.hp=Math.max(0,target.hp-damage);spawnHitEffect(target.x,target.y-50,"orange");}
  else if(target instanceof Boss){if(target.dead||target.hp<=0)return;target.hp-=damage;spawnHitEffect(target.x,target.y-90,"gold");if(target.hp<=0){target.hp=0;target.dead=true;spawnBossDeathBurst(target.x,target.y);}}
  else if(target instanceof RoadWall){if(target.hp<=0)return;target.hp=Math.max(0,target.hp-damage);spawnHitEffect(target.x,H*FLOOR_Y_RATIO-90,"#e8a33d");}
  else if(target instanceof RoadEnemy){if(target.hp<=0)return;target.hp=Math.max(0,target.hp-damage);spawnHitEffect(target.x,target.y-50,"#ffaa33");}
  else if(target instanceof RoadBoss){
    if(target.dead||target.hp<=0)return;
    if(target.type===2&&target.visible===false)return;
    target.hp-=damage;target.hitFlash=8;
    spawnHitEffect(target.x,target.y-100,"crimson");
    if(target.hp<=0){target.hp=0;target.dead=true;spawnBossDeathBurst(target.x,target.y);}
  }
}
function aoeHit(attacker,damage,radius){radius*=SR;getAllEnemies(attacker).forEach(tgt=>{if(Math.abs(tgt.x-attacker.x)<radius&&Math.abs(tgt.y-attacker.y)<radius*0.8)applyDamage(tgt,damage,attacker);});}
function aoeHitAt(attacker,damage,cx,cy,radius){radius*=SR;getAllEnemies(attacker).forEach(tgt=>{if(Math.abs(tgt.x-cx)<radius&&Math.abs(tgt.y-cy)<radius*0.9)applyDamage(tgt,damage,attacker);});}
function aoePush(attacker,damage,radius){radius*=SR;getAllEnemies(attacker).forEach(tgt=>{const dx=tgt.x-attacker.x;if(Math.abs(dx)<radius&&Math.abs(tgt.y-attacker.y)<120*SR){if(isPushable(tgt)){const pd=dx>=0?1:-1;tgt.x=clamp(tgt.x+pd*Math.floor(radius*0.5),40,W-40);if(tgt instanceof Fighter)tgt.vy=-5;}applyDamage(tgt,damage,attacker);}});}
function getChallengeTarget(attacker){const cands=[...challengeEnemies.filter(e=>e.hp>0),...challengeBosses.filter(b=>!b.dead&&b.hp>0)];if(!cands.length)return null;return cands.reduce((best,c)=>Math.abs(c.x-attacker.x)<Math.abs(best.x-attacker.x)?c:best);}

function updateProjectiles(floorY,player2){
  const active=[];
  for(const proj of projectiles){
    proj.x+=proj.vx;if(proj.vy!==undefined)proj.y+=proj.vy;
    const px=proj.x,py=proj.y,pDir=proj.vx>=0?1:-1,color=proj.color||"cyan",pType=proj.type||"";
    ctx.save();ctx.translate(px,py);ctx.scale(CHAR_VISUAL_SCALE,CHAR_VISUAL_SCALE);ctx.translate(-px,-py);
    if(pType==="wind_orb"){const r=proj.radius||14;_oval(px-r,py-r,r*2,r*2,"#90EE90","white");_oval(px-r/2,py-r/2,r,r,"white",null);}
    else if(pType==="water_orb"){
      const r=proj.radius||15;
      ctx.save();ctx.shadowColor="aqua";ctx.shadowBlur=12;
      _oval(px-r,py-r,r*2,r*2,"dodgerblue","aqua",1.5);
      _oval(px-r*0.35,py-r*0.55,r*0.55,r*0.4,"#D6F3FF",null);
      ctx.restore();
      for(let i=0;i<3;i++)_oval(px+rndInt(-r,r)*0.6-2,py+rndInt(-r,r)*0.6-2,4,4,"rgba(200,240,255,0.6)",null);
    }
    else if(pType==="ice_arrow"){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(px,py-8);ctx.lineTo(px+20*pDir,py);ctx.lineTo(px,py+8);ctx.lineTo(px-8*pDir,py);ctx.closePath();ctx.fill();}
    else if(pType==="ice_slash"){
      ctx.save();ctx.shadowColor="cyan";ctx.shadowBlur=12;
      ctx.strokeStyle="#E0FFFF";ctx.lineWidth=5;ctx.lineCap="round";
      ctx.beginPath();ctx.moveTo(px-16*pDir,py-16);ctx.quadraticCurveTo(px+12*pDir,py,px-16*pDir,py+16);ctx.stroke();
      ctx.strokeStyle="white";ctx.lineWidth=2;ctx.stroke();
      ctx.restore();
      for(let i=0;i<3;i++)_oval(px-3+rndInt(-6,6),py-3+rndInt(-10,10),6,6,"white",null);
    }
    else{ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px-25*pDir,py-6);ctx.lineTo(px-20*pDir,py);ctx.lineTo(px-25*pDir,py+6);ctx.closePath();ctx.fill();}
    ctx.restore();
    let hit=false;
    const owner=proj.owner,dmg=proj.damage,slowF=proj.slow||0,slowP=proj.slow_pct||0;
    if(gameState==="GAMEPLAY"&&player2){const tgt=proj.target;if(tgt instanceof Fighter&&tgt.hp>0&&Math.abs(px-tgt.x)<55*SR&&Math.abs(py-tgt.y)<85*SR){applyDamage(tgt,dmg,owner);if(slowF>0){tgt.slowTimer=Math.max(tgt.slowTimer,slowF);tgt._slowPct=slowP;}hit=true;}}
    else if(gameState==="CHALLENGE"){if(owner instanceof Fighter){let exploded=false;challengeEnemies.forEach(e=>{if(e.hp>0&&Math.abs(px-e.x)<60*SR&&Math.abs(py-e.y)<80*SR){applyDamage(e,dmg,owner);hit=true;exploded=true;}});challengeBosses.forEach(b=>{if(!b.dead&&b.hp>0&&Math.abs(px-b.x)<70*SR&&Math.abs(py-b.y)<100*SR){applyDamage(b,dmg,owner);hit=true;exploded=true;}});if(exploded){[...challengeEnemies].forEach(e=>{if(e.hp>0&&Math.abs(px-e.x)<120*SR&&Math.abs(py-e.y)<120*SR)applyDamage(e,dmg*0.5,owner);});}}else{if(p1.hp>0&&Math.abs(px-p1.x)<55*SR&&Math.abs(py-p1.y)<85*SR){applyDamage(p1,dmg,owner);if(slowF>0){p1.slowTimer=Math.max(p1.slowTimer,slowF);p1._slowPct=slowP;}hit=true;}}}
    else if(gameState==="ROAD"){
      if(owner instanceof Fighter){
        let exploded=false;
        roadEnemies.forEach(e=>{if(e.hp>0&&Math.abs(px-e.x)<50*SR&&Math.abs(py-e.y)<80*SR){applyDamage(e,dmg,owner);hit=true;exploded=true;}});
        const fw=getFrontWall();
        if(fw&&Math.abs(px-fw.x)<50*SR&&py>H*0.25){applyDamage(fw,dmg,owner);hit=true;exploded=true;}
        if(roadBoss&&!roadBoss.dead&&Math.abs(px-roadBoss.x)<80*SR&&Math.abs(py-roadBoss.y)<160*SR){applyDamage(roadBoss,dmg,owner);hit=true;exploded=true;}
        if(exploded)roadEnemies.forEach(e=>{if(e.hp>0&&Math.abs(px-e.x)<120*SR&&Math.abs(py-e.y)<120*SR)applyDamage(e,dmg*0.5,owner);});
      }else{
        if(p1.hp>0&&Math.abs(px-p1.x)<45*SR&&Math.abs(py-p1.y)<80*SR){applyDamage(p1,dmg,owner);if(slowF>0){p1.slowTimer=Math.max(p1.slowTimer,slowF);p1._slowPct=slowP;}hit=true;}
      }
    }
    const inBounds = gameState==="ROAD" ? (px>roadCameraX-80&&px<roadCameraX+W+80)
      : ((gameState==="GAMEPLAY"||gameState==="CHALLENGE") ? (px>campX-80&&px<campX+W+80) : (px>0&&px<W));
    if(!hit&&inBounds)active.push(proj);
  }
  projectiles.length=0;projectiles.push(...active);
}

let _waveSpawnTimer=0;
function startChallenge(stage){
  challengeStage=stage;challengeEnemies=[];challengeBosses=[];
  challengeWaveIdx=0;challengeBossSpawned=false;challengeResult="";
  const floorY=H*FLOOR_Y_RATIO;
  const worldW=W*MAP_SCALE;
  const batches=stage<4?[2,3,4,1]:[2,3,3,2];
  challengeWaveSched=batches.slice(0,3);
  challengeWaveSched.push(10-challengeWaveSched.reduce((a,b)=>a+b,0));
  challengeState="WAVE";_spawnChallengeWave(floorY,worldW);
}
function _spawnChallengeWave(floorY,worldW){
  if(challengeWaveIdx>=challengeWaveSched.length)return;
  const cnt=challengeWaveSched[challengeWaveIdx++];
  const ww=worldW||W*MAP_SCALE;
  for(let i=0;i<cnt;i++){
    const side=rng()<0.5?-1:1;
    const ex=clamp(p1.x+side*rndInt(220,420)+rndInt(-60,60),80,ww-80);
    challengeEnemies.push(new ChallengeEnemy(ex,floorY,challengeStage));
  }
}

// ================================================================
//  V4 TRANSFORM TICK
// ================================================================
function tickV4(p){
  if(!p.transformActive)return;
  if(p.transformTimer>0)p.transformTimer--;
  else{
    p.transformActive=false;p.isFlying=false;p.v4LifestealPct=0;p.ghostHp=0;p.transformInvisActive=false;p.transformInvisTimer=0;
    if(p.charType==="red"){
      // Small closing burst + distinct sound as the blue hellfire fades and normal red fire returns.
      sfxTransformEnd();
      for(let i=0;i<14;i++){const ang=rng()*Math.PI*2,spd=rng()*3+1.5;hitEffects.push({x:p.x,y:p.y-60,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-1,life:26,maxLife:26,particle:true,color:rndChoice(["#0099FF","#66DFFF","#FF6600"])});}
      hitEffects.push({x:p.x,y:p.y-60,life:22,maxLife:22,color:"#00AEFF",ring:true});
    }
    return;
  }
  if(p.charType==="red"&&p.v4InvisScheduled&&p.transformTimer<=300){p.v4InvisScheduled=false;p.transformInvisActive=true;p.transformInvisTimer=120;}
  if(p.charType==="red"&&p.transformInvisActive){if(p.transformInvisTimer>0)p.transformInvisTimer--;else p.transformInvisActive=false;}
  if(p.charType==="thunder"){p.thunderAuraTick++;if(p.thunderAuraTick>=15){p.thunderAuraTick=0;getAllEnemies(p).forEach(opp=>{if(dist(p.x,p.y,opp.x,opp.y)<540)applyDamage(opp,2.5,p);});}}
  if(p.charType==="frost"&&!p.isFlying)p.isFlying=true;
  if(p.charType==="water"){p.waterRegenTick++;if(p.waterRegenTick>=15){p.waterRegenTick=0;p.hp=Math.min(MAX_HP,p.hp+3);}p.waterSlowAuraTick++;if(p.waterSlowAuraTick>=30){p.waterSlowAuraTick=0;getAllEnemies(p).forEach(opp=>{if(dist(p.x,p.y,opp.x,opp.y)<320){opp.slowTimer=Math.max(opp.slowTimer||0,45);opp._slowPct=0.8;}});}}
  if(p.charType==="wind"){p.windMiniTornadoTick++;if(p.windMiniTornadoTick===1){getAllEnemies(p).forEach(opp=>{if(dist(p.x,p.y,opp.x,opp.y)<160){if(opp instanceof Fighter)opp.vy=-16;applyDamage(opp,5,p);}});}else if(p.windMiniTornadoTick>=120)p.windMiniTornadoTick=0;}
}

// ================================================================
//  WATER RAIN CLOUD TICK (skill 2)
// ================================================================
function tickWaterCloud(p){
  if(p.dmgReduceTimer>0)p.dmgReduceTimer--;
  if(!p.waterCloudTimer||p.waterCloudTimer<=0){p.waterCloudTimer=0;return;}
  p.waterCloudTimer--;
  p.waterCloudTick=(p.waterCloudTick||0)+1;
  if(p.waterCloudTick>=60){p.waterCloudTick=0;p.hp=Math.min(MAX_HP,p.hp+2);}
  if(!p.waterCloudDrops)p.waterCloudDrops=[];
  if(rng()<0.5&&p.waterCloudDrops.length<20)p.waterCloudDrops.push({x:p.x+rndInt(-45,45),y:p.y-rndInt(60,130),r:rndInt(2,4)});
  p.waterCloudDrops.forEach(d=>{d.y+=6;});
  p.waterCloudDrops=p.waterCloudDrops.filter(d=>d.y<p.y+10);
  getAllEnemies(p).forEach(opp=>{
    if(Math.abs(opp.x-p.x)<75&&Math.abs(opp.y-p.y)<100){
      opp.slowTimer=Math.max(opp.slowTimer||0,15);opp._slowPct=0.5;
    }
  });
}

  if(mx>=px+pw/2-140&&mx<=px+pw/2-20&&my>=doneY&&my<=doneY+36){ gameState="MENU"; rebindingAction=null; return; }
  if(mx>=px+pw/2+20&&mx<=px+pw/2+140&&my>=doneY&&my<=doneY+36){
    keyBindings={left:"a", right:"d", up:"w", down:"s", s1:"e", s2:"f", s3:"t", s4:"g", v4:"y", shield:"r"};
    rebindingAction=null; return;
  }
}

function _hitTestVBtn(x,y,btn){ return btn && Math.hypot(x-btn.x, y-btn.y) <= ((btn.r||30)+6); }
function drawTouchEditor(){

  _rect(W-140,16,120,32,"#2d6a2d","white",1); _text(W-80,32,"XONG","white","11px Arial bold");

  if(touchEditorSelKey){

    _rect(W/2-140,by-16,44,44,"#333","white",2); _text(W/2-118,by+6,"−","white","20px Arial bold");
    _rect(W/2-40,by-16,80,44,"#444","#888",1); _text(W/2,by+6,`x${mobileLayoutCfg[touchEditorSelKey].scale.toFixed(1)}`,"white","10px Arial bold");
    _rect(W/2+96,by-16,44,44,"#333","white",2); _text(W/2+118,by+6,"+","white","20px Arial bold");
    _rect(W/2+160,by-16,110,44,"#7a3b3b","white",1); _text(W/2+215,by+6,"Đặt lại nút","white","9px Arial bold");
  }
}
function handleTouchEditorPointer(x,y,phase){
  if(phase==="down"){
    if(x>=20&&x<=160&&y>=16&&y<=48){
      Object.keys(mobileLayoutCfg).forEach(k=>{mobileLayoutCfg[k]={dx:0,dy:0,scale:1};});
      mobileLayoutVersion++; touchEditorSelKey=null; touchEditorDrag=null; return;
    }
    if(x>=W-140&&x<=W-20&&y>=16&&y<=48){ gameState="MENU"; touchEditorDrag=null; return; }
    if(touchEditorSelKey){
      const by=H-70;
      if(x>=W/2-140&&x<=W/2-96&&y>=by-16&&y<=by+28){
        const c=mobileLayoutCfg[touchEditorSelKey]; c.scale=Math.max(0.6,+(c.scale-0.1).toFixed(2)); mobileLayoutVersion++; return;
      }
      if(x>=W/2+96&&x<=W/2+140&&y>=by-16&&y<=by+28){
        const c=mobileLayoutCfg[touchEditorSelKey]; c.scale=Math.min(1.8,+(c.scale+0.1).toFixed(2)); mobileLayoutVersion++; return;
      }
      if(x>=W/2+160&&x<=W/2+270&&y>=by-16&&y<=by+28){
        mobileLayoutCfg[touchEditorSelKey]={dx:0,dy:0,scale:1}; mobileLayoutVersion++; return;
      }
    }
    buildVBtns();
    const order=["joystick","s1","s2","s3","s4","shield","v4"];
    for(const k of order){
      if(_hitTestVBtn(x,y,vBtns1[k])){
        touchEditorSelKey=k;
        touchEditorDrag={key:k, startX:x, startY:y, baseDx:mobileLayoutCfg[k].dx, baseDy:mobileLayoutCfg[k].dy};
        return;
      }
    }
    touchEditorSelKey=null; touchEditorDrag=null;
  }else if(phase==="move"){
    if(!touchEditorDrag) return;
    const c=mobileLayoutCfg[touchEditorDrag.key];
    c.dx = touchEditorDrag.baseDx + (x-touchEditorDrag.startX);
    c.dy = touchEditorDrag.baseDy + (y-touchEditorDrag.startY);
    mobileLayoutVersion++;
  }else if(phase==="up"){
    touchEditorDrag=null;
  }
}

// ================================================================
//  MENU CLICK HANDLER
// ================================================================
function handleMenuClick(mx, my) {
  if(gameState==="MENU"){
    // Gear icon
    if(W-60<=mx&&mx<=W-20&&20<=my&&my<=60){showSettings=!showSettings;return;}
    if(showSettings){handleSettingsClick(mx,my);return;}
    for(let i=0;i<5;i++){
      if(W/2-150<=mx&&mx<=W/2+150&&H/2+i*60<=my&&my<=H/2+45+i*60){
        if(i===3){gameState="CHALLENGE_SELECT";return;}
        if(i===4){gameState="ROAD_CHAR_SELECT";return;}
        gameMode="PVE";botLevel=i+1;selectingPlayer=1;gameState="CHAR_SELECT";return;
      }
    }
  }else if(gameState==="ROAD_CHAR_SELECT"){
    CHARS.forEach((ch,i)=>{const cx=W/2-700+i*200,cy=H/2-50;if(cx<=mx&&mx<=cx+170&&cy<=my&&my<=cy+250){selectedP1=ch.id;startRoadMode();}});
  }else if(gameState==="CHALLENGE_SELECT"){
    for(let i=0;i<4;i++){const by1=H/2-80+i*80;if(W/2-100<=mx&&mx<=W/2+100&&by1<=my&&my<=by1+60){challengeStage=i+1;gameState="CHALLENGE_CHAR_SELECT";return;}}
  }else if(gameState==="CHALLENGE_CHAR_SELECT"){
    CHARS.forEach((ch,i)=>{const cx=W/2-700+i*200,cy=H/2-50;if(cx<=mx&&mx<=cx+170&&cy<=my&&my<=cy+250){selectedP1=ch.id;startChallengeMode(challengeStage);}});
  }else if(gameState==="CHAR_SELECT"){
    CHARS.forEach((ch,i)=>{
      const cx=W/2-700+i*200,cy=H/2-50;
      if(cx<=mx&&mx<=cx+170&&cy<=my&&my<=cy+250){
        if(selectingPlayer===1){selectedP1=ch.id;if(gameMode==="PVP"){selectingPlayer=2;}else{const avail=CHARS.filter(c=>c.id!==ch.id);selectedP2=rndChoice(avail).id;startMatch();}}
        else{selectedP2=ch.id;startMatch();}
      }
    });
  }else if(gameState==="KEY_EDITOR"){
    handleKeyEditorClick(mx,my);
  }
}

// ================================================================
//  MAIN UPDATE LOOP
// ================================================================
function update(){
  try{
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = (gameState==="GAMEPLAY"||gameState==="CHALLENGE"||gameState==="ROAD") ? "#87CEFA" : "black";
  ctx.fillRect(0,0,W,H);
  let dx=0,dy=0;
  if(screenShake>0){dx=rndInt(-screenShake,screenShake);dy=rndInt(-screenShake,screenShake);screenShake*=0.96;if(screenShake<0.8)screenShake=0;}
  frameCount++;
  const floorY=H*FLOOR_Y_RATIO;
  ctx.save();ctx.translate(dx,dy);
  if(gameState==="MENU")drawMenu();
  else if(gameState==="CHALLENGE_SELECT")drawChallengeSelect();
  else if(gameState==="CHAR_SELECT")drawCharSelect("CHỌN PHÙ THỦY CHIẾN ĐẤU","white");
  else if(gameState==="CHALLENGE_CHAR_SELECT")drawCharSelect(`⚔️ MÀN ${challengeStage} — CHỌN NHÂN VẬT ⚔️`,"gold");
  else if(gameState==="ROAD_CHAR_SELECT")drawCharSelect("🛣️ ĐƯỜNG ĐI — CHỌN NHÂN VẬT 🛣️","#e67e22");
  else if(gameState==="GAMEPLAY")updateGameplay(floorY);
  else if(gameState==="CHALLENGE")updateChallenge(W,H);
  else if(gameState==="ROAD")updateRoad();
  else if(gameState==="TOUCH_EDITOR")drawTouchEditor();
  else if(gameState==="KEY_EDITOR")drawKeyEditor();
  ctx.restore();
  // Mobile overlays (outside shake transform)
  if(platformMode==="MOBILE"){
    if(["GAMEPLAY","CHALLENGE","ROAD"].includes(gameState))drawMobileControls();
    drawEscBtn();
  }
  processTouchSkills();
  }catch(err){console.error("Game loop error:",err);}
  requestAnimationFrame(update);
}

// ================================================================
//  GAMEPLAY UPDATE
// ================================================================
function updateGameplay(floorY){
  const worldW=W*MAP_SCALE;
  if(frameCount%60===0){for(const p of[p1,p2]){if(p.charType==="red"&&p.hp>0)p.hp=Math.min(MAX_HP,p.hp+1);}}
  for(const p of[p1,p2]){if(p.ultiTimer>0&&p.activeSkill==="water_s4"){p.tsunamiWaveXL-=8;p.tsunamiWaveXR+=8;}}
  for(const p of[p1,p2]){
    if(p.slowTimer>0)p.slowTimer--;if(p.stunTimer>0)p.stunTimer--;
    if(p.thunderFTimer>0){p.thunderFTimer--;if(p.thunderFTimer===0)p.thunderFCount=0;}
    for(const s in p.cds)if(p.cds[s]>0)p.cds[s]--;
    tickV4(p);
    tickWaterCloud(p);
  }
  for(const[attacker,pvpTarget]of[[p1,p2],[p2,p1]]){
    if(attacker.ultiTimer>0){
      attacker.ultiTimer--;
      const d=dist(attacker.x,attacker.y,pvpTarget.x,pvpTarget.y);
      if(attacker.activeSkill==="red_s4"&&d<350*SR)applyDamage(pvpTarget,0.25,attacker);
      else if(attacker.activeSkill==="thunder_s4"&&d<420*SR)applyDamage(pvpTarget,0.30,attacker);
      else if(attacker.activeSkill==="frost_s4"&&d<450*SR){applyDamage(pvpTarget,0.18,attacker);pvpTarget.slowTimer=Math.max(pvpTarget.slowTimer,10);}
      else if(attacker.activeSkill==="earth_s4"&&(d<420*SR||Math.abs(pvpTarget.x-attacker.targetSpikeX)<60*SR))applyDamage(pvpTarget,0.26,attacker);
      else if(attacker.activeSkill==="shadow_s4"&&Math.abs(attacker.x-pvpTarget.x)<360*SR)applyDamage(pvpTarget,0.40,attacker);
      if(attacker.ultiTimer===0){attacker.isAttacking=false;attacker.activeSkill=null;if(attacker.charType==="earth")attacker.earthPillars=[];}
    }
    if(attacker.attackCooldown>0&&attacker.activeSkill==="red_s3"){if(Math.abs(attacker.y-pvpTarget.y)<60*SR&&0<(pvpTarget.x-attacker.x)*attacker.direction&&(pvpTarget.x-attacker.x)*attacker.direction<600*SR)applyDamage(pvpTarget,0.18,attacker);}
  }
  for(const p of[p1,p2]){if(p.charType==="wind"&&p.windBoostTimer>0)p.windBoostTimer--;}
  const msb=4.3125;
  if(p1.hp>0&&p2.hp>0){
    const p1CanMove=(p1.ultiTimer===0||p1.activeSkill==="water_s4")&&p1.stunTimer===0;
    if(p1CanMove){
      let spd=msb*(p1.isShielding?0.35:1);
      if(p1.charType==="wind"&&p1.windBoostTimer>0)spd*=1.25;
      if(p1.slowTimer>0)spd*=(1-p1._slowPct);
      if(p1.charType==="earth"&&["earth_s2","earth_s3"].includes(p1.activeSkill))spd*=0.8;
      if(p1.transformActive)spd*=p1.getTransformBuffs().speed||1;
      const goLeft  = keys.has(keyBindings.left)      || (platformMode==="MOBILE"&&touch1.left);
      const goRight = keys.has(keyBindings.right)      || (platformMode==="MOBILE"&&touch1.right);
      const goUp    = keys.has(keyBindings.up)      || (platformMode==="MOBILE"&&touch1.up);
      const goDown  = keys.has(keyBindings.down)      || (platformMode==="MOBILE"&&touch1.down);
      if(p1.activeSkill!=="red_s3"){if(goLeft)p1.x-=spd;if(goRight)p1.x+=spd;}
      if(p1.charType==="frost"&&p1.transformActive&&p1.isFlying&&goDown)p1.vy=8;
      if(goUp&&!p1._upPrevInput)p1.jump();
      p1._upPrevInput=goUp;
    }
    p1.applyGravity(floorY);
    // PVP mode has been removed — the second fighter is always bot-controlled
    if(p2.ultiTimer===0)updateBot();
    p2.applyGravity(floorY);
  }
  for(const p of[p1,p2]){
    if(p.charType==="wind"&&p.windTornadoActive&&p.windTornadoX!==null){
      p.windTornadoX+=9*p.windTornadoDir;
      const opp=p===p1?p2:p1;
      if(Math.abs(p.windTornadoX-opp.x)<70*SR&&!p._tornadoHitTargets.has(opp)){p._tornadoHitTargets.add(opp);opp.x=clamp(opp.x+p.windTornadoDir*W,40,worldW-40);applyDamage(opp,p._tornadoDmg||35,p);}
      if(p.windTornadoX<campX-100||p.windTornadoX>campX+W+100){p.windTornadoActive=false;p.windTornadoX=null;}
    }
  }
  for(const p of[p1,p2]){p.x=clamp(p.x,40,worldW-40);if(p.attackCooldown>0){p.attackCooldown--;if(p.attackCooldown===0&&p.ultiTimer===0){p.isAttacking=false;p.activeSkill=null;}}}

  // Camera follows p1 across the expanded (2.5x) arena
  const CAM_L=W*0.35, CAM_R=W*0.55;
  if(p1.x-campX>CAM_R) campX=p1.x-CAM_R;
  else if(p1.x-campX<CAM_L) campX=p1.x-CAM_L;
  campX=clamp(campX,0,Math.max(0,worldW-W));

  ctx.save();ctx.translate(-campX,0);
  drawFloor(floorY,false,campX);
  updateProjectiles(floorY,p2);
  puppets=puppets.filter(pu=>pu.hp>0&&pu.life>0);
  puppets.forEach(pu=>pu.update(floorY,worldW));
  puppets.forEach(pu=>pu.draw());
  p1.draw();p2.draw();
  updateAndDrawHitEffects();
  ctx.restore();

  drawHpBar(p1,50,40,"P1");
  drawHpBar(p2,W-250,40,"BOT");
  drawRageBar(50,63,200,14,p1);
  drawRageBar(W-250,63,200,14,p2);
  if(platformMode==="PC")drawCooldownUI();
  if(p1.hp<=0||p2.hp<=0){
    const winner=p1.hp<=0?p2.charType.toUpperCase():p1.charType.toUpperCase();
    _text(W/2,H/2,`${winner} WINS!`,"gold","46px Arial bold");
    _text(W/2,H/2+60,platformMode==="MOBILE"?"Tap ESC về menu | R chơi lại":"ESC về menu | R chơi lại","white","14px Arial");
  }
}

let _challengeWaveTimer=0;
function updateChallenge(w,h){
  const worldW=w*MAP_SCALE;
  const floorY=h*FLOOR_Y_RATIO;
  if(p1.slowTimer>0)p1.slowTimer--;if(p1.stunTimer>0)p1.stunTimer--;

  for(const s in p1.cds)if(p1.cds[s]>0)p1.cds[s]--;
  tickV4(p1);
  tickWaterCloud(p1);
  if(frameCount%60===0&&p1.charType==="red"&&p1.hp>0)p1.hp=Math.min(MAX_HP,p1.hp+1);
  if(p1.ultiTimer>0&&p1.activeSkill==="water_s4"){p1.tsunamiWaveXL-=8;p1.tsunamiWaveXR+=8;}
  if(p1.stunTimer<=0&&p1.hp>0){
    let spd=4.3125;
    if(p1.charType==="wind"&&p1.windBoostTimer>0){spd*=1.25;p1.windBoostTimer--;}
    if(p1.slowTimer>0)spd*=(1-p1._slowPct);
    if(p1.charType==="earth"&&["earth_s2","earth_s3"].includes(p1.activeSkill))spd*=0.8;
    if(p1.transformActive)spd*=p1.getTransformBuffs().speed||1;
    const canMoveH=p1.ultiTimer===0||p1.activeSkill==="water_s4";
    const goLeft  = keys.has(keyBindings.left)   || (platformMode==="MOBILE"&&touch1.left);
    const goRight = keys.has(keyBindings.right)   || (platformMode==="MOBILE"&&touch1.right);
    const goUp    = keys.has(keyBindings.up)   || (platformMode==="MOBILE"&&touch1.up);
    const goDown  = keys.has(keyBindings.down)   || (platformMode==="MOBILE"&&touch1.down);
    if(canMoveH&&p1.activeSkill!=="red_s3"){if(goLeft)p1.x-=spd;if(goRight)p1.x+=spd;}
    if(p1.charType==="frost"&&p1.transformActive&&p1.isFlying){if(goUp)p1.vy=-10;if(goDown)p1.vy=8;}
    else{if(goUp&&!p1._upPrevInput)p1.jump();}
    p1._upPrevInput=goUp;
  }
  p1.applyGravity(floorY);
  p1.x=clamp(p1.x,40,worldW-40);
  if(p1.attackCooldown>0){p1.attackCooldown--;if(p1.attackCooldown===0&&p1.ultiTimer===0){p1.isAttacking=false;p1.activeSkill=null;}}
  if(p1.ultiTimer>0){
    p1.ultiTimer--;
    const all=[...challengeEnemies,...challengeBosses.filter(b=>!b.dead&&b.hp>0)];
    all.forEach(tgt=>{
      const d=dist(p1.x,p1.y,tgt.x,tgt.y);
      if(p1.activeSkill==="red_s4"&&d<350*SR)applyDamage(tgt,0.25,p1);
      else if(p1.activeSkill==="thunder_s4"&&d<420*SR)applyDamage(tgt,0.30,p1);
      else if(p1.activeSkill==="frost_s4"&&d<450*SR){applyDamage(tgt,0.18,p1);if(tgt instanceof Fighter)tgt.slowTimer=Math.max(tgt.slowTimer,10);}
      else if(p1.activeSkill==="earth_s4"&&(d<420*SR||Math.abs(tgt.x-p1.targetSpikeX)<60*SR))applyDamage(tgt,0.26,p1);
      else if(p1.activeSkill==="shadow_s4"&&Math.abs(p1.x-tgt.x)<360*SR)applyDamage(tgt,0.40,p1);
      else if(p1.activeSkill==="water_s4"&&p1.tsunamiWaveXL<tgt.x&&tgt.x<p1.tsunamiWaveXR){applyDamage(tgt,0.35,p1);tgt.slowTimer=Math.max(tgt.slowTimer||0,20);tgt._slowPct=0.5;}
    });
    if(p1.ultiTimer===0){p1.isAttacking=false;p1.activeSkill=null;if(p1.charType==="earth")p1.earthPillars=[];}
  }
  if(p1.attackCooldown>0&&p1.activeSkill==="red_s3"){const all=[...challengeEnemies,...challengeBosses.filter(b=>!b.dead&&b.hp>0)];all.forEach(tgt=>{if(Math.abs(p1.y-tgt.y)<80*SR&&0<(tgt.x-p1.x)*p1.direction&&(tgt.x-p1.x)*p1.direction<600*SR)applyDamage(tgt,0.18,p1);});}
  if(p1.charType==="wind"&&p1.windTornadoActive&&p1.windTornadoX!==null){
    p1.windTornadoX+=10*p1.windTornadoDir;
    if(!p1._tornadoHitTargets)p1._tornadoHitTargets=new Set();
    const tdmg=p1._tornadoDmg||35;
    [...challengeEnemies,...challengeBosses.filter(b=>!b.dead&&b.hp>0)].forEach(tgt=>{if(tgt.hp>0&&Math.abs(p1.windTornadoX-tgt.x)<90*SR&&!p1._tornadoHitTargets.has(tgt)){p1._tornadoHitTargets.add(tgt);tgt.x=clamp(tgt.x+p1.windTornadoDir*320,40,worldW-40);applyDamage(tgt,tdmg,p1);}});
    if(p1.windTornadoX<campX-100||p1.windTornadoX>campX+w+100){p1.windTornadoActive=false;p1.windTornadoX=null;}
  }
  challengeEnemies=challengeEnemies.filter(e=>{if(e.hp>0&&p1.hp>0)e.update(p1,floorY,worldW);return e.hp>0;});
  if(challengeEnemies.length===0&&challengeState==="WAVE"){
    if(challengeWaveIdx<challengeWaveSched.length){_challengeWaveTimer++;if(_challengeWaveTimer>=120){_challengeWaveTimer=0;_spawnChallengeWave(floorY,worldW);}}
    else if(!challengeBossSpawned){challengeBossSpawned=true;_challengeWaveTimer=0;challengeBosses.push(new Boss(challengeStage,clamp(p1.x+500,150,worldW-150),floorY));challengeState="BOSS";}
  }else _challengeWaveTimer=0;
  challengeBosses.forEach(b=>{if(!b.dead&&b.hp>0&&p1.hp>0){b.update(p1,floorY,worldW);if(b.summonEnemies.length){challengeEnemies.push(...b.summonEnemies);b.summonEnemies=[];}}});
  if(p1.hp<=0&&challengeState!=="DONE"){challengeResult="LOSE";challengeState="DONE";}
  const allDead=challengeBosses.length>0&&challengeBosses.every(b=>b.dead);
  if(allDead&&challengeBossSpawned&&challengeEnemies.length===0&&challengeState!=="DONE"){challengeResult="WIN";challengeState="DONE";}

  // Camera follows p1 across the expanded (2.5x) arena
  const CAM_L=w*0.35, CAM_R=w*0.55;
  if(p1.x-campX>CAM_R) campX=p1.x-CAM_R;
  else if(p1.x-campX<CAM_L) campX=p1.x-CAM_L;
  campX=clamp(campX,0,Math.max(0,worldW-w));

  ctx.save();ctx.translate(-campX,0);
  drawFloor(floorY,false,campX);
  updateProjectiles(floorY,null);
  puppets=puppets.filter(pu=>pu.hp>0&&pu.life>0);
  puppets.forEach(pu=>pu.update(floorY,worldW));
  puppets.forEach(pu=>pu.draw());
  p1.draw();
  challengeEnemies.forEach(e=>e.draw());
  challengeBosses.forEach(b=>{if(!b.dead)b.draw();});
  updateAndDrawHitEffects();
  ctx.restore();

  _text(w/2,20,`⚔️ THỬ THÁCH - MÀN ${challengeStage} ⚔️`,"gold","16px Arial bold");
  const bw2=(p1.hp/MAX_HP)*200;
  _rect(50,40,200,20,"#333",null,0);_rect(50,40,Math.max(0,bw2),20,"#ff1a1a",null,0);
  _text(150,30,`P1 (${p1.charType.toUpperCase()}): ${getHPDisplay(p1.hp)}/${MAX_HP} HP`,"white","10px Arial bold");
  _text(w/2,50,`Quái còn lại: ${challengeEnemies.length} | Boss: ${challengeBossSpawned?"Đã xuất hiện":"Chưa ra"}`,"white","10px Arial");
  drawRageBar(50,63,200,14,p1);
  if(platformMode==="PC")drawCooldownChallenge();
  if(challengeState==="DONE"){
    if(challengeResult==="WIN"){
      _text(w/2,H/2,`✨ CHIẾN THẮNG MÀN ${challengeStage}! ✨`,"gold","36px Arial bold");
      if(challengeStage<4)_text(w/2,H/2+60,"Nhấn SPACE để tiếp tục | ESC về menu","white","14px Arial");
      else{_text(w/2,H/2+60,"🎉 HOÀN THÀNH TẤT CẢ 4 MÀN! 🎉","cyan","18px Arial bold");_text(w/2,H/2+100,"Nhấn ESC để về menu","white","12px Arial");}
    }else{
      _text(w/2,H/2,"💀 THẤT BẠI 💀","red","40px Arial bold");
      _text(w/2,H/2+60,"Nhấn R để thử lại | ESC về menu","white","14px Arial");
    }
  }
}

function onKeyPress(e){
  const k=e.key.toLowerCase();
  if(k==="escape"){gameState="MENU";showSettings=false;}
  if(k==="r"){
    if(gameState==="GAMEPLAY"&&(p1.hp<=0||p2.hp<=0))startMatch();
    if(gameState==="CHALLENGE"&&challengeState==="DONE"&&challengeResult==="LOSE")startChallengeMode(challengeStage);
    if(gameState==="ROAD"&&(roadState==="LOST"||roadState==="WON"))startRoadMode();
  }
  if(k===" "){if(gameState==="CHALLENGE"&&challengeState==="DONE"&&challengeResult==="WIN"&&challengeStage<4){challengeStage++;gameState="CHALLENGE_CHAR_SELECT";}}
  if(k===keyBindings.shield&&gameState==="GAMEPLAY")p1.isShielding=true;
  if(k==="2"&&gameMode==="PVP"&&gameState==="GAMEPLAY")p2.isShielding=true;
  if(k===keyBindings.s1)castSkill(p1,p2,1);
  if(k===keyBindings.s2)castSkill(p1,p2,2);
  if(k===keyBindings.s3)castSkill(p1,p2,3);
  if(k===keyBindings.s4)castSkill(p1,p2,4);
  if(k===keyBindings.v4)castSkill(p1,p2,5);
  if(gameMode==="PVP"&&gameState==="GAMEPLAY"){
    if(k==="1")castSkill(p2,p1,1);
    if(k==="4")castSkill(p2,p1,2);
    if(k==="3")castSkill(p2,p1,3);
    if(k==="5")castSkill(p2,p1,4);
    if(k==="6")castSkill(p2,p1,5);
  }
  // Menu navigation
  if(!["GAMEPLAY","CHALLENGE","ROAD"].includes(gameState))return;
  e.preventDefault();
}

function startChallengeMode(stage){

  p1.hp=MAX_HP;campX=0;gameState="CHALLENGE";_challengeWaveTimer=0;startChallenge(stage);
