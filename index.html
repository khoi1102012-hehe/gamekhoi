    if(this.type===2&&this.dying){this._updateDeath2();return;}
    if(this.stunTimer>0){this.stunTimer--;return;}
    for(const k in this.skillTimer)if(this.skillTimer[k]>0)this.skillTimer[k]--;
    if(this.type===1)this._update1(player);
    else if(this.type===2)this._update2(player);
    else this._update3(player);
    this.x=clamp(this.x,roadCameraX+50,roadCameraX+W-50);
  }
  _update1(player){
    this.y=this.floorY;this.bobPhase+=0.05;
    if(Math.abs(player.x-this.x)<75&&player.hp>0&&rng()<0.015)applyDamage(player,3,null);
    if(this.skillTimer.summon<=0){
      this.skillTimer.summon=420;
      for(let i=0;i<2;i++)this.summonQueue.push(new RoadEnemy(this.x+rndInt(-150,150),this.floorY,3,false,false,true));
      this.hitFlash=Math.max(this.hitFlash,10);screenShake=Math.max(screenShake,10);
    }
  }
  // ---- Vua Bọ Cạp Cát (Sand Scorpion King) — AI, combat & movement ----
  _update2(player){
    const s=this.cd;
    this.y=this.floorY;
    this.legPhase+=0.15;
    // Nội tại: Giáp Cát khi HP < 50%
    const wasArmor=this.armorActive;
    this.armorActive=this.hp<=this.maxHp*0.5;
    if(this.armorActive&&!wasArmor)screenShake=Math.max(screenShake,8);
    // tick cooldowns
    if(s.basic>0)s.basic--; if(s.claw>0)s.claw--; if(s.tail>0)s.tail--; if(s.sand>0)s.sand--;
    if(s.skillGate>0)s.skillGate--;
    if(this.postSkillRest>0)this.postSkillRest--;
    // Bão Cát (Chiêu 3) ongoing effect
    if(this.sandStormTimer>0){
      this.sandStormTimer--;
      if(player.hp>0&&this.sandStormTimer%15===0&&Math.abs(player.x-this.sandStormCenterX)<230){
        player.slowTimer=Math.max(player.slowTimer,20);player._slowPct=Math.max(player._slowPct||0.3,0.3);
      }
    }
    // dust trail particles while moving
    if(rng()<0.5)this.dustP.push({x:this.x-30*this.direction,y:this.floorY-6,life:22,maxLife:22,r:rndInt(3,7)});
    this.dustP=this.dustP.filter(d=>{d.x-=1.2*this.direction;d.life--;return d.life>0;});

    // Chiêu 4 — Triệu Hồi Bọ Cạp Con (chỉ một lần khi HP < 50%)
    if(!this.summonedOnce&&this.hp<=this.maxHp*0.5&&this.action==="IDLE"){
      this.action="SUMMON_WARN";this.actionTimer=45;this.summonedOnce=true;return;
    }

    const dx=player.x-this.x,dist=Math.abs(dx);

    if(this.action==="IDLE"){
      this.direction=dx>0?1:-1;
      if(dist>90)this.x+=this.moveSpeed*(dx>0?1:-1); // Boss luôn cố gắng tiến lại gần người chơi
      // Ưu tiên đánh thường trước; chỉ dùng kỹ năng sau khi hết "skillGate" và không đang nghỉ sau chiêu trước
      if(s.basic<=0&&dist<=95&&player.hp>0){
        this.action="BASIC_WINDUP";this.actionTimer=22;return;
      }
      if(s.skillGate<=0&&this.postSkillRest<=0){
        if(dist>260&&s.sand<=0){ // người chơi ở xa -> ưu tiên kỹ năng tầm xa (Bão Cát)
          this.action="SAND_CAST";this.actionTimer=60;this.sandStormCenterX=player.x;return;
        }
        if(dist<=150&&s.claw<=0&&rng()<0.5){
          this.action="CLAW_WARN";this.actionTimer=48;this.clawWarnX=player.x;this.clawHitDone=false;return;
        }
        if(dist<=230&&s.tail<=0){
          this.action="TAIL_WARN";this.actionTimer=26;this.tailHitDone=false;return;
        }
      }
    }
    // Đánh thường — Boss dùng hai càng để tấn công
    else if(this.action==="BASIC_WINDUP"){
      this.actionTimer--;
      if(this.actionTimer<=0){this.action="BASIC_STRIKE";this.actionTimer=10;}
    }else if(this.action==="BASIC_STRIKE"){
      this.actionTimer--;
      if(this.actionTimer===6&&player.hp>0&&Math.abs(player.x-this.x)<95){
        applyDamage(player,12,null);screenShake=Math.max(screenShake,6);
      }
      if(this.actionTimer<=0){this.action="BASIC_RECOVER";this.actionTimer=28;s.basic=70;}
    }else if(this.action==="BASIC_RECOVER"){
      this.actionTimer--;if(this.actionTimer<=0)this.action="IDLE";
    }
    // Chiêu 1 — Càng Khổng Lồ
    else if(this.action==="CLAW_WARN"){
      this.actionTimer--;
      if(this.actionTimer<=0){this.action="CLAW_STRIKE";this.actionTimer=14;}
    }else if(this.action==="CLAW_STRIKE"){
      this.actionTimer--;
      if(!this.clawHitDone&&this.actionTimer===8){
        this.clawHitDone=true;
        if(player.hp>0&&Math.abs(player.x-this.clawWarnX)<80){
          applyDamage(player,15,null);
          player.x=clamp(player.x+(player.x>this.x?1:-1)*90,roadCameraX+40,roadCameraX+W-40);
          player.stunTimer=Math.max(player.stunTimer,30);
        }
        screenShake=Math.max(screenShake,16);
      }
      if(this.actionTimer<=0){this.action="CLAW_RECOVER";this.actionTimer=40;s.claw=300;this.postSkillRest=90;}
    }else if(this.action==="CLAW_RECOVER"){
      this.actionTimer--;if(this.actionTimer<=0)this.action="IDLE";
    }
    // Chiêu 2 — Đuôi Độc
    else if(this.action==="TAIL_WARN"){
      this.direction=dx>0?1:-1;
      this.actionTimer--;
      if(this.actionTimer<=0){this.action="TAIL_STRIKE";this.actionTimer=16;this.tailHitDone=false;}
    }else if(this.action==="TAIL_STRIKE"){
      this.actionTimer--;
      this.x+=this.moveSpeed*1.6*this.direction;
      if(!this.tailHitDone&&player.hp>0&&Math.abs(player.x-this.x)<70){
        this.tailHitDone=true;
        applyDamage(player,20,null);
        player.poisonTimer=Math.max(player.poisonTimer||0,300);
        screenShake=Math.max(screenShake,10);
      }
      if(this.actionTimer<=0){this.action="TAIL_RECOVER";this.actionTimer=30;s.tail=210;this.postSkillRest=70;}
    }else if(this.action==="TAIL_RECOVER"){
      this.actionTimer--;if(this.actionTimer<=0)this.action="IDLE";
    }
    // Chiêu 3 — Bão Cát (cắm đuôi xuống đất rồi tạo bão)
    else if(this.action==="SAND_CAST"){
      this.actionTimer--;
      if(this.actionTimer<=0){
        this.sandStormTimer=360;this.sandStormCenterX=this.x;
        s.sand=520;this.postSkillRest=100;screenShake=Math.max(screenShake,18);
        this.action="IDLE";
      }
    }
    // Chiêu 4 — Triệu Hồi Bọ Cạp Con
    else if(this.action==="SUMMON_WARN"){
      this.actionTimer--;
      if(this.actionTimer<=0)this.action="SUMMON_ACT";
    }else if(this.action==="SUMMON_ACT"){
      for(let i=0;i<3;i++){
        const e=new RoadEnemy(this.x+rndInt(-140,140),this.floorY,3,false,false,false);
        e.hp=e.maxHp=30;e.dmg=5;e.spd=3.2;
        this.summonQueue.push(e);
      }
      screenShake=Math.max(screenShake,20);
      this.action="IDLE";this.postSkillRest=60;
    }
  }
  // ---- Death sequence: roar -> nứt -> nổ tung thành cát -> tan dần ----
  _updateDeath2(){
    this.deathTimer--;
    if(this.deathTimer===55)screenShake=Math.max(screenShake,8); // gầm lên
    if(this.deathTimer===35)screenShake=Math.max(screenShake,10); // vết nứt lan ra
    if(this.deathTimer===18){ // nổ tung thành cát
      spawnBossDeathBurst(this.x,this.y-50);
      for(let i=0;i<26;i++){
        const ang=rng()*Math.PI*2,spd=rng()*7+2;
        hitEffects.push({x:this.x+rndInt(-40,40),y:this.y-50-rndInt(0,60),vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-2,life:44,maxLife:44,particle:true,color:rndChoice(["#c9a165","#7a5a30","#e8cfa0"])});
      }
      screenShake=Math.max(screenShake,32);
    }
    if(this.deathTimer<=0){this.dead=true;this.dying=false;}
  }
  _update3(player){
    this.wingAngle=(this.wingAngle+5)%360;
    this.hoverOffset=Math.sin(this.anim*0.04)*14;
    if(this.hp<=this.maxHp*0.5&&this.phase===1){this.phase=2;screenShake=Math.max(screenShake,30);}
    const isP2=this.phase===2,s=this.skillTimer;
    if(!this.diveActive){
      const dx=player.x-this.x,spd=isP2?3.2:2.2,ideal=240;
      if(Math.abs(dx)>ideal+60)this.x+=spd*(dx>0?1:-1);
      this.direction=dx>0?1:-1;
      this.y=this.floorY-140+this.hoverOffset;
    }
    if(s.spike<=0){
      s.spike=isP2?210:300;
      for(let i=0;i<(isP2?4:2);i++)this.bloodSpikes.push({x:player.x+rndInt(-140,140),y:-30,vy:0,warnTimer:35,fell:false});
    }
    this.bloodSpikes=this.bloodSpikes.filter(sp=>{
      if(sp.warnTimer>0){sp.warnTimer--;return true;}
      sp.vy+=0.9;sp.y+=sp.vy;
      if(!sp.fell&&sp.y>=this.floorY-4){
        sp.fell=true;
        if(player.hp>0&&Math.abs(sp.x-player.x)<34)applyDamage(player,isP2?9:7,null);
        return false;
      }
      return sp.y<this.floorY;
    });
    if(!this.diveActive&&s.dive<=0){
      s.dive=isP2?330:400;this.diveActive=true;this.diveHitDone=false;
      this.diveTargetX=player.x;this.diveTargetY=this.floorY-30;
    }
    if(this.diveActive){
      const dx=this.diveTargetX-this.x,dy=this.diveTargetY-this.y,d=Math.max(1,Math.hypot(dx,dy)),spd=isP2?13:10;
      this.x+=dx/d*spd;this.y+=dy/d*spd;
      if(d<40){
        this.diveActive=false;screenShake=Math.max(screenShake,20);
        if(!this.diveHitDone){
          this.diveHitDone=true;
          if(player.hp>0&&Math.abs(this.x-player.x)<90){applyDamage(player,isP2?13:10,null);player.x=clamp(player.x+(player.x>this.x?1:-1)*160,roadCameraX+40,roadCameraX+W-40);}
        }
      }
    }
    if(s.roar<=0&&this.roarWarn<=0&&this.roarActive<=0){s.roar=isP2?460:580;this.roarWarn=50;}
    if(this.roarWarn>0){
      this.roarWarn--;
      if(this.roarWarn===0){
        this.roarActive=40;
        if(player.hp>0&&Math.abs(this.x-player.x)<600){applyDamage(player,isP2?10:7,null);player.stunTimer=Math.max(player.stunTimer,60);}
        screenShake=Math.max(screenShake,26);
      }
    }
    if(this.roarActive>0)this.roarActive--;
  }
  draw(){if(this.type===1)this._draw1();else if(this.type===2){if(this.dying)this._drawDeath2();else this._draw2();}else this._draw3();}
  _draw1(){
    const rx=this.x,ry=this.y,pulse=Math.sin(this.bobPhase)*6;
    ctx.save();
    ctx.shadowColor="#7CFC00";ctx.shadowBlur=this.hitFlash>0?30:14;
    const grad=ctx.createRadialGradient(rx-20,ry-140,10,rx,ry-100,140);
    grad.addColorStop(0,"#e8ffcc");grad.addColorStop(0.5,"#9ecb5c");grad.addColorStop(1,"#3f5c1e");
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.ellipse(rx,ry-100,100+pulse*0.3,140+pulse,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="#2b3d10";ctx.lineWidth=4;ctx.stroke();
    ctx.restore();
    for(let i=0;i<5;i++){
      const ang=(i/5)*Math.PI*2+this.anim*0.003;
      ctx.strokeStyle=`rgba(120,200,60,${0.5+0.3*Math.sin(this.anim*0.05+i)})`;ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(rx,ry-100);ctx.lineTo(rx+Math.cos(ang)*80,ry-100+Math.sin(ang)*110);ctx.stroke();
    }
    const embryoPulse=0.4+0.3*Math.sin(this.anim*0.08);
    ctx.save();ctx.globalAlpha=embryoPulse;ctx.fillStyle="#ffee88";ctx.beginPath();ctx.ellipse(rx,ry-110,26,36,0,0,Math.PI*2);ctx.fill();ctx.restore();
    ctx.strokeStyle="#1a2408";ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(rx-40,ry-180);ctx.lineTo(rx-10,ry-140);ctx.lineTo(rx-35,ry-90);ctx.stroke();
    ctx.beginPath();ctx.moveTo(rx+30,ry-190);ctx.lineTo(rx+15,ry-130);ctx.lineTo(rx+45,ry-70);ctx.stroke();
    for(let i=0;i<3;i++){const dripY=ry-40+(this.anim*1.2+i*60)%150;_oval(rx-60+i*55-4,dripY-6,8,14,"#6a8f2a",null);}
    this._drawHpBar(rx,ry,"🥚 MA THÚ TRỨNG","#9ecb5c");
  }
  // ---- Vua Bọ Cạp Cát (Sand Scorpion King) — rendering ----
  _draw2(){
    const rx=this.x,ry=this.y,d=this.direction,a=this.action;
    // bụi cát phía sau khi di chuyển
    this.dustP.forEach(p=>{const al=p.life/p.maxLife;ctx.save();ctx.globalAlpha=al*0.5;_oval(p.x-p.r,p.y-p.r,p.r*2,p.r*2,"#cba36a",null);ctx.restore();});
    // cảnh báo Chiêu 1 - Càng Khổng Lồ (vòng đỏ dưới đất)
    if(a==="CLAW_WARN"){
      const t=Math.max(0,this.actionTimer)/48;
      ctx.save();ctx.strokeStyle=`rgba(255,40,40,${0.4+0.5*(1-t)})`;ctx.lineWidth=3;
      ctx.beginPath();ctx.ellipse(this.clawWarnX,this.floorY,60,16,0,0,Math.PI*2);ctx.stroke();ctx.restore();
    }
    // tia đỏ báo trước Chiêu 2 - Đuôi Độc
    if(a==="TAIL_WARN"){
      ctx.save();ctx.strokeStyle="rgba(255,30,30,0.75)";ctx.lineWidth=3;ctx.setLineDash([6,4]);
      ctx.beginPath();ctx.moveTo(rx,ry-70);ctx.lineTo(rx+d*230,ry-70);ctx.stroke();ctx.setLineDash([]);ctx.restore();
    }
    // Bão Cát đang hoạt động
    if(this.sandStormTimer>0){
      const cx=this.sandStormCenterX;
      for(let i=0;i<14;i++){const ang=(this.anim*0.09+i*0.9)%(Math.PI*2),rr=20+ (i%5)*22;
        _oval(cx+Math.cos(ang)*rr-4,this.floorY-40+Math.sin(ang)*rr*0.4-4,8,8,"#d9b478",null);}
      _text(cx,ry-280,"🏜️ BÃO CÁT 🏜️","#d9b478","12px Arial bold");
    }
    ctx.save();
    if(this.hitFlash>0)ctx.filter="brightness(1.7)";
    if(this.armorActive){ctx.shadowColor="#f0c878";ctx.shadowBlur=22;}
    else{ctx.shadowColor="#c9a165";ctx.shadowBlur=10;}

    const bob=Math.sin(this.legPhase)*3;
    // 6 chân
    ctx.strokeStyle="#5a4021";ctx.lineWidth=6;
    for(let i=0;i<3;i++){
      const lx=rx-(i-1)*26*d,legSw=Math.sin(this.legPhase+i)*8;
      ctx.beginPath();ctx.moveTo(lx,ry-50);ctx.lineTo(lx-14*d+legSw,ry-14);ctx.lineTo(lx-24*d+legSw,ry);ctx.stroke();
      ctx.beginPath();ctx.moveTo(lx,ry-50);ctx.lineTo(lx+14*d-legSw,ry-14);ctx.lineTo(lx+24*d-legSw,ry);ctx.stroke();
    }
    // thân — màu vàng nâu cát, giáp dày trên lưng
    const bodyGrad=ctx.createLinearGradient(rx,ry-110,rx,ry-30);
    bodyGrad.addColorStop(0,"#caa46c");bodyGrad.addColorStop(1,"#7a5a30");
    ctx.fillStyle=bodyGrad;ctx.strokeStyle="#4a3218";ctx.lineWidth=3;
    ctx.beginPath();ctx.ellipse(rx,ry-58+bob,72,44,0,0,Math.PI*2);ctx.fill();ctx.stroke();
    // mảng giáp lưng
    for(let i=0;i<4;i++){
      const px2=rx-40+i*26*d;
      ctx.fillStyle="#8a6838";ctx.beginPath();
      ctx.moveTo(px2-12,ry-78+bob);ctx.lineTo(px2,ry-98+bob);ctx.lineTo(px2+12,ry-78+bob);ctx.closePath();ctx.fill();ctx.stroke();
    }
    // đầu
    const hx=rx+58*d,hy=ry-64+bob;
    ctx.fillStyle="#caa46c";ctx.beginPath();ctx.ellipse(hx,hy,30,26,0,0,Math.PI*2);ctx.fill();ctx.stroke();
    // mắt phát sáng đỏ
    ctx.shadowColor="red";ctx.shadowBlur=10;ctx.fillStyle="#ff2222";
    _oval(hx+10*d-6,hy-8,10,10,"#ff2222",null);_oval(hx+10*d-6,hy+6,10,10,"#ff2222",null);
    ctx.shadowBlur=0;
    // Giáp Cát nội tại — cát xoay quanh cơ thể khi HP<50%
    if(this.armorActive){
      for(let i=0;i<8;i++){
        const ang=this.anim*0.06+i*(Math.PI/4),rr=90;
        _oval(rx+Math.cos(ang)*rr-4,ry-58+Math.sin(ang)*rr*0.5-4,8,8,"rgba(240,200,120,0.75)",null);
      }
    }
    // hai càng
    const clawUp = (a==="CLAW_WARN") ? 1-Math.max(0,this.actionTimer)/48 : (a==="CLAW_STRIKE"?1:0);
    const clawSwing = a==="CLAW_STRIKE"||a==="BASIC_STRIKE"?1:(a==="BASIC_WINDUP"?0.5:0);
    for(const side of[-1,1]){
      const cx2=rx+34*d+side*26,cy2=ry-70+bob-clawUp*40;
      ctx.save();ctx.translate(cx2,cy2);ctx.rotate(side*0.5-clawSwing*side*0.6*d);
      ctx.fillStyle="#8a6838";ctx.strokeStyle="#4a3218";ctx.lineWidth=2.5;
      ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(24*d,-6);ctx.lineTo(30*d,10);ctx.lineTo(24*d,20);ctx.lineTo(0,14);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.restore();
    }
    // đuôi cong với kim độc — vươn xa khi Đuôi Độc
    const tailExt = a==="TAIL_STRIKE"?1:(a==="TAIL_WARN"?0.4:0);
    const tx0=rx-40*d,ty0=ry-90+bob;
    ctx.strokeStyle="#7a5a30";ctx.lineWidth=10;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(rx-10*d,ry-70+bob);
    ctx.quadraticCurveTo(tx0-20*d*(1-tailExt*0.5),ty0-40-tailExt*20,tx0-70*d-tailExt*90*d,ty0-50-tailExt*30);
    ctx.stroke();
    const stingerX=tx0-70*d-tailExt*90*d,stingerY=ty0-50-tailExt*30;
    ctx.fillStyle="#3a1010";ctx.strokeStyle="#c00030";ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(stingerX,stingerY-8);ctx.lineTo(stingerX-16*d,stingerY);ctx.lineTo(stingerX,stingerY+8);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.restore();

    // nhãn trạng thái nội tại
    if(this.armorActive)_text(rx,ry-230,"🛡️ GIÁP CÁT","#f0c878","11px Arial bold");
    this._drawHpBar(rx,ry,"🦂 VUA BỌ CẠP CÁT",this.armorActive?"#f0c878":"#c9a165");
  }
  _drawDeath2(){
    const rx=this.x,ry=this.y,t=this.deathTimer;
    if(t>18){
      // gầm lên rồi xuất hiện vết nứt trên toàn thân
      ctx.save();ctx.shadowColor="#c9a165";ctx.shadowBlur=16;
      const bodyGrad=ctx.createLinearGradient(rx,ry-110,rx,ry-30);
      bodyGrad.addColorStop(0,"#caa46c");bodyGrad.addColorStop(1,"#7a5a30");
      ctx.fillStyle=bodyGrad;ctx.strokeStyle="#4a3218";ctx.lineWidth=3;
      ctx.beginPath();ctx.ellipse(rx,ry-58,72,44,0,0,Math.PI*2);ctx.fill();ctx.stroke();
      if(t<=48){
        const crackA=1-(t-18)/30;
        ctx.strokeStyle=`rgba(20,10,0,${0.6+0.4*crackA})`;ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(rx-40,ry-80);ctx.lineTo(rx-10,ry-55);ctx.lineTo(rx-30,ry-30);ctx.stroke();
        ctx.beginPath();ctx.moveTo(rx+20,ry-90);ctx.lineTo(rx+10,ry-60);ctx.lineTo(rx+45,ry-35);ctx.stroke();
      }
      if(t>50)_text(rx,ry-240,"🦂 GẦM LÊN 🦂","#ff6a2a","14px Arial bold");
      ctx.restore();
    }else{
      // nổ tung thành cát — bụi cát bay lên rồi tan dần
      const fade=Math.max(0,t)/18;
      ctx.save();ctx.globalAlpha=fade;
      for(let i=0;i<10;i++){_oval(rx-50+rndInt(-10,10)+i*10,ry-60-rndInt(0,40),10,10,"#c9a165",null);}
      ctx.restore();
    }
  }
  _draw3(){
    const rx=this.x,ry=this.y,isP2=this.phase===2;
    this.bloodSpikes.forEach(sp=>{
      if(sp.warnTimer>0){ctx.strokeStyle="rgba(255,0,0,0.6)";ctx.lineWidth=2;ctx.setLineDash([4,3]);ctx.beginPath();ctx.moveTo(sp.x,ry-260);ctx.lineTo(sp.x,this.floorY);ctx.stroke();ctx.setLineDash([]);}
      else{ctx.save();ctx.shadowColor="red";ctx.shadowBlur=8;ctx.fillStyle="#7a0010";ctx.strokeStyle="#ff2244";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(sp.x-8,sp.y+20);ctx.lineTo(sp.x,sp.y-20);ctx.lineTo(sp.x+8,sp.y+20);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();}
    });

function _rect(x,y,w,h,fill,stroke,lw=1){if(w<0){x+=w;w=-w;}if(h<0){y+=h;h=-h;}ctx.fillStyle=fill;ctx.fillRect(x,y,w,h);if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.strokeRect(x,y,w,h);}}
function _rectOutline(x,y,w,h,stroke,lw){if(w<0){x+=w;w=-w;}if(h<0){y+=h;h=-h;}ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.strokeRect(x,y,w,h);}
function _oval(x,y,w,h,fill,stroke,lw=1){ctx.beginPath();ctx.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}}

// Tapered claw/scratch-mark shape: a thin curved leaf pointed at both ends,
// following a gentle bow along its length — reads as a slash mark rather
// than a plain stroked line.
function _clawMark(cx,cy,angleDeg,length,maxWidth,bow,color,outline){
  const rad=angleDeg*Math.PI/180,dx=Math.cos(rad),dy=Math.sin(rad),nx=-dy,ny=dx,segs=14,pts=[];
  for(let i=0;i<=segs;i++){
    const t=i/segs,taper=Math.sin(t*Math.PI),curve=Math.sin(t*Math.PI)*bow;
    pts.push({px:cx+dx*length*t+nx*curve,py:cy+dy*length*t+ny*curve,ox:nx*taper*maxWidth,oy:ny*taper*maxWidth});
  }
  ctx.beginPath();
  pts.forEach((p,i)=>{const x=p.px+p.ox,y=p.py+p.oy;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
  for(let i=segs;i>=0;i--){const p=pts[i];ctx.lineTo(p.px-p.ox,p.py-p.oy);}
  ctx.closePath();
  ctx.fillStyle=color;ctx.fill();
  if(outline){ctx.strokeStyle=outline;ctx.lineWidth=1.2;ctx.stroke();}
}

function applyDamage(target,damage,attacker){

      hitEffects.push({x:target.x,y:target.y-50,life:15,maxLife:15,color:"#c68a4a",ring:true});

    if(target.charType==="earth"&&target.activeSkill==="earth_s3"&&attacker){const ref=damage*0.8;if(attacker.hp!==undefined)attacker.hp=Math.max(0,attacker.hp-(attacker.isShielding?ref*0.2:ref));return;}

    target.hp=Math.max(0,target.hp);

// ---- THUNDER: Chain Lightning ----
// Fires a bolt from (x,y) to the nearest un-chained enemy, then keeps jumping
// to the next nearest enemy (within CHAIN_RANGE) up to maxTargets total,
// losing ~15% damage per jump. Draws a jagged bolt effect for each jump and
// stops the moment no valid target remains in range.
const CHAIN_RANGE=380;
function chainLightning(attacker,fromX,fromY,damage,maxTargets=5,excludeFirst=null,customRange=null){
  const hitSet=new Set();
  let cx=fromX,cy=fromY,curDmg=damage,jumps=0;
  if(excludeFirst)hitSet.add(excludeFirst);
  const range = customRange || CHAIN_RANGE * SR;
  while(jumps<maxTargets){
    const cands=getAllEnemies(attacker).filter(t=>t&&t.hp>0&&!hitSet.has(t)&&dist(cx,cy,t.x,t.y)<range);
    if(!cands.length)break;
    const nextT=cands.reduce((a,b)=>dist(cx,cy,a.x,a.y)<dist(cx,cy,b.x,b.y)?a:b);
    spawnLightningArc(cx,cy,nextT.x,nextT.y-40);
    applyDamage(nextT,curDmg,attacker);
    addShock(nextT,attacker);
    hitSet.add(nextT);
    cx=nextT.x;cy=nextT.y-40;
    curDmg*=0.85; // 15% falloff per jump
    jumps++;
  }
  return jumps;
}
let lightningArcs=[];
function spawnLightningArc(x1,y1,x2,y2){
  const pts=[x1,y1];let cx=x1,cy=y1;
  const steps=6;
  for(let i=1;i<=steps;i++){
    const t=i/steps;
    cx=x1+(x2-x1)*t+rndInt(-14,14);
    cy=y1+(y2-y1)*t+rndInt(-14,14);
    pts.push(cx,cy);
  }
  pts.push(x2,y2);
  lightningArcs.push({pts,life:12,maxLife:12});
}
function updateAndDrawLightningArcs(){
  lightningArcs=lightningArcs.filter(a=>a.life>0);
  lightningArcs.forEach(a=>{
    a.life--;
    const alpha=Math.max(0,a.life/a.maxLife);
    ctx.save();ctx.globalAlpha=alpha;ctx.shadowColor="#FFD700";ctx.shadowBlur=18;
    ctx.strokeStyle="#FFFFFF";ctx.lineWidth=3;ctx.lineCap="round";
    ctx.beginPath();for(let i=0;i<a.pts.length;i+=2){i===0?ctx.moveTo(a.pts[i],a.pts[i+1]):ctx.lineTo(a.pts[i],a.pts[i+1]);}ctx.stroke();
    ctx.strokeStyle="#FFD700";ctx.lineWidth=1.5;ctx.stroke();
    ctx.restore();
  });
}
// ---- THUNDER: Shock Stack ----
// Every hit from a thunder-type attacker builds a stack on the target; at 5
// stacks it detonates (stun + launch + burst damage) and resets to 0.
function addShock(target,attacker){
  if(!attacker||attacker.charType!=="thunder")return;
  if(!(target instanceof Fighter))return;
  if(target.hp<=0)return;
  target.shockStack=(target.shockStack||0)+1;
  if(target.shockStack>=5){
    target.shockStack=0;
    applyDamage(target,18,attacker);
    target.stunTimer=Math.max(target.stunTimer||0,50);
    target.vy=-10;
    screenShake=Math.max(screenShake,18);

    for(let i=0;i<16;i++){const ang=rng()*Math.PI*2,spd=rng()*5+2;hitEffects.push({x:target.x,y:target.y-60,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-2,life:26,maxLife:26,particle:true,color:rndChoice(["#FFD700","#FFF176","white"])});}
  }
}

function getChallengeTarget(attacker){const cands=[...challengeEnemies.filter(e=>e.hp>0),...challengeBosses.filter(b=>!b.dead&&b.hp>0)];if(!cands.length)return null;return cands.reduce((best,c)=>Math.abs(c.x-attacker.x)<Math.abs(best.x-attacker.x)?c:best);}

function castSkill(attacker,target,skillNum){

  if(attacker.cds[sKey]>0)return;

    // the air first; only once the windup finishes does the powerful 20-ray
    // spark explosion fire off and the V4 skin actually appear (see
    // Fighter#_finalizeTransform, triggered from applyGravity).
    if(attacker.transformWindupTimer>0)return;

  const chTarget=gameState==="CHALLENGE"?getChallengeTarget(attacker):(gameState==="ROAD"?getRoadTarget(attacker):target);
  const combatTarget=chTarget;
  const _isRedDash=attacker.charType==="red"&&skillNum===2; // plain forward gap-closer, not a targeted teleport — must not face backward toward a trailing enemy
  if((gameState==="CHALLENGE"||gameState==="ROAD")&&combatTarget&&!_isRedDash)attacker.direction=combatTarget.x>attacker.x?1:-1;
  if(attacker.charType==="wind"){
    if(skillNum===1){attacker.attackCooldown=10;attacker.activeSkill=skillId;attacker.cds.s1=30;const targets=getAllEnemies(attacker).filter(t=>Math.abs(attacker.x-t.x)<280*SR&&Math.abs(attacker.y-t.y)<90*SR);targets.forEach(t=>{if(t&&t.hp>0){applyDamage(t,10,attacker);if(isPushable(t))t.x=clamp(t.x+(t.x>attacker.x?1:-1)*160,moveBoundLo(),moveBoundHi());}});}
    else if(skillNum===2){attacker.attackCooldown=12;attacker.activeSkill=skillId;attacker.cds.s2=300;attacker.windBoostTimer=180;}

  if(attacker.charType==="shadow"&&skillNum===2){attacker.attackCooldown=16;attacker.activeSkill=skillId;attacker.cds.s2=140;

  if(attacker.charType==="thunder"&&skillNum===2){

    else if(skillNum===2){attacker.attackCooldown=15;attacker.activeSkill=skillId;attacker.cds.s2=480;attacker.waterCloudTimer=300;attacker.waterCloudTick=0;attacker.waterCloudDrops=[];}

    else if(skillNum===4){attacker.attackCooldown=20;attacker.activeSkill=skillId;attacker.ultiTimer=120;attacker.cds.s4=1080;attacker.tsunamiWaveXL=attacker.x-80;attacker.tsunamiWaveXR=attacker.x+80;getAllEnemies(attacker).forEach(t=>{if(isPushable(t)){const pd=t.x>attacker.x?1:-1;t.x=clamp(t.x+pd*500,moveBoundLo(),moveBoundHi());if(t instanceof Fighter){t.slowTimer=Math.max(t.slowTimer,120);t.vy=-8;}}applyDamage(t,20,attacker);});screenShake=40;}

  if(attacker.charType==="thunder"&&skillNum===1){

    else if(skillNum===4){attacker.attackCooldown=180;attacker.activeSkill=skillId;attacker.ultiTimer=180;attacker.cds.s4=1080;}
  }else{
    if(skillNum===1){
      // EARTH BOULDER: throw a massive rock projectile
      attacker.attackCooldown=20;attacker.activeSkill=skillId;attacker.cds.s1=120;
      projectiles.push({x:attacker.x+40*attacker.direction,y:attacker.y-60,vx:12*attacker.direction,vy:-4,owner:attacker,target:combatTarget,

    }
    else if(skillNum===2){attacker.attackCooldown=14;attacker.activeSkill=skillId;attacker.cds.s2=480;attacker.dmgReduceTimer=180;}
    else if(skillNum===3){attacker.attackCooldown=150;attacker.activeSkill=skillId;attacker.cds.s3=300;}
    else if(skillNum===4){attacker.attackCooldown=120;attacker.activeSkill=skillId;attacker.ultiTimer=120;attacker.boulderY=-320;attacker.boulderLanded=false;if(combatTarget)attacker.targetSpikeX=combatTarget.x;else attacker.targetSpikeX=attacker.x+220*attacker.direction;attacker.cds.s4=1080;attacker.hp=Math.min(MAX_HP,attacker.hp+10);screenShake=10;}

// ================================================================

function updateBot(){
  if(gameMode==="PVP"||p2.hp<=0)return;
  const dx=p1.x-p2.x,absD=Math.abs(dx);
  if(botLevel>=1&&absD<140&&rng()<0.03)castSkill(p2,p1,1);
  if(botLevel>=2){p2.x+=3.0*(p1.x>p2.x?1:-1);if(rng()<0.01)p2.jump();if(absD>100&&absD<320&&rng()<0.02)castSkill(p2,p1,3);}
  if(botLevel>=3){p2.isShielding=p1.isAttacking;if(absD<250&&rng()<0.03)castSkill(p2,p1,4);if(absD<140)castSkill(p2,p1,1);}
}

function updateProjectiles(floorY,player2){
  const active=[];

    }
    else if(pType==="earth_boulder"){

    // Earth boulder special hit detection

        }});

        if(roadBoss&&!roadBoss.dead&&Math.abs(px-roadBoss.x)<70*SR&&Math.abs(py-roadBoss.y)<140*SR){applyDamage(roadBoss,boulderDmg,owner);roadBoss.stunTimer=Math.max(roadBoss.stunTimer||0,15);hit=true;}
      }else{
        const fighters=[p1,p2].filter(f=>f!==owner&&f.hp>0);
        fighters.forEach(f=>{if(Math.abs(px-f.x)<50*SR&&Math.abs(py-f.y)<70*SR){
          applyDamage(f,boulderDmg,owner);f.stunTimer=Math.max(f.stunTimer||0,boulderStun);
          if(isPushable(f)){const pd=f.x>=px?1:-1;f.x=clamp(f.x+pd*80,moveBoundLo(),moveBoundHi());}
          hit=true;
          spawnHitEffect(f.x,f.y-40,"#c68a4a");
          for(let i=0;i<8;i++){const ang=rng()*Math.PI*2,spd=rng()*6+2;hitEffects.push({x:px,y:py,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-3,life:25,maxLife:25,particle:true,color:rndChoice(["#8a6a4a","#6a4a2a","#c68a4a"])});}
        }});
      }
      // Boulder hits ground
      if(!hit&&py>=floorY-5){
        for(let i=0;i<10;i++){const ang=Math.PI+(rng()-0.5)*Math.PI*0.8,spd=rng()*5+2;hitEffects.push({x:px,y:floorY,vx:Math.cos(ang)*spd,vy:-Math.abs(Math.sin(ang))*spd-1,life:22,maxLife:22,particle:true,color:rndChoice(["#8a6a4a","#6a4a2a","#c68a4a"])});}
        hitEffects.push({x:px,y:floorY,life:18,maxLife:18,color:"#c68a4a",ring:true});
        hit=true;
      }
    }
    if(!hit&&inBounds)active.push(proj);
  }
  projectiles.length=0;projectiles.push(...active);
}

let _waveSpawnTimer=0;

function _spawnChallengeWave(floorY,worldW){

function checkFrostCombo(p){
  const log=p.frostComboLog;
  if(log.length<4)return;
  const last4=log.slice(-4);
  const seq=last4.map(e=>e.skill).join(",");
  if(seq==="4,2,1,3"&&(last4[3].t-last4[0].t)<=300){
    p.frostComboLog=[]; // consumed — must redo the full sequence to trigger again
    p.frostComboBonusPct=0.30;
    p.frostComboFX=40;
    screenShake=Math.max(screenShake,16);
    spawnHitEffect(p.x,p.y-60,"white");
    for(let i=0;i<24;i++){const ang=rng()*Math.PI*2,spd=rng()*6+2;hitEffects.push({x:p.x,y:p.y-60,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-2,life:34,maxLife:34,particle:true,color:rndChoice(["white","#AEEBFF","cyan"])});}

}
// ================================================================
//  FROST PER-FRAME TICK — slide trail, Frozen Domain aura, Ice Prison timing, V4 innate pillars
// ================================================================
function tickFrost(p){
  if(p.charType!=="frost")return;
  if(p.frostSlideActive>0)p.frostSlideActive--;
  if(p.frostComboFX>0)p.frostComboFX--;
  // age the ice slide trail and slow anyone standing on it
  if(p.frostSlideTrail.length){
    p.frostSlideTrail.forEach(t=>t.life--);
    p.frostSlideTrail=p.frostSlideTrail.filter(t=>t.life>0);
    if(p.frostSlideTrail.length){
      getAllEnemies(p).forEach(opp=>{
        if(opp.hp<=0)return;
        const onTrail=p.frostSlideTrail.some(t=>Math.abs(t.x-opp.x)<30*SR&&Math.abs(opp.y-p.y)<50*SR);
        if(onTrail){opp.slowTimer=Math.max(opp.slowTimer||0,20);opp._slowPct=Math.max(opp._slowPct||0,0.35);}
      });
    }
  }
  // Frozen Domain — persistent chilling zone
  if(p.frostDomainActive){
    p.frostDomainTimer--;
    p.frostDomainTick++;
    const isBossTgt=t=>(typeof Boss!=="undefined"&&t instanceof Boss)||(typeof RoadBoss!=="undefined"&&t instanceof RoadBoss);
    getAllEnemies(p).forEach(opp=>{
      if(opp.hp<=0)return;
      const d=dist(p.x,p.y,opp.x,opp.y);
      if(d<650*SR){
        const boss=isBossTgt(opp);
        opp.slowTimer=Math.max(opp.slowTimer||0,10);opp._slowPct=Math.max(opp._slowPct||0,boss?0.18:0.35);
        if(p.frostDomainTick%50===0){ // short chill pulse every ~0.8s
          if(boss)opp.stunTimer=Math.max(opp.stunTimer||0,8);
          else opp.stunTimer=Math.max(opp.stunTimer||0,16);
        }
      }
    });
    if(p.frostDomainTimer<=0)p.frostDomainActive=false;
  }
  // Ice Prison — tracks all locked targets, each explodes on expiry or if it's hit early
  if(p._icePrisonedTargets&&p._icePrisonedTargets.length){
    p._icePrisonedTargets=p._icePrisonedTargets.filter(tgt=>{
      if(!tgt||tgt.hp<=0)return false;
      const tookDamage=tgt._icePrisonHpLast!==undefined&&tgt.hp<tgt._icePrisonHpLast-0.01;
      tgt._icePrisonHpLast=tgt.hp;
      if(tgt._icePrisonTimer>0)tgt._icePrisonTimer--;
      if(tookDamage||tgt._icePrisonTimer<=0){
        aoeHitAt(p,10,tgt.x,tgt.y,90);
        spawnHitEffect(tgt.x,tgt.y-40,"#AEEBFF");
        for(let i=0;i<14;i++){const ang=rng()*Math.PI*2,spd=rng()*5+2;hitEffects.push({x:tgt.x,y:tgt.y-40,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-2,life:26,maxLife:26,particle:true,color:"#DFF7FF"});}
        tgt._icePrisonTimer=0;
        return false;
      }
      return true;
    });
  }
  // V4 innate: every 5s while transformed, 5 ice pillars erupt under the nearest foes
  if(p.transformActive){
    p.frostPillarTick++;
    if(p.frostPillarTick>=300){
      p.frostPillarTick=0;
      const picks=getAllEnemies(p).filter(e=>e.hp>0).sort((a,b)=>dist(p.x,p.y,a.x,a.y)-dist(p.x,p.y,b.x,b.y)).slice(0,5);
      picks.forEach(tgt=>{
        aoeHitAt(p,6,tgt.x,tgt.y,60);
        tgt.slowTimer=Math.max(tgt.slowTimer||0,40);tgt._slowPct=Math.max(tgt._slowPct||0,0.3);
        for(let i=0;i<10;i++)hitEffects.push({x:tgt.x+rndInt(-8,8),y:tgt.y-10,vx:(rng()-0.5)*2,vy:-rng()*3-1,life:22,maxLife:22,particle:true,color:"#AEEBFF"});
      });
      if(picks.length)screenShake=Math.max(screenShake,4);
    }
  }else p.frostPillarTick=0;
}

// THUNDER DASH TRAIL: the electric line left behind by Thunder Dash. Each
// segment arms for ~0.3s (18 frames) then detonates once, shocking/slowing/
// knocking back anyone standing on it, before fading out visually.
function tickThunderDash(p){
  if(p.charType!=="thunder"||!p.thunderDashTrail||!p.thunderDashTrail.length)return;
  p.thunderDashTrail.forEach(seg=>{
    if(seg.armed>0){
      seg.armed--;
      if(seg.armed===0&&!seg.exploded){
        seg.exploded=true;
        getAllEnemies(p).forEach(opp=>{
          if(dist(seg.x,seg.y,opp.x,opp.y)<70*SR){
            applyDamage(opp,10,p);
            addShock(opp,p);
            opp.slowTimer=Math.max(opp.slowTimer||0,60);opp._slowPct=0.5;
            if(opp instanceof Fighter){opp.vy=-6;const pd=opp.x>=seg.x?1:-1;opp.x=clamp(opp.x+pd*40,moveBoundLo(),moveBoundHi());}
          }
        });
        spawnHitEffect(seg.x,seg.y-20,"#FFD700");
        screenShake=Math.max(screenShake,8);
      }
    }
    seg.life--;
  });
  p.thunderDashTrail=p.thunderDashTrail.filter(s=>s.life>0);
}

function tickV4(p){

  else{
    p.transformActive=false;p.isFlying=false;p.v4LifestealPct=0;p.ghostHp=0;p.transformInvisActive=false;p.transformInvisTimer=0;
    if(p.charType==="red"){
      // Small closing burst + distinct sound as the blue hellfire fades and normal red fire returns.
      sfxTransformEnd();

      hitEffects.push({x:p.x,y:p.y-60,life:22,maxLife:22,color:"#00AEFF",ring:true});
    }
    return;
  }
  if(p.charType==="red"&&p.v4InvisScheduled&&p.transformTimer<=300){p.v4InvisScheduled=false;p.transformInvisActive=true;p.transformInvisTimer=120;}
  if(p.charType==="red"&&p.transformInvisActive){if(p.transformInvisTimer>0)p.transformInvisTimer--;else p.transformInvisActive=false;}
  if(p.charType==="thunder"){
    // V4 AURA (Storm Field): ~6m radius crackling field around the fighter.
    // Anyone standing in it gets a light shock, builds Shock Stack, and
    // takes damage over time. Occasional random bolts crash nearby too,
    // giving the "storm following the god" feel.
    p.thunderAuraTick++;
    if(p.thunderAuraTick>=15){
      p.thunderAuraTick=0;
      getAllEnemies(p).forEach(opp=>{
        if(dist(p.x,p.y,opp.x,opp.y)<540){
          applyDamage(opp,2.5,p);
          addShock(opp,p);
        }

    }
    if(rng()<0.10){

      spawnLightningArc(sx,sy,sx+rndInt(-20,20),p.y-30);
    }

  if(p.charType==="frost"&&!p.isFlying)p.isFlying=true;
  if(p.charType==="water"){p.waterRegenTick++;if(p.waterRegenTick>=15){p.waterRegenTick=0;p.hp=Math.min(MAX_HP,p.hp+3);}p.waterSlowAuraTick++;if(p.waterSlowAuraTick>=30){p.waterSlowAuraTick=0;getAllEnemies(p).forEach(opp=>{if(dist(p.x,p.y,opp.x,opp.y)<320){opp.slowTimer=Math.max(opp.slowTimer||0,45);opp._slowPct=0.8;}});}}
  if(p.charType==="wind"){p.windMiniTornadoTick++;if(p.windMiniTornadoTick===1){getAllEnemies(p).forEach(opp=>{if(dist(p.x,p.y,opp.x,opp.y)<160){if(opp instanceof Fighter)opp.vy=-16;applyDamage(opp,5,p);}});}else if(p.windMiniTornadoTick>=120)p.windMiniTornadoTick=0;}
  // EARTH V4: slow aura + ground rumble
  if(p.charType==="earth"&&p.transformActive){
    p.waterSlowAuraTick++; // reusing this timer
    if(p.waterSlowAuraTick>=40){
      p.waterSlowAuraTick=0;
      getAllEnemies(p).forEach(opp=>{
        if(dist(p.x,p.y,opp.x,opp.y)<280){
          opp.slowTimer=Math.max(opp.slowTimer||0,30);
          opp._slowPct=Math.max(opp._slowPct||0,0.4);
        }
      });
    }
    // Ground rumble particles
    if(p.onGround&&p.waterSlowAuraTick%20===0){
      for(let i=0;i<2;i++)hitEffects.push({x:p.x+rndInt(-30,30),y:p.y+2,vy:-rng()*0.3-0.1,vx:(rng()-0.5)*0.5,life:15,maxLife:15,smoke:true,r0:rndInt(3,6),color:rndChoice(["#c68a4a","#a67c52","#8a6a4a"])});
    }
  }
}

    _rect(W/2-40,by-16,80,44,"#444","#888",1); _text(W/2,by+6,`x${mobileLayoutCfg[touchEditorSelKey].scale.toFixed(1)}`,"white","10px Arial bold");
    _rect(W/2+96,by-16,44,44,"#333","white",2); _text(W/2+118,by+6,"+","white","20px Arial bold");
    _rect(W/2+160,by-16,110,44,"#7a3b3b","white",1); _text(W/2+215,by+6,"Đặt lại nút","white","9px Arial bold");

function handleTouchEditorPointer(x,y,phase){
  if(phase==="down"){
    if(x>=20&&x<=160&&y>=16&&y<=48){
      Object.keys(mobileLayoutCfg).forEach(k=>{mobileLayoutCfg[k]={dx:0,dy:0,scale:1};});
      mobileLayoutVersion++; touchEditorSelKey=null; touchEditorDrag=null; return;
    }
    if(x>=W-140&&x<=W-20&&y>=16&&y<=48){ gameState="MENU"; touchEditorDrag=null; return; }
    if(x>=W/2-115&&x<=W/2+115&&y>=56&&y<=86){
      touchMoveStyle = touchMoveStyle==="dpad" ? "joystick" : "dpad"; return;
    }
    if(touchEditorSelKey){
      const by=H-70;
      if(x>=W/2-140&&x<=W/2-96&&y>=by-16&&y<=by+28){
        const c=mobileLayoutCfg[touchEditorSelKey]; c.scale=Math.max(0.6,+(c.scale-0.1).toFixed(2)); mobileLayoutVersion++; return;
      }
      if(x>=W/2+96&&x<=W/2+140&&y>=by-16&&y<=by+28){
        const c=mobileLayoutCfg[touchEditorSelKey]; c.scale=Math.min(1.8,+(c.scale+0.1).toFixed(2)); mobileLayoutVersion++; return;
      }
      if(x>=W/2+160&&x<=W/2+270&&y>=by-16&&y<=by+28){
        mobileLayoutCfg[touchEditorSelKey]={dx:0,dy:0,scale:1}; mobileLayoutVersion++; return;
      }
    }
    buildVBtns();
    const order=["joystick","s1","s2","s3","s4","shield","v4"];
    for(const k of order){
      const testBtn = (k==="joystick"&&touchMoveStyle==="dpad") ? {x:vBtns1.joystick.x,y:vBtns1.joystick.y,r:vBtns1.joystick.r*1.6} : vBtns1[k];
      if(_hitTestVBtn(x,y,testBtn)){
        touchEditorSelKey=k;
        touchEditorDrag={key:k, startX:x, startY:y, baseDx:mobileLayoutCfg[k].dx, baseDy:mobileLayoutCfg[k].dy};
        return;
      }
    }
    touchEditorSelKey=null; touchEditorDrag=null;
  }else if(phase==="move"){
    if(!touchEditorDrag) return;
    const c=mobileLayoutCfg[touchEditorDrag.key];
    c.dx = touchEditorDrag.baseDx + (x-touchEditorDrag.startX);
    c.dy = touchEditorDrag.baseDy + (y-touchEditorDrag.startY);
    mobileLayoutVersion++;
  }else if(phase==="up"){
    touchEditorDrag=null;
  }
}

function handleMenuClick(mx, my) {
  if(gameState==="MENU"){
    // Gear icon
    if(W-60<=mx&&mx<=W-20&&20<=my&&my<=60){showSettings=!showSettings;return;}
    if(showSettings){handleSettingsClick(mx,my);return;}

      if(W/2-150<=mx&&mx<=W/2+150&&H/2+i*60<=my&&my<=H/2+45+i*60){
        if(i===3){gameState="CHALLENGE_SELECT";return;}
        if(i===4){gameState="ROAD_CHAR_SELECT";return;}
        gameMode="PVE";botLevel=i+1;selectingPlayer=1;gameState="CHAR_SELECT";return;
      }
    }
  }else if(gameState==="ROAD_CHAR_SELECT"){
    CHARS.forEach((ch,i)=>{const cx=W/2-700+i*200,cy=H/2-50;if(cx<=mx&&mx<=cx+170&&cy<=my&&my<=cy+250){selectedP1=ch.id;startRoadMode();}});
  }else if(gameState==="CHALLENGE_SELECT"){
    for(let i=0;i<4;i++){const by1=H/2-80+i*80;if(W/2-100<=mx&&mx<=W/2+100&&by1<=my&&my<=by1+60){challengeStage=i+1;gameState="CHALLENGE_CHAR_SELECT";return;}}
  }else if(gameState==="CHALLENGE_CHAR_SELECT"){
    CHARS.forEach((ch,i)=>{const cx=W/2-700+i*200,cy=H/2-50;if(cx<=mx&&mx<=cx+170&&cy<=my&&my<=cy+250){selectedP1=ch.id;startChallengeMode(challengeStage);}});
  }else if(gameState==="CHAR_SELECT"){
    CHARS.forEach((ch,i)=>{
      const cx=W/2-700+i*200,cy=H/2-50;
      if(cx<=mx&&mx<=cx+170&&cy<=my&&my<=cy+250){
        if(selectingPlayer===1){selectedP1=ch.id;if(gameMode==="PVP"){selectingPlayer=2;}else{const avail=CHARS.filter(c=>c.id!==ch.id);selectedP2=rndChoice(avail).id;startMatch();}}
        else{selectedP2=ch.id;startMatch();}
      }
    });
  }else if(gameState==="KEY_EDITOR"){
    handleKeyEditorClick(mx,my);
  }
}

// ================================================================
//  MAIN UPDATE LOOP
// ================================================================
function update(){
  try{
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = (gameState==="GAMEPLAY"||gameState==="CHALLENGE"||gameState==="ROAD") ? "#87CEFA" : "black";
  ctx.fillRect(0,0,W,H);
  let dx=0,dy=0;
  if(screenShake>0){dx=rndInt(-screenShake,screenShake);dy=rndInt(-screenShake,screenShake);screenShake*=0.96;if(screenShake<0.8)screenShake=0;}
  frameCount++;
  if(comboTimer>0){comboTimer--;if(comboTimer===0)comboCount=0;}
  if(_hitSfxCooldown>0)_hitSfxCooldown--;
  const floorY=H*FLOOR_Y_RATIO;
  ctx.save();ctx.translate(dx,dy);
  if(gameState==="MENU")drawMenu();
  else if(gameState==="CHALLENGE_SELECT")drawChallengeSelect();
  else if(gameState==="CHAR_SELECT")drawCharSelect("CHỌN PHÙ THỦY CHIẾN ĐẤU","white");
  else if(gameState==="CHALLENGE_CHAR_SELECT")drawCharSelect(`⚔️ MÀN ${challengeStage} — CHỌN NHÂN VẬT ⚔️`,"gold");
  else if(gameState==="ROAD_CHAR_SELECT")drawCharSelect("🛣️ ĐƯỜNG ĐI — CHỌN NHÂN VẬT 🛣️","#e67e22");
  else if(gameState==="GAMEPLAY")updateGameplay(floorY);
  else if(gameState==="CHALLENGE")updateChallenge(W,H);
  else if(gameState==="ROAD")updateRoad();
  else if(gameState==="TOUCH_EDITOR")drawTouchEditor();
  else if(gameState==="KEY_EDITOR")drawKeyEditor();
  ctx.restore();
  // Mobile overlays (outside shake transform)
  if(platformMode==="MOBILE"){
    if(["GAMEPLAY","CHALLENGE","ROAD"].includes(gameState))drawMobileControls();
    drawEscBtn();
  }
  processTouchSkills();
  }catch(err){console.error("Game loop error:",err);}
  requestAnimationFrame(update);
}

// ================================================================
//  GAMEPLAY UPDATE
// ================================================================
function updateGameplay(floorY){
  const worldW=W*MAP_SCALE;
  if(frameCount%60===0){for(const p of[p1,p2]){if(p.charType==="red"&&p.hp>0)p.hp=Math.min(MAX_HP,p.hp+1);}}
  for(const p of[p1,p2]){if(p.ultiTimer>0&&p.activeSkill==="water_s4"){p.tsunamiWaveXL-=8;p.tsunamiWaveXR+=8;}}
  for(const p of[p1,p2]){
    if(p.slowTimer>0)p.slowTimer--;if(p.stunTimer>0)p.stunTimer--;
    if(p.thunderFTimer>0){p.thunderFTimer--;if(p.thunderFTimer===0)p.thunderFCount=0;}
    for(const s in p.cds)if(p.cds[s]>0)p.cds[s]--;
    tickV4(p);
    tickThunderDash(p);
    tickWaterCloud(p);
    tickFrost(p);
  }
  for(const[attacker,pvpTarget]of[[p1,p2],[p2,p1]]){
    if(attacker.ultiTimer>0){
      attacker.ultiTimer--;
      const d=dist(attacker.x,attacker.y,pvpTarget.x,pvpTarget.y);
      if(attacker.activeSkill==="red_s4"&&d<350*SR)applyDamage(pvpTarget,0.25,attacker);

function onKeyPress(e){
  const k=e.key.toLowerCase();
  if(k==="escape"){gameState="MENU";showSettings=false;}
  if(k==="r"){
    if(gameState==="GAMEPLAY"&&(p1.hp<=0||p2.hp<=0))startMatch();
    if(gameState==="CHALLENGE"&&challengeState==="DONE"&&challengeResult==="LOSE")startChallengeMode(challengeStage);
    if(gameState==="ROAD"&&(roadState==="LOST"||roadState==="WON"))startRoadMode();
  }
  if(k===" "){if(gameState==="CHALLENGE"&&challengeState==="DONE"&&challengeResult==="WIN"&&challengeStage<4){challengeStage++;gameState="CHALLENGE_CHAR_SELECT";}}
  if(k===keyBindings.shield&&gameState==="GAMEPLAY")p1.isShielding=true;
  if(k==="2"&&gameMode==="PVP"&&gameState==="GAMEPLAY")p2.isShielding=true;
  if(k===keyBindings.s1)castSkill(p1,p2,1);
  if(k===keyBindings.s2)castSkill(p1,p2,2);
  if(k===keyBindings.s3)castSkill(p1,p2,3);
  if(k===keyBindings.s4)castSkill(p1,p2,4);
  if(k===keyBindings.v4)castSkill(p1,p2,5);
  if(gameMode==="PVP"&&gameState==="GAMEPLAY"){
    if(k==="1")castSkill(p2,p1,1);
    if(k==="4")castSkill(p2,p1,2);
    if(k==="3")castSkill(p2,p1,3);
    if(k==="5")castSkill(p2,p1,4);
    if(k==="6")castSkill(p2,p1,5);
  }
  // Menu navigation
  if(!["GAMEPLAY","CHALLENGE","ROAD"].includes(gameState))return;
  e.preventDefault();
}

function startChallengeMode(stage){

  p1.hp=MAX_HP;campX=0;gameState="CHALLENGE";_challengeWaveTimer=0;startChallenge(stage);
  dmgNumbers=[];comboCount=0;comboTimer=0;comboMaxThisRun=0;_challengeEndSfxDone=false;

function terrainHeightAt(worldX){
  if(!roadTerrain) return 0;
  const idx=Math.max(0,Math.floor(worldX/roadTerrain.segLen));
  return roadTerrain.heights[Math.min(idx,roadTerrain.heights.length-1)]||0;
}
function _generateRoadTerrain(totalLenPx,flatZonesPx){
  const segLen=380;
  const segCount=Math.ceil(totalLenPx/segLen)+6;
  const levels=[-90,-50,50,90]; // negative = raised plateau, positive = dip/valley
  const heights=[0,0,0]; // keep the spawn area flat
  for(let i=3;i<segCount;i++){
    let h = rng()<0.34 ? 0 : rndChoice(levels); // roughly a third of the road stays flat
    const prev=heights[i-1];
    if(Math.abs(h-prev)>110) h = prev + (h>prev?90:-90); // no un-jumpable cliffs between neighbors
    heights.push(h);
  }
  // Force flat ground around each boss set-piece — their fight logic assumes level footing.
  flatZonesPx.forEach(px=>{
    const a=Math.max(0,Math.floor((px-320)/segLen));
    const b=Math.floor((px+320)/segLen);
    for(let i=a;i<=b&&i<heights.length;i++) heights[i]=0;
  });
  return {segLen,heights};
}
function _spreadPositions(count,minX,maxX,avoidRanges,minGap){
  const positions=[]; let guard=0;
  while(positions.length<count && guard<count*50){
    guard++;
    const x=rndInt(minX,maxX);
    if(avoidRanges.some(r=>x>=r[0]&&x<=r[1])) continue;
    if(positions.some(p=>Math.abs(p-x)<minGap)) continue;
    positions.push(x);
  }
  return positions.sort((a,b)=>a-b);
}
let roadClouds=null;
function _initRoadClouds(){
  roadClouds=[];
  for(let i=0;i<8;i++){
    roadClouds.push({x:rndInt(-200,2400),y:rndInt(30,170),w:rndInt(70,150),spd:0.12+rng()*0.18});
  }
}
function _drawCloud(cx,cy,w){
  ctx.save();ctx.globalAlpha=0.9;ctx.fillStyle="#ffffff";
  const h=w*0.42;
  ctx.beginPath();
  ctx.ellipse(cx,cy,w*0.32,h*0.55,0,0,Math.PI*2);
  ctx.ellipse(cx-w*0.28,cy+h*0.12,w*0.24,h*0.42,0,0,Math.PI*2);
  ctx.ellipse(cx+w*0.28,cy+h*0.12,w*0.26,h*0.45,0,0,Math.PI*2);
  ctx.ellipse(cx+w*0.05,cy-h*0.18,w*0.22,h*0.4,0,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}
function drawRoadSky(isBossFight){
  if(!roadClouds)_initRoadClouds();
  if(!isBossFight){
    const grad=ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,"#4fa8e8");grad.addColorStop(0.55,"#8fd0f0");grad.addColorStop(1,"#cdeeff");
    ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
    ctx.save();ctx.globalAlpha=0.55;ctx.fillStyle="#fff6cc";ctx.beginPath();ctx.arc(W-90,80,44,0,Math.PI*2);ctx.fill();ctx.restore();
    roadClouds.forEach(c=>{
      c.x-=c.spd; // gentle drift, independent of camera so the sky always feels alive
      if(c.x<-220)c.x=W+rndInt(50,200);
      _drawCloud(c.x,c.y,c.w);
    });
  }else{
    const grad=ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,"#2a0a3d");grad.addColorStop(0.55,"#4b1466");grad.addColorStop(1,"#170824");
    ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
    ctx.save();ctx.shadowColor="#a866ff";ctx.shadowBlur=30;ctx.fillStyle="#d9b6ff";ctx.beginPath();ctx.arc(W-90,80,34,0,Math.PI*2);ctx.fill();ctx.restore();
    for(let i=0;i<18;i++){
      const sx=(i*137+frameCount*0.2)%W,sy=(i*59)%160;
      ctx.fillStyle=`rgba(255,255,255,${0.15+0.15*Math.sin(frameCount*0.05+i)})`;
      ctx.fillRect(sx,sy,2,2);
    }
  }
}
function drawRoadTerrain(baseFloorY){
  if(!roadTerrain){ drawFloor(baseFloorY,false); return; }
  const segLen=roadTerrain.segLen;
  const startIdx=Math.max(0,Math.floor((roadCameraX-100)/segLen));
  const endIdx=Math.min(roadTerrain.heights.length-1,Math.ceil((roadCameraX+W+100)/segLen));
  for(let i=startIdx;i<=endIdx;i++){
    const segX=i*segLen, segY=baseFloorY+roadTerrain.heights[i];
    _rect(segX,segY,segLen+2,H-segY,"#1a1a2e",null,0);
    _rect(segX,segY,segLen+2,22,"#2d2d44",null,0);
    ctx.strokeStyle="#e84545";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(segX,segY);ctx.lineTo(segX+segLen+2,segY);ctx.stroke();
    if(i<endIdx){
      const nextY=baseFloorY+roadTerrain.heights[i+1];
      if(nextY!==segY){
        const top=Math.min(segY,nextY), bot=Math.max(segY,nextY);
        _rect(segX+segLen-5,top,12,bot-top,"#241f38","#3a3260",1);
      }
    }
  }
}

const ROAD_BOSS_TRIGGERS_M=[350,800,1300].map(m=>Math.round(m*MAP_SCALE)); // 2.5x longer road between boss encounters
let _roadBossClearDelay=0;
function startRoadMode(){
  projectiles=[];puppets=[];
  const floorY=H*FLOOR_Y_RATIO;
  p1=new Fighter(220,floorY,selectedP1,1);
  p1.hp=MAX_HP;
  roadState="RUN";roadDistanceM=0;roadCameraX=0;
  roadWalls=[];roadTraps=[];roadEnemies=[];roadBoss=null;roadBossZoneIndex=0;
  roadBossTriggersPx=ROAD_BOSS_TRIGGERS_M.map(m=>m*ROAD_METER_PX+220);
  _roadBossClearDelay=0;

  const totalLenPx=roadBossTriggersPx[2]+900;
  const bossAvoid=roadBossTriggersPx.map(px=>[px-320,px+320]);
  roadTerrain=_generateRoadTerrain(totalLenPx,roadBossTriggersPx);

  // Fixed roster for the whole run — 18-20 enemies total, ~1/3 ranged casters,
  // spread evenly across the route instead of an endless timer-based spawner.
  const enemyCount=Math.round(rndInt(18,20)*MAP_SCALE);
  const enemyXs=_spreadPositions(enemyCount,500,totalLenPx-400,bossAvoid,140);
  const casterCount=Math.max(1,Math.round(enemyXs.length/3));
  const casterFlags=new Array(enemyXs.length).fill(false);
  for(let i=0;i<casterCount;i++) casterFlags[Math.min(enemyXs.length-1,Math.floor(i*(enemyXs.length/casterCount)))]=true;
  roadEnemyPlan=enemyXs.map((x,i)=>({x,caster:casterFlags[i],elite:rng()<0.15,spawned:false}));

  const wallCount=Math.round(rndInt(4,6)*MAP_SCALE);
  const wallXs=_spreadPositions(wallCount,900,totalLenPx-500,bossAvoid,650);
  roadWallPlan=wallXs.map((x,i)=>({x,hp:70+i*12,spawned:false}));

  const trapCount=Math.round(rndInt(10,14)*MAP_SCALE);
  const trapXs=_spreadPositions(trapCount,400,totalLenPx-300,bossAvoid,220);
  roadTrapPlan=trapXs.map((x,i)=>({x,type:i%2===0?"spike":"fire",spawned:false}));

  dmgNumbers=[];comboCount=0;comboTimer=0;comboMaxThisRun=0;roadKillCount=0;roadNewRecord=false;roadRunStartFrame=frameCount;_roadEndSfxDone=false;
  gameState="ROAD";
}
function startMatch(){
  projectiles=[];puppets=[];const floorY=H*FLOOR_Y_RATIO;
  p1=new Fighter(W*0.2,floorY,selectedP1,1);
  p2=new Fighter(W*0.8,floorY,selectedP2,-1);
  campX=0;gameState="GAMEPLAY";
  dmgNumbers=[];comboCount=0;comboTimer=0;comboMaxThisRun=0;_gameplayEndSfxDone=false;
}

// ================================================================
//  ROAD MODE UPDATE ("ĐƯỜNG ĐI" — 3 MA THÚ)
// ================================================================
function updateRoad(){
  const floorY=H*FLOOR_Y_RATIO;
  drawRoadSky(roadState==="BOSS");

  if(p1.slowTimer>0)p1.slowTimer--; if(p1.stunTimer>0)p1.stunTimer--;
  if(p1.poisonTimer>0){p1.poisonTimer--;if(p1.poisonTimer%60===0&&p1.hp>0)applyDamage(p1,2,null);}
  if(p1.thunderFTimer>0){p1.thunderFTimer--; if(p1.thunderFTimer===0)p1.thunderFCount=0;}
  for(const s in p1.cds) if(p1.cds[s]>0)p1.cds[s]--;
  tickV4(p1); tickWaterCloud(p1); tickFrost(p1); tickThunderDash(p1);
  if(frameCount%60===0 && p1.charType==="red" && p1.hp>0) p1.hp=Math.min(MAX_HP,p1.hp+1);
  if(p1.ultiTimer>0 && p1.activeSkill==="water_s4"){p1.tsunamiWaveXL-=8;p1.tsunamiWaveXR+=8;}

  const running = roadState==="RUN" || roadState==="BOSS";
if(running && p1.hp>0 && p1.stunTimer<=0 && p1.transformWindupTimer===0 && p1.transformLandingTimer===0){
    let spd=4.3125;
    if(p1.charType==="wind"&&p1.windBoostTimer>0){spd*=1.25;p1.windBoostTimer--;}
    if(p1.slowTimer>0)spd*=(1-p1._slowPct);
    if(p1.charType==="earth"&&["earth_s2","earth_s3"].includes(p1.activeSkill))spd*=0.8;
    if(p1.transformActive)spd*=p1.getTransformBuffs().speed||1;
    const canMoveH=p1.ultiTimer===0||p1.activeSkill==="water_s4";
    const goLeft  = keys.has(keyBindings.left) || (platformMode==="MOBILE"&&touch1.left);
    const goRight = keys.has(keyBindings.right) || (platformMode==="MOBILE"&&touch1.right);
    const goUp    = keys.has(keyBindings.up) || (platformMode==="MOBILE"&&touch1.up);
    const goDown  = keys.has(keyBindings.down) || (platformMode==="MOBILE"&&touch1.down);
    if(canMoveH&&p1.activeSkill!=="red_s3"){ if(goLeft)p1.x-=spd; if(goRight)p1.x+=spd; }
    if(p1.charType==="frost"&&p1.transformActive&&p1.isFlying){ if(goUp)p1.vy=-10; if(goDown)p1.vy=8; }
    else{ if(goUp&&!p1._upPrevInput)p1.jump(); }
    p1._upPrevInput=goUp;
  }
  p1.applyGravity(floorY+terrainHeightAt(p1.x));

  // Camera follows the player both forward AND backward (with a small dead
  // zone so it doesn't jitter). This must run BEFORE the camera-edge clamp
  // below, using this frame's already-updated p1.x (which may reflect last
  // frame's knockback), otherwise a forward-only camera would keep re-pinning
  // a knocked-back player to its old edge every frame — the "văng vô map bị
  // kẹt" bug.
  const CAM_MARGIN_LEFT=W*0.28, CAM_MARGIN_RIGHT=W*0.55;
  if(p1.x-roadCameraX>CAM_MARGIN_RIGHT) roadCameraX=p1.x-CAM_MARGIN_RIGHT;
  else if(p1.x-roadCameraX<CAM_MARGIN_LEFT) roadCameraX=p1.x-CAM_MARGIN_LEFT;
  roadCameraX=Math.max(0,roadCameraX);

  p1.x=Math.max(p1.x,roadCameraX+40);
  const frontWall=getFrontWall();
  if(frontWall && frontWall.hp>0 && frontWall.x-p1.x<90) p1.x=Math.min(p1.x,frontWall.x-90);
  if(roadBoss && !roadBoss.dead && roadBoss.hp>0 && roadBoss.x-p1.x<170) p1.x=Math.min(p1.x,roadBoss.x-170);

  roadDistanceM=Math.max(0,Math.floor((p1.x-220)/ROAD_METER_PX));

  if(p1.attackCooldown>0){p1.attackCooldown--; if(p1.attackCooldown===0&&p1.ultiTimer===0){p1.isAttacking=false;p1.activeSkill=null;}}

  if(p1.ultiTimer>0){
    p1.ultiTimer--;
    getAllEnemies(p1).forEach(tgt=>{
      const d=dist(p1.x,p1.y,tgt.x,tgt.y);
      if(p1.activeSkill==="red_s4"&&d<350*SR)applyDamage(tgt,0.25,p1);
      else if(p1.activeSkill==="thunder_s4")thunderJudgmentTick(p1);
      else if(p1.activeSkill==="frost_s4"&&d<450*SR){applyDamage(tgt,0.18,p1);if(tgt instanceof Fighter)tgt.slowTimer=Math.max(tgt.slowTimer,10);}
      else if(p1.activeSkill==="earth_s4"&&(d<420*SR||Math.abs(tgt.x-p1.targetSpikeX)<60*SR))applyDamage(tgt,0.26,p1);
      else if(p1.activeSkill==="shadow_s4"&&Math.abs(p1.x-tgt.x)<500*SR)applyDamage(tgt,0.40,p1);
      else if(p1.activeSkill==="water_s4"&&p1.tsunamiWaveXL<tgt.x&&tgt.x<p1.tsunamiWaveXR){applyDamage(tgt,0.35,p1);tgt.slowTimer=Math.max(tgt.slowTimer||0,20);tgt._slowPct=0.5;}
    });
    if(p1.ultiTimer===0){p1.isAttacking=false;p1.activeSkill=null;if(p1.charType==="earth")p1.earthPillars=[];}
  }
  if(p1.attackCooldown>0&&p1.activeSkill==="red_s3"){
    getAllEnemies(p1).forEach(tgt=>{ if(Math.abs(p1.y-tgt.y)<80*SR&&0<(tgt.x-p1.x)*p1.direction&&(tgt.x-p1.x)*p1.direction<600*SR) applyDamage(tgt,0.18,p1); });
  }
  if(p1.charType==="wind"&&p1.windTornadoActive&&p1.windTornadoX!==null){
    p1.windTornadoX+=10*p1.windTornadoDir;
    if(!p1._tornadoHitTargets)p1._tornadoHitTargets=new Set();
    const tdmg=p1._tornadoDmg||35;
    getAllEnemies(p1).forEach(tgt=>{ if(tgt.hp>0&&Math.abs(p1.windTornadoX-tgt.x)<90*SR&&!p1._tornadoHitTargets.has(tgt)){ p1._tornadoHitTargets.add(tgt); if(isPushable(tgt))tgt.x+=p1.windTornadoDir*320; applyDamage(tgt,tdmg,p1);} });
    if(p1.windTornadoX<roadCameraX-100||p1.windTornadoX>roadCameraX+W+100){p1.windTornadoActive=false;p1.windTornadoX=null;}
  }

  if(roadState==="RUN"){
    const revealX=p1.x+W*0.65;
    roadEnemyPlan.forEach(pl=>{
      if(!pl.spawned && pl.x<=revealX){
        pl.spawned=true;
        const tier=Math.floor(pl.x/900);
        roadEnemies.push(new RoadEnemy(pl.x,floorY+terrainHeightAt(pl.x),tier,pl.elite,pl.caster));
      }
    });
    roadWallPlan.forEach(pl=>{
      if(!pl.spawned && pl.x<=revealX){
        pl.spawned=true;
        roadWalls.push(new RoadWall(pl.x,pl.hp,floorY+terrainHeightAt(pl.x)));
      }
    });
    roadTrapPlan.forEach(pl=>{
      if(!pl.spawned && pl.x<=revealX){
        pl.spawned=true;
        roadTraps.push(new RoadTrap(pl.x,pl.type));
      }
    });
    if(roadBossZoneIndex<3 && p1.x>=roadBossTriggersPx[roadBossZoneIndex]){
      roadBoss=new RoadBoss(roadBossZoneIndex+1, p1.x+420, floorY);
      roadState="BOSS";
      roadEnemies=[];
      screenShake=Math.max(screenShake,15);
    }
  }else if(roadState==="BOSS"){
    if(roadBoss){
      if(!roadBoss.dead && (roadBoss.hp>0 || roadBoss.dying) && p1.hp>0) roadBoss.update(p1);
      if(roadBoss.summonQueue && roadBoss.summonQueue.length){ roadEnemies.push(...roadBoss.summonQueue); roadBoss.summonQueue=[]; }
      if(roadBoss.dead){
        _roadBossClearDelay++;
        if(_roadBossClearDelay>50){
          roadBossZoneIndex++; roadBoss=null; _roadBossClearDelay=0;
          roadState = roadBossZoneIndex>=3 ? "WON" : "RUN";
          if(roadState==="WON"){
            roadNewRecord = roadDistanceM>roadBestDistance;
            if(roadNewRecord)roadBestDistance=roadDistanceM;
          }
        }
      }
    }
  }

  roadEnemies=roadEnemies.filter(e=>{ if(e.hp>0&&p1.hp>0)e.update(p1,floorY+terrainHeightAt(e.x),projectiles); return e.hp>0 && e.x>roadCameraX-200; });
  roadTraps.forEach(t=>{ if(p1.hp>0)t.update(p1,floorY+terrainHeightAt(t.x)); });
  roadWalls=roadWalls.filter(w=>w.hp>0 || w.x>roadCameraX-100);

  if(p1.hp<=0 && roadState!=="LOST"){
    roadState="LOST";
    roadNewRecord = roadDistanceM>roadBestDistance;
    if(roadNewRecord)roadBestDistance=roadDistanceM;
  }

  ctx.save();
  ctx.translate(-roadCameraX,0);
  ctx.fillStyle="#13263b";
  const stripeStart=Math.floor(roadCameraX/300)*300;
  for(let i=0;i<40;i++){ const gx=stripeStart+i*300; ctx.fillRect(gx+40,floorY-260,3,260); }
  drawRoadTerrain(floorY);
  roadTraps.forEach(t=>t.draw(floorY+terrainHeightAt(t.x)));
  roadWalls.forEach(w=>w.draw(floorY+terrainHeightAt(w.x)));
  updateProjectiles(floorY,null);
  roadEnemies.forEach(e=>e.draw());
  if(roadBoss && !roadBoss.dead) roadBoss.draw();
  puppets=puppets.filter(pu=>pu.hp>0&&pu.life>0);
  puppets.forEach(pu=>pu.update(floorY+terrainHeightAt(pu.x),roadCameraX+W));
  puppets.forEach(pu=>pu.draw());
  drawFrostSlideTrail(p1);drawFrostDomain(p1);if(p1._icePrisonedTargets)p1._icePrisonedTargets.forEach(drawFrostIcePrison);drawThunderDashTrail(p1);
  p1.draw();
  if(p1.poisonTimer>0){
    for(let i=0;i<3;i++){
      const px=p1.x+rndInt(-16,16),py=p1.y-30-rndInt(0,55);
      _oval(px-7,py-7,14,14,"rgba(170,60,220,0.45)",null);
    }
  }
  updateAndDrawHitEffects();
  updateAndDrawLightningArcs();
  updateAndDrawDmgNumbers();
  ctx.restore();

  _text(W/2,20,"🛣️ ĐƯỜNG ĐI — 3 MA THÚ 🛣️","gold","16px Arial bold");
  const bw2=(p1.hp/MAX_HP)*200;
  _rect(50,40,200,20,"#333",null,0); _rect(50,40,Math.max(0,bw2),20,"#ff1a1a",null,0);
  _text(150,30,`P1 (${p1.charType.toUpperCase()}): ${getHPDisplay(p1.hp)}/${MAX_HP} HP`,"white","10px Arial bold");
  drawRageBar(50,63,200,14,p1);
  if(platformMode==="PC")drawCooldownChallenge();
  drawComboCounter();
  drawLowHpVignette();
  const bossNames=["🥚 Trứng Ma Thú","🦂 Vua Bọ Cạp Cát","🦇 Dơi Khổng Lồ"];
  _text(W-160,30,`Quãng đường: ${roadDistanceM}m`,"white","11px Arial bold");
  if(roadBestDistance>0)_text(W-160,63,`🏅 Kỷ lục: ${roadBestDistance}m`,"gold","9px Arial bold");
  if(roadState==="RUN" && roadBossZoneIndex<3){
    const remainM=Math.max(0,Math.ceil((roadBossTriggersPx[roadBossZoneIndex]-p1.x)/ROAD_METER_PX));
    _text(W-160,48,`Boss tiếp theo (${bossNames[roadBossZoneIndex]}): ${remainM}m`,"#aaa","9px Arial");
  }else if(roadState==="BOSS"){
    _text(W-160,48,`⚔️ Đang chiến đấu: ${bossNames[roadBossZoneIndex]}`,"orange","9px Arial bold");
  }

  if(roadState==="WON"||roadState==="LOST"){
    if(!_roadEndSfxDone){
      _roadEndSfxDone=true;
      if(roadState==="WON")sfxVictory();else sfxDefeat();
      if(roadNewRecord)setTimeout(()=>{ if(gameState==="ROAD")sfxRecord(); },350);
    }
  }
  if(roadState==="WON"){
    _text(W/2,H/2-25,"🏆 CHINH PHỤC ĐƯỜNG ĐI THÀNH CÔNG! 🏆","gold","32px Arial bold");
    _text(W/2,H/2+15,`Quãng đường: ${roadDistanceM}m  •  Quái đã hạ: ${roadKillCount}  •  Combo cao nhất: ${comboMaxThisRun}`,"#dddddd","12px Arial bold");
    if(roadNewRecord)_text(W/2,H/2+42,"🌟 KỶ LỤC MỚI! 🌟","#ffcc00","15px Arial bold");
    _text(W/2,H/2+72,platformMode==="MOBILE"?"Chạm màn hình để chơi lại | ESC về menu":"Nhấn R để chơi lại | ESC về menu","white","14px Arial");
  }else if(roadState==="LOST"){
    _text(W/2,H/2-25,"💀 THẤT BẠI 💀","red","40px Arial bold");
    _text(W/2,H/2+20,`Quãng đường: ${roadDistanceM}m  •  Quái đã hạ: ${roadKillCount}  •  Combo cao nhất: ${comboMaxThisRun}`,"#dddddd","12px Arial bold");
    if(roadNewRecord)_text(W/2,H/2+46,"🌟 KỶ LỤC MỚI! 🌟","#ffcc00","15px Arial bold");
    _text(W/2,H/2+74,platformMode==="MOBILE"?"Chạm màn hình để thử lại | ESC về menu":"Nhấn R để thử lại | ESC về menu","white","14px Arial");
  }
}
let _roadEndSfxDone=false;

// ================================================================
//  KICK OFF
// ================================================================
update();
</script>
