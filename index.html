    }
    if(this.charType==="earth"){
      // EARTH — "Luyện Thạch Giáp": đá chồi thẳng từ đất, lần lượt ráp kín
      // từng phần cơ thể (chân → hông/ngực/tay/vai → cổ → đầu) rồi 1 giây
      // sau ánh sáng rực lên từ các khe hở trước khi nổ tung — fully custom,
      // kept entirely separate from the shared generic swirl below so other
      // elements are untouched. See _drawEarthTransformWindup().
      this._drawEarthTransformWindup(rx,ry,af,age,total);
      return;
    }
    const col=ELEMENT_COLORS[this.charType]||"#FFAA33";
    const glow="#FFEE99";
    if(this.charType==="thunder"){
      // THUNDER V4 WINDUP: screen dims, sky-bolts crash down around the
      // fighter as they rise, then one huge column of lightning strikes them.
      // Bolt top-Y is solved analytically (same fix as Water's light beam)
      // so it always originates just above the real top of the canvas
      // (screen_y ≈ -60) instead of a fixed "ry-N" offset that — after the
      // per-pivot CHAR_VISUAL_SCALE body shrink — could fall short of the
      // top of the screen on tall viewports.
      const _fy=ry+52, _skyY=_fy+(-60-_fy)/CHAR_VISUAL_SCALE;
      ctx.save();
      // Draw outside camera context for full screen coverage
      ctx.setTransform(1,0,0,1,0,0);
      ctx.globalAlpha=Math.min(0.5,prog*0.6);ctx.fillStyle="#000010";ctx.fillRect(0,0,W,H);
      ctx.restore();
      // HÀO QUANG TỰ THÂN tăng dần từ mờ nhẹ đến CỰC SÁNG khi prog tiến gần
      // 1 — không bật sáng chói ngay từ đầu (không tự nhiên) mà sáng dần
      // đều theo tiến trình tụ lực, pha trộn 3 màu tím/vàng/trắng đảo
      // luân phiên cho có cảm giác điện năng đang cuộn trào quanh người.
      {
        const auraCols=["#FFD700","#B266FF","white"];
        const auraCol=auraCols[Math.floor(age/8)%3];
        ctx.save();
        ctx.globalAlpha=Math.min(1,prog*prog*1.1);
        ctx.shadowColor=auraCol;ctx.shadowBlur=20+prog*70;
        ctx.strokeStyle=auraCol;ctx.lineWidth=2+prog*3;
        const auraR=34+Math.sin(age*0.35)*4+prog*10;
        ctx.beginPath();ctx.arc(rx,ry-45,auraR,0,Math.PI*2);ctx.stroke();
        ctx.restore();
      }
      if(!this._windupBolts||af%6===0){
        this._windupBolts=[];
        const _boltCols=["#FFD700","#B266FF","white","#FFF176"];
        for(let b=0;b<4;b++){
          const sx=rx+rndInt(-220,220);
          // Độ nghiêng TỔNG THỂ của cả tia (không phải rung lắc vặt quanh 1
          // đường thẳng đứng như trước) — sét thật gần như không bao giờ
          // đánh thẳng đứng 90°, luôn xiên theo hướng nào đó. Mỗi tia random
          // 1 độ xiên riêng, cộng dồn dần suốt chiều dài tia bên dưới thay
          // vì chỉ dao động qua lại quanh gốc x cố định (trước đây bị coi là
          // "giới hạn theo tọa độ dọc" vì x chỉ nhích ±16 mỗi bước trong khi
          // y luôn +20..+40, nên tia nào cũng gần như đâm thẳng xuống).
          const tilt=(rng()-0.5)*320; // tổng độ lệch ngang từ đỉnh xuống đáy tia
          this._windupBolts.push({x:sx,y0:_skyY,y1:ry-30,tilt,col:rndChoice(_boltCols)});
        }
      }
      this._windupBolts.forEach(b=>{
        ctx.save();ctx.globalAlpha=0.8;ctx.strokeStyle=b.col||"white";ctx.shadowColor=b.col||"#FFD700";ctx.shadowBlur=16;ctx.lineWidth=3;
        ctx.beginPath();
        const totalDrop=Math.max(1,b.y1-b.y0);
        let cy3=b.y0,cx3=b.x;
        ctx.moveTo(cx3,cy3);
        while(cy3<b.y1){
          const stepY=rndInt(20,40);
          const tiltStep=b.tilt*(stepY/totalDrop); // trượt ngang theo ĐÚNG độ nghiêng tổng thể
          cx3+=tiltStep+rndInt(-16,16); // + zig-zag ngẫu nhiên nhỏ đè lên trên độ nghiêng
          cy3+=stepY;
          ctx.lineTo(cx3,cy3);
        }
        ctx.stroke();ctx.restore();
      });
      if(prog>0.5){
        // giant strike column right on top of the fighter as the windup finishes
        // Cải tiến: tia sét tụ lại rồi phình to gấp 3 (từ prog 0.5 đến 1.0)
        const boltProg = (prog - 0.5) / 0.5; // 0.0 -> 1.0
        const baseWidth = 4;
        const targetWidth = 30; // To gấp 3 lần bình thường (10 * 3)
        const currentWidth = baseWidth + (targetWidth - baseWidth) * boltProg;
        
        ctx.save();
        ctx.globalAlpha=Math.min(1, boltProg * 1.5);
        ctx.strokeStyle="white";ctx.shadowColor="white";ctx.shadowBlur=30 + boltProg * 20;
        ctx.lineWidth=currentWidth;
        // Cột sét cuối cùng: xiên nhẹ theo 1 hướng cố định (chốt ngay khi
        // bắt đầu phình to, giữ nguyên suốt — không đổi hướng loạn xạ mỗi
        // frame) thay vì kẻ thẳng đứng 90° cứng nhắc như trước, cho giống
        // 1 cú đánh sét thật thay vì 1 cột ánh sáng dựng đứng.
        if(this._finalBoltTiltX===undefined)this._finalBoltTiltX=rndInt(-55,55);
        ctx.beginPath();ctx.moveTo(rx+this._finalBoltTiltX+rndInt(-4,4),_skyY);ctx.lineTo(rx,ry-30);ctx.stroke();
        
        ctx.strokeStyle="#FFD700";
        ctx.lineWidth=currentWidth * 0.4;
        ctx.stroke();
        // Lõi tím bên trong cùng — mảnh hơn nữa, cho cột sét cuối có 3 lớp
        // màu (trắng ngoài / vàng giữa / tím lõi) thay vì chỉ trắng-vàng.
        ctx.strokeStyle="#B266FF";
        ctx.lineWidth=currentWidth * 0.18;
        ctx.stroke();
        ctx.restore();
      }
      // Trước đây thiếu return ở đây nên sau khi vẽ xong tia sét riêng của
      // Thunder, code vẫn rơi tiếp xuống khối vòng xoáy hạt sáng DÙNG
      // CHUNG cho các nhân vật chưa có hiệu ứng riêng (earth/frost/water/
      // wind) ở cuối hàm — khiến 2 hiệu ứng bị vẽ CHỒNG LÊN NHAU (tia sét
      // + vòng xoáy hạt lung tung), nhìn rối và xấu. Giống Shadow/Red/Fire
      // đã return sớm để KHÔNG dính khối chung đó, Thunder giờ cũng vậy.
      return;
    }
    // Frost — "Hóa Rồng Băng": fully custom 3.5s (210-frame) cinematic
    // sequence (camera punch-in + glow -> ice tentacles -> self-freeze ->
    // explode), same structure/language as Shadow/Thunder's V4 wind-ups.
    // See _drawFrostTransformWindup() for the phase-by-phase breakdown.
    if(this.charType==="frost"){
      this._drawFrostTransformWindup(rx,ry,af,age,total);
      return;
    }
    // Earth-specific windup: ground cracks and rocks fly toward the character
    if(this.charType==="earth")return;
    ctx.save();
    ctx.globalAlpha=0.55+prog*0.4;
    ctx.shadowColor=glow;ctx.shadowBlur=14+prog*20;
    for(let i=0;i<12;i++){
      const spinSpeed=4+prog*6;
      const ang=(af*spinSpeed+i*30)*Math.PI/180;
      const rad=(1-prog)*100+12;
      const px=rx+rad*Math.cos(ang);
      const py=ry-15+rad*Math.sin(ang)*0.6-prog*40;
      const s=3+prog*4;
      _oval(px-s,py-s,s*2,s*2,i%2===0?col:glow,null);
    }
    ctx.strokeStyle=col;ctx.lineWidth=2+prog*2;
    ctx.beginPath();ctx.ellipse(rx,ry-15,40+prog*15,60+prog*20,0,0,Math.PI*2*prog+0.2);ctx.stroke();
    ctx.restore();
  }
  // ================================================================
  //  RED — HỎA MA THẦN (Fire Demon God) V4 rework-only helpers
  // ================================================================
  // Fire-themed magic circle, hand-rolled on <canvas> (no images): three
  // concentric rings rotating in alternating directions, ancient-rune tick
  // marks, a six-point star, flame glyphs, radiating energy lines, a
  // flowing "lava" dashed stroke, and rising embers. Red/orange/gold only.
  _drawFireMagicCircle(cx,cy,alpha,intensity){
    if(alpha<=0)return;
    const af=this.animFrame;
    this._fireCircleAngle=((this._fireCircleAngle||0)+0.25)%360;   // outer ring: slow
    this._fireCircleAngle2=((this._fireCircleAngle2||0)-0.55)%360; // inner ring: faster, opposite
    const baseY=cy+56, flat=0.34;
    const R1=150,R2=112,R3=78;
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.translate(cx,baseY);
    // glow field
    const grad=ctx.createRadialGradient(0,0,10,0,0,R1);
    grad.addColorStop(0,`rgba(255,140,0,${0.35*intensity})`);
    grad.addColorStop(0.6,`rgba(255,60,0,${0.18*intensity})`);
    grad.addColorStop(1,"rgba(255,0,0,0)");
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.ellipse(0,0,R1,R1*flat,0,0,Math.PI*2);ctx.fill();
    // outer ring: rune ticks + flowing lava dash
    ctx.save();ctx.rotate(this._fireCircleAngle*Math.PI/180);
    ctx.strokeStyle="#FF6A00";ctx.lineWidth=3;ctx.shadowColor="#FF8800";ctx.shadowBlur=18;
    ctx.beginPath();ctx.ellipse(0,0,R1,R1*flat,0,0,Math.PI*2);ctx.stroke();
    ctx.setLineDash([16,10]);ctx.lineDashOffset=-af*1.4;ctx.strokeStyle="#FFCC33";ctx.lineWidth=2;ctx.shadowBlur=10;
    ctx.beginPath();ctx.ellipse(0,0,R1,R1*flat,0,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
    for(let i=0;i<24;i++){
      const a=(i/24)*Math.PI*2;
      const x1=Math.cos(a)*R1,y1=Math.sin(a)*R1*flat;
      const ext=i%3===0?16:9;
      const x2=Math.cos(a)*(R1+ext),y2=Math.sin(a)*(R1+ext)*flat;
      ctx.strokeStyle=i%3===0?"#FFDD55":"#FF5500";ctx.lineWidth=i%3===0?2.6:1.4;ctx.shadowBlur=i%3===0?12:4;
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
      if(i%3===0){ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2+Math.cos(a+0.5)*7,y2+Math.sin(a+0.5)*7*flat);ctx.stroke();}
    }
    ctx.restore();
    // middle ring: six-point magic star, counter-rotating
    ctx.save();ctx.rotate(this._fireCircleAngle2*Math.PI/180);
    ctx.strokeStyle="#FF9900";ctx.lineWidth=2;ctx.shadowColor="#FFB020";ctx.shadowBlur=14;
    ctx.beginPath();ctx.ellipse(0,0,R2,R2*flat,0,0,Math.PI*2);ctx.stroke();
    for(let pass=0;pass<2;pass++){
      ctx.beginPath();
      for(let i=0;i<=6;i++){const a=(i/6)*Math.PI*2+(pass?Math.PI/6:0);const x=Math.cos(a)*R2,y=Math.sin(a)*R2*flat;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}
      ctx.closePath();ctx.strokeStyle="#FF4400";ctx.lineWidth=1.6;ctx.stroke();
    }
    ctx.restore();
    // inner ring: fast spin, radiating energy lines
    ctx.save();ctx.rotate(this._fireCircleAngle*-1.6*Math.PI/180);
    ctx.strokeStyle="#FFEE88";ctx.lineWidth=2;ctx.shadowColor="#FFF3C0";ctx.shadowBlur=10;
    ctx.beginPath();ctx.ellipse(0,0,R3,R3*flat,0,0,Math.PI*2);ctx.stroke();
    for(let i=0;i<8;i++){
      const a=(i/8)*Math.PI*2;
      ctx.globalAlpha=alpha*(0.4+0.3*Math.sin(af*0.15+i));
      ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*R3,Math.sin(a)*R3*flat);ctx.stroke();
    }
    ctx.globalAlpha=alpha;
    ctx.restore();
    // fire glyphs at 4 points, pulsing
    for(let i=0;i<4;i++){
      const a=(i/4)*Math.PI*2+this._fireCircleAngle*Math.PI/180*0.3;
      const gx=Math.cos(a)*R2,gy=Math.sin(a)*R2*flat;
      const pulse=0.7+0.3*Math.sin(af*0.2+i);
      ctx.save();ctx.globalAlpha=alpha*pulse;ctx.translate(gx,gy);
      ctx.fillStyle="#FF6600";ctx.shadowColor="#FFAA00";ctx.shadowBlur=10;
      ctx.beginPath();
      ctx.moveTo(0,-9);ctx.quadraticCurveTo(6,-2,3,5);ctx.quadraticCurveTo(6,3,0,9);
      ctx.quadraticCurveTo(-6,3,-3,-1);ctx.quadraticCurveTo(-2,-6,0,-9);
      ctx.closePath();ctx.fill();
      ctx.restore();
    }
    ctx.restore();
    // rising embers off the ring
    if(!this._fireCircleEmbers)this._fireCircleEmbers=[];
    if(rng()<0.55*intensity&&this._fireCircleEmbers.length<40){
      const a=rng()*Math.PI*2;
      this._fireCircleEmbers.push({x:cx+Math.cos(a)*R1*rng(),y:baseY+Math.sin(a)*R1*flat*rng(),vy:-(rng()*1.3+0.6),vx:(rng()-0.5)*0.4,life:50,maxLife:50,size:rndInt(2,4)});
    }
    _compact(this._fireCircleEmbers,e=>e.life>0);
    this._fireCircleEmbers.forEach(e=>{
      e.x+=e.vx;e.y+=e.vy;e.life--;
      ctx.save();ctx.globalAlpha=Math.max(0,e.life/e.maxLife)*alpha*0.9;
      _oval(e.x-e.size,e.y-e.size,e.size*2,e.size*2,rndChoice(["#FF8800","#FFCC33","#FF4400"]),null);
      ctx.restore();
    });
  }
  // The 3-stage RED windup sequence described by design:
  //  Stage 1 (0 -> 0.8s): magic circle fades in under the character's feet.
  //  Stage 2 (0.8s -> ~3.2s): a towering pillar of fire erupts — camera
  //    shake, a screen flash, a heat-wave overlay, and the circle brightens.
  //  Stage 3 (~4.5s -> end): the pillar dissolves into drifting embers as
  //    the new Hỏa Ma Thần form is revealed (finalized when landing completes).
  _drawFireTransformWindup(rx,ry,af,age,total){
    const t1=48, t3=270; // 0.8s ignite, matches the physical "begin descend" phase
    if(!this._windupCrackled&&age>=t1){this._windupCrackled=true;sfxFireCrackle();screenShake=Math.max(screenShake,10);}
    const circleAlpha=Math.min(1,age/20);
    const circleIntensity=age<t1?0.5+0.5*(age/t1):1;
    this._drawFireMagicCircle(rx,ry,circleAlpha,circleIntensity);
    if(age>=t1&&age<t3){
      const pillarAge=age-t1;
      const pillarProg=Math.min(1,pillarAge/24);
      screenShake=Math.max(screenShake,pillarAge<10?16:4);
      ctx.save();
      const ph=260*pillarProg;
      const pw=70+Math.sin(af*0.3)*8;
      const grad=ctx.createLinearGradient(0,ry-ph,0,ry+30);
      grad.addColorStop(0,"rgba(255,240,180,0.05)");
      grad.addColorStop(0.35,"rgba(255,150,30,0.55)");
      grad.addColorStop(0.75,"rgba(255,60,0,0.8)");
      grad.addColorStop(1,"rgba(180,20,0,0.9)");
      ctx.fillStyle=grad;ctx.shadowColor="#FF6600";ctx.shadowBlur=30;
      ctx.beginPath();
      ctx.moveTo(rx-pw*0.5,ry+30);
      ctx.quadraticCurveTo(rx-pw*0.8,ry-ph*0.5,rx-pw*0.25,ry-ph);
      ctx.quadraticCurveTo(rx,ry-ph-16,rx+pw*0.25,ry-ph);
      ctx.quadraticCurveTo(rx+pw*0.8,ry-ph*0.5,rx+pw*0.5,ry+30);
      ctx.closePath();ctx.fill();
      ctx.globalAlpha=0.85;ctx.fillStyle="rgba(255,255,220,0.5)";
      ctx.beginPath();ctx.ellipse(rx,ry-ph*0.4,pw*0.22,ph*0.42,0,0,Math.PI*2);ctx.fill();
      ctx.restore();
      if(af%2===0)for(let i=0;i<3;i++){const ex=rx+rndInt(-pw*0.5,pw*0.5),ey=ry-rng()*ph;hitEffects.push({x:ex,y:ey,vx:(rng()-0.5)*2,vy:-rng()*2-1,life:26,maxLife:26,particle:true,color:rndChoice(["#FF8800","#FFCC33","#FFEE88"])});}
      ctx.save();ctx.setTransform(1,0,0,1,0,0);
      ctx.globalAlpha=0.05+0.05*Math.sin(af*0.4);
      ctx.fillStyle="#FF3300";ctx.fillRect(0,0,W,H);
      ctx.restore();
      if(pillarAge<10){
        ctx.save();ctx.setTransform(1,0,0,1,0,0);
        ctx.globalAlpha=Math.max(0,(10-pillarAge)/10)*0.5;
        ctx.fillStyle="white";ctx.fillRect(0,0,W,H);
        ctx.restore();
      }
    }else if(age>=t3){
      const dProg=Math.min(1,(age-t3)/Math.max(1,total-t3));
      const emberCount=Math.floor(6*(1-dProg))+2;
      for(let i=0;i<emberCount;i++){
        const ang=rng()*Math.PI*2,r=rng()*50;
        hitEffects.push({x:rx+Math.cos(ang)*r,y:ry-20+Math.sin(ang)*r*0.5,vx:(rng()-0.5)*1.2,vy:-rng()*1.6-0.4,life:30,maxLife:30,particle:true,color:rndChoice(["#FF8800","#FFCC33","#FF4400"])});
      }
      ctx.save();ctx.globalAlpha=dProg*0.9;ctx.shadowColor="#FF6600";ctx.shadowBlur=20;
      _oval(rx-30,ry-70,60,90,`rgba(255,120,0,${0.4*dProg})`,null);
      ctx.restore();
    }
  }
  // ================================================================
  //  FIRE — "Flame V2" transformation windup.
  //  The character stands completely still while:
  //   0.0s-0.3s : body starts glowing red/orange, faint shake begins
  //   0.3s-0.9s : a column of RED fire erupts straight up around them
  //   0.9s-1.5s : the pillar FLIPS to blue mid-air with a burst of energy,
  //               a shockwave ring races outward, and blue embers scatter
  //   1.5s+     : holds in a settled blue-glow standby until the shared
  //               6s windup finishes and _finalizeTransform() switches the
  //               fighter into Flame V2 proper.
  //  (The overall stand-still windup duration is the same 360-frame timer
  //  shared by every character's transform, so other characters are 100%
  //  unaffected — only the visuals inside these ~90 frames matter here.)
  // ================================================================
  _drawFireV2TransformWindup(rx,ry,af,age,total){
    const t1=18,t2=54,t3=90; // frame marks: glow start, red pillar peak, blue flip complete (~0.3/0.9/1.5s)
    if(age<t1){
      const glowA=age/t1;
      ctx.save();ctx.globalAlpha=glowA*0.6;ctx.shadowColor=FIRE_V1_COL;ctx.shadowBlur=26*glowA;
      _oval(rx-34,ry-70,68,110,`rgba(255,69,0,${0.35*glowA})`,null);
      ctx.restore();
      if(age>t1*0.5)screenShake=Math.max(screenShake,3);
      return;
    }
    if(!this._windupCrackled&&age>=t1){this._windupCrackled=true;sfxFireCrackle();}
    if(age<t2){
      // Rising red/orange fire column
      const prog=Math.min(1,(age-t1)/(t2-t1));
      screenShake=Math.max(screenShake,prog<0.3?12:5);
      const ph=230*prog,pw=56+Math.sin(af*0.3)*6;
      ctx.save();
      const grad=ctx.createLinearGradient(0,ry-ph,0,ry+30);
      grad.addColorStop(0,"rgba(255,220,150,0.05)");
      grad.addColorStop(0.4,"rgba(255,120,20,0.55)");
      grad.addColorStop(0.8,"rgba(255,40,0,0.85)");
      grad.addColorStop(1,"rgba(160,10,0,0.9)");
      ctx.fillStyle=grad;ctx.shadowColor=FIRE_V1_COL;ctx.shadowBlur=26;
      ctx.beginPath();
      ctx.moveTo(rx-pw*0.5,ry+30);
      ctx.quadraticCurveTo(rx-pw*0.8,ry-ph*0.5,rx-pw*0.25,ry-ph);
      ctx.quadraticCurveTo(rx,ry-ph-14,rx+pw*0.25,ry-ph);
      ctx.quadraticCurveTo(rx+pw*0.8,ry-ph*0.5,rx+pw*0.5,ry+30);
      ctx.closePath();ctx.fill();
      ctx.restore();
      if(af%2===0)for(let i=0;i<3;i++){const ex=rx+rndInt(-pw*0.5,pw*0.5),ey=ry-rng()*ph;hitEffects.push({x:ex,y:ey,vx:(rng()-0.5)*2,vy:-rng()*2-1,life:24,maxLife:24,particle:true,color:rndChoice(["#FF6600","#FF4400","#FFAA33"])});}
      return;
    }
    if(age<t3){
      // Blue flip: burst + shockwave
      if(!this._fireFlipDone){
        this._fireFlipDone=true;
        screenShake=Math.max(screenShake,20);
        sfxExplosion();
        for(let i=0;i<26;i++){const ang=rng()*Math.PI*2,spd=rng()*7+3;hitEffects.push({x:rx,y:ry-40,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-3,life:34,maxLife:34,particle:true,color:rndChoice(["#00AEFF","#00E5FF","white","#66F0FF"])});}
        hitEffects.push({x:rx,y:ry-20,life:30,maxLife:30,color:"#00CFFF",ring:true,big:true});
        hitEffects.push({x:rx,y:ry-20,life:40,maxLife:40,color:"white",ring:true,big:true,delay:5});
      }
      const prog=(age-t2)/(t3-t2);
      ctx.save();ctx.globalAlpha=Math.max(0,1-prog)*0.9;ctx.shadowColor=FIRE_V2_COL;ctx.shadowBlur=24;
      _oval(rx-32,ry-90,64,110,`rgba(0,180,255,${0.4*(1-prog)})`,null);
      ctx.restore();
      return;
    }
    // Settled Flame V2 standby glow for the remainder of the windup
    ctx.save();ctx.globalAlpha=0.35+0.15*Math.sin(af*0.15);ctx.shadowColor=FIRE_V2_COL;ctx.shadowBlur=18;
    _oval(rx-28,ry-80,56,100,"rgba(0,180,255,0.3)",null);
    ctx.restore();
    if(rng()<0.4)hitEffects.push({x:rx+rndInt(-24,24),y:ry-30,vx:(rng()-0.5)*0.6,vy:-rng()*1.4-0.4,life:26,maxLife:26,particle:true,color:rndChoice(["#00AEFF","#00E5FF","white"])});
  }
  // ================================================================
  //  SHADOW — "Bóng Tối Thức Tỉnh" (Darkness Awakening) V4 wind-up.
  //  Total length: 210 frames = 3.5s @60fps (set by castSkill / read via
  //  this._transformWindupTotal so the shared timer stays generic).
  //   0.0s-0.5s (age   0- 30): Kích hoạt — aura bóng tối nhẹ bắt đầu hiện ra.
  //   0.5s-1.4s (age  30- 84): Mở năng lượng — bóng dưới chân lan rộng,
  //                            portal/hố đen hé mở, hạt năng lượng bay vào.
  //   1.4s-2.4s (age  84-144): Tụ lực mạnh — aura + particle tăng tốc, rung
  //                            màn hình rất nhẹ tăng dần.
  //   2.4s-3.0s (age 144-180): Cao trào — portal đạt max, silhouette Reaper
  //                            hiện mờ phía sau lưng Shadow.
  //   3.0s-3.2s (age 180-192): "Nín thở" — mọi hiệu ứng dịu lại cực ngắn,
  //                            silhouette nhập vào Shadow.
  //   3.2s-3.5s (age 192-210): BÙNG NỔ — vòng xung kích + particle bắn ra +
  //                            flash ngắn. _finalizeTransform() được
  //                            applyGravity() gọi đúng 1 lần khi age=210.
  // ================================================================
  // EARTH — "Luyện Thạch Giáp" (270f = 4.5s):
  //  PHA 1 (0–50f): đất nứt toác rải rác quanh người, đá vụn trồi lên lác
  //    đác — báo hiệu trước khi những khối đá thật sự bắt đầu vón lại.
  //  PHA 2 (50–210f, 160f chia đều 7 khối tròn ~23f/khối): TỪNG KHỐI ĐÁ
  //    TRÒN LỚN (không cắt theo hình tay/chân/đầu — CỐ Ý để không ra dáng
  //    "tượng người") trồi lên từ một điểm TRÊN MẶT ĐẤT lệch XA sang một
  //    bên rồi bay chéo một quãng dài, chồng đè lên nhau từ dưới lên trên
  //    (đáy → giữa → đỉnh) cho tới khi cả người bị nuốt trọn bên trong MỘT
  //    khối bầu dục đá lớn duy nhất, không còn phân biệt được đâu là tay
  //    chân — đúng nghĩa "một tảng đá" chứ không phải bộ giáp hình người.
  //  PHA 3 (210–270f, ~1s): ánh sáng rực lên từ khe hở giữa các khối đá,
  //    rung lắc tăng dần — báo hiệu sắp bung nổ (vụ nổ thật sự diễn ra ở
  //    _finalizeTransform() ngay khi transformWindupTimer chạm 0).
  _drawEarthTransformWindup(rx,ry,af,age,total){
    ctx.save();
    const ENCASE_START=50,ENCASE_END=210;
    const STAGE_DUR=(ENCASE_END-ENCASE_START)/7;
    // 7 khối đá lớn ghép chồng thành MỘT khối bầu dục. Giữ nguyên bố cục cũ
    // để không phá nhịp animation, nhưng tăng độ "đá" bằng cạnh gồ ghề,
    // mặt cắt, khe nứt và phản lực khi va chạm.
    const STAGES=[
      {tx:0,  ty:58, r:51,gx:-156,rot:-0.12},
      {tx:-41,ty:45, r:45,gx:163, rot: 0.18},
      {tx:41, ty:45, r:45,gx:-170,rot:-0.24},
      {tx:0,  ty:-14,r:61,gx:177, rot: 0.08},
      {tx:-46,ty:-10, r:48,gx:-150,rot:-0.16},
      {tx:46, ty:-10, r:48,gx:153, rot: 0.22},
      {tx:0,  ty:-79,r:53,gx:-119,rot:-0.08}
    ];
    const groundY=ry+54;

    // PHA 1 — mặt đất rung, nứt theo hướng tâm + đá vụn bật lên.
    if(age<ENCASE_START){
      const p1=age/ENCASE_START;
      if(af%4===0){
        for(let c=0;c<3;c++){
          const ang=(c/3)*Math.PI*2 + age*0.015;
          const dist=18+rng()*48;
          const cx=rx+Math.cos(ang)*dist;
          const cy=groundY+2+rng()*5;
          hitEffects.push({x:cx,y:cy,life:20,maxLife:20,particle:true,color:rndChoice(["#4a3524","#6a4a2a","#8a6a4a"]),vx:(rng()-0.5)*0.55,vy:-rng()*0.7-0.15});
        }
      }
      // Các đường nứt hướng vào tâm, tăng dần độ rõ.
      ctx.save();
      ctx.globalAlpha=0.75*p1;
      ctx.lineWidth=1.5+2*p1;
      ctx.strokeStyle="#50351f";
      for(let i=0;i<7;i++){
        const a=(i/7)*Math.PI*2 + 0.18*Math.sin(i*7.3);
        const len=22+52*p1;
        const x0=rx+Math.cos(a)*6, y0=groundY-1+Math.sin(a)*3;
        const x1=rx+Math.cos(a)*len, y1=groundY+Math.sin(a)*len*0.28;
        ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1);
        ctx.lineTo(x1+Math.cos(a+0.8)*7,y1+Math.sin(a+0.8)*5);
        ctx.stroke();
      }
      ctx.restore();
      screenShake=Math.max(screenShake,3+6*p1);
    }

    // PHA 2 — đá bay từ xa vào vị trí. Mỗi lần chạm có bụi, mảnh văng,
    // flash ngắn và "nén" nhẹ để tạo cảm giác khối đá thật có khối lượng.
    let doneStage=-1;
    for(let i=0;i<STAGES.length;i++){
      const st=STAGES[i];
      const sStart=ENCASE_START+i*STAGE_DUR, sEnd=sStart+STAGE_DUR;
      const targetX=rx+st.tx, targetY=ry+st.ty;
      const originX=rx+st.tx+st.gx;
      if(age>=sEnd){
        doneStage=i;
        const impactAge=age-sEnd;
        const impactPulse=Math.max(0,1-impactAge/10);
        const jit=Math.sin(af*0.48+i*1.7)*0.45 + (i%2?0.25:-0.15)*impactPulse;
        const squash=1-0.055*impactPulse;
        ctx.save();
        ctx.translate(targetX+jit,targetY+impactPulse*1.4);
        ctx.scale(1+0.03*impactPulse,squash);
        this._drawEarthRockBlob(0,0,st.r,false,st.rot,i);
        ctx.restore();
      }else if(age>=sStart){
        const lp=(age-sStart)/STAGE_DUR;
        const eased=1-Math.pow(1-lp,3);
        const curX=originX+(targetX-originX)*eased;
        const curY=groundY+(targetY-groundY)*eased - Math.sin(lp*Math.PI)*9;
        this._drawEarthRockBlob(curX,curY,st.r,true,st.rot,i);
        if(af%3===0){
          hitEffects.push({x:originX+rndInt(-5,5),y:groundY-2,life:16,maxLife:16,particle:true,color:rndChoice(["#6a4a2a","#8a6a4a","#4a3524"]),vx:(rng()-0.5)*0.9,vy:-rng()*0.9});
        }
        if(af%5===0 && lp>0.72){
          hitEffects.push({x:curX,y:curY,life:10,maxLife:10,particle:true,color:"#a37a52",vx:(rng()-0.5)*0.35,vy:-rng()*0.45});
        }
      }
    }

    if(doneStage!==this._earthEncaseStage){
      this._earthEncaseStage=doneStage;
      if(doneStage>=0){
        const st=STAGES[doneStage];
        screenShake=Math.max(screenShake,9);
        // Bụi + đá con từ điểm va chạm.
        for(let i=0;i<11;i++){
          const a=rng()*Math.PI*2, sp=0.45+rng()*2.4;
          hitEffects.push({
            x:rx+st.tx+rndInt(-9,9), y:ry+st.ty+rndInt(-8,8),
            life:16+rndInt(0,10), maxLife:26, particle:true,
            color:rndChoice(["#4a3524","#6a4a2a","#8a6a4a","#a37a52"]),
            vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-0.55
          });
        }
        // Flash va chạm ngắn.
        ctx.save();
        ctx.globalAlpha=0.16;
        ctx.fillStyle="#ffd7a0";
        ctx.beginPath();ctx.arc(rx+st.tx,ry+st.ty,st.r*0.78,0,Math.PI*2);ctx.fill();
        ctx.restore();
      }
    }

    // PHA 3 — cả người bị khóa trong tảng đá. Năng lượng không còn là các
    // chấm sáng đơn lẻ: nó chạy thành các khe nứt trên bề mặt đá.
    if(age>=ENCASE_END){
      const p3=Math.min(1,(age-ENCASE_END)/Math.max(1,total-ENCASE_END));
      const pulse=0.5+0.5*Math.sin(af*0.28);

      // Hào quang lõi bên trong, rất nhẹ, tăng theo nhịp.
      ctx.save();
      ctx.globalAlpha=0.08+0.16*p3+0.04*pulse;
      ctx.shadowColor="#ffb84d"; ctx.shadowBlur=18+24*p3;
      ctx.fillStyle="#fff3c0";
      ctx.beginPath();ctx.ellipse(rx,ry-10,54+10*p3,70+14*p3,0,0,Math.PI*2);ctx.fill();
      ctx.restore();

      const crackDefs=[
        [[-34, 42],[-20, 18],[-27,-6],[-8,-30]],
        [[ 34, 40],[ 18, 17],[ 29,-10],[ 10,-31]],
        [[-46, -2],[-22,-7],[ -6,-28],[-2,-61]],
        [[ 46,  2],[ 24,-7],[  7,-30],[ 3,-58]],
        [[-15, 55],[  0, 32],[ 14,  8],[ 7,-13]],
        [[ 13, 55],[  2, 31],[-12,  8],[-7,-14]]
      ];
      crackDefs.forEach((pts,ci)=>{
        const localP=Math.max(0,Math.min(1,(p3*1.18)-(ci%3)*0.055));
        if(localP<=0)return;
        ctx.save();
        ctx.lineJoin="round";ctx.lineCap="round";
        const drawP=Math.min(1,localP*1.35);
        const visiblePts=Math.max(1,Math.floor(drawP*(pts.length-1)));
        const frac=drawP*(pts.length-1)-visiblePts;
        ctx.beginPath();
        ctx.moveTo(rx+pts[0][0],ry+pts[0][1]);
        for(let j=1;j<=visiblePts && j<pts.length;j++){
          ctx.lineTo(rx+pts[j][0],ry+pts[j][1]);
        }
        if(visiblePts<pts.length-1){
          const a=pts[visiblePts],b=pts[visiblePts+1];
          ctx.lineTo(rx+a[0]+(b[0]-a[0])*frac,ry+a[1]+(b[1]-a[1])*frac);
        }
        ctx.strokeStyle="#6b3413";ctx.lineWidth=4.5;ctx.globalAlpha=0.8;ctx.stroke();
        ctx.shadowColor="#ff9d24";ctx.shadowBlur=12+12*p3;
        ctx.strokeStyle= p3>0.58 ? "#fff1b0" : "#ff9d24";
        ctx.lineWidth=1.8+1.7*p3;
        ctx.globalAlpha=0.72+0.22*p3;
        ctx.stroke();
        ctx.restore();
      });

      // Một ít bụi lơ lửng quanh chân khối để phần cuối không đứng im.
      if(af%4===0){
        hitEffects.push({x:rx+rndInt(-58,58),y:groundY+rndInt(-2,6),life:18,maxLife:18,particle:true,color:"#8a6a4a",vx:(rng()-0.5)*0.7,vy:-0.35-rng()*0.45});
      }
      screenShake=Math.max(screenShake,4+p3*13);

      // Từ frame cuối, lõi sáng dồn vào tâm để chuẩn bị cho BURST ở finalizeTransform.
      if(p3>0.72){
        const q=(p3-0.72)/0.28;
        ctx.save();
        ctx.globalAlpha=q*(0.10+0.08*pulse);
        ctx.fillStyle="#ffffff";
        ctx.shadowColor="#fff4c7";ctx.shadowBlur=20+35*q;
        ctx.beginPath();ctx.arc(rx,ry-8,18+38*q,0,Math.PI*2);ctx.fill();
        ctx.restore();
      }
    }
    ctx.restore();
  }

  // Khối đá đa mặt: vẫn bo lớn để ghép thành MỘT tảng đá, nhưng cạnh không
  // còn là hình tròn hoàn hảo. Các mặt cắt và khe nứt giúp ánh sáng đọc được
  // như bề mặt đá thật thay vì các quả bóng nâu.
  _drawEarthRockBlob(cx,cy,r,rising,baseRot=0,seed=0){
    ctx.save();
    ctx.translate(cx,cy);
    const N=12;
    const pts=[];
    for(let k=0;k<N;k++){
      const ang=baseRot+(k/N)*Math.PI*2;
      const wob=1 + 0.075*Math.sin((k+1)*(seed+2)*1.91) + 0.055*Math.cos(k*3.7+seed);
      const rr=r*wob;
      pts.push([Math.cos(ang)*rr,Math.sin(ang)*rr]);
    }
    ctx.beginPath();
    pts.forEach((p,k)=>k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
    ctx.closePath();
    if(rising){ctx.shadowColor="#c68a4a";ctx.shadowBlur=10;}
    ctx.fillStyle="#765437";ctx.fill();
    ctx.lineWidth=rising?2.5:2.1;
    ctx.strokeStyle=rising?"#3c2517":"#24170d";
    ctx.stroke();

    // Mặt đá phụ: tam giác lớn lệch sáng để tạo cảm giác nhiều mặt phẳng.
    ctx.save();
    ctx.clip();
    ctx.globalAlpha=0.22;
    ctx.fillStyle="#d0ad78";
    ctx.beginPath();
    ctx.moveTo(-r*0.82,-r*0.28);
    ctx.lineTo(-r*0.18,-r*0.82);
    ctx.lineTo(r*0.42,-r*0.35);
    ctx.lineTo(-r*0.04,r*0.02);
    ctx.closePath();ctx.fill();
    ctx.globalAlpha=0.13;
    ctx.fillStyle="#3d2819";
    ctx.beginPath();
    ctx.moveTo(r*0.10,-r*0.18);ctx.lineTo(r*0.82,-r*0.42);ctx.lineTo(r*0.64,r*0.54);ctx.lineTo(r*0.02,r*0.24);ctx.closePath();ctx.fill();
    ctx.restore();

    // 2–3 khe vật chất tối, ngẫu nhiên nhưng ổn định theo seed để không nhấp nháy.
    ctx.save();
    ctx.beginPath();ctx.rect(-r,-r,r*2,r*2);ctx.clip();
    for(let c=0;c<3;c++){
      const a=(seed*1.73+c*2.1)%6.283;
      const x0=Math.cos(a)*r*0.12, y0=Math.sin(a)*r*0.12;
      const x1=Math.cos(a+0.65)*r*0.75, y1=Math.sin(a+0.65)*r*0.75;
      ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);
      ctx.strokeStyle="#3b281b";ctx.globalAlpha=0.48;ctx.lineWidth=1.1+0.3*c;ctx.stroke();
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x1+Math.cos(a-0.9)*r*0.18,y1+Math.sin(a-0.9)*r*0.18);
      ctx.stroke();
    }
    ctx.restore();
    ctx.restore();
  }
  _drawShadowTransformWindup(rx,ry,af,age,total){
    // First 45 frames (0.75s = 0.25s nothing + 0.5s camera punch-in, handled
    // entirely by shadowCamZoomState()/the camera code in
    // 07-fx-ticks-ui-and-main-menu.js) are deliberately blank here — no aura,
    // no portal, nothing. The moment the camera finishes zooming in on the
    // caster, vAge crosses 0 and the original 3.5s (210f) VFX sequence below
    // plays out exactly as before, just now offset by the punch-in.
    const PREROLL=45;
    const vAge=age-PREROLL, vTotal=total-PREROLL;
    if(vAge<0)return;
    const T1=30,T2=84,T3=144,T4=180,BURST=192; // frame marks relative to vAge (vTotal=210)
    age=vAge; total=vTotal;
    // footY lowered a bit (was ry+52) so the ground portal actually hugs
    // Shadow's feet at the character's real height instead of reading as
    // slightly "floating".
    const footY=ry+64;
    // ---- one-shot ambient SFX as each phase begins (sfxEnergyCharge already
    // fired once at the moment the skill was cast, in castSkill) ----
    if(!this._shadowRiftCracked&&age>=T1){this._shadowRiftCracked=true;sfxVoidCrack?.();}
    if(!this._shadowWhispered&&age>=T2){this._shadowWhispered=true;sfxShadowWhisper?.();}

    // The portal (pool + ring + tentacles) doesn't just cut off — it
    // dissolves away in a rising-smoke sweep the instant BÙNG NỔ fires,
    // matching the same dissolve language as Void Tentacle/Ultimate
    // (_shadowTentacleDissolve / _shadowUltiDissolve in 06).
    const dissolveT=age>=BURST?Math.min(1,(age-BURST)/Math.max(1,total-BURST)):0;
    const portalAlphaMult=1-dissolveT;

    // ---- growing shadow pool + black-hole/portal ring under the feet ----
    const poolProg=Math.min(1,age/T4);
    const poolR=16+poolProg*95;
    ctx.save();
    ctx.globalAlpha=(0.3+0.45*poolProg)*portalAlphaMult;
    const poolGrad=ctx.createRadialGradient(rx,footY,4,rx,footY,poolR);
    poolGrad.addColorStop(0,"rgba(8,4,16,0.95)");
    poolGrad.addColorStop(0.55,"rgba(90,40,180,0.35)");
    poolGrad.addColorStop(1,"rgba(90,40,180,0)");
    ctx.fillStyle=poolGrad;
    ctx.beginPath();ctx.ellipse(rx,footY,poolR,poolR*0.32,0,0,Math.PI*2);ctx.fill();
    ctx.restore();
    if(age>=T1){
      const ringProg=Math.min(1,(age-T1)/(T4-T1));
      const ringR=12+ringProg*(poolR-4);
      ctx.save();
      ctx.globalAlpha=(0.5+0.4*ringProg)*portalAlphaMult;
      ctx.strokeStyle="#bb44ff";ctx.shadowColor="#6654ff";ctx.shadowBlur=14;ctx.lineWidth=2.5;
      ctx.beginPath();ctx.ellipse(rx,footY,ringR,ringR*0.32,0,0,Math.PI*2);ctx.stroke();
      ctx.restore();
      // ---- tentacles reaching up out of the portal rim (same visual
      // language as the Void Tentacle skill / the Nộ bar's tendrils) ----
      const tentCount=5;
      for(let i=0;i<tentCount;i++){
        const baseAng=(i/tentCount)*Math.PI*2+af*0.01;
        const bx=rx+Math.cos(baseAng)*ringR*0.85,by=footY+Math.sin(baseAng)*ringR*0.85*0.32;
        const h=(14+ringProg*44)*(1-dissolveT*0.6);
        const sway=Math.sin(af*0.13+i*1.7)*9;
        ctx.save();
        ctx.globalAlpha=(0.45+0.35*ringProg)*portalAlphaMult;
        ctx.strokeStyle="#6654ff";ctx.shadowColor="#bb44ff";ctx.shadowBlur=7;ctx.lineWidth=3;ctx.lineCap="round";
        ctx.beginPath();
        ctx.moveTo(bx,by);
        ctx.quadraticCurveTo(bx+sway*0.6,by-h*0.55,bx+sway,by-h);
        ctx.stroke();
        ctx.restore();
      }
    }
    // ---- dissolve: portal + tentacles sweep upward into rising smoke as
    // they fade, instead of just vanishing the moment the burst fires ----
    if(dissolveT>0&&rng()<0.55){
      hitEffects.push({x:rx+rndInt(-poolR*0.6,poolR*0.6),y:footY,vx:(rng()-0.5)*0.6,vy:-rng()*1.6-0.6,life:34,maxLife:34,particle:true,size:rndInt(6,12),color:rndChoice(["#1a0a24","#3a0a55","#6654ff"])});
    }

    // ---- inbound dark/purple energy particles converging on the caster ----
    if(age>=T1){
      const inProg=Math.min(1,(age-T1)/(T4-T1));
      const count=Math.floor(6+inProg*18); // 6 -> 24 particles as it intensifies
      const spinSpeed=3+inProg*9+(age>=T2?5:0);
      for(let i=0;i<count;i++){
        const ang=(af*spinSpeed+i*(360/count))*Math.PI/180;
        const pullT=((af*2+i*11)%90)/90; // each particle loops its own pull-in cycle
        const rad=190-(190-10)*pullT;
        const px=rx+rad*Math.cos(ang);
        const py=ry-15+rad*Math.sin(ang)*0.55-inProg*10;
        const s=2+(1-pullT)*3;
        ctx.save();ctx.globalAlpha=(0.45+0.4*inProg)*(age>=T4&&age<BURST?0.5:1);ctx.shadowColor="#bb44ff";ctx.shadowBlur=8;
        _oval(px-s,py-s,s*2,s*2,i%2===0?"#6654ff":"#bb44ff",null);
        ctx.restore();
      }
    }

    // ---- rising dark aura wrapping the body ----
    const auraProg=Math.min(1,age/T4);
    const holdBreath=age>=T4&&age<BURST; // brief lull right before the burst
    const pulse=0.5+0.5*Math.sin(af*(0.08+auraProg*0.15));
    ctx.save();
    ctx.globalAlpha=(holdBreath?0.4:1)*(0.14+0.5*auraProg*pulse);
    ctx.shadowColor="#6654ff";ctx.shadowBlur=(holdBreath?8:14)+auraProg*22;
    _oval(rx-36-auraProg*10,ry-95-auraProg*10,72+auraProg*20,130+auraProg*20,`rgba(80,40,170,${holdBreath?0.1:0.22})`,null);
    ctx.restore();

    // ---- very light, gradually-increasing screen shake (capped low) ----
    if(age>=T2&&!holdBreath){
      const shakeProg=Math.min(1,(age-T2)/(T4-T2));
      screenShake=Math.max(screenShake,1+shakeProg*3);
    }

    // ---- climax silhouette: cái bóng ngả thành silhouette Reaper phía sau
    // lưng Shadow, hiện rõ dần rồi nhập vào nhân vật ngay trước khi nín thở ----
    if(age>=T3&&age<T4){
      const silProg=(age-T3)/(T4-T3);
      ctx.save();
      ctx.globalAlpha=silProg*0.75;
      ctx.fillStyle="#0a0812";
      ctx.shadowColor="#6654ff";ctx.shadowBlur=18;
      const sx=rx,sy=ry-10-silProg*6;
      ctx.beginPath();
      ctx.moveTo(sx-30,sy+60);
      ctx.quadraticCurveTo(sx-40,sy-10,sx-24,sy-55);
      ctx.quadraticCurveTo(sx,sy-85,sx+24,sy-55);
      ctx.quadraticCurveTo(sx+40,sy-10,sx+30,sy+60);
      ctx.closePath();ctx.fill();
      ctx.restore();
    }

    // ---- BÙNG NỔ: fires once at age===BURST (3.2s), then the shockwave
    // ring/particles play out through the remaining ~0.3s before
    // applyGravity() hits age=total and calls _finalizeTransform() ----
    if(age>=BURST){
      if(!this._shadowWindupBurstDone){
        this._shadowWindupBurstDone=true;
        screenShake=Math.max(screenShake,14);
        sfxVoidExplode?.();
        for(let i=0;i<22;i++){
          const ang=rng()*Math.PI*2,spd=rng()*6+3;
          hitEffects.push({x:rx,y:ry-40,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd*0.6-2,life:36,maxLife:36,particle:true,size:rndInt(6,14),color:rndChoice(["#0a0a10","#6654ff","#bb44ff","white"])});
        }
        hitEffects.push({x:rx,y:footY,life:30,maxLife:30,color:"#6654ff",ring:true,big:true});
        hitEffects.push({x:rx,y:footY,life:40,maxLife:40,color:"white",ring:true,big:true,delay:4});
      }
      const burstProg=(age-BURST)/Math.max(1,total-BURST);
      if(burstProg<0.3){
        ctx.save();ctx.setTransform(1,0,0,1,0,0);
        ctx.globalAlpha=Math.max(0,(0.3-burstProg)/0.3)*0.5;
        ctx.fillStyle="white";ctx.fillRect(0,0,W,H);
        ctx.restore();

  // ================================================================
  //  FROST — "Hóa Rồng Băng" (Ice Dragon Awakening) V4 wind-up.
  //  Total length: 210 frames = 3.5s @60fps (same pacing family as Shadow's
  //  3.5s VFX / Thunder's 2.5s VFX — set by castSkill via
  //  this._transformWindupTotal so the shared timer stays generic), split:
  //   0.0s-0.5s (age   0- 30 = PREROLL): camera punch-in only (handled by
  //                            shadowCamZoomState() in 07, FROST branch) —
  //                            nothing drawn here yet.
  //   0.0s-0.42s (vAge  0- 25): Phát sáng — light aura ring brightens.
  //   0.42s-1.5s (vAge 25- 90): Mọc súc tua — 6 icy tentacles/spikes grow
  //                            out of the body, swaying.
  //   1.5s-2.33s(vAge 90-140): Tự đóng băng — an ice shell grows up and
  //                            encases the whole body.
  //   2.33s-2.58s(vAge140-155): "Nín thở" — shell fully formed, brief lull.
  //   2.58s-3.0s (vAge155-180=BURST..total): BÙNG NỔ — the ice shell shatters
  //                            outward in one burst; _finalizeTransform()
  //                            fires right as this hits total (age=210).
  // ================================================================
  _drawFrostTransformWindup(rx,ry,af,age,total){
    const PREROLL=30;
    const vAge=age-PREROLL, vTotal=total-PREROLL;
    if(vAge<0)return;
    const T1=25,T2=90,T3=140,T4=155,BURST=155;
    age=vAge; total=vTotal;
    // Toàn thân nhân vật trải dài khoảng ry-96 (đỉnh đầu) tới ry+60 (chân)
    // — dùng đúng khung này (tham chiếu theo vòng khiên nước ellipse(rx,ry-18,
    // 50,78)) để mọi hiệu ứng bọc quanh CẢ NGƯỜI chứ không lơ lửng trên đầu.
    const bodyTop=ry-96, bodyBot=ry+60, bodyCX=ry-18;

    // ---- Phase 1: Phát sáng — hào quang quanh CẢ THÂN NGƯỜI sáng dần lên ----
    const glowProg=Math.min(1,age/T1);
    ctx.save();
    ctx.globalAlpha=(0.14+0.3*glowProg);
    ctx.shadowColor="#AEEBFF";ctx.shadowBlur=14+glowProg*22;
    ctx.fillStyle="rgba(180,235,255,0.5)";
    ctx.beginPath();ctx.ellipse(rx,bodyCX,30+glowProg*8,78+glowProg*8,0,0,Math.PI*2);ctx.fill();
    ctx.restore();

    // ---- Phase 2: Mọc vảy băng — các mảng vảy băng góc cạnh mọc thẳng
    // ra từ bề mặt cơ thể (không cong đung đưa như xúc tua), rải đều từ
    // chân lên đầu ----
    if(age>=T1){
      const scaleProg=Math.min(1,(age-T1)/(T2-T1));
      const rows=5;
      for(let row=0;row<rows;row++){
        const t=row/(rows-1); // 0=chân .. 1=đầu
        const rowY=bodyBot-(bodyBot-bodyTop)*t;
        const perRow=3;
        for(let i=0;i<perRow;i++){
          const side=i%2===0?-1:1;
          const jt=(i+row*0.5)/(perRow+rows);
          const baseX=rx+side*(16+8*Math.sin(row*2+i));
          const grow=Math.max(0,Math.min(1,(scaleProg*(rows+perRow)-(row+i))/1.4));
          if(grow<=0)continue;
          const w=6+grow*7,h=8+grow*10;
          const ang=side*(35+row*4)*Math.PI/180;
          ctx.save();
          ctx.translate(baseX,rowY);ctx.rotate(ang);
          ctx.globalAlpha=0.55+0.35*grow;
          ctx.fillStyle="#DFF6FF";
          ctx.strokeStyle="white";ctx.lineWidth=1;
          ctx.shadowColor="#66CCFF";ctx.shadowBlur=6;
          ctx.beginPath();
          ctx.moveTo(0,-h);ctx.lineTo(w*0.5,0);ctx.lineTo(0,h*0.35);ctx.lineTo(-w*0.5,0);ctx.closePath();
          ctx.fill();ctx.stroke();
          ctx.restore();
        }
      }
    }

    // ---- Phase 3: Tự đóng băng — một khối băng GÓC CẠNH (không phải hình
    // tròn/oval trơn) bọc dần từ chân lên đầu, phủ trọn cả người, TO GẤP ĐÔI
    // bề ngang (không kéo dài thêm chiều cao — giữ đúng chiều cao cơ thể) ----
    if(age>=T2){
      const freezeProg=Math.min(1,(age-T2)/(T3-T2));
      if(!this._frostFreezeCracked){this._frostFreezeCracked=true;screenShake=Math.max(screenShake,4);}
      const bigTop=bodyTop, bigBot=bodyBot;
      const coverBot=bigBot;
      const coverTop=bigBot-(bigBot-bigTop)*freezeProg;
      const segH=coverBot-coverTop;
      if(segH>1){
        ctx.save();
        ctx.globalAlpha=0.3+0.5*freezeProg;
        ctx.shadowColor="#AEEBFF";ctx.shadowBlur=24;
        const grad=ctx.createLinearGradient(rx,coverTop,rx,coverBot);
        grad.addColorStop(0,"rgba(235,250,255,0.75)");
        grad.addColorStop(1,"rgba(140,220,255,0.35)");
        ctx.fillStyle=grad;
        // Đa giác góc cạnh (khối băng vỡ) thay vì ellipse trơn: 2 mép trái/phải
        // zig-zag, bề ngang thu hẹp dần về phía đầu cho giống 1 cột băng lớn
        // bọc quanh thân người thay vì 1 viên kẹo tròn.
        const segRows=Math.max(2,Math.round((segH/(bigBot-bigTop))*8));
        ctx.beginPath();
        for(let i=0;i<=segRows;i++){
          const rt=i/segRows, py=coverBot-segH*rt;
          const widthAt=68-44*Math.max(0,1-freezeProg*1.4)*rt; // thu hẹp nhẹ về phía trên khi mới bắt đầu bọc
          const jag=(i%2===0?1:-1)*6;
          const px=rx-widthAt/2+jag;
          if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
        }
        for(let i=segRows;i>=0;i--){
          const rt=i/segRows, py=coverBot-segH*rt;
          const widthAt=68-44*Math.max(0,1-freezeProg*1.4)*rt;
          const jag=(i%2===0?-1:1)*6;
          const px=rx+widthAt/2+jag;
          ctx.lineTo(px,py);
        }
        ctx.closePath();ctx.fill();
        ctx.strokeStyle="white";ctx.lineWidth=1.5;ctx.globalAlpha=0.5+0.4*freezeProg;
        ctx.stroke();
        // đường nứt góc cạnh bên trong khối băng, giống phong cách ICE PRISON đã có
        ctx.strokeStyle="rgba(255,255,255,0.5)";ctx.lineWidth=1;ctx.globalAlpha=0.35+0.3*freezeProg;
        for(let i=0;i<3;i++){
          const lx=rx-18+i*18;
          ctx.beginPath();ctx.moveTo(lx,coverTop+4);ctx.lineTo(lx+(i-1)*6,coverBot-4);ctx.stroke();
        }
        ctx.restore();
      }
    }

    // ---- Phase 4: BÙNG NỔ — khối băng vỡ tung ra từ TOÀN THÂN (không chỉ
    // trên đầu), right before applyGravity() hits age=total and calls
    // _finalizeTransform() ----
    if(age>=BURST){
      if(!this._frostWindupBurstDone){
        this._frostWindupBurstDone=true;
        screenShake=Math.max(screenShake,14);
        spawnHitEffect(rx,bodyCX,"white");
        for(let i=0;i<28;i++){
          const ang=rng()*Math.PI*2,spd=rng()*6+3;
          const py=bodyTop+rng()*(bodyBot-bodyTop);
          hitEffects.push({x:rx,y:py,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd*0.7-1,life:34,maxLife:34,particle:true,size:rndInt(5,12),color:rndChoice(["white","#AEEBFF","cyan","#66CCFF"])});
        }
        hitEffects.push({x:rx,y:bodyCX,life:26,maxLife:26,color:"white",ring:true,big:true});
        hitEffects.push({x:rx,y:bodyCX,life:34,maxLife:34,color:"#AEEBFF",ring:true,big:true,delay:4});
      }
      const burstProg=(age-BURST)/Math.max(1,total-BURST);
      if(burstProg<0.3){
        ctx.save();ctx.setTransform(1,0,0,1,0,0);
        ctx.globalAlpha=Math.max(0,(0.3-burstProg)/0.3)*0.45;
        ctx.fillStyle="white";ctx.fillRect(0,0,W,H);
        ctx.restore();
      }
    }
  }
  // Stack indicator for the Hỏa Chủng innate: 10 small flame pips + counter,
  // floating above the fighter's head while V4 is active.
  _drawHoaChungStacks(rx,ry){
    const n=this.hoaChungStacks||0;
    if(this.hoaChungFlashTimer>0)this.hoaChungFlashTimer--;
    const flashBoost=this.hoaChungFlashTimer>0?(this.hoaChungFlashTimer/12)*6:0;
    const y0=ry-205;
    ctx.save();
    ctx.font="10px Arial bold";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillStyle=n>=10?"#FFEE88":"#FFAA33";
    ctx.shadowColor="#FF6600";ctx.shadowBlur=8+flashBoost;
    ctx.fillText(`🔥 HỎA CHỦNG ${n}/10`,rx,y0);
    ctx.restore();
    const spacing=13,startX=rx-(10*spacing)/2+spacing/2;
    for(let i=0;i<10;i++){
      const filled=i<n,px=startX+i*spacing,py=y0+13;
      ctx.save();
      ctx.globalAlpha=filled?1:0.25;
      ctx.fillStyle=filled?(i===9?"#FFEE88":"#FF7700"):"#552200";
      ctx.shadowColor=filled?"#FFAA00":"transparent";ctx.shadowBlur=filled?8:0;
      ctx.beginPath();
      ctx.moveTo(px,py-5);ctx.quadraticCurveTo(px+3.5,py-1,px+2,py+3);
      ctx.quadraticCurveTo(px+3.5,py+1.5,px,py+5);
      ctx.quadraticCurveTo(px-3.5,py+1.5,px-2,py+3);
      ctx.quadraticCurveTo(px-3.5,py-1,px,py-5);
      ctx.closePath();ctx.fill();
      ctx.restore();
    }
  }
  // Small scorch decals left behind on every V4 running step ("để lại dấu
  // cháy khi di chuyển"). Fixed-length array, always trimmed — no leak.
  _drawFireFootprints(ox,oy){
    if(!this._fireFootprints)this._fireFootprints=[];
    _compact(this._fireFootprints,f=>f.life>0);
    this._fireFootprints.forEach(f=>{
      f.life--;
      const a=Math.max(0,f.life/f.maxLife)*0.5;
      ctx.save();ctx.globalAlpha=a;ctx.fillStyle="#3a1000";
      ctx.beginPath();ctx.ellipse(f.x+ox,f.y+oy+2,14,5,0,0,Math.PI*2);ctx.fill();

      ctx.restore();

  // Long fire-comet tail drawn behind the fighter while airborne in "Hỏa
  // Phi" — a distinct flight identity from any other character's aerial FX.
  _drawFireFlyTrail(rx,ry){
    if(!this._fireFlyTrail)this._fireFlyTrail=[];

  _drawAfterImages(ox,oy){

      a.life--;

  // Detailed rotating aura ring for the fire fighter's V4 transform. The
  // fighter stays fixed at the exact center of the ring while it continuously
  // and slowly spins, with an inner counter-rotating ring and 16 tick/rune
  // marks for a layered, "ngầu" magic-circle look.
  _drawHellRing(cx,cy,hell){
    const outerCol=hell?"#00AEFF":"#FF5500";
    const glowCol =hell?"#66E0FF":"#FFCC33";
    this._drawEnergyRing(cx,cy,outerCol,glowCol);
  }
  _drawEnergyRing(cx,cy,outerCol,glowCol){
    const af=this.animFrame;
    if(this._ringAngle===undefined)this._ringAngle=0;
    this._ringAngle=(this._ringAngle+0.45)%360; // slow continuous rotation
    const rot1=this._ringAngle*Math.PI/180;
    const rot2=-this._ringAngle*1.7*Math.PI/180;
    ctx.save();
    ctx.translate(cx,cy);
    // outer solid ring
    ctx.rotate(rot1);
    ctx.strokeStyle=outerCol;ctx.lineWidth=3;
    ctx.shadowColor=glowCol;ctx.shadowBlur=18;
    ctx.beginPath();ctx.ellipse(0,0,98,68,0,0,Math.PI*2);ctx.stroke();
    // 16 rotating tick/rune marks around the outer ring
    for(let i=0;i<16;i++){
      const a=(i/16)*Math.PI*2;
      const rxo=98,ryo=68;
      const x1=Math.cos(a)*rxo,y1=Math.sin(a)*ryo;
      const x2=Math.cos(a)*(rxo+ (i%4===0?14:8)),y2=Math.sin(a)*(ryo+(i%4===0?10:6));
      ctx.strokeStyle=i%4===0?glowCol:outerCol;
      ctx.lineWidth=i%4===0?3:1.5;
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    }
    ctx.rotate(-rot1);
    // inner dashed ring, counter-rotating for a layered "double ring" effect
    ctx.rotate(rot2);
    ctx.strokeStyle=glowCol;ctx.lineWidth=2;ctx.setLineDash([9,7]);
    ctx.beginPath();ctx.ellipse(0,0,78,54,0,0,Math.PI*2);ctx.stroke();
    ctx.setLineDash([]);
    ctx.rotate(-rot2);
    ctx.restore();
    // faint pulsing energy particles orbiting along the ring
    for(let i=0;i<6;i++){
      const a=((af*3+i*60)%360)*Math.PI/180;
      const px=cx+Math.cos(a)*98,py=cy+Math.sin(a)*68;
      ctx.save();ctx.globalAlpha=0.8;
      _oval(px-3,py-3,6,6,glowCol,null);
      ctx.restore();
    }
  }
  _drawLivingAura(rx,ry){
    const col=(this.charType==="red"&&this.transformActive)?"#00AEFF":((this.charType==="fire"&&this.transformActive)?FIRE_V2_COL:(ELEMENT_COLORS[this.charType]||"white"));
    const af=this.animFrame;
    ctx.save();
    for(let l=0;l<4;l++){
      const wobble=Math.sin(af*0.08+l*1.3)*6;
      const rBase=32+l*11+wobble;
      const rot=((af*0.7+l*35)%360)*Math.PI/180;

      ctx.beginPath();
      ctx.ellipse(rx,ry-15,rBase,rBase*0.55,rot,0,Math.PI*2);
      ctx.stroke();

    ctx.restore();
    if(!this.auraParticles)this.auraParticles=[];
    if(this.hp>0&&rng()<0.32&&this.auraParticles.length<14){
      this.auraParticles.push({x:rx+rndInt(-24,24),y:ry+22,vy:-(rng()*1.1+0.6),life:38,maxLife:38,r:rndInt(2,4)});
    }
    _compact(this.auraParticles,p=>p.life>0);
    this.auraParticles.forEach(p=>{
      p.y+=p.vy;p.life--;
      ctx.save();ctx.globalAlpha=Math.max(0,p.life/p.maxLife)*0.65;
      _oval(p.x-p.r,p.y-p.r,p.r*2,p.r*2,col,null);

      amb.parts.forEach(p=>{p.y+=p.vy;p.life--;ctx.save();ctx.globalAlpha=Math.max(0,p.life/p.maxLife)*0.5;_oval(p.x-p.r,p.y-p.r,p.r*2,p.r*2,"#8844aa",null);ctx.restore();});

  //   EXPAND (~0.3s): vòng tròn bung ra nhanh
  //   HOLD   (phần giữa): vòng tròn giữ nguyên + rung nhẹ, tia sét bắn ra
  //                        ngẫu nhiên liên tục quanh tâm nổ
  //   FADE   (~0.33s cuối): mờ dần về 0 — không cắt đột ngột
  // Camera zoom-out (shadowCamZoomState) chỉ bắt đầu SAU khi pha này xong
  // hẳn, nên người chơi luôn thấy trọn hiệu ứng trước khi màn hình thu nhỏ lại.
  _drawTransformBurst(rx,ry){
    this.transformBurstTimer--;
    const total=TRANSFORM_BURST_FRAMES,t=this.transformBurstTimer,age=total-t;
    const EXPAND=18,FADE=20,HOLD_END=total-FADE;
    let rad;
    if(age<EXPAND){
      const t2=age/EXPAND, eased=1-Math.pow(1-t2,3); // ease-out cubic: bung nhanh rồi khựng lại
      rad=150*eased;
    }else{
      rad=150+Math.sin(age*0.25)*6; // giữ + rung nhẹ trong lúc tia sét nổ ra
    }
    let alpha;
    if(age<HOLD_END){
      alpha=0.9;
    }else{
      const t3=(age-HOLD_END)/FADE;
      alpha=0.9*(1-t3); // mờ dần, không tắt phụt
    }
    ctx.save();
    ctx.globalAlpha=Math.max(0,alpha);
    ctx.strokeStyle="white";ctx.lineWidth=5;
    ctx.beginPath();ctx.arc(rx,ry-20,rad,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle=(this.charType==="red"&&this.transformActive)?"#00AEFF":((this.charType==="fire"&&this.transformActive)?FIRE_V2_COL:(ELEMENT_COLORS[this.charType]||"gold"));ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(rx,ry-20,rad*0.7,0,Math.PI*2);ctx.stroke();
    ctx.restore();
    // Tia sét nhánh tỏa ngẫu nhiên quanh tâm nổ, bắn liên tục suốt pha HOLD.
    if(age>=EXPAND&&age<HOLD_END&&age%6===0){
      for(let i=0;i<2;i++){
        const ang=rng()*Math.PI*2,len=70+rng()*70;
        spawnLightningArc(rx,ry-20,rx+Math.cos(ang)*len,ry-20+Math.sin(ang)*len*0.6);
      }
    }
  }

  _drawHellRing(cx,cy,hell){
    const af=this.animFrame;
    if(this._ringAngle===undefined)this._ringAngle=0;
    this._ringAngle=(this._ringAngle+0.45)%360; // slow continuous rotation
    const outerCol=hell?"#00AEFF":"#FF5500";
    const glowCol =hell?"#66E0FF":"#FFCC33";
    const rot1=this._ringAngle*Math.PI/180;
    const rot2=-this._ringAngle*1.7*Math.PI/180;
    ctx.save();
    ctx.translate(cx,cy);
    // outer solid ring
    ctx.rotate(rot1);
    ctx.strokeStyle=outerCol;ctx.lineWidth=3;
    ctx.shadowColor=glowCol;ctx.shadowBlur=18;
    ctx.beginPath();ctx.ellipse(0,0,98,68,0,0,Math.PI*2);ctx.stroke();
    // 16 rotating tick/rune marks around the outer ring
    for(let i=0;i<16;i++){
      const a=(i/16)*Math.PI*2;
      const rxo=98,ryo=68;
      const x1=Math.cos(a)*rxo,y1=Math.sin(a)*ryo;
      const x2=Math.cos(a)*(rxo+ (i%4===0?14:8)),y2=Math.sin(a)*(ryo+(i%4===0?10:6));
      ctx.strokeStyle=i%4===0?glowCol:outerCol;
      ctx.lineWidth=i%4===0?3:1.5;
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    }
    ctx.rotate(-rot1);
    // inner dashed ring, counter-rotating for a layered "double ring" effect
    ctx.rotate(rot2);
    ctx.strokeStyle=glowCol;ctx.lineWidth=2;ctx.setLineDash([9,7]);
    ctx.beginPath();ctx.ellipse(0,0,78,54,0,0,Math.PI*2);ctx.stroke();
    ctx.setLineDash([]);
    ctx.rotate(-rot2);
    ctx.restore();
    // faint pulsing energy particles orbiting along the ring
    for(let i=0;i<6;i++){
      const a=((af*3+i*60)%360)*Math.PI/180;
      const px=cx+Math.cos(a)*98,py=cy+Math.sin(a)*68;
      ctx.save();ctx.globalAlpha=0.8;
      _oval(px-3,py-3,6,6,glowCol,null);

      ctx.moveTo(rx-14,ry+40);

    }
    else if(t==="fire"){
      // FLAME V2 — blue fire body, white-hot core, cyan light, blue "hair"

      this._drawHellRing(rx,ry-15,true);
      const cols=["#0033CC","#0066FF","#0099FF","#33CCFF","#99EEFF","white","#00E5FF"];
      ctx.save();ctx.shadowColor=FIRE_V2_COL;ctx.shadowBlur=22;
      for(let i=0;i<20;i++){

      _oval(rx-19,ry+40,10,10,"white","lightgray");
      for(let i=0;i<4;i++){const tr=rx-(i+1)*12*this.direction;ctx.strokeStyle="#90EE90";ctx.lineWidth=Math.max(1,4-Math.floor(i/2));ctx.setLineDash([3,2]);ctx.beginPath();ctx.moveTo(tr,ry-25);ctx.lineTo(tr+14*this.direction,ry+18);ctx.stroke();ctx.setLineDash([]);}

<script>
// ================================================================
//  CHALLENGE ENEMY
// ================================================================
class ChallengeEnemy {
  constructor(x,y,stage){
    const cfg=CHALLENGE_ENEMY_CFG[stage];
    this.x=x;this.y=y;this.vy=0;this.onGround=false;
    this.hp=cfg.hp;this.maxHp=cfg.hp;this.spd=cfg.spd;this.dmg=cfg.dmg;
    this.stage=stage;this.direction=1;this.attackTimer=0;this.anim=0;
    this.slowTimer=0;this._slowPct=0.5;this.stunTimer=0;
  }
  applyGravity(floorY){this.vy+=GRAVITY;this.y+=this.vy;if(this.y>=floorY){this.y=floorY;this.vy=0;this.onGround=true;}else this.onGround=false;}
  update(player,floorY,w){
    this.anim++;this.applyGravity(floorY);
    // FIX: slowTimer/_slowPct were tracked but never applied — mobs ignored
    // every slow effect in the game (frost trail, water aura, ice spear...).
    // Now ticks down and reduces movement speed, same as RoadEnemy already does.
    if(this.slowTimer>0)this.slowTimer--;
    if(this.stunTimer>0){this.stunTimer--;return;}
    const dx=player.x-this.x;this.direction=dx>0?1:-1;
    const spd=this.spd*(this.slowTimer>0?(1-this._slowPct):1);
    if(Math.abs(dx)>60)this.x+=spd*this.direction;
    this.x=clamp(this.x,40,w-40);
    this.attackTimer--;
    if(this.attackTimer<=0&&Math.abs(dx)<80*(player.sizeMult||1)){applyDamage(player,player.isShielding?this.dmg*0.2:this.dmg,null);this.attackTimer=70;}
  }
  draw(){
    if(this.reaperForm){this._drawReaperForm();return;}
    const COLS={1:"#884400",2:"#aa2200",3:"#cc0055",4:"#2a0a40",5:"#5a8fae"},col=COLS[this.stage]||"gray";
    if(this.stage===4){ctx.save();ctx.shadowColor="#a020f0";ctx.shadowBlur=8;}
    _rect(this.x-20,this.y-40,40,40,col,this.stage===4?"#c060ff":"white",2);_rect(this.x-15,this.y-65,30,30,col,this.stage===4?"#c060ff":"white",2);
    if(this.stage===4)ctx.restore();
    _oval(this.x+8*this.direction-4,this.y-57,8,8,this.stage===4?"#c060ff":"red",null);
    const bw=60*(this.hp/this.maxHp);
    _rect(this.x-30,this.y-80,60,7,"#333",null,0);_rect(this.x-30,this.y-80,bw,7,"#ff4444",null,0);
    _text(this.x,this.y-90,`S${this.stage} ${this.direction>0?">":"<"}`,"yellow","8px Arial bold");
    if(this.slowTimer>0)_text(this.x,this.y-100,"❄️","deepskyblue","10px Arial");
  }
  _drawReaperForm(){
    const rx=this.x,ry=this.y;
    _drawReaperMonster(rx,ry,this.direction);
    if(this.slowTimer>0)_text(rx,ry-98,"💨","#bda8ff","10px Arial");
    const bw=60*(this.hp/this.maxHp);
    _rect(rx-30,ry-80,60,7,"#333",null,0);_rect(rx-30,ry-80,Math.max(0,bw),7,"#8866ff",null,0);
  }
}

// ================================================================
//  EARTH SOLDIERS — Melee Minions
// ================================================================
class EarthSoldier {
  constructor(owner,x,y,direction){
    this.owner=owner;this.x=x;this.y=y;this.vy=0;this.direction=direction;
    this.hp=35;this.maxHp=35;this.atkTimer=0;this.anim=0;
    this.spd=4.3125*1.2;this.dmg=8;this.type="soldier";this.enemyList=[];
  }
  update(floorY,w){
    this.anim++;
    this.vy+=GRAVITY;this.y+=this.vy;if(this.y>=floorY){this.y=floorY;this.vy=0;}
    const targets=getAllEnemies(this.owner);
    if(targets.length){
      const tgt=targets.reduce((best,c)=>dist(c.x,c.y,this.x,this.y)<dist(best.x,best.y,this.x,this.y)?c:best);
      const dx=tgt.x-this.x;this.direction=dx>0?1:-1;
      if(Math.abs(dx)>40)this.x+=this.spd*this.direction;
      this.x=clamp(this.x,40,w-40);
      this.atkTimer--;
      if(this.atkTimer<=0&&Math.abs(dx)<70*(tgt.sizeMult||1)){applyDamage(tgt,this.dmg,this.owner);this.atkTimer=60;}
    }else{
      // Follow owner when no enemies
      const ownerDx=this.owner.x-this.x;
      if(Math.abs(ownerDx)>100)this.x+=this.spd*Math.sign(ownerDx);
      else this.x+=Math.sign(ownerDx)*0.5;
      this.x=clamp(this.x,40,w-40);
    }
  }
  draw(){
    const rx=this.x,ry=this.y,bob=Math.sin(this.anim*0.12)*1.5;
    ctx.save();ctx.shadowColor="#c68a4a";ctx.shadowBlur=8;
    // Body
    _rect(rx-12,ry-35+bob,24,35,"#8a6a4a","#4a3524",2);
    // Head
    _oval(rx-10,ry-48+bob,20,16,"#a67c52","#6a4a2a",1.5);
    // Eyes
    _oval(rx-6+2*this.direction,ry-44+bob,3,3,"#000",null);
    ctx.restore();
    const bw=24*(this.hp/this.maxHp);
    _rect(rx-12,ry-55+bob,24,3,"#333",null,0);_rect(rx-12,ry-55+bob,Math.max(0,bw),3,"#c68a4a",null,0);
  }
}

// ================================================================

// ================================================================
class EarthArcher {
  constructor(owner,x,y,direction){
    this.owner=owner;this.x=x;this.y=y;this.vy=0;this.direction=direction;
    this.hp=35;this.maxHp=35;this.atkTimer=0;this.anim=0;
    this.spd=4.3125*1.2*0.857;this.dmg=6;this.type="archer";
  }
  update(floorY,w){
    this.anim++;
    this.vy+=GRAVITY;this.y+=this.vy;if(this.y>=floorY){this.y=floorY;this.vy=0;}
    const targets=getAllEnemies(this.owner);
    if(targets.length){
      const tgt=targets.reduce((best,c)=>dist(c.x,c.y,this.x,this.y)<dist(best.x,best.y,this.x,this.y)?c:best);
      const dx=tgt.x-this.x;const dy=tgt.y-this.y;
      const dist_to_tgt=Math.hypot(dx,dy);
      this.direction=dx>0?1:-1;

      else if(dist_to_tgt>200)this.x+=this.spd*this.direction;
      this.x=clamp(this.x,40,w-40);
      this.atkTimer--;
      if(this.atkTimer<=0&&dist_to_tgt<220){
        // Fire homing arrow
        projectiles.push({x:this.x+20*this.direction,y:this.y-30,vx:8*this.direction,vy:-2,owner:this.owner,
          damage:this.dmg,slow:30,slow_pct:0.3,color:"#8a6a4a",type:"earth_arrow",dir:this.direction,target:tgt,homing:true});
        this.atkTimer=70;
      }
    }else{
      // Follow owner when no enemies
      const ownerDx=this.owner.x-this.x;
      if(Math.abs(ownerDx)>120)this.x+=this.spd*Math.sign(ownerDx);
      else this.x+=Math.sign(ownerDx)*0.3;
      this.x=clamp(this.x,40,w-40);
    }
  }
  draw(){
    const rx=this.x,ry=this.y,bob=Math.sin(this.anim*0.1)*1;
    ctx.save();ctx.shadowColor="#a67c52";ctx.shadowBlur=6;
    // Body
    _rect(rx-10,ry-32+bob,20,32,"#a67c52","#6a4a2a",1.5);
    // Head

// ================================================================
//  EARTH GOLEM (Earth skill 3 — TRIỆU HỒI THẠCH LINH) — a single
//  17-HP construct that looks like a smaller copy of its owner. It
//  fights using the owner's new melee S1 (Đấm Thạch Quyền) but on a
//  much slower 2s swing timer (vs. the owner's own S1 cooldown), and
//  it is the #1 target-priority pick for every enemy while it lives
//  (see shadowSoulTarget()'s earth-golem redirect). If its own
//  lifetime (== the owner's S3 cooldown, so "chiêu hồi xong mà nó
//  chưa chết") runs out before it dies, it despawns into a puff of
//  brown smoke rather than lingering forever.
// ================================================================
class EarthGolem {
  constructor(owner,x,y,direction,lifeFrames){
    this.owner=owner;this.x=x;this.y=y;this.vy=0;this.direction=direction;
    this.hp=17;this.maxHp=17;this.atkTimer=0;this.anim=0;
    this.spd=4.3125*1.05;this.dmg=5;this.type="golem";
    this.life=lifeFrames; // counts down to 0 == owner's S3 cooldown; despawns (not "dies") when it hits 0
    this._punchTimer=0; // brief forward-punch pose after each swing, purely visual
  }
  update(floorY,w){
    this.anim++;
    if(this.life>0)this.life--;
    this.vy+=GRAVITY;this.y+=this.vy;if(this.y>=floorY){this.y=floorY;this.vy=0;}
    if(this._punchTimer>0)this._punchTimer--;
    const targets=getAllEnemies(this.owner);
    if(targets.length){
      const tgt=targets.reduce((best,c)=>dist(c.x,c.y,this.x,this.y)<dist(best.x,best.y,this.x,this.y)?c:best);
      const dx=tgt.x-this.x;this.direction=dx>0?1:-1;
      if(Math.abs(dx)>55)this.x+=this.spd*this.direction;
      this.x=clamp(this.x,40,w-40);
      this.atkTimer--;
      // ĐẤM THẠCH QUYỀN — cú đấm cận chiến trực tiếp riêng của Thạch Linh
      // (không dùng projectile như S1 hiện tại của chủ nó, dù cùng ý tưởng
      // "chiêu 1"), trên chu kỳ 2 giây (120 khung hình @60fps) thay vì hồi
      // chiêu thật, vì đây là đòn tự động thụ động chứ không phải kỹ năng
      // chủ động.
      if(this.atkTimer<=0&&Math.abs(dx)<75*(tgt.sizeMult||1)){
        applyDamage(tgt,this.dmg,this.owner);
        this._punchTimer=10;
        spawnHitEffect(tgt.x,(tgt.y||this.y)-50,"#c68a4a");
        this.atkTimer=120;
      }
    }else{
      const ownerDx=this.owner.x-this.x;
      if(Math.abs(ownerDx)>110)this.x+=this.spd*Math.sign(ownerDx);
      else this.x+=Math.sign(ownerDx)*0.5;
      this.x=clamp(this.x,40,w-40);
    }
  }
  draw(){
    // A smaller copy of the owner's own Terra silhouette (_bodyEarth), with
    // every point mapped through LX/LY so the FEET always land exactly on
    // this.y (ground level) — the previous version scaled the full-size
    // body shape around the feet point itself, which pushed the whole
    // torso ~30px below ground (looked "sunk into the floor").
    const rx=this.x,ry=this.y,punch=this._punchTimer>0?6:0,dir=this.direction;
    const SC=0.62;
    const LX=(lx)=>rx+SC*lx;
    const LY=(ly)=>ry+SC*(ly-50); // ly=50 (torso bottom in the original body) maps to exactly ry
    ctx.save();ctx.shadowColor="#c68a4a";ctx.shadowBlur=7;
    ctx.fillStyle="sienna";ctx.strokeStyle="#4a3524";ctx.lineWidth=2*SC;
    ctx.beginPath();ctx.moveTo(LX(-19),LY(-10));ctx.lineTo(LX(19),LY(-10));ctx.lineTo(LX(30),LY(50));ctx.lineTo(LX(-30),LY(50));ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle="#8a6a4a";ctx.strokeStyle="#4a3524";ctx.lineWidth=1.5*SC;
    ctx.beginPath();ctx.moveTo(LX(-19),LY(-10));ctx.lineTo(LX(-35),LY(-26));ctx.lineTo(LX(-11),LY(-18));ctx.closePath();ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(LX(19),LY(-10));ctx.lineTo(LX(29),LY(-20));ctx.lineTo(LX(13),LY(-16));ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle="sienna";ctx.strokeStyle="#4a3524";ctx.lineWidth=2*SC;
    _rect(LX(-14),LY(-76),28*SC,28*SC,"sienna","#4a3524",2*SC);
    const eyeLX=4*dir;
    ctx.fillStyle="#ff8800";ctx.shadowColor="#ff8800";ctx.shadowBlur=8;
    ctx.fillRect(LX(eyeLX-4),LY(-64),8*SC,3*SC);
    ctx.shadowBlur=0;
    const flx=(30+punch)*dir,fly=18;
    ctx.fillStyle="#7a5a3a";ctx.strokeStyle="#3a2818";ctx.lineWidth=2*SC;
    ctx.beginPath();
    ctx.moveTo(LX(flx-13),LY(fly-6));ctx.lineTo(LX(flx+2),LY(fly-13));ctx.lineTo(LX(flx+14),LY(fly-4));
    ctx.lineTo(LX(flx+11),LY(fly+11));ctx.lineTo(LX(flx-4),LY(fly+15));ctx.lineTo(LX(flx-14),LY(fly+5));
    ctx.closePath();ctx.fill();ctx.stroke();
    ctx.restore();
    // Nhãn ưu tiên bị đánh — head-top giờ nằm ở khoảng LY(-76)≈ry-78, đặt
    // tên/thanh máu/số máu cao hơn một chút để không đè lên đầu.
    _text(rx,ry-100,"🗿 THẠCH LINH 🗿","#c68a4a","8px Arial bold");
    const bw=30*(this.hp/this.maxHp);
    _rect(rx-15,ry-90,30,3.5,"#333",null,0);_rect(rx-15,ry-90,Math.max(0,bw),3.5,"#c68a4a",null,0);
    _text(rx,ry-83,`${Math.ceil(this.hp)}/${this.maxHp}`,"white","7px Arial bold");
  }
}
