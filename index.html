  //  torso plates, cube shoulders, segmented rectangular limbs, a
  //  crowned cube head with glowing eyes, and a glowing geometric
  //  trident. Deliberately NOT a smooth humanoid/mermaid silhouette —
  //  every part reads as an assembled polygon shape.
  // ================================================================
  _drawBossTidal(){
    const rx=this.x,ry=this.y-this.hoverBob,isP2=this.phase===2;
    if(this.dead){
      for(let i=0;i<10;i++){const ex=rx+rndInt(-80,80),ey=ry+rndInt(-90,10);_oval(ex-9,ey-9,18,18,rndChoice(["#66e0ff","#1a8fc4","#eafcff"]),null);}
      _text(rx,ry-80,"💀 DEFEATED 💀","#66e0ff","16px Arial bold");
      return;
    }
    const sz=isP2?1.1:1.0,dir=this.direction;

    this._drawBossTidalSkillEffects();

    // ---- orbiting geometric water cubes/droplets ----
    this.waterAura.forEach(wa=>{
      const ox=rx+Math.cos(wa.ang)*wa.rad,oy=ry-95+Math.sin(wa.ang)*wa.rad*0.4+Math.sin(this.anim*0.05+wa.bob)*3;
      ctx.save();ctx.globalAlpha=0.55;ctx.fillStyle=isP2?"#aef2ff":"#5fd0f0";
      if(wa.type==="cube"){ctx.translate(ox,oy);ctx.rotate(this.anim*0.03+wa.bob);ctx.fillRect(-wa.size,-wa.size,wa.size*2,wa.size*2);}
      else{ctx.beginPath();ctx.arc(ox,oy,wa.size,0,Math.PI*2);ctx.fill();}
      ctx.restore();
    });

    const sway=this.bodySway;

    // ---- legs: two rectangular geometric blocks ----
    _rect(rx-22*sz,ry-34,16*sz,34,isP2?"#0c6f92":"#136f92","#aef2ff",2);
    _rect(rx+6*sz,ry-34,16*sz,34,isP2?"#0c6f92":"#136f92","#aef2ff",2);

    // ---- torso: tiered geometric plates, alternating shades, slight sway ----
    const plateCols=isP2?["#0e7ea8","#1590bd","#1ea8d8"]:["#136f92","#1590bd","#1ea8d8"];
    const plates=[[-26,-64,52,32],[-22,-92,44,30],[-17,-118,34,28]];
    plates.forEach(([px,py,pw,ph],i)=>{
      ctx.save();
      ctx.translate(sway*(i*0.4),0);
      _rect(rx+px*sz,ry+py,pw*sz,ph,plateCols[i],"#aef2ff",2);
      ctx.restore();
    });

    // ---- shoulders: cube blocks ----
    _rect(rx-46*sz,ry-118,20*sz,20,isP2?"#1ea8d8":"#1590bd","#aef2ff",2);
    _rect(rx+26*sz,ry-118,20*sz,20,isP2?"#1ea8d8":"#1590bd","#aef2ff",2);

    // ---- arms: segmented geometric limbs ----
    const armSwing=Math.sin(this.anim*0.06)*0.06;
    ctx.save();
    ctx.translate(rx-40*sz,ry-110);ctx.rotate(-0.25+armSwing);
    ctx.fillStyle=isP2?"#1ea8d8":"#1590bd";ctx.strokeStyle="#aef2ff";ctx.lineWidth=2;
    ctx.fillRect(-7,0,14,34);ctx.strokeRect(-7,0,14,34);
    ctx.restore();

    // right arm holds the trident — raises briefly when a skill fires
    const raiseAngle=this.tridentRaiseTimer>0?-1.3:-0.35;
    ctx.save();
    ctx.translate(rx+40*sz,ry-110);ctx.rotate(raiseAngle);
    ctx.fillStyle=isP2?"#1ea8d8":"#1590bd";ctx.strokeStyle="#aef2ff";ctx.lineWidth=2;
    ctx.fillRect(-7,0,14,34);ctx.strokeRect(-7,0,14,34);
    this._drawTrident(0,34);
    ctx.restore();

    // ---- head: geometric cube with a crown of small triangular spikes ----
    const hx=rx+4*dir,hy=ry-140*sz;
    _rect(hx-14*sz,hy-14,28*sz,28,isP2?"#1ea8d8":"#1590bd","#aef2ff",2);
    ctx.save();ctx.fillStyle=isP2?"#eafcff":"#aef2ff";
    for(let i=0;i<3;i++){
      const cxp=hx-10*sz+i*10*sz;
      ctx.beginPath();ctx.moveTo(cxp,hy-14);ctx.lineTo(cxp+4*sz,hy-30);ctx.lineTo(cxp+8*sz,hy-14);ctx.closePath();ctx.fill();
    }
    ctx.restore();

    // ---- glowing blue eyes ----
    const eyePulse=0.7+Math.sin(this.anim*0.09)*0.3;
    ctx.save();ctx.shadowColor=isP2?"#ffffff":"#66e0ff";ctx.shadowBlur=14*eyePulse;
    ctx.fillStyle=isP2?"#ffffff":"#eafcff";
    ctx.beginPath();ctx.ellipse(hx-5*sz,hy,4*sz*eyePulse,3*sz*eyePulse,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(hx+5*sz,hy,4*sz*eyePulse,3*sz*eyePulse,0,0,Math.PI*2);ctx.fill();
    ctx.restore();

    // ---- pulsing water energy lines on torso ----
    ctx.save();ctx.globalAlpha=0.5+0.3*Math.sin(this.anim*0.08);ctx.strokeStyle="#aef2ff";ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(rx-6*sz,ry-30);ctx.lineTo(rx-4*sz,ry-118);ctx.stroke();
    ctx.beginPath();ctx.moveTo(rx+6*sz,ry-30);ctx.lineTo(rx+4*sz,ry-118);ctx.stroke();
    ctx.restore();

    if(!this._introHideHp){
      const hpLabel=isP2?"🌊 더 타이달 - PHASE 2":"🌊 더 타이달";
      this._drawHpBar(rx,ry-40,hpLabel,isP2?"#eafcff":"#2ab8e8",true);
    }
  }
  // Small geometric trident — drawn in the caller's already-translated/rotated local
  // space. lx,ly is the grip (hand). The shaft runs outward from the grip (away from
  // the body) and the three prongs sit at the far tip — NOT bunched up near the hand.
  _drawTrident(lx,ly){
    ctx.save();ctx.strokeStyle="#aef2ff";ctx.fillStyle="#bff5ff";ctx.lineWidth=2;
    ctx.shadowColor="#66e0ff";ctx.shadowBlur=8;
    const shaftTip=ly+40,prongTip=shaftTip+16;
    ctx.beginPath();ctx.moveTo(lx,ly-8);ctx.lineTo(lx,shaftTip);ctx.stroke(); // shaft: short butt behind the grip -> long pole out to the prong base
    [-8,0,8].forEach(off=>{ // three prongs, at the far tip, pointing further away from the body
      ctx.beginPath();ctx.moveTo(lx+off,shaftTip);ctx.lineTo(lx+off,prongTip);ctx.stroke();
      ctx.beginPath();ctx.moveTo(lx+off-3,prongTip);ctx.lineTo(lx+off,prongTip+10);ctx.lineTo(lx+off+3,prongTip);ctx.closePath();ctx.fill();
    });
    ctx.restore();
  }
  _drawBossTidalSkillEffects(){
    const rx=this.x,ry=this.y-this.hoverBob,baseY=this._floorY||this.y;

    // Water Spear — small geometric droplet-shaped projectiles
    this.waterSpears.forEach(sp=>{
      ctx.save();ctx.fillStyle="#aef2ff";ctx.globalAlpha=Math.min(1,sp.life/40);
      ctx.beginPath();ctx.moveTo(sp.x,sp.y-8);ctx.lineTo(sp.x-5,sp.y+6);ctx.lineTo(sp.x+5,sp.y+6);ctx.closePath();ctx.fill();
      ctx.restore();
    });

    // Tidal Wave — layered geometric wave: soft back-wash + hard front wedges + foam crest line
    this.tidalWaves.forEach(t=>{
      const waveH=95*t.h;
      ctx.save();
      // soft back-wash layer, taller & lighter, gives the wave visual depth
      ctx.globalAlpha=0.35;ctx.fillStyle="#5fd0f0";
      ctx.beginPath();
      ctx.moveTo(t.x-4*t.dir,baseY);
      ctx.quadraticCurveTo(t.x+70*t.dir,baseY-waveH*0.65,t.x+118*t.dir,baseY-waveH*0.18);
      ctx.lineTo(t.x+118*t.dir,baseY);ctx.closePath();ctx.fill();
      // main body — stacked geometric wedges, darker & crisp-edged
      ctx.globalAlpha=0.9;ctx.fillStyle="#1590bd";ctx.strokeStyle="#aef2ff";ctx.lineWidth=2;
      for(let i=0;i<5;i++){
        const wx=t.x+i*16*t.dir,wh=waveH*(1-i*0.14);
        ctx.beginPath();
        ctx.moveTo(wx,baseY);ctx.lineTo(wx,baseY-wh);
        ctx.lineTo(wx+10*t.dir,baseY-wh*0.72);ctx.lineTo(wx+10*t.dir,baseY);
        ctx.closePath();ctx.fill();ctx.stroke();
      }
      // foam crest line riding the top of the wedges
      ctx.globalAlpha=1;ctx.strokeStyle="#eafcff";ctx.lineWidth=3;ctx.lineJoin="round";
      ctx.beginPath();ctx.moveTo(t.x,baseY-waveH*0.98);
      for(let i=0;i<5;i++){const wx=t.x+i*16*t.dir,wh=waveH*(1-i*0.14);ctx.lineTo(wx+10*t.dir,baseY-wh*0.72);}
      ctx.stroke();
      // small procedural foam-spray dots along the crest (no allocation — driven by t.life)
      ctx.fillStyle="#eafcff";ctx.globalAlpha=0.85;
      for(let i=0;i<3;i++){
        const fx=t.x+(i*20+((t.life*3)%20))*t.dir,fh=waveH*(1-Math.min(0.9,i*0.22));
        ctx.beginPath();ctx.arc(fx,baseY-fh*0.9-6,2.4,0,Math.PI*2);ctx.fill();
      }
      ctx.restore();
    });

    // Water Whirl — a real vortex: dark funnel core, spinning geometric rings, small chunks spiraling inward
    this.waterWhirls.forEach(wh=>{
      ctx.save();
      const coreR=wh.r*0.32;
      ctx.globalAlpha=0.55;ctx.fillStyle="#04384a";
      ctx.beginPath();ctx.ellipse(wh.x,baseY,coreR,coreR*0.42,0,0,Math.PI*2);ctx.fill();
      for(let i=0;i<6;i++){
        const rr=wh.r*(1-i*0.13),rot=wh.tick*0.08+i*0.9;
        ctx.globalAlpha=0.62-i*0.07;ctx.strokeStyle=i%2===0?"#5fd0f0":"#aef2ff";ctx.lineWidth=Math.max(1,3-i*0.35);
        ctx.beginPath();ctx.ellipse(wh.x,baseY,rr,rr*0.42,0,rot,rot+4.2);ctx.stroke();
      }
      // geometric water-chunks caught in the spiral, orbiting inward
      for(let i=0;i<5;i++){
        const ang=wh.tick*0.1+i*(Math.PI*2/5);
        const orbit=wh.r*(0.35+0.55*((Math.sin(wh.tick*0.05+i)+1)/2));
        const px=wh.x+Math.cos(ang)*orbit,py=baseY+Math.sin(ang)*orbit*0.42;
        ctx.save();ctx.translate(px,py);ctx.rotate(ang);
        ctx.globalAlpha=0.75;ctx.fillStyle="#eafcff";ctx.fillRect(-3,-3,6,6);
        ctx.restore();
      }
      ctx.restore();
    });

    // Water Prison — a real cage: pillars ringed around the player + a swirling dome roof + containment field
    if(this.waterPrisonActive){
      const a=Math.min(1,(75-this.waterPrisonTimer)/12);
      const cx=this.waterPrisonX,cy=baseY,pillars=6,ringR=46;
      ctx.save();
      ctx.globalAlpha=0.14*a;ctx.fillStyle="#5fd0f0";
      ctx.beginPath();ctx.ellipse(cx,cy-58,ringR+6,66,0,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=0.6*a;
      for(let i=0;i<pillars;i++){
        const ang=(i/pillars)*Math.PI*2,px2=cx+Math.cos(ang)*ringR,pw=8-Math.abs(Math.cos(ang))*2;
        ctx.fillStyle="rgba(95,208,240,0.4)";ctx.strokeStyle="#aef2ff";ctx.lineWidth=2;
        ctx.fillRect(px2-pw/2,cy-104,pw,104);ctx.strokeRect(px2-pw/2,cy-104,pw,104);
      }
      for(let i=0;i<3;i++){
        const rr=52-i*9,rot=this.anim*0.05+i*1.4;
        ctx.globalAlpha=(0.5-i*0.1)*a;ctx.strokeStyle="#eafcff";ctx.lineWidth=2;
        ctx.beginPath();ctx.ellipse(cx,cy-104,rr,rr*0.4,0,rot,rot+4);ctx.stroke();
      }
      ctx.restore();
      _text(cx,cy-134,"🌊 WATER PRISON 🌊","#aef2ff","11px Arial bold");
    }

    // Rising Tide — warning rings + tapered geometric columns with a splash cap
    this.risingTideWarnings.forEach(rw=>{
      ctx.save();ctx.globalAlpha=0.5+Math.sin(rw.timer*0.5)*0.3;
      ctx.strokeStyle="red";ctx.lineWidth=2;ctx.setLineDash([4,3]);
      ctx.beginPath();ctx.ellipse(rw.x,baseY,26,10,0,0,Math.PI*2);ctx.stroke();
      ctx.setLineDash([]);ctx.restore();
    });
    this.risingTideColumns.forEach(c=>{
      const h=c.h*150;
      ctx.save();
      ctx.globalAlpha=0.45;ctx.strokeStyle="#aef2ff";ctx.lineWidth=2;
      ctx.beginPath();ctx.ellipse(c.x,baseY,26,9,0,0,Math.PI*2);ctx.stroke();
      ctx.globalAlpha=0.4;ctx.fillStyle="#5fd0f0";ctx.fillRect(c.x-18,baseY-h,36,h);
      ctx.globalAlpha=0.9;ctx.fillStyle="#1590bd";ctx.strokeStyle="#aef2ff";ctx.lineWidth=2;
      ctx.fillRect(c.x-11,baseY-h,22,h);ctx.strokeRect(c.x-11,baseY-h,22,h);
      ctx.globalAlpha=0.6;ctx.strokeStyle="#eafcff";ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(c.x-6,baseY);ctx.lineTo(c.x-6,baseY-h*0.85);ctx.stroke();
      ctx.beginPath();ctx.moveTo(c.x+6,baseY);ctx.lineTo(c.x+6,baseY-h*0.85);ctx.stroke();
      if(c.h>0.7){
        ctx.globalAlpha=0.85;ctx.fillStyle="#eafcff";
        for(let i=-2;i<=2;i++){
          const sx2=c.x+i*8,sy2=baseY-h-6-Math.abs(i)*4;
          ctx.beginPath();ctx.moveTo(sx2-4,baseY-h+2);ctx.lineTo(sx2,sy2);ctx.lineTo(sx2+4,baseY-h+2);ctx.closePath();ctx.fill();
        }
      }
      ctx.restore();
    });

    // Trident Rush trail
    this.tridentRushTrail.forEach(t=>{
      ctx.globalAlpha=Math.max(0,t.life/20)*0.6;
      ctx.strokeStyle="#5fd0f0";ctx.lineWidth=6;
      ctx.beginPath();ctx.moveTo(t.x,baseY-10);ctx.lineTo(t.x,baseY-140);ctx.stroke();
      ctx.globalAlpha=1;
    });
    if(this.tridentRushActive)_text(rx,ry-210,"🔱 TRIDENT RUSH 🔱","#aef2ff","11px Arial bold");

    // Maelstrom — a large, dramatic vortex: dark funnel core + many spinning rings + orbiting chunks
    if(this.maelstromActive){
      ctx.save();
      const coreR=34;
      ctx.globalAlpha=0.5;ctx.fillStyle="#03303f";
      ctx.beginPath();ctx.ellipse(this.maelstromX,baseY,coreR,coreR*0.4,0,0,Math.PI*2);ctx.fill();
      for(let i=0;i<6;i++){
        const rr=40+i*26,rot=this.anim*0.045+i*0.8;
        ctx.globalAlpha=0.42-i*0.05;ctx.strokeStyle=i%2===0?"#2ab8e8":"#aef2ff";ctx.lineWidth=3;
        ctx.beginPath();ctx.ellipse(this.maelstromX,baseY,rr,rr*0.4,0,rot,rot+4.5);ctx.stroke();
      }
      for(let i=0;i<7;i++){
        const ang=this.anim*0.06+i*(Math.PI*2/7);
        const orbit=40+150*((Math.sin(this.anim*0.03+i)+1)/2);
        const px=this.maelstromX+Math.cos(ang)*orbit,py=baseY+Math.sin(ang)*orbit*0.4;
        ctx.save();ctx.translate(px,py);ctx.rotate(ang);
        ctx.globalAlpha=0.7;ctx.fillStyle="#eafcff";ctx.fillRect(-4,-4,8,8);
        ctx.restore();
      }
      ctx.restore();
      _text(this.maelstromX,baseY-210,"🌀 MAELSTROM 🌀","#aef2ff","12px Arial bold");
    }

    // Ocean's Judgment — true full-screen flood tint (uses the live camera/viewport,
    // not a fixed box anchored to the boss, so it actually covers the whole visible
    // screen regardless of arena width or zoom) + sweeping wave-bands for motion.
    if(this.oceanJudgmentCharging){
      ctx.save();
      const gx0=campX-30,gx1=campX+W+30;
      const grad=ctx.createLinearGradient(0,0,0,H);
      grad.addColorStop(0,"rgba(14,126,168,0.10)");
      grad.addColorStop(0.55,"rgba(14,126,168,0.24)");
      grad.addColorStop(1,"rgba(10,90,122,0.42)");
      ctx.fillStyle=grad;
      ctx.fillRect(gx0,-30,gx1-gx0,H+60);
      ctx.globalAlpha=0.28;ctx.strokeStyle="#aef2ff";ctx.lineWidth=3;
      for(let i=0;i<4;i++){
        const yy=H*0.28+i*H*0.16;
        ctx.beginPath();
        for(let sx=gx0;sx<=gx1;sx+=26){
          const wy=yy+Math.sin(this.anim*0.05+sx*0.02+i*1.3)*9;
          if(sx===gx0)ctx.moveTo(sx,wy);else ctx.lineTo(sx,wy);
        }
        ctx.stroke();
      }
      ctx.restore();
      _text(rx,ry-240,"🌊 OCEAN'S JUDGMENT 🌊","#aef2ff","14px Arial bold");
    }
  }

  // ================================================================
  //  더 볼티지 (Boss 7 — FINAL BOSS) — a Lightning entity, the fastest
  //  and most mobile of the 7 elemental bosses. 6 skills + a channeled
  //  special (Overcharge, own cooldown outside the weighted pool) + an
  //  arena-wide ultimate (Thunderstorm). Fights through unpredictable
  //  repositioning, chains, fields and arena-wide lightning — never a
  //  straightforward brawler. Phase 2 triggers at 50% HP (per spec,
  //  matching The Tidal).
  // ================================================================
  _updateBossVoltage(player,floorY,w){
    this._floorY=floorY;
    this.bodyJitter=Math.sin(this.anim*0.11)*2+Math.sin(this.anim*0.23)*1.4;
    this.arcPulse=(this.arcPulse+0.06)%(Math.PI*2);
    this.voltAura.forEach(va=>va.ang+=va.spd);
    this.bodyBlocks.forEach(bb=>bb.drift+=0.03);

    // ======= PHASE 2 CHECK (50% HP, per spec) =======
    if(this.phase===1 && this.hp<=this.maxHp*0.5 && !this.phase2Entered){
      this.phase=2;this.phase2Entered=true;this.phase2SpeedMult=1.15;this.phase2DmgMult=1.15;
      screenShake=Math.max(screenShake,30);
      this.skillTimer.s8=Math.min(this.skillTimer.s8,260);
    }
    const isP2=this.phase===2;

    // ======= SPECIAL: OVERCHARGE — own cooldown, outside the weighted pool (mirrors The Tempest's Sky Fall) =======
    if(this.overchargeCd>0)this.overchargeCd--;
    if(!this.overchargeActive && this.overchargeCd<=0 && !this.lightningDashActive && !this.thunderstormCharging){
      this._bossVoltageStartOvercharge();
    }

    const busy=this.lightningDashActive||this.overchargeActive||this.thunderstormCharging;

    if(!busy){
      // ======= GROUND MOVEMENT — the fastest boss: never idles long, closes/opens distance quickly =======
      const dx=player.x-this.x,distP=Math.abs(dx),spd=(isP2?3.1:2.5)*this.phase2SpeedMult,idealDist=190;
      if(distP>idealDist+60)this.x+=spd*(dx>0?1:-1);
      else if(distP<idealDist-70)this.x-=spd*0.6*(dx>0?1:-1);
      else this.x+=Math.sin(this.anim*0.05)*0.6; // "Boss không đứng yên quá lâu" — small restless shimmer-step
      this.x=clamp(this.x,80,w-80);
      this.direction=dx>=0?1:-1;

      // ======= WEIGHTED AI SKILL DECISION (same recipe as the other bosses) =======
      const canUseS1=this.skillTimer.s1<=0 && this.lastSkillUsed!=="s1";
      const canUseS2=this.skillTimer.s2<=0 && this.lastSkillUsed!=="s2";
      const canUseS3=this.skillTimer.s3<=0 && this.lastSkillUsed!=="s3";
      const canUseS4=this.skillTimer.s4<=0 && this.lastSkillUsed!=="s4";
      const canUseS5=this.skillTimer.s5<=0 && this.lastSkillUsed!=="s5";
      const canUseS6=this.skillTimer.s6<=0 && this.lastSkillUsed!=="s6";
      const canUseS8=this.skillTimer.s8<=0 && isP2 && this.lastSkillUsed!=="s8";

      let weights={s1:20,s2:18,s3:16,s4:12,s5:14,s6:12,s8:10};
      if(distP>340)weights.s3=30; // far away -> Lightning Dash to close the gap instantly
      if(distP<130)weights.s2+=10; // too close -> Thunder Strike to punish standing still
      if(isP2){weights.s8=22;weights.s1+=4;weights.s6+=4;}

      let totalWeight=0;
      if(canUseS1)totalWeight+=weights.s1;
      if(canUseS2)totalWeight+=weights.s2;
      if(canUseS3)totalWeight+=weights.s3;
      if(canUseS4)totalWeight+=weights.s4;
      if(canUseS5)totalWeight+=weights.s5;
      if(canUseS6)totalWeight+=weights.s6;
      if(canUseS8)totalWeight+=weights.s8;

      let selectedSkill=null;
      if(totalWeight>0){
        let decision=rng()*totalWeight,acc=0;
        if(canUseS1){acc+=weights.s1;if(decision<acc)selectedSkill="s1";}
        if(!selectedSkill&&canUseS2){acc+=weights.s2;if(decision<acc)selectedSkill="s2";}
        if(!selectedSkill&&canUseS3){acc+=weights.s3;if(decision<acc)selectedSkill="s3";}
        if(!selectedSkill&&canUseS4){acc+=weights.s4;if(decision<acc)selectedSkill="s4";}
        if(!selectedSkill&&canUseS5){acc+=weights.s5;if(decision<acc)selectedSkill="s5";}
        if(!selectedSkill&&canUseS6){acc+=weights.s6;if(decision<acc)selectedSkill="s6";}
        if(!selectedSkill&&canUseS8){acc+=weights.s8;if(decision<acc)selectedSkill="s8";}
      }

      if(selectedSkill==="s1")this._bossVoltageSkillChainLightning(player,w);
      else if(selectedSkill==="s2")this._bossVoltageSkillThunderStrike(player,w);
      else if(selectedSkill==="s3")this._bossVoltageSkillLightningDash(player,w);
      else if(selectedSkill==="s4")this._bossVoltageSkillElectricField(player,w);
      else if(selectedSkill==="s5")this._bossVoltageSkillVoltageOrbs(player,w);
      else if(selectedSkill==="s6")this._bossVoltageSkillThunderPillars(player,w);
      else if(selectedSkill==="s8")this._bossVoltageSkillThunderstorm(player,w);
    }

    // ======= ACTIVE SKILL UPDATES =======
    this._updateChainLightning(player,w);
    this._updateThunderStrikes(player,w);
    this._updateLightningDash(player,floorY,w);
    this._updateElectricFields(player,w);
    this._updateVoltageOrbs(player,w);
    this._updateThunderPillars(player,w);
    this._updateOvercharge(player,w);
    this._updateThunderstorm(player,w);
  }

  // ===== SKILL 1: CHAIN LIGHTNING — a bolt hits the player, then arcs onward once (bounded) =====
  _bossVoltageSkillChainLightning(player,w){
    this.skillTimer.s1=this.skillCd.s1;this.lastSkillUsed="s1";
    const dir=player.x>=this.x?1:-1;
    this.chainBolts.push({x:this.x+dir*20,y:this.y-95,tx:player.x,ty:player.y-90,life:0,maxLife:26,dmg:(this.phase===2?12:9)*this.phase2DmgMult,hit:false,warnT:16});
    sfxLightningZap?.();
  }
  _updateChainLightning(player,w){
    _compact(this.chainBolts,b=>{
      if(b.warnT>0){b.warnT--;return true;}
      b.life++;
      if(!b.hit && Math.abs(player.x-b.tx)<50 && Math.abs(player.y-b.ty)<70 && player.hp>0){
        b.hit=true;applyDamage(player,b.dmg,this);
        // "Sau khi trúng mục tiêu, tia điện có thể truyền sang các điểm gần đó" — one bounded chain-tail arc, never infinite
        const dir2=b.tx>=b.x?1:-1;
        this.chainBolts.push({x:b.tx,y:b.ty,tx:b.tx+dir2*140,ty:b.ty,life:0,maxLife:16,dmg:b.dmg*0.6,hit:true,warnT:6,isChainTail:true});
      }
      return b.life<b.maxLife;
    });
  }

  // ===== SKILL 2: THUNDER STRIKE — telegraphed strike zone(s) under the player, then lightning slams down =====
  _bossVoltageSkillThunderStrike(player,w){
    this.skillTimer.s2=this.skillCd.s2;this.lastSkillUsed="s2";
    const count=this.phase===2?3:2;
    for(let i=0;i<count;i++){
      this.thunderWarnings.push({x:clamp(player.x+rndInt(-70,70),80,w-80),timer:34+i*10});
    }
  }
  _updateThunderStrikes(player,w){
    _compact(this.thunderWarnings,tw=>{
      tw.timer--;
      if(tw.timer<=0){
        this.thunderStrikes.push({x:tw.x,life:22,hitTimer:0});
        sfxThunderBoom?.();screenShake=Math.max(screenShake,7);
        return false;
      }
      return true;
    });
    _compact(this.thunderStrikes,ts=>{
      ts.life--;
      if(ts.hitTimer>0)ts.hitTimer--;
      if(ts.life>10&&ts.hitTimer<=0&&Math.abs(player.x-ts.x)<34&&player.hp>0){
        applyDamage(player,(this.phase===2?13:10)*this.phase2DmgMult,this);ts.hitTimer=20;
      }
      return ts.life>0;
    });
  }

  // ===== SKILL 3: LIGHTNING DASH — boss becomes a bolt, streaks across the arena, reappears at the far side =====
  _bossVoltageSkillLightningDash(player,w){
    this.skillTimer.s3=this.skillCd.s3;this.lastSkillUsed="s3";
    this.lightningDashActive=true;this.lightningDashTimer=26;this.lightningDashDir=player.x>=this.x?1:-1;
    sfxLightningZap?.();
  }
  _updateLightningDash(player,floorY,w){
    if(!this.lightningDashActive){this._updateLightningDashTrail(player,w);return;}
    this.lightningDashTimer--;
    this.lightningDashTrail.push({x:this.x,y:this.y,life:22});
    this.x+=this.lightningDashDir*(this.phase===2?13:10.5);
    this.x=clamp(this.x,60,w-60);
    this.direction=this.lightningDashDir;
    // "Không gây damage vô lý" — a light contact tick only, mirrors The Tempest's Wind Dash rule
    if(Math.abs(player.x-this.x)<34&&player.hp>0&&this.anim%8===0){
      applyDamage(player,(this.phase===2?6:4)*this.phase2DmgMult,this);
    }
    if(this.lightningDashTimer<=0){
      this.lightningDashActive=false;
      screenShake=Math.max(screenShake,6);
    }
    this._updateLightningDashTrail(player,w);
  }
  _updateLightningDashTrail(player,w){
    _compact(this.lightningDashTrail,t=>{
      t.life--;
      if(t.life>10&&Math.abs(player.x-t.x)<20&&player.hp>0&&this.anim%16===0){
        applyDamage(player,(this.phase===2?3:2)*this.phase2DmgMult,this);
      }
      return t.life>0;
    });
  }

  // ===== SKILL 4: ELECTRIC FIELD — a drifting electrified ground zone, ticks damage the longer the player lingers =====
  _bossVoltageSkillElectricField(player,w){
    this.skillTimer.s4=this.skillCd.s4;this.lastSkillUsed="s4";
    this.electricFields.push({x:clamp(player.x+rndInt(-30,30),120,w-120),r:70,life:260,tick:0,driftDir:rndChoice([-1,1])});
  }
  _updateElectricFields(player,w){
    _compact(this.electricFields,ef=>{
      ef.life--;ef.tick++;
      ef.x=clamp(ef.x+ef.driftDir*0.5,100,w-100);
      if(ef.tick%90===0)ef.driftDir*=-1;
      if(Math.abs(player.x-ef.x)<ef.r&&player.hp>0&&ef.tick%26===0){
        applyDamage(player,(this.phase===2?7:5)*this.phase2DmgMult,this);
      }
      return ef.life>0;
    });
  }

  // ===== SKILL 5: VOLTAGE ORBS — geometric energy orbs orbit the boss, then lock on and launch (capped count) =====
  _bossVoltageSkillVoltageOrbs(player,w){
    this.skillTimer.s5=this.skillCd.s5;this.lastSkillUsed="s5";
    const count=this.phase===2?4:3; // "Không tạo quá nhiều quả cầu cùng lúc"
    for(let i=0;i<count;i++){
      this.voltageOrbs.push({x:this.x,y:this.y-120,orbitAng:(i/count)*Math.PI*2,orbitT:34,vx:0,vy:0,locked:false,life:160,dmg:(this.phase===2?9:7)*this.phase2DmgMult});
    }
    sfxLightningZap?.();
  }
  _updateVoltageOrbs(player,w){
    _compact(this.voltageOrbs,o=>{
      o.life--;
      if(o.orbitT>0){
        o.orbitT--;o.orbitAng+=0.18;
        o.x=this.x+Math.cos(o.orbitAng)*46;o.y=this.y-120+Math.sin(o.orbitAng)*26;
        if(o.orbitT<=0&&!o.locked){
          o.locked=true;
          const dx=player.x-o.x,dy=(player.y-90)-o.y,d=Math.max(1,Math.hypot(dx,dy)),spd=5.4;
          o.vx=dx/d*spd;o.vy=dy/d*spd;
        }
        return true;
      }
      o.x+=o.vx;o.y+=o.vy;
      if(Math.abs(player.x-o.x)<26&&Math.abs((player.y-90)-o.y)<40&&player.hp>0){
        applyDamage(player,o.dmg,this);return false;
      }
      return o.life>0 && o.x>-200 && o.x<w+200;
    });
  }

  // ===== SKILL 6: THUNDER PILLARS — a telegraphed sequence of lightning columns, 1->2->3->4 =====
  _bossVoltageSkillThunderPillars(player,w){
    this.skillTimer.s6=this.skillCd.s6;this.lastSkillUsed="s6";
    const dir=player.x>=this.x?1:-1,startX=clamp(player.x-dir*40,120,w-120);
    const count=this.phase===2?5:4;
    for(let i=0;i<count;i++){
      this.thunderPillarWarnings.push({x:clamp(startX+dir*i*95,90,w-90),timer:24+i*20});
    }
  }
  _updateThunderPillars(player,w){
    _compact(this.thunderPillarWarnings,pw=>{
      pw.timer--;
      if(pw.timer<=0){
        this.thunderPillars.push({x:pw.x,life:24,hitTimer:0});
        sfxThunderBoom?.();screenShake=Math.max(screenShake,5);
        return false;
      }
      return true;
    });
    _compact(this.thunderPillars,tp=>{
      tp.life--;
      if(tp.hitTimer>0)tp.hitTimer--;
      if(tp.life>10&&tp.hitTimer<=0&&Math.abs(player.x-tp.x)<32&&player.hp>0){
        applyDamage(player,(this.phase===2?10:8)*this.phase2DmgMult,this);tp.hitTimer=20;
      }
      return tp.life>0;
    });
  }

  // ===== SPECIAL: OVERCHARGE — boss stops, body blocks tear apart briefly, then a wide electric pulse (own cooldown, outside the weighted pool) =====
  _bossVoltageStartOvercharge(){
    this.overchargeActive=true;this.overchargePhase="charging";this.overchargeTimer=70;this.overchargeCd=560;
    sfxElectricCharge?.();
  }
  _updateOvercharge(player,w){
    if(!this.overchargeActive)return;
    this.overchargeTimer--;
    if(this.overchargePhase==="charging" && this.overchargeTimer<=0){
      this.overchargePhase="release";this.overchargeTimer=16;
      screenShake=Math.max(screenShake,22);sfxThunderBoom?.();
      const radius=200,dmg=(this.phase===2?18:14)*this.phase2DmgMult;
      if(Math.abs(player.x-this.x)<radius&&player.hp>0){
        applyDamage(player,dmg,this);
        const push=player.x>=this.x?1:-1;player.x=clamp(player.x+push*140,40,w-40);
      }
    }else if(this.overchargePhase==="release" && this.overchargeTimer<=0){
      this.overchargeActive=false;this.overchargePhase="";
    }
  }

  // ===== ULTIMATE: THUNDERSTORM — arena darkens, storm strikes sweep the ground, then converge on the boss for one huge shockwave =====
  _bossVoltageSkillThunderstorm(player,w){
    this.skillTimer.s8=this.skillCd.s8;this.lastSkillUsed="s8";
    this.thunderstormCharging=true;this.thunderstormPhase="gather";this.thunderstormTimer=90;this.thunderstormTick=0;
    this.x=clamp((this.x+player.x)/2,w*0.35,w*0.65);
    sfxVoltageRoar?.();sfxElectricCharge?.();
  }
  _updateThunderstorm(player,w){
    if(!this.thunderstormCharging)return;
    this.thunderstormTimer--;this.thunderstormTick++;
    if(this.thunderstormPhase==="gather"){
      // "Bầu trời bắt đầu xuất hiện các tia sét. Các vùng cảnh báo xuất hiện trên mặt đất."
      if(this.thunderstormTick%14===0)this.thunderWarnings.push({x:clamp(rndInt(80,w-80),80,w-80),timer:26});
      if(this.thunderstormTimer<=0){this.thunderstormPhase="storm";this.thunderstormTimer=170;this.thunderstormTick=0;}
    }else if(this.thunderstormPhase==="storm"){
      // "Sét bắt đầu đánh xuống liên tục. Boss biến mất. Các tia điện xuất hiện ở nhiều vị trí."
      if(this.thunderstormTick%16===0)this.thunderWarnings.push({x:clamp(rndInt(80,w-80),80,w-80),timer:22});
      if(this.thunderstormTimer<=0){this.thunderstormPhase="converge";this.thunderstormTimer=50;this.thunderstormTick=0;this.x=clamp(player.x,w*0.3,w*0.7);}
    }else if(this.thunderstormPhase==="converge"){
      // "Tất cả các tia điện bắt đầu hội tụ về một điểm. The Voltage xuất hiện trở lại ở trung tâm."
      if(this.thunderstormTimer<=0){
        this.thunderstormPhase="detonate";this.thunderstormTimer=1;
        screenShake=Math.max(screenShake,44);sfxThunderstormBurst?.();
        const radius=480,dmg=(this.phase===2?34:28)*this.phase2DmgMult;
        if(Math.abs(player.x-this.x)<radius&&player.hp>0){
          applyDamage(player,dmg,this);
          const push=player.x>=this.x?1:-1;player.x=clamp(player.x+push*210,40,w-40);
        }
      }
    }else if(this.thunderstormPhase==="detonate"){
      if(this.thunderstormTimer<=0){this.thunderstormCharging=false;this.thunderstormPhase="";}
    }
  }

  // ================================================================
  //  더 볼티지 (Boss 7 — FINAL BOSS) — drawing. Built entirely from
  //  yellow/white/electric-blue geometric blocks: stacked torso plates,
  //  cube shoulders, segmented limbs, a cube head linked to the neck by
  //  a visible arc, and several detached floating blocks tethered to
  //  the body only by lightning — deliberately NOT a sealed humanoid
  //  silhouette. "Không phải một sinh vật chứa điện — một sinh vật được
  //  tạo thành từ điện."
  // ================================================================
  _drawBossVoltage(){
    const rx=this.x,ry=this.y,isP2=this.phase===2;
    if(this.dead){
      for(let i=0;i<10;i++){const ex=rx+rndInt(-80,80),ey=ry+rndInt(-90,10);_oval(ex-9,ey-9,18,18,rndChoice(["#fff45c","#66e0ff","#ffffff"]),null);}
      _text(rx,ry-80,"💀 DEFEATED 💀","#fff45c","16px Arial bold");
      return;
    }
    const sz=isP2?1.1:1.0,dir=this.direction,jit=this.bodyJitter;

    this._drawBossVoltageSkillEffects();

    // ---- orbiting geometric energy sparks/cubes ----
    this.voltAura.forEach(va=>{
      const ox=rx+Math.cos(va.ang)*va.rad,oy=ry-95+Math.sin(va.ang)*va.rad*0.4+Math.sin(this.anim*0.08+va.bob)*3;
      ctx.save();ctx.globalAlpha=0.6;ctx.fillStyle=isP2?"#ffffff":"#fff45c";
      if(va.type==="cube"){ctx.translate(ox,oy);ctx.rotate(this.anim*0.05+va.bob);ctx.fillRect(-va.size,-va.size,va.size*2,va.size*2);}
      else{ctx.strokeStyle="#66e0ff";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(ox-va.size,oy);ctx.lineTo(ox+va.size,oy);ctx.moveTo(ox,oy-va.size);ctx.lineTo(ox,oy+va.size);ctx.stroke();}
      ctx.restore();
    });

    // ---- detached floating geometric blocks, linked to the body only by electric arcs ----
    this.bodyBlocks.forEach(bb=>{
      const bx=rx+bb.ox*sz+Math.sin(bb.drift)*6,by=ry+bb.oy+Math.cos(bb.drift*0.8)*5;
      ctx.save();ctx.strokeStyle=`rgba(255,244,92,${0.5+0.3*Math.sin(this.anim*0.15+bb.drift)})`;ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(rx+bb.ox*0.3,ry-100);
      const midx=(rx+bb.ox*0.3+bx)/2+rndInt(-6,6),midy=(ry-100+by)/2+rndInt(-6,6);
      ctx.lineTo(midx,midy);ctx.lineTo(bx,by);ctx.stroke();
      ctx.restore();
      ctx.save();ctx.translate(bx,by);ctx.rotate(bb.drift);
      ctx.fillStyle=isP2?"#ffffff":"#ffe066";ctx.strokeStyle="#66e0ff";ctx.lineWidth=1.5;
      ctx.fillRect(-bb.size,-bb.size,bb.size*2,bb.size*2);ctx.strokeRect(-bb.size,-bb.size,bb.size*2,bb.size*2);
      ctx.restore();
    });

    // ---- legs: two rectangular geometric blocks (slightly restless — never fully still) ----
    _rect(rx-22*sz+jit*0.3,ry-34,16*sz,34,isP2?"#b8860b":"#8a6d1a","#fff45c",2);
    _rect(rx+6*sz-jit*0.3,ry-34,16*sz,34,isP2?"#b8860b":"#8a6d1a","#fff45c",2);

    // ---- torso: tiered geometric plates, alternating shades ----
    const plateCols=isP2?["#c99a1e","#e0b52a","#fff45c"]:["#8a6d1a","#c99a1e","#e0b52a"];
    const plates=[[-26,-64,52,30],[-21,-90,42,26],[-16,-114,32,24]];
    plates.forEach(([px,py,pw,ph],i)=>{
      ctx.save();ctx.translate(jit*(i*0.5),0);
      _rect(rx+px*sz,ry+py,pw*sz,ph,plateCols[i],"#fff45c",2);
      ctx.restore();
    });

    // ---- shoulders: cube blocks ----
    _rect(rx-46*sz,ry-112,18*sz,18,isP2?"#fff45c":"#e0b52a","#ffffff",2);
    _rect(rx+28*sz,ry-112,18*sz,18,isP2?"#fff45c":"#e0b52a","#ffffff",2);

    // ---- arms: segmented geometric limbs, twitching with current ----
    const armSwing=Math.sin(this.anim*0.14)*0.1;
    ctx.save();ctx.translate(rx-40*sz,ry-104);ctx.rotate(-0.3+armSwing);
    ctx.fillStyle=isP2?"#fff45c":"#e0b52a";ctx.strokeStyle="#66e0ff";ctx.lineWidth=2;
    ctx.fillRect(-7,0,14,30);ctx.strokeRect(-7,0,14,30);
    ctx.restore();
    ctx.save();ctx.translate(rx+40*sz,ry-104);ctx.rotate(0.3-armSwing);
    ctx.fillStyle=isP2?"#fff45c":"#e0b52a";ctx.strokeStyle="#66e0ff";ctx.lineWidth=2;
    ctx.fillRect(-7,0,14,30);ctx.strokeRect(-7,0,14,30);
    ctx.restore();

    // ---- head: geometric cube, floating slightly apart from the neck, linked by an arc ----
    const hx=rx+4*dir+jit,hy=ry-142*sz+Math.sin(this.anim*0.1)*2;
    ctx.save();ctx.strokeStyle="rgba(102,224,255,0.7)";ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(rx,ry-124);ctx.lineTo(hx,hy+14);ctx.stroke();
    ctx.restore();
    _rect(hx-14*sz,hy-14,28*sz,28,isP2?"#fff45c":"#e0b52a","#ffffff",2);

    // ---- eyes: glowing electric slits ----
    const eyePulse=0.7+Math.sin(this.anim*0.16)*0.3;
    ctx.save();ctx.shadowColor="#66e0ff";ctx.shadowBlur=16*eyePulse;ctx.fillStyle=isP2?"#ffffff":"#eafcff";
    ctx.fillRect(hx-9*sz,hy-2,7*sz,3*eyePulse);ctx.fillRect(hx+2*sz,hy-2,7*sz,3*eyePulse);
    ctx.restore();

    // ---- constant electric arcs running across the body ----
    ctx.save();ctx.globalAlpha=0.6+0.3*Math.sin(this.anim*0.2);ctx.strokeStyle="#66e0ff";ctx.lineWidth=1.5;
    for(let i=0;i<3;i++){
      const ay=ry-40-i*30,ax1=rx-18+rndInt(-4,4),ax2=rx+18+rndInt(-4,4);
      ctx.beginPath();ctx.moveTo(ax1,ay);ctx.lineTo(rx+rndInt(-6,6),ay-14);ctx.lineTo(ax2,ay-4);ctx.stroke();
    }
    ctx.restore();

    if(!this._introHideHp){
      const hpLabel=isP2?"⚡ 더 볼티지 - PHASE 2":"⚡ 더 볼티지";
      this._drawHpBar(rx,ry-40,hpLabel,isP2?"#ffffff":"#fff45c",true);
    }
  }
  _drawBossVoltageSkillEffects(){
    const rx=this.x,ry=this.y,baseY=this._floorY||this.y;

    // Chain Lightning — a brief telegraph line, then a jagged geometric bolt to the target
    this.chainBolts.forEach(b=>{
      ctx.save();
      if(b.warnT>0){
        ctx.globalAlpha=0.4;ctx.strokeStyle="red";ctx.lineWidth=1.5;ctx.setLineDash([5,4]);
        ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.tx,b.ty);ctx.stroke();ctx.setLineDash([]);
      }else{
        ctx.globalAlpha=Math.max(0,1-b.life/b.maxLife);ctx.strokeStyle=b.isChainTail?"#aef2ff":"#fff45c";ctx.lineWidth=b.isChainTail?2:3;
        ctx.shadowColor="#66e0ff";ctx.shadowBlur=10;
        ctx.beginPath();ctx.moveTo(b.x,b.y);
        const segs=6;
        for(let i=1;i<=segs;i++){
          const t=i/segs,mx=b.x+(b.tx-b.x)*t+rndInt(-8,8),my=b.y+(b.ty-b.y)*t+rndInt(-8,8);
          ctx.lineTo(mx,my);
        }
        ctx.stroke();
      }
      ctx.restore();
    });

    // Thunder Strike — warning ring, then a vertical geometric lightning bolt slamming down
    this.thunderWarnings.forEach(tw=>{
      ctx.save();ctx.globalAlpha=0.5+Math.sin(tw.timer*0.6)*0.3;
      ctx.strokeStyle="red";ctx.lineWidth=2;ctx.setLineDash([4,3]);
      ctx.beginPath();ctx.ellipse(tw.x,baseY,24,9,0,0,Math.PI*2);ctx.stroke();
      ctx.setLineDash([]);ctx.restore();
    });
    this.thunderStrikes.forEach(ts=>{
      const a=Math.max(0,ts.life/22);
      ctx.save();ctx.globalAlpha=a;ctx.strokeStyle="#fff45c";ctx.lineWidth=5;ctx.shadowColor="#66e0ff";ctx.shadowBlur=14;
      let px=ts.x+rndInt(-6,6),py=baseY-260;ctx.beginPath();ctx.moveTo(px,py);
      for(let i=1;i<=5;i++){py=baseY-260+(260*i/5);px=ts.x+rndInt(-14,14);ctx.lineTo(px,py);}
      ctx.lineTo(ts.x,baseY);ctx.stroke();
      ctx.globalAlpha=a*0.5;ctx.fillStyle="#fff45c";ctx.beginPath();ctx.ellipse(ts.x,baseY,26*a+8,10,0,0,Math.PI*2);ctx.fill();
      ctx.restore();
    });

    // Lightning Dash trail — a bright streak of electricity
    this.lightningDashTrail.forEach(t=>{
      ctx.save();ctx.globalAlpha=Math.max(0,t.life/22)*0.7;ctx.strokeStyle="#66e0ff";ctx.lineWidth=7;
      ctx.beginPath();ctx.moveTo(t.x,t.y-10);ctx.lineTo(t.x,t.y-130);ctx.stroke();
      ctx.restore();
    });
    if(this.lightningDashActive)_text(rx,ry-210,"⚡ LIGHTNING DASH ⚡","#fff45c","11px Arial bold");

    // Electric Field — geometric arcs crawling across a ground zone
    this.electricFields.forEach(ef=>{
      ctx.save();ctx.globalAlpha=0.3;ctx.fillStyle="#fff45c";
      ctx.beginPath();ctx.ellipse(ef.x,baseY,ef.r,ef.r*0.32,0,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=0.7;ctx.strokeStyle="#66e0ff";ctx.lineWidth=1.5;
      for(let i=0;i<5;i++){
        const ang=this.anim*0.1+i*1.3,ex1=ef.x+Math.cos(ang)*ef.r*0.7,ey1=baseY+Math.sin(ang)*ef.r*0.22;
        ctx.beginPath();ctx.moveTo(ef.x,baseY);ctx.lineTo((ef.x+ex1)/2+rndInt(-4,4),baseY-8);ctx.lineTo(ex1,ey1);ctx.stroke();
      }
      ctx.restore();
    });

    // Voltage Orbs — small glowing geometric energy diamonds
    this.voltageOrbs.forEach(o=>{
      ctx.save();ctx.shadowColor="#66e0ff";ctx.shadowBlur=10;ctx.fillStyle=o.locked?"#fff45c":"#ffe066";
      ctx.translate(o.x,o.y);ctx.rotate(this.anim*0.1);
      ctx.beginPath();ctx.moveTo(0,-7);ctx.lineTo(7,0);ctx.lineTo(0,7);ctx.lineTo(-7,0);ctx.closePath();ctx.fill();
      ctx.restore();
    });

    // Thunder Pillars — warnings + vertical geometric energy columns, in sequence
    this.thunderPillarWarnings.forEach(pw=>{
      ctx.save();ctx.globalAlpha=0.5+Math.sin(pw.timer*0.5)*0.3;
      ctx.strokeStyle="red";ctx.lineWidth=2;ctx.setLineDash([4,3]);
      ctx.beginPath();ctx.ellipse(pw.x,baseY,22,8,0,0,Math.PI*2);ctx.stroke();
      ctx.setLineDash([]);ctx.restore();
    });
    this.thunderPillars.forEach(tp=>{
      const a=Math.max(0,tp.life/24);
      ctx.save();ctx.globalAlpha=a*0.85;ctx.fillStyle="#fff45c";ctx.strokeStyle="#66e0ff";ctx.lineWidth=2;
      ctx.fillRect(tp.x-9,baseY-150*a,18,150*a);ctx.strokeRect(tp.x-9,baseY-150*a,18,150*a);
      ctx.restore();
    });

    // Overcharge — the body crackles brighter while channeling, then a wide ring pulse on release
    if(this.overchargeActive){
      if(this.overchargePhase==="charging"){
        const p=1-Math.max(0,this.overchargeTimer/70);
        ctx.save();ctx.globalAlpha=0.3+0.5*p;ctx.strokeStyle="#66e0ff";ctx.lineWidth=2+3*p;
        ctx.beginPath();ctx.ellipse(rx,ry-90,40+30*p,60+30*p,0,0,Math.PI*2);ctx.stroke();
        ctx.restore();
        _text(rx,ry-220,"⚡ OVERCHARGE ⚡","#fff45c","12px Arial bold");
      }else{
        const p=Math.max(0,this.overchargeTimer/16);
        ctx.save();ctx.globalAlpha=p*0.6;ctx.strokeStyle="#fff45c";ctx.lineWidth=6;
        ctx.beginPath();ctx.ellipse(rx,baseY,220*(1-p)+40,80*(1-p)+20,0,0,Math.PI*2);ctx.stroke();
        ctx.restore();
      }
    }

    // Thunderstorm — a live-viewport darkened storm tint (mirrors Ocean's Judgment) + intermittent sky-flashes
    if(this.thunderstormCharging){
      ctx.save();
      const gx0=campX-30,gx1=campX+W+30;
      ctx.globalAlpha=this.thunderstormPhase==="gather"?0.16:this.thunderstormPhase==="storm"?0.30:0.42;
      ctx.fillStyle="#0a0a1a";ctx.fillRect(gx0,-30,gx1-gx0,H+60);
      if(this.thunderstormPhase==="storm"&&this.thunderstormTick%10<2){ctx.globalAlpha=0.12;ctx.fillStyle="#eafcff";ctx.fillRect(gx0,-30,gx1-gx0,H+60);}
      ctx.restore();
      _text(rx,ry-240,"⚡ THUNDERSTORM ⚡","#fff45c","14px Arial bold");
    }
  }
}

<script>

class RoadWall{
  constructor(x,hp,y){

  }

    _rect(rx-this.width/2,floorY-190,this.width,190,"#4a3524","#7a5a3a",3);

    for(let i=0;i<4;i++){
      const ly=floorY-30-i*40;
      ctx.strokeStyle=`rgba(255,${180-i*20},60,${0.5+0.3*Math.sin(this.anim*0.05+i)})`;
      ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(rx-this.width/2+6,ly);ctx.lineTo(rx+this.width/2-6,ly);ctx.stroke();
    }
    ctx.strokeStyle="black";ctx.lineWidth=2;
    if(crackFrac>0.2){ctx.beginPath();ctx.moveTo(rx-10,floorY-40);ctx.lineTo(rx+5,floorY-90);ctx.lineTo(rx-8,floorY-140);ctx.stroke();}
    if(crackFrac>0.5){ctx.beginPath();ctx.moveTo(rx+15,floorY-20);ctx.lineTo(rx-5,floorY-110);ctx.stroke();}
    if(crackFrac>0.75){for(let i=0;i<8;i++){const px2=rx+rndInt(-30,30),py2=floorY-rndInt(10,180);_oval(px2-3,py2-3,6,6,"#2a1a10",null);}}
    const bw=94;
    _rect(rx-bw/2,floorY-210,bw,8,"#222",null,0);_rect(rx-bw/2,floorY-210,Math.max(0,bw*(this.hp/this.maxHp)),8,"#e8a33d",null,0);
    _text(rx,floorY-222,`🚧 CỔNG CHẮN: ${Math.floor(this.hp)}/${this.maxHp}`,"gold","9px Arial bold");

}

class RoadTrap{

    if(this.hitCooldown>0){this.hitCooldown--;return;}
    if(player.hp>0&&Math.abs(player.x-this.x)<30&&player.y>=floorY-6){
      applyDamage(player,this.type==="fire"?6:8,null);
      player.slowTimer=Math.max(player.slowTimer,20);

  ctx.strokeStyle="#cfcdc8";ctx.lineWidth=4;

class RoadEnemy{
  constructor(x,y,tier,elite=false,caster=false,rabbit=false){
    this.x=x;this.y=y;this.vy=0;this.onGround=false;
    tier=Math.min(12,Math.max(0,tier)); // cap so far-away enemies stay tough but not absurd
    const hpBase=22+tier*6,dmgBase=1+tier*0.22;
    this.hp=this.maxHp=elite?hpBase*2.0:hpBase;
    this.dmg=elite?dmgBase*1.35:dmgBase;
    this.spd=(elite?1.8:2.3)+Math.min(tier,10)*0.04;
    this.elite=elite;this.caster=caster;this.tier=tier;this.rabbit=rabbit;
    this.direction=1;this.attackTimer=rndInt(20,60);this.anim=0;
    this.slowTimer=0;this._slowPct=0.5;this.stunTimer=0;
    this.castTimer=rndInt(60,140);
    this.hopTimer=rndInt(0,20);
  }
  applyGravity(floorY){this.vy+=GRAVITY;this.y+=this.vy;if(this.y>=floorY){this.y=floorY;this.vy=0;this.onGround=true;}else this.onGround=false;}
  update(player,floorY,castArr){
    this.anim++;this.applyGravity(floorY);
    if(this.slowTimer>0)this.slowTimer--;
    if(this.stunTimer>0){this.stunTimer--;return;}
    const dx=player.x-this.x;this.direction=dx>0?1:-1;
    let spd=this.spd*(this.slowTimer>0?(1-this._slowPct):1);
    if(this.rabbit){
      // Hop in bursts instead of gliding: leap forward, land, pause briefly, repeat.
      if(this.hopTimer>0)this.hopTimer--;
      if(this.onGround&&this.hopTimer<=0&&Math.abs(dx)>55){
        this.vy=-6.5;this.hopTimer=26;this.x+=spd*this.direction*13;
      }
    }else if(Math.abs(dx)>55)this.x+=spd*this.direction;
    this.attackTimer--;
    if(this.attackTimer<=0&&Math.abs(dx)<70*(player.sizeMult||1)&&Math.abs(player.y-this.y)<75&&player.hp>0){applyDamage(player,player.isShielding?this.dmg*0.2:this.dmg,null);this.attackTimer=75;}
    if(this.caster){
      this.castTimer--;
      if(this.castTimer<=0&&Math.abs(dx)<650&&player.hp>0){
        this.castTimer=150;
        castArr.push({x:this.x,y:this.y-30,vx:7*this.direction,vy:0,owner:null,target:player,damage:this.dmg*2,slow:0,slow_pct:0,color:"#cc8844",type:"road_bolt"});
      }
    }
  }
  draw(){
    if(this.reaperForm){this._drawReaperForm();return;}
    if(this.rabbit){this._drawRabbit();return;}
    const col=this.elite?"#772222":"#5a3d1a",rx=this.x,ry=this.y;
    ctx.save();
    if(this.elite){ctx.shadowColor="red";ctx.shadowBlur=8;}
    _rect(rx-18,ry-38,36,38,col,this.elite?"orange":"#333",2);
    _rect(rx-13,ry-60,26,26,col,this.elite?"orange":"#333",2);
    ctx.restore();
    _oval(rx+6*this.direction-4,ry-52,8,8,this.caster?"violet":"red",null);
    if(this.elite){for(let i=0;i<2;i++){const hx=rx-6+i*12;ctx.fillStyle="#222";ctx.beginPath();ctx.moveTo(hx-4,ry-60);ctx.lineTo(hx,ry-72);ctx.lineTo(hx+4,ry-60);ctx.closePath();ctx.fill();}}
    if(this.slowTimer>0)_text(rx,ry-90,"❄️","deepskyblue","10px Arial");
    const bw=36*(this.hp/this.maxHp);
    _rect(rx-18,ry-78,36,5,"#333",null,0);_rect(rx-18,ry-78,Math.max(0,bw),5,this.elite?"#ff4444":"#ffaa33",null,0);
  }
  _drawReaperForm(){
    const rx=this.x,ry=this.y;
    _drawReaperMonster(rx,ry,this.direction);
    if(this.slowTimer>0)_text(rx,ry-96,"💨","#bda8ff","10px Arial");
    const bw=36*(this.hp/this.maxHp);
    _rect(rx-18,ry-78,36,5,"#333",null,0);_rect(rx-18,ry-78,Math.max(0,bw),5,"#8866ff",null,0);
  }
  _drawRabbit(){
    const rx=this.x,ry=this.y,d=this.direction;
    const airborne=!this.onGround, squash=airborne?1:1-Math.min(0.12,this.hopTimer*0.005);
    ctx.save();
    ctx.shadowColor="#ffe6ee";ctx.shadowBlur=6;
    // tail (drawn behind the body, opposite the facing direction)
    _oval(rx-10*d-6,ry-24,12,12,"#ffffff","#e8b8c8",1.5);
    // body
    _oval(rx-16,ry-40*squash,32,40*squash,"#ffffff","#dcc3cf",2);
    // head
    const hx=rx+4*d;
    _oval(hx-15,ry-66,30,28,"#ffffff","#dcc3cf",2);
    // long rabbit ears, perked up (tilt slightly with the hop)
    const earTilt=airborne?-8:0;
    ctx.fillStyle="#ffffff";ctx.strokeStyle="#dcc3cf";ctx.lineWidth=1.5;
    ctx.save();ctx.translate(hx-7,ry-64);ctx.rotate((-12+earTilt)*Math.PI/180);
    ctx.beginPath();ctx.ellipse(0,-18,6,20,0,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.fillStyle="#ffc3d6";ctx.beginPath();ctx.ellipse(0,-18,3,14,0,0,Math.PI*2);ctx.fill();
    ctx.restore();
    ctx.fillStyle="#ffffff";
    ctx.save();ctx.translate(hx+7,ry-64);ctx.rotate((12-earTilt)*Math.PI/180);
    ctx.beginPath();ctx.ellipse(0,-18,6,20,0,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.fillStyle="#ffc3d6";ctx.beginPath();ctx.ellipse(0,-18,3,14,0,0,Math.PI*2);ctx.fill();
    ctx.restore();
    ctx.restore();
    // red eyes
    _oval(hx+2*d-4,ry-56,7,7,"red",null);
    _oval(hx+10*d-4,ry-56,7,7,"red",null);
    if(this.elite){for(let i=0;i<2;i++){const hx2=hx-6+i*12;ctx.fillStyle="#c00030";ctx.beginPath();ctx.moveTo(hx2-3,ry-64);ctx.lineTo(hx2,ry-72);ctx.lineTo(hx2+3,ry-64);ctx.closePath();ctx.fill();}}
    if(this.slowTimer>0)_text(rx,ry-98,"❄️","deepskyblue","10px Arial");
    const bw=36*(this.hp/this.maxHp);
    _rect(rx-18,ry-86,36,5,"#333",null,0);_rect(rx-18,ry-86,Math.max(0,bw),5,this.elite?"#ff4444":"#ff9dc2",null,0);
  }
}

// ================================================================
//  ROAD MODE — 3 MAIN BOSSES (MA THÚ)
// ================================================================
class RoadBoss{
  constructor(type,x,floorY){
    this.type=type;this.x=x;this.y=floorY;this.floorY=floorY;this.vy=0;
    this.anim=0;this.dead=false;this.direction=-1;this.stunTimer=0;this.phase=1;
    this.summonQueue=[];this.hitFlash=0;this.skillTimer={};
    this._init();
  }
  _init(){
    if(this.type===1){
      this.hp=this.maxHp=320;this.skillTimer={summon:260};this.bobPhase=0;
    }else{
      // ---- 심연의 마룡 (Abyssal Shadow Dragon) ----
      this.hp=this.maxHp=560;this.phase=1;
      this.skillTimer={breath:260,slam:380,tail:200,roar:560};
      this.wingAngle=0;this.neckSway=0;this.tailSway=0;this.hoverOffset=0;
      this.breathActive=0;this.breathWarn=0;this._breathDir=1;
      this.slamActive=false;this.slamHitDone=false;this.slamPhaseTimer=0;
      this.slamTargetX=this.x;this.slamTargetY=this.floorY-30;this._slamRiseY=this.floorY-320;
      this.tailActive=0;this.tailWarn=0;this.tailHitDone=false;
      this.roarActive=0;this.roarWarn=0;this.prisonX=this.x;this.prisonY=this.floorY-60;
      this.groundSpikes=[];this.emberParticles=[];
      this.y=this.floorY-160;
    }
  }
  update(player){
    this.anim++;
    if(this.hitFlash>0)this.hitFlash--;
    if(this.stunTimer>0){this.stunTimer--;return;}
    for(const k in this.skillTimer)if(this.skillTimer[k]>0)this.skillTimer[k]--;
    if(this.type===1)this._update1(player);
    else this._update3(player);
    this.x=clamp(this.x,roadCameraX+50,roadCameraX+W-50);
  }
  _update1(player){
    this.y=this.floorY;this.bobPhase+=0.05;
    if(Math.abs(player.x-this.x)<75&&player.hp>0&&rng()<0.015)applyDamage(player,3,null);
    if(this.skillTimer.summon<=0){
      this.skillTimer.summon=420;
      for(let i=0;i<2;i++)this.summonQueue.push(new RoadEnemy(this.x+rndInt(-150,150),this.floorY,3,false,false,true));
      this.hitFlash=Math.max(this.hitFlash,10);screenShake=Math.max(screenShake,10);
    }
  }
  // ---- 심연의 마룡 (Abyssal Shadow Dragon) — AI, combat & movement ----
  _update3(player){
    this.wingAngle=(this.wingAngle+4.5)%360;
    this.neckSway=Math.sin(this.anim*0.03)*8;
    this.tailSway=Math.sin(this.anim*0.025)*10;
    this.hoverOffset=Math.sin(this.anim*0.035)*16;
    if(this.hp<=this.maxHp*0.5&&this.phase===1){this.phase=2;screenShake=Math.max(screenShake,30);}
    const isP2=this.phase===2,s=this.skillTimer;

    // Bay lượn giữ khoảng cách lý tưởng với người chơi (trừ khi đang lao xuống)
    if(!this.slamActive){
      const dx=player.x-this.x,spd=isP2?3.4:2.4,ideal=260;
      if(Math.abs(dx)>ideal+60)this.x+=spd*(dx>0?1:-1);
      this.direction=dx>0?1:-1;
      this.y=this.floorY-160+this.hoverOffset;
    }

    // Chiêu 1: Hơi Thở Tử Khí — báo trước rồi phun luồng khí độc tím theo hướng nhìn (nhiều hạt, kéo dài hơn để dễ thấy)
    if(s.breath<=0&&this.breathWarn<=0&&this.breathActive<=0){s.breath=isP2?310:390;this.breathWarn=48;this._breathDir=this.direction;}
    if(this.breathWarn>0){this.breathWarn--; if(this.breathWarn===0)this.breathActive=isP2?110:85;}
    if(this.breathActive>0){
      this.breathActive--;
      if(player.hp>0){
        const dirOk=this._breathDir>0?player.x>this.x:player.x<this.x;
        const inCone=dirOk&&Math.abs(player.x-this.x)<(isP2?540:440)&&Math.abs(player.y-this.y)<170;
        if(inCone&&this.anim%5===0)applyDamage(player,isP2?3:2,null);
      }
      // phun dày đặc nhiều hạt khí độc kích thước khác nhau, bay chậm và tồn tại lâu hơn để dễ nhận biết
      for(let i=0;i<3;i++){
        const life=36+rndInt(0,14);
        this.emberParticles.push({x:this.x+this._breathDir*(40+rndInt(0,24)),y:this.y-30+rndInt(-28,28),vx:this._breathDir*(4.5+rng()*4.5),vy:rndInt(-2,2)*0.6,life,maxLife:life,r:6+rng()*7});
      }
    }
    _compact(this.emberParticles,p=>{p.x+=p.vx;p.y+=p.vy;p.vy*=0.98;p.life--;return p.life>0;});

    // Chiêu 2: Bổ Nhào Vực Thẳm — bay vọt lên rồi lao bổ xuống vị trí người chơi, tạo dư chấn + gai bóng tối
    if(!this.slamActive&&s.slam<=0){
      s.slam=isP2?300:390;this.slamActive=true;this.slamHitDone=false;this.slamPhaseTimer=0;
      this.slamTargetX=player.x;this.slamTargetY=this.floorY-30;this._slamRiseY=this.floorY-320;
    }
    if(this.slamActive){
      this.slamPhaseTimer++;
      if(this.slamPhaseTimer<26){
        this.y+=(this._slamRiseY-this.y)*0.12;
      }else{
        const dx=this.slamTargetX-this.x,dy=this.slamTargetY-this.y,d=Math.max(1,Math.hypot(dx,dy)),spd=isP2?15:12;
        this.x+=dx/d*spd;this.y+=dy/d*spd;
        if(d<40){
          this.slamActive=false;screenShake=Math.max(screenShake,24);
          if(!this.slamHitDone){
            this.slamHitDone=true;
            if(player.hp>0&&Math.abs(this.x-player.x)<130){applyDamage(player,isP2?15:11,null);player.x=clamp(player.x+(player.x>this.x?1:-1)*180,roadCameraX+40,roadCameraX+W-40);}
            // nhiều gai bóng tối cao thấp khác nhau, tồn tại lâu để người chơi dễ nhận biết rồi mới tan dần
            for(let i=0;i<6;i++)this.groundSpikes.push({x:this.x+rndInt(-160,160),rise:0,h:rndInt(45,115),life:130,maxLife:130,hit:false});
          }
        }
      }
    }
    _compact(this.groundSpikes,sp=>{
      if(sp.rise<1)sp.rise=Math.min(1,sp.rise+0.1);
      sp.life--;
      if(!sp.hit&&sp.rise>=1&&player.hp>0&&Math.abs(sp.x-player.x)<28){applyDamage(player,isP2?4:3,null);sp.hit=true;}
      return sp.life>0;
    });

    // Chiêu 3: Quét Đuôi — khi người chơi lại gần, quật đuôi hất văng ra
    if(!this.slamActive&&this.tailWarn<=0&&this.tailActive<=0&&s.tail<=0&&Math.abs(player.x-this.x)<190){
      s.tail=isP2?170:230;this.tailWarn=22;this.tailHitDone=false;
    }
    if(this.tailWarn>0){this.tailWarn--; if(this.tailWarn===0)this.tailActive=16;}
    if(this.tailActive>0){
      this.tailActive--;
      if(!this.tailHitDone&&this.tailActive===8&&player.hp>0&&Math.abs(player.x-this.x)<200){
        this.tailHitDone=true;applyDamage(player,isP2?9:6,null);
        player.x=clamp(player.x+(player.x>this.x?1:-1)*140,roadCameraX+40,roadCameraX+W-40);
      }
    }

    // Chiêu 4: Gầm Thét Vực Thẳm — Lồng Giam Bóng Tối: rồng phát ánh sáng tím, người chơi bị dây xích đen bao quanh,
    // không thể di chuyển / dùng chiêu trong 3 giây (180 khung hình ở 60fps)
    if(!this.slamActive&&s.roar<=0&&this.roarWarn<=0&&this.roarActive<=0){s.roar=isP2?540:660;this.roarWarn=55;}
    if(this.roarWarn>0){
      this.roarWarn--;
      if(this.roarWarn===0){
        this.roarActive=180;
        this.prisonX=player.x;this.prisonY=player.y;
        if(player.hp>0)player.stunTimer=Math.max(player.stunTimer,180);
        screenShake=Math.max(screenShake,26);
      }
    }
    if(this.roarActive>0)this.roarActive--;
  }
  draw(){if(this.type===1)this._draw1();else this._draw3();}
  _draw1(){
    const rx=this.x,ry=this.y,pulse=Math.sin(this.bobPhase)*6;
    ctx.save();
    ctx.shadowColor="#7CFC00";ctx.shadowBlur=this.hitFlash>0?30:14;
    const grad=ctx.createRadialGradient(rx-20,ry-140,10,rx,ry-100,140);
    grad.addColorStop(0,"#e8ffcc");grad.addColorStop(0.5,"#9ecb5c");grad.addColorStop(1,"#3f5c1e");
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.ellipse(rx,ry-100,100+pulse*0.3,140+pulse,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="#2b3d10";ctx.lineWidth=4;ctx.stroke();
    ctx.restore();
    for(let i=0;i<5;i++){
      const ang=(i/5)*Math.PI*2+this.anim*0.003;
      ctx.strokeStyle=`rgba(120,200,60,${0.5+0.3*Math.sin(this.anim*0.05+i)})`;ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(rx,ry-100);ctx.lineTo(rx+Math.cos(ang)*80,ry-100+Math.sin(ang)*110);ctx.stroke();
    }
    const embryoPulse=0.4+0.3*Math.sin(this.anim*0.08);
    ctx.save();ctx.globalAlpha=embryoPulse;ctx.fillStyle="#ffee88";ctx.beginPath();ctx.ellipse(rx,ry-110,26,36,0,0,Math.PI*2);ctx.fill();ctx.restore();
    ctx.strokeStyle="#1a2408";ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(rx-40,ry-180);ctx.lineTo(rx-10,ry-140);ctx.lineTo(rx-35,ry-90);ctx.stroke();
    ctx.beginPath();ctx.moveTo(rx+30,ry-190);ctx.lineTo(rx+15,ry-130);ctx.lineTo(rx+45,ry-70);ctx.stroke();
    for(let i=0;i<3;i++){const dripY=ry-40+(this.anim*1.2+i*60)%150;_oval(rx-60+i*55-4,dripY-6,8,14,"#6a8f2a",null);}
    this._drawHpBar(rx,ry,"🥚 MA THÚ TRỨNG","#9ecb5c");
  }
  _draw3(){
    const rx=this.x,ry=this.y,isP2=this.phase===2,d=this.direction,sz=isP2?1.3:1.0;

    // gai bóng tối trồi lên từ đất sau đòn Bổ Nhào — cao thấp khác nhau, tồn tại lâu rồi mới tan dần
    this.groundSpikes.forEach(sp=>{
      const h=(sp.h||70)*sp.rise;
      const alpha=sp.life<35?Math.max(0,sp.life/35):1;
      ctx.save();ctx.globalAlpha=alpha;ctx.shadowColor="#a020c0";ctx.shadowBlur=12;
      ctx.fillStyle="#2a0030";ctx.strokeStyle="#c060ff";ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(sp.x-11,this.floorY);ctx.lineTo(sp.x,this.floorY-h);ctx.lineTo(sp.x+11,this.floorY);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.restore();
    });

    // báo trước Hơi Thở Tử Khí
    if(this.breathWarn>0){
      const t=this.breathWarn/48;
      ctx.save();ctx.strokeStyle=`rgba(160,0,220,${0.35+0.4*(1-t)})`;ctx.lineWidth=3;ctx.setLineDash([8,5]);
      ctx.beginPath();ctx.moveTo(rx+this._breathDir*30,ry-90);ctx.lineTo(rx+this._breathDir*480,ry-90);ctx.stroke();ctx.setLineDash([]);ctx.restore();
      _text(rx,ry-235,"🔥 HÍT HƠI TỬ KHÍ 🔥","#c060ff","12px Arial bold");
    }
    // luồng khí độc đang phun
    if(this.breathActive>0){
      ctx.save();
      const grad=ctx.createLinearGradient(rx,ry-90,rx+this._breathDir*450,ry-90);
      grad.addColorStop(0,"rgba(180,40,255,0.85)");grad.addColorStop(1,"rgba(60,0,90,0)");
      ctx.fillStyle=grad;
      ctx.beginPath();ctx.moveTo(rx+this._breathDir*20,ry-130);ctx.lineTo(rx+this._breathDir*(isP2?480:400),ry-90);ctx.lineTo(rx+this._breathDir*20,ry-50);ctx.closePath();ctx.fill();
      ctx.restore();
    }
    this.emberParticles.forEach(p=>{
      const al=p.life/p.maxLife;
      ctx.save();ctx.globalAlpha=al;ctx.shadowColor="#c060ff";ctx.shadowBlur=14;
      _oval(p.x-p.r,p.y-p.r,p.r*2,p.r*2,al>0.55?"#e6b3ff":"#a020c0",null);
      ctx.restore();
    });

    // báo trước Quét Đuôi
    if(this.tailWarn>0){
      ctx.save();ctx.strokeStyle="rgba(200,40,255,0.7)";ctx.lineWidth=3;ctx.setLineDash([6,4]);
      ctx.beginPath();ctx.moveTo(rx,ry+10);ctx.lineTo(rx-d*220,ry+10);ctx.stroke();ctx.setLineDash([]);ctx.restore();
    }

    // báo trước & hiệu ứng Lồng Giam Bóng Tối
    if(this.roarWarn>0)_text(rx,ry-220,"🐉 CHUẨN BỊ GẦM 🐉","#c060ff","13px Arial bold");
    if(this.roarActive>0){
      const px=this.prisonX,py=this.prisonY,t=this.roarActive;
      const appearT=Math.min(1,(180-t)/18);   // lồng hiện ra dần trong ~0.3s đầu
      const fadeT=t<25?Math.max(0,t/25):1;    // mờ dần trong ~25 khung cuối trước khi tan
      const a=appearT*fadeT;
      ctx.save();ctx.globalAlpha=a;
      // ánh sáng tím tỏa ra từ rồng trước khi bao trùm người chơi
      ctx.strokeStyle="rgba(192,96,255,0.55)";ctx.lineWidth=2;ctx.shadowColor="#c060ff";ctx.shadowBlur=24;
      ctx.beginPath();ctx.moveTo(rx,ry-90);ctx.lineTo(px,py-60);ctx.stroke();
      // vòng ma pháp tím dưới chân người chơi
      ctx.strokeStyle="#c060ff";ctx.lineWidth=3;
      ctx.beginPath();ctx.ellipse(px,py+6,52,16,0,0,Math.PI*2);ctx.stroke();
      // vòm năng lượng tím bao quanh
      ctx.strokeStyle="rgba(192,96,255,0.45)";ctx.lineWidth=2;ctx.shadowBlur=16;
      ctx.beginPath();ctx.ellipse(px,py-70,62,92,0,0,Math.PI*2);ctx.stroke();
      // các dây xích đen quấn quanh, lắc nhẹ, siết chặt dần
      ctx.shadowBlur=0;
      const chainCount=8;
      for(let i=0;i<chainCount;i++){
        const ang=(i/chainCount)*Math.PI*2+this.anim*0.015;
        const baseX=px+Math.cos(ang)*36,baseTopY=py-150;
        ctx.strokeStyle="#0a0a0a";ctx.lineWidth=4;ctx.lineCap="round";
        ctx.beginPath();ctx.moveTo(baseX,baseTopY);
        for(let seg=1;seg<=7;seg++){
          const segY=baseTopY+seg*20;
          const wobble=Math.sin(this.anim*0.28+seg*1.3+i)*4;
          ctx.lineTo(baseX+wobble,segY);
        }
        ctx.stroke();
        for(let seg=1;seg<7;seg+=2){
          const segY=baseTopY+seg*20;
          _oval(baseX-4,segY-4,8,8,"#1a1a1a",null);
        }
      }
      ctx.restore();
      _text(px,py-200,"⛓ GIAM CẦM BÓNG TỐI ⛓","#c060ff","13px Arial bold");
    }

    // ---- cánh: màng gai góc cạnh, phát sáng mạnh hơn ở phase 2 ----
    const wf=Math.sin(this.wingAngle*Math.PI/180)*55;
    ctx.save();ctx.shadowColor=isP2?"#c060ff":"#5a0090";ctx.shadowBlur=isP2?26:14;
    ctx.fillStyle="#0d0018";ctx.strokeStyle=isP2?"#c060ff":"#7a20a0";ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(rx-25*sz,ry-110*sz);ctx.lineTo(rx-190*sz,ry-170*sz+wf);ctx.lineTo(rx-150*sz,ry-110*sz+wf*0.5);
    ctx.lineTo(rx-165*sz,ry-60*sz);ctx.lineTo(rx-110*sz,ry-70*sz);ctx.lineTo(rx-80*sz,ry-40*sz);ctx.closePath();
    ctx.fill();ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(rx+25*sz,ry-110*sz);ctx.lineTo(rx+190*sz,ry-170*sz+wf);ctx.lineTo(rx+150*sz,ry-110*sz+wf*0.5);
    ctx.lineTo(rx+165*sz,ry-60*sz);ctx.lineTo(rx+110*sz,ry-70*sz);ctx.lineTo(rx+80*sz,ry-40*sz);ctx.closePath();
    ctx.fill();ctx.stroke();
    ctx.restore();

    // ---- đuôi dài, đung đưa, mũi nhọn ở cuối ----
    ctx.save();ctx.strokeStyle="#0d0018";ctx.lineWidth=16*sz;ctx.lineCap="round";
    const td=-d,tailX=rx+td*60,tailY=ry+20*sz+this.tailSway;
    ctx.beginPath();ctx.moveTo(rx,ry+10*sz);ctx.quadraticCurveTo(rx+td*50,ry+40*sz,tailX,tailY);ctx.stroke();
    ctx.strokeStyle=isP2?"#c060ff":"#7a20a0";ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(tailX,tailY-14);ctx.lineTo(tailX+td*22,tailY);ctx.lineTo(tailX,tailY+14);ctx.stroke();
    ctx.restore();

    // ---- thân: vảy tối, viền phát sáng, gai sống lưng ----
    const bodyGrad=ctx.createLinearGradient(rx,ry-150*sz,rx,ry-20);
    bodyGrad.addColorStop(0,"#241033");bodyGrad.addColorStop(0.6,"#12061e");bodyGrad.addColorStop(1,"#05000a");
    ctx.save();ctx.shadowColor=isP2?"#c060ff":"#4a1070";ctx.shadowBlur=isP2?18:8;
    ctx.fillStyle=bodyGrad;ctx.strokeStyle=isP2?"#c060ff":"#5a1090";ctx.lineWidth=3;
    ctx.beginPath();ctx.ellipse(rx,ry-70*sz,60*sz,80*sz,0,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.restore();
    for(let i=0;i<5;i++){
      const px2=rx-40*sz+i*22*sz,pyBase=ry-120*sz+Math.abs(i-2)*10*sz;
      ctx.fillStyle=isP2?"#c060ff":"#7a20a0";
      ctx.beginPath();ctx.moveTo(px2-8,pyBase+14);ctx.lineTo(px2,pyBase-10);ctx.lineTo(px2+8,pyBase+14);ctx.closePath();ctx.fill();
    }

    // ---- cổ dài uốn lượn + đầu rồng: sừng, mắt đỏ phát sáng ----
    const hx=rx+50*d*sz,hy=ry-150*sz+this.neckSway;
    ctx.save();ctx.strokeStyle="#12061e";ctx.lineWidth=30*sz;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(rx+10*d,ry-90*sz);ctx.quadraticCurveTo(rx+30*d,ry-130*sz,hx,hy+10);ctx.stroke();
    ctx.restore();
    ctx.save();ctx.shadowColor=isP2?"#ff2244":"#c00030";ctx.shadowBlur=isP2?18:8;
    ctx.fillStyle="#150022";ctx.strokeStyle=isP2?"#c060ff":"#7a20a0";ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(hx-30,hy);ctx.lineTo(hx+40*d,hy-16);ctx.lineTo(hx+70*d,hy+6);ctx.lineTo(hx+38*d,hy+22);ctx.lineTo(hx-25,hy+26);ctx.closePath();
    ctx.fill();ctx.stroke();
    ctx.restore();
    ctx.strokeStyle=isP2?"#c060ff":"#7a20a0";ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(hx-14,hy-6);ctx.lineTo(hx-30,hy-46);ctx.stroke();
    ctx.beginPath();ctx.moveTo(hx+6,hy-10);ctx.lineTo(hx-2,hy-50);ctx.stroke();
    ctx.save();ctx.shadowColor="#ff2244";ctx.shadowBlur=12;
    _oval(hx+18*d-6,hy-4,12,10,isP2?"#ff4466":"#ff2244",null);
    ctx.restore();

    this._drawHpBar(rx,ry,`🐉 MA LONG VỰC THẲM (P${this.phase})`,isP2?"#c060ff":"#7a20a0",true);
  }
  _drawHpBar(rx,ry,label,color,wide){
    this._hpLabel = label;
    this._hpColor = color;
  }
}
</script>

<script>
// ================================================================
//  BOSS 3 SKILL CASTING
// ================================================================
function boss3CastSkill(boss,player,skillType){
  const w=W;
  if(skillType==="fire"){for(const ao of[-20,0,20]){const dx=player.x-boss.x,dy=player.y-boss.y,d=Math.max(1,Math.sqrt(dx*dx+dy*dy)),rad=Math.atan2(dy,dx)+ao*Math.PI/180;projectiles.push({x:boss.x,y:boss.y-30,vx:Math.cos(rad)*9,vy:Math.sin(rad)*9,owner:boss,target:player,damage:5,slow:0,slow_pct:0,color:"orange",type:"fireball"});}}
  else if(skillType==="shadow"){const dx=player.x-boss.x;boss.x=clamp(player.x-(dx>0?80:-80),60,w-60);applyDamage(player,6,boss);screenShake=Math.max(screenShake,10);}
  else if(skillType==="ice"){projectiles.push({x:boss.x,y:boss.y-30,vx:10*(player.x>boss.x?1:-1),vy:0,owner:boss,target:player,damage:4,slow:150,slow_pct:0.45,color:"cyan",type:"ice_arrow"});}
  else if(skillType==="thunder"){if(Math.abs(boss.x-player.x)<500){applyDamage(player,7,boss);screenShake=Math.max(screenShake,15);}}
  else if(skillType==="earth"){if(Math.abs(boss.x-player.x)<400){applyDamage(player,8,boss);player.vy=-10;}}
  else if(skillType==="water"){if(Math.abs(boss.x-player.x)<450){const push=player.x>boss.x?1:-1;player.x=clamp(player.x+push*200,40,w-40);applyDamage(player,5,boss);}}
  else if(skillType==="wind"){if(Math.abs(boss.x-player.x)<500){const pull=player.x>boss.x?-1:1;player.x=clamp(player.x+pull*150,40,w-40);applyDamage(player,4,boss);}}
}

// ================================================================
//  DRAWING HELPERS
// ================================================================
function _rect(x,y,w,h,fill,stroke,lw=1){if(w<0){x+=w;w=-w;}if(h<0){y+=h;h=-h;}ctx.fillStyle=fill;ctx.fillRect(x,y,w,h);if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.strokeRect(x,y,w,h);}}
function _rectOutline(x,y,w,h,stroke,lw){if(w<0){x+=w;w=-w;}if(h<0){y+=h;h=-h;}ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.strokeRect(x,y,w,h);}
function _oval(x,y,w,h,fill,stroke,lw=1){ctx.beginPath();ctx.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}}
function _line(x1,y1,x2,y2,stroke,lw){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function _text(x,y,txt,fill,font){ctx.fillStyle=fill;ctx.font=font;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(txt,x,y);}
// Tapered claw/scratch-mark shape: a thin curved leaf pointed at both ends,
// following a gentle bow along its length — reads as a slash mark rather
// than a plain stroked line.
function _clawMark(cx,cy,angleDeg,length,maxWidth,bow,color,outline){
  const rad=angleDeg*Math.PI/180,dx=Math.cos(rad),dy=Math.sin(rad),nx=-dy,ny=dx,segs=14,pts=[];
  for(let i=0;i<=segs;i++){
    const t=i/segs,taper=Math.sin(t*Math.PI),curve=Math.sin(t*Math.PI)*bow;
    pts.push({px:cx+dx*length*t+nx*curve,py:cy+dy*length*t+ny*curve,ox:nx*taper*maxWidth,oy:ny*taper*maxWidth});
  }
  ctx.beginPath();
  pts.forEach((p,i)=>{const x=p.px+p.ox,y=p.py+p.oy;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
  for(let i=segs;i>=0;i--){const p=pts[i];ctx.lineTo(p.px-p.ox,p.py-p.oy);}
  ctx.closePath();
  ctx.fillStyle=color;ctx.fill();
  if(outline){ctx.strokeStyle=outline;ctx.lineWidth=1.2;ctx.stroke();}
}

// ================================================================
//  DAMAGE & SKILL UTILS
// ================================================================
function shadowSoulTarget(real){
  // SHADOW — Thoát Xác: while the soul is out, redirect anything that would
  // target the real fighter onto the stationary decoy old body instead.

function getAllEnemies(attacker){

let lightningArcs=[];
function spawnLightningArc(x1,y1,x2,y2){

  for(let i=1;i<=steps;i++){
    const t=i/steps;

function updateAndDrawLightningArcs(){
  _compact(lightningArcs,a=>a.life>0);

    a.life--;

// ================================================================
//  THUNDER PASSIVE — QUÁ TẢI (Overload): every landed hit from a thunder
//  attacker builds 1 stack on the target (0->5). At 5 stacks it detonates —
//  bonus burst damage, a stun/launch, and a small chain to nearby enemies —
//  then resets to 0. Works against ANY target type the game has (Fighter,
//  ChallengeEnemy, Boss, RoadEnemy, RoadBoss...), not just PVP, since it
//  only ever touches generic fields every enemy class here already
//  supports (hp, stunTimer — see the identical pattern ice_spear already
//  uses on all these types in updateProjectiles/06).
// ================================================================
function addShock(target,attacker){
  if(!attacker||attacker.charType!=="thunder")return;
  if(!target||target.hp===undefined||target.hp<=0)return;
  if(target instanceof RoadWall)return; // set-piece gate, not a real "kẻ địch" to stack/detonate on
  target.shockStack=(target.shockStack||0)+1;
  if(target.shockStack>=5){
    target.shockStack=0;

    target.stunTimer=Math.max(target.stunTimer||0,50);
    if(target instanceof Fighter)target.vy=-10;
    screenShake=Math.max(screenShake,18);
    spawnHitEffect(target.x,target.y-70,"#FFFFFF");
    for(let i=0;i<16;i++){const ang=rng()*Math.PI*2,spd=rng()*5+2;hitEffects.push({x:target.x,y:target.y-60,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-2,life:26,maxLife:26,particle:true,color:rndChoice(["#FFD700","#FFF176","white"])});}

    // with a visible arc, so the detonation reads as "điện lan sang xung
    // quanh" without becoming an unbounded AOE (capped radius, one-shot).
    const chainR=150*SR;
    getAllEnemies(attacker).forEach(en=>{
      if(en===target||!(en.hp>0))return;

}
function aoeHit(attacker,damage,radius){radius*=SR;getAllEnemies(attacker).forEach(tgt=>{const tr=radius*(tgt.sizeMult||1);if(Math.abs(tgt.x-attacker.x)<tr&&Math.abs(tgt.y-attacker.y)<tr*0.8)applyDamage(tgt,damage,attacker);});}

  return p.charType==="thunder"&&p.activeSkill==="thunder_s4"&&p.ultiTimer>0
    &&(THUNDER_ULTI_TOTAL-p.ultiTimer)>=THUNDER_CHARGE_FRAMES;
}
// true trong đúng pha TỤ LỰC (trước khi tia bắn ra) của Thiên Lôi Ultimate —
// dùng để bật khiên chắn cứng quanh người trong lúc đứng yên tụ sức, để
// không bị lính cận chiến chạy vào ăn damage/tử vong trước khi kịp bắn.
function thunderUltiCharging(p){
  return p.charType==="thunder"&&p.activeSkill==="thunder_s4"&&p.ultiTimer>0
    &&(THUNDER_ULTI_TOTAL-p.ultiTimer)<THUNDER_CHARGE_FRAMES;
}
const THUNDER_CHARGE_SHIELD_RADIUS=110; // bán kính khiên chắn (px, trước khi nhân SR)
// KHIÊN CHẮN TỤ LỰC: đẩy bật MỌI kẻ địch còn sống ra khỏi bán kính khiên
// mỗi frame trong lúc đang tụ lực, để không con nào chen được vào gần —
// kết hợp với miễn nhiễm sát thương/khống chế được thêm trong applyDamage().
function tickThunderChargeShield(p){
  if(!thunderUltiCharging(p))return;
  const rad=THUNDER_CHARGE_SHIELD_RADIUS*SR;
  getAllEnemies(p).forEach(en=>{
    if(!en||en.hp<=0)return;
    const dx=en.x-p.x;
    if(Math.abs(dx)<rad&&Math.abs((en.y||p.y)-p.y)<140*SR){
      const pd=dx>=0?1:-1;
      const pushedX=p.x+pd*rad;
      if(isPushable(en))en.x=pd>=0?Math.max(en.x,pushedX):Math.min(en.x,pushedX);
      en.x=clamp(en.x,moveBoundLo(),moveBoundHi());
    }
  });
}
function thunderJudgmentTick(attacker){
  if(!attacker||attacker.activeSkill!=="thunder_s4")return;
  if(attacker._thunderUltiTickFrame===frameCount)return;
  attacker._thunderUltiTickFrame=frameCount;
  const elapsed=THUNDER_ULTI_TOTAL-attacker.ultiTimer;
  const beamElapsed=elapsed-THUNDER_CHARGE_FRAMES;
  if(beamElapsed<0||beamElapsed>=THUNDER_BEAM_FRAMES)return; // còn đang tụ lực hoặc đã bắn xong
  if(beamElapsed%THUNDER_BEAM_TICK!==0)return; // chưa tới mốc 0.5s tiếp theo
  // TIA NĂNG LƯỢNG XUYÊN ĐỊCH: bám theo vị trí + hướng mặt HIỆN TẠI của
  // nhân vật (vì được phép di chuyển trong lúc bắn), trải dài từ người ra
  // tới hết map theo hướng đó. Gây damage cho TẤT CẢ kẻ địch trong tia
  // cùng lúc — không dừng lại ở mục tiêu đầu tiên như 1 viên đạn thường.
  const bx=attacker.x,by=attacker.y-70,dir=attacker.direction;
  const reach=(W*MAP_SCALE)*2; // đủ dài để luôn phủ hết map bất kể map rộng bao nhiêu
  getAllEnemies(attacker).forEach(e=>{
    if(!e||e.hp<=0)return;
    const ey=e.y!==undefined?e.y:attacker.y;
    const inFront=dir>=0?(e.x>=bx-25):(e.x<=bx+25);
    if(inFront&&Math.abs(e.x-bx)<reach&&Math.abs(ey-attacker.y)<130*SR){
      applyDamage(e,THUNDER_BEAM_DMG,attacker);
      spawnHitEffect(e.x,ey-60,"#FFFFFF");
    }
  });
  screenShake=Math.max(screenShake,9);
  sfxLightningZap();
}
function aoePush(attacker,damage,radius){radius*=SR;getAllEnemies(attacker).forEach(tgt=>{if(tgt instanceof Fighter&&tgt.charType==="thunder"&&tgt.thunderDashTimer>0)return;const dx=tgt.x-attacker.x;if(Math.abs(dx)<radius&&Math.abs(tgt.y-attacker.y)<120*SR){if(isPushable(tgt)){const pd=dx>=0?1:-1;tgt.x=clamp(tgt.x+pd*Math.floor(radius*0.5),moveBoundLo(),moveBoundHi());if(tgt instanceof Fighter)tgt.vy=-5;}applyDamage(tgt,damage,attacker);}});}
// EARTH S1 (tay trái, xem castSkill) — đẩy lùi MỘT mục tiêu duy nhất ra xa
// khỏi người ném, dùng cho khối thạch kiên khi trúng đòn. An toàn gọi trên
// bất kỳ đối tượng nào (tường/boss không đẩy được sẽ tự bỏ qua nhờ isPushable()).
function knockbackSingleTarget(target,fromX,dist){
  if(!target||!isPushable(target))return;
  const pd=target.x>=fromX?1:-1;
  target.x=clamp(target.x+pd*dist,moveBoundLo(),moveBoundHi());
  if(target instanceof Fighter)target.vy=-5;
}
function getChallengeTarget(attacker){const cands=[...challengeEnemies.filter(e=>e.hp>0),...challengeBosses.filter(b=>!b.dead&&b.hp>0)];if(!cands.length)return null;return cands.reduce((best,c)=>Math.abs(c.x-attacker.x)<Math.abs(best.x-attacker.x)?c:best);}

function tickEarthMud(p){
  if(!p.earthMudActive)return;
  // MIỄN KHỐNG CHẾ: mud form is immune to all crowd control. applyDamage()
  // already blocks damage-attached CC at the source; this clears any CC that
  // gets set directly on the fighter (e.g. boss scripts) so nothing lingers.
  p.stunTimer=0;p.slowTimer=0;
  p.earthMudTimer--;
  // Speed buff
  if(p.earthMudTimer>0){
    // HP regen
    p.hp=Math.min(p.maxHp||MAX_HP,p.hp+(p.earthMudRegen/60));
  }
  // End mud form
  if(p.earthMudTimer<=0){
    p.earthMudActive=false;
    p.isAttacking=false;
    p.activeSkill=null;
    screenShake=6;
  }
}

// ================================================================
//  EARTH S4 — GIÁNG THẾ CHẤN ĐỘNG (thay cho THIÊN THẠCH cũ): nhân vật tự
//  nhảy lên rồi lao xuống đập đất (chuyển động dựng sẵn theo thời gian,
//  xem applyGravity()). Hàm này lo phần TÁC ĐỘNG: sát thương được chia làm
//  HAI đợt xung kích (16 dmg mỗi đợt, tổng vẫn 32 như cũ) — đợt 1 lúc chạm
//  đất, đợt 2 là dư chấn giữa chừng 3 giây chấn động — để cả quãng thời
//  gian đó có gameplay thật (không chỉ rung màn hình suông), rồi duy trì
//  rung màn hình LIÊN TỤC (ghi đè lại mỗi frame, chống bị tự tắt dần do
//  screenShake*=0.96 trong update()) cho tới khi hết hẳn.
// ================================================================
function tickEarthGroundSlam(p){
  if(p.activeSkill!=="earth_s4"||p.ultiTimer<=0)return;
  const total=p._groundSlamTotal||255;
  const elapsed=total-p.ultiTimer;
  const FALL_END=75; // 0.75s mắt đỏ + 0.25s nhảy + 0.25s rơi = chạm đất tại đây
  const IMPACT2_AT=165; // dư chấn thứ 2, 1.5s sau khi chạm đất (giữa quãng 3s)
  const doShock=(dmg,big)=>{
    screenShake=Math.max(screenShake,big?42:36);
    sfxExplosion();
    getAllEnemies(p).forEach(en=>{
      if(en&&en.hp>0){
        applyDamage(en,dmg,p);
        if(isPushable(en)){
          const pd=en.x>=p.x?1:-1;
          en.x=clamp(en.x+pd*(big?260:190),moveBoundLo(),moveBoundHi());
          if(en instanceof Fighter)en.vy=-(big?9:7);
        }
      }
    });
    const pCount=big?60:42;
    for(let i=0;i<pCount;i++){
      const ang=rng()*Math.PI*2,spd=rng()*(big?12:9)+3;
      hitEffects.push({x:p.x,y:p.y-6,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-7,life:46,maxLife:46,particle:true,color:rndChoice(["#8a6a4a","#6a4a2a","#c68a4a","#5a4030","#c9a06a"])});
    }
    for(let i=0;i<(big?16:11);i++){
      hitEffects.push({x:p.x+rndInt(-60,60),y:p.y+rndInt(-10,10),vy:-rng()*1.2-0.3,vx:(rng()-0.5)*0.8,life:60,maxLife:60,smoke:true,r0:rndInt(16,30),color:rndChoice(["#5a4a3a","#3a2e22","#786040"])});
    }
    hitEffects.push({x:p.x,y:p.y,life:30,maxLife:30,color:"#c9a06a",ring:true,big:true});
    hitEffects.push({x:p.x,y:p.y,life:40,maxLife:40,color:"#5a4030",ring:true,big:true});
  };
  // ĐỢT 1 — chạm đất
  if(!p._groundSlamImpacted&&elapsed>=FALL_END){
    p._groundSlamImpacted=true;
    p._groundSlamImpact2=false;
    p._groundSlamImpactX=p.x;p._groundSlamImpactY=p.y; // vị trí chạm đất, dùng cho FX nứt đất/khói trong _drawUlti
    p._groundSlamFlash1=elapsed; // mốc thời gian đợt 1, để _drawUlti vẽ đúng hiệu ứng chớp sáng
    doShock(16,true);
  }
  // ĐỢT 2 — dư chấn giữa chừng 3s, giữ nhân vật/màn chơi "sống" suốt thời
  // gian chấn động thay vì chỉ có 1 cú đánh rồi im lìm rung màn hình.
  if(p._groundSlamImpacted&&!p._groundSlamImpact2&&elapsed>=IMPACT2_AT){
    p._groundSlamImpact2=true;
    p._groundSlamFlash2=elapsed;
    doShock(16,false);
  }
  // RUNG MÀN HÌNH LIÊN TỤC suốt 3s chấn động sau khi chạm đất — ghi đè mỗi
  // frame để screenShake không bị decay*0.96 làm yếu/tắt dần giữa chừng.
  if(p._groundSlamImpacted&&p.ultiTimer>0){
    screenShake=Math.max(screenShake,14);
  }
}

// ================================================================
//  THUNDER S3 (skillNum 3, phím T) — THIÊN LÔI GIÁNG THẾ
//  0.0-0.53s (0-32f, ultiTimer): pha cast đứng im — tia sét bám đúng vị trí
//            nhân vật, sáng/dày dần lên khi sắp chạm (drawThunderSelfBolt, 07).
//  Khi chạm (ultiTimer về 0 -> triggerThunderS3Strike, hook đặt tại chỗ dọn
//            dẹp ultiTimer===0 dùng chung, 06): nổ tại chỗ (AOE nhẹ quanh
//            người), và bản thân nhân vật vào trạng thái CƯỜNG HÓA 5s:
//            +20% sát thương (_thunderBuffTimer, hook có sẵn trong
//            applyDamage), +30% tốc độ di chuyển (_thunderSpeedBuffTimer,
//            hook trong updateGameplay/06), khiên 30 không hồi trong 4s
//            (thunderShieldHp/thunderShieldTimer, xem tickThunderShield +
//            applyDamage), và thỉnh thoảng phóng 1 tia điện nhỏ sang mục
//            tiêu gần đó (xem vòng proc bên dưới) — hào quang "⚡ CƯỜNG HÓA
//            ⚡" quanh người trong suốt thời gian buff (drawThunderBuffAura, 07).
// ================================================================
function triggerThunderS3Strike(attacker,target){
  // THIÊN LÔI GIÁNG THẾ — QUẢ CẦU ĐIỆN: bay SIÊU CHẬM — tốc độ được tính
  // động theo bề ngang map hiện tại (W*MAP_SCALE) sao cho nếu bay từ đầu
  // tới cuối map mà không trúng ai thì mất đúng 2.75 giây (165 frame @60fps)
  // mới tự tan, thay vì tốc độ nhanh 26px/frame trước đây. Quả cầu giờ
  // XUYÊN ĐỊCH — không còn biến mất ngay khi chạm 1 mục tiêu, mà tiếp tục
  // bay và có thể nổ trên nhiều mục tiêu khác dọc đường (xem logic pierce +
  // _hitSet trong nhánh pType==="thunder_dragon" ở updateProjectiles, 06).
  const travelFrames=165; // 2.75s @60fps
  const travelDist=W*MAP_SCALE;
  const spd=travelDist/travelFrames;
  projectiles.push({x:attacker.x+40*attacker.direction,y:attacker.y-58,vx:spd*attacker.direction,vy:0,
    owner:attacker,dir:attacker.direction,damage:18,life:0,maxLife:travelFrames,
    color:"#FFD700",type:"thunder_dragon",target:target||null});
}
function tickThunderS3(p){

      if(near.length&&rng()<0.5){

}
