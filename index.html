<script>
// ================================================================
//  startTimeFreeze(frames, caster) — the generic time-stop trigger.
//  Called by any skill wind-up that wants everything else to hold still.
//  Decremented once per frame at the top of update() below; the actual
//  freezing happens at each mode's own update-call-sites (updateGameplay/
//  updateChallenge/updateRoad), which skip advancing enemies/bosses/
//  projectiles/the other fighter while globalTimeFreeze>0 — everyone except
//  `caster` just holds their current frame, still fully drawn.
// ================================================================
function startTimeFreeze(frames,caster){
  globalTimeFreeze=Math.max(globalTimeFreeze,frames);
  globalTimeFreezeCaster=caster;
}

// ================================================================
//  SHADOW V4 — CINEMATIC CAMERA PUNCH-IN (pre-windup)
//  Drives the camera during the Shadow "Bóng Tối Thức Tỉnh" wind-up
//  (see castSkill skillNum===5 in 06, and _drawShadowTransformWindup in 03):
//   age  0-15 (0.00-0.25s): nothing — camera stays exactly where it is
//   age 15-45 (0.25-0.75s): camera snaps to center on the caster and zooms
//                            in hard, up to SHADOW_CAM_ZOOM_MAX (character
//                            reads roughly boss-sized on screen)
//   age  45+ (0.75s+)     : holds at max zoom while the 3.5s VFX wind-up
//                            (_drawShadowTransformWindup) plays out and the
//                            fighter finally transforms
//   landing (0.5s)        : eases back down to 1.0 while transformLandingTimer
//                            runs out, so the zoom doesn't just snap off
//  Used by updateGameplay / updateChallenge / updateRoad below — each reads
//  this once per frame and folds it into its own existing camera-follow +
//  (for CHALLENGE) boss-intro-zoom logic, rather than adding a parallel
//  camera system.
// ================================================================
const SHADOW_CAM_ZOOM_MAX=2.5;
const SHADOW_CAM_DELAY=15;      // 0.25s: absolutely nothing happens yet
const SHADOW_CAM_ZOOMIN_END=45; // 0.75s elapsed: punch-in finished, VFX wind-up begins exactly here
const THUNDER_CAM_ZOOM_MAX=1.9;  // nhẹ hơn Shadow (2.5) vì tụ lực của Thunder ngắn hơn (2.5s so với 3.5s)
const THUNDER_CAM_DELAY=8;
const THUNDER_CAM_ZOOMIN_END=40;
const FROST_CAM_ZOOM_MAX=2.1;    // punch-in cho "Hóa Rồng Băng", giữa mức Thunder và Shadow
const FROST_CAM_DELAY=10;
const FROST_CAM_ZOOMIN_END=30;   // 0.5s cam punch-in (10f delay + 20f zoom-in) trước khi VFX 3.0s bắt đầu — xem PREROLL trong _drawFrostTransformWindup()
// EARTH — zoom NHẸ hơn hẳn 3 nhân vật kia (1.7 so với 1.9-2.5) nhưng KÉO
// DÀI hơn (delay 20f + zoom-in kéo tới tận 110f, so với Thunder chỉ 40f) —
// chủ đích là một cú đẩy camera vào CHẬM RÃI, NẶNG NỀ, giống đất đang từ từ
// dồn lực, thay vì cú "punch-in" dứt khoát của Shadow/Thunder/Frost.
const EARTH_CAM_ZOOM_MAX=1.7;
const EARTH_CAM_DELAY=25;
const EARTH_CAM_ZOOMIN_END=140;
// Sau khi biến hình xong (_finalizeTransform): vòng nổ trắng + tia sét tỏa
// quanh nhân vật chạy trong TRANSFORM_BURST_FRAMES (~1.5s) — camera GIỮ
// NGUYÊN zoom tối đa suốt lúc này. Chỉ sau khi hiệu ứng nổ kết thúc, camera
// mới bắt đầu zoom-out từ từ (không cắt đột ngột) trong
// TRANSFORM_CAM_EASE_FRAMES kế tiếp (~0.75s) — xem _drawTransformBurst() và
// shadowCamZoomState().
const TRANSFORM_BURST_FRAMES=90;
const TRANSFORM_CAM_EASE_FRAMES=45;
function shadowCamZoomState(p){
  if(!p||(p.charType!=="shadow"&&p.charType!=="thunder"&&p.charType!=="frost"&&p.charType!=="earth"))return{zoom:1.0,active:false};
  // THUNDER, FROST và EARTH dùng chung cơ chế zoom camera này với Shadow
  // (theo yêu cầu: biến hình của mọi nhân vật đều phải có đoạn zoom màn
  // hình), chỉ khác bộ hằng số thời gian/độ zoom tối đa.
  const isThunder=p.charType==="thunder";
  const isFrost=p.charType==="frost";
  const isEarth=p.charType==="earth";
  const ZOOM_MAX=isThunder?THUNDER_CAM_ZOOM_MAX:(isFrost?FROST_CAM_ZOOM_MAX:(isEarth?EARTH_CAM_ZOOM_MAX:SHADOW_CAM_ZOOM_MAX));
  const DELAY=isThunder?THUNDER_CAM_DELAY:(isFrost?FROST_CAM_DELAY:(isEarth?EARTH_CAM_DELAY:SHADOW_CAM_DELAY));
  const ZOOMIN_END=isThunder?THUNDER_CAM_ZOOMIN_END:(isFrost?FROST_CAM_ZOOMIN_END:(isEarth?EARTH_CAM_ZOOMIN_END:SHADOW_CAM_ZOOMIN_END));
  if(p.transformWindupTimer>0){
    const total=p._transformWindupTotal||(isThunder?150:(isFrost?210:(isEarth?270:255)));
    const age=total-p.transformWindupTimer;
    if(age<DELAY)return{zoom:1.0,active:false};
    if(age<ZOOMIN_END){
      const t=(age-DELAY)/(ZOOMIN_END-DELAY);
      const eased=1-Math.pow(1-t,3); // ease-out cubic: fast punch, settles into place
      return{zoom:1.0+(ZOOM_MAX-1.0)*eased,active:true};
    }
    return{zoom:ZOOM_MAX,active:true};
  }
  if(p.camHoldTimer>0&&p.transformActive&&(p.charType==="shadow"||p.charType==="thunder"||p.charType==="frost"||p.charType==="earth")){
    if(p.camHoldTimer>TRANSFORM_CAM_EASE_FRAMES){
      // Vẫn đang trong pha nổ + tia sét: giữ nguyên zoom tối đa, chưa zoom-out.
      return{zoom:ZOOM_MAX,active:true};
    }
    // Hiệu ứng nổ đã xong: zoom-out từ từ (ease-out cubic — chậm rãi, không giật).
    const t=1-(p.camHoldTimer/TRANSFORM_CAM_EASE_FRAMES);
    const eased=1-Math.pow(1-t,3);
    return{zoom:ZOOM_MAX+(1.0-ZOOM_MAX)*eased,active:true};
  }
  return{zoom:1.0,active:false};
}

// ================================================================
//  FROST WORLD-SPACE FX — drawn in absolute coordinates (not the per-fighter scaled transform)
// ================================================================
// THUNDER DASH TRAIL: the electric line left behind by Thunder Dash (S2 —
// Lôi Ảnh). Purely visual — the actual hit detection happens once, at cast
// time, in castSkill (06); this just decays the trail segments left behind.
function tickThunderDash(p){
  if(p.charType!=="thunder"||!p.thunderDashTrail||!p.thunderDashTrail.length)return;
  p.thunderDashTrail.forEach(t=>t.life--);
  _compact(p.thunderDashTrail,t=>t.life>0);
}
function drawThunderDashTrail(p){
  if(p.charType!=="thunder"||!p.thunderDashTrail||!p.thunderDashTrail.length)return;
  p.thunderDashTrail.forEach(t=>{
    const a=Math.max(0,t.life/t.maxLife);
    ctx.save();ctx.globalAlpha=a*0.6;ctx.strokeStyle="#FFD700";ctx.lineWidth=3;ctx.shadowColor="#FFF176";ctx.shadowBlur=8;
    ctx.beginPath();ctx.moveTo(t.x-14,t.y-52);ctx.lineTo(t.x+14,t.y-62);ctx.stroke();
    ctx.restore();
  });
}
// (THUNDER S3 windup-bolt draw fn removed — S3 now fires the dragon
// instantly on cast, no more standing-still charge phase to telegraph.)
// THUNDER CƯỜNG HÓA (buff sau S3): pulsing electric aura + timer label,
// shown for as long as either the damage buff or the speed buff is active.
function drawThunderBuffAura(p){
  if(p.charType!=="thunder")return;
  const buffed=(p._thunderBuffTimer>0)||(p._thunderSpeedBuffTimer>0);
  if(!buffed)return;
  const af=p.animFrame;
  for(let i=0;i<3;i++){
    const ang=(af*6+i*120)*Math.PI/180,r=44+Math.sin(af*0.2+i)*6;
    const sx=p.x+Math.cos(ang)*r,sy=p.y-70+Math.sin(ang)*r*0.5;
    ctx.save();ctx.shadowColor="#FFD700";ctx.shadowBlur=8;ctx.strokeStyle="#FFF176";ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(sx-6,sy-6);ctx.lineTo(sx+3,sy+2);ctx.lineTo(sx-2,sy+2);ctx.lineTo(sx+6,sy+8);ctx.stroke();
    ctx.restore();
  }
  const remain=Math.max(p._thunderBuffTimer||0,p._thunderSpeedBuffTimer||0);
  _text(p.x,p.y-140,`⚡ CƯỜNG HÓA (${Math.ceil(remain/60)}s)`,"gold","9px Arial bold");
}
// THUNDER SHIELD (khiên nhỏ từ S3): pulsing dashed ring around the caster
// while thunderShieldHp>0 — absorption itself is handled in applyDamage (06).
function drawThunderShield(p){
  if(p.charType!=="thunder"||!(p.thunderShieldHp>0))return;
  const pulse=Math.sin(p.animFrame*0.15)*4;
  ctx.save();ctx.globalAlpha=0.8;ctx.strokeStyle="#FFD700";ctx.lineWidth=3;ctx.setLineDash([5,4]);ctx.shadowColor="#FFF176";ctx.shadowBlur=10;
  ctx.beginPath();ctx.ellipse(p.x,p.y-40,46+pulse,68+pulse,0,0,Math.PI*2);ctx.stroke();
  ctx.setLineDash([]);ctx.restore();
  _text(p.x,p.y-118,`⚡ ${Math.ceil(p.thunderShieldHp)}`,"#FFD700","9px Arial bold");
}
// ULTIMATE — "PHÁN QUYẾT THIÊN LÔI": charge sparks around the caster
// (giai đoạn 1), then a lock-on ring over every marked target (giai đoạn
// 2-3, list frozen by thunderJudgmentTick in 06), then a lingering title
// once the final bolt has landed (giai đoạn 4). The individual bolts
// themselves are ordinary lightningArcs, spawned from thunderJudgmentTick().
function drawThunderOrb(p){
  if(p.charType!=="thunder"||p.activeSkill!=="thunder_s4"||p.ultiTimer<=0)return;
  const elapsed=THUNDER_ULTI_TOTAL-p.ultiTimer;
  const af=p.animFrame;
  const cx=p.x,cy=p.y-70;
  if(elapsed<THUNDER_CHARGE_FRAMES){
    // ================================================================
    //  GIAI ĐOẠN TỤ LỰC (2.5s) — làm thật hoành tráng theo yêu cầu: năng
    //  lượng hội tụ dần vào ngực (quầng sáng to dần), hạt điện bị "hút"
    //  từ vòng ngoài về người (ngược hướng 1 vụ nổ — tạo cảm giác đang gom
    //  sức mạnh chứ không phải đang xả ra), tia chớp giật quanh người dày
    //  đặc dần, vòng năng lượng nứt dưới chân lặp lại, rung màn hình tăng
    //  dần về cuối, thanh tiến độ phía trên đầu, và một khoảnh khắc bùng
    //  nổ ngay lúc chuyển sang giai đoạn bắn.
    // ================================================================
    const prog=elapsed/THUNDER_CHARGE_FRAMES;
    const r=18+70*prog;
    ctx.save();
    ctx.shadowColor="#FFD700";ctx.shadowBlur=28+30*prog;
    const grad=ctx.createRadialGradient(cx,cy,2,cx,cy,r);
    grad.addColorStop(0,"rgba(255,255,255,0.95)");
    grad.addColorStop(0.45,"rgba(255,220,80,0.85)");
    grad.addColorStop(1,"rgba(255,180,0,0)");
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
    ctx.restore();
    // hạt điện bị hút từ xa hội tụ về ngực
    if(rng()<0.55+0.35*prog){
      const ang=rng()*Math.PI*2,r0=90+rng()*70;
      const sx=cx+Math.cos(ang)*r0,sy=cy+Math.sin(ang)*r0*0.6;
      hitEffects.push({x:sx,y:sy,vx:(cx-sx)*0.09,vy:(cy-sy)*0.09,life:20,maxLife:20,particle:true,size:4+3*prog,color:rndChoice(["#FFD700","white","#FFF176"])});
    }
    // tia chớp giật quanh người, dày đặc dần khi càng gần lúc xong
    if(rng()<0.25+0.5*prog){
      const ang=rng()*Math.PI*2,r1=30+rng()*10,r2=r1+20+rng()*20;
      spawnLightningArc(cx+Math.cos(ang)*r1,cy+Math.sin(ang)*r1*1.2,cx+Math.cos(ang)*r2,cy+Math.sin(ang)*r2*1.2);
    }
    // vòng năng lượng nứt dưới chân, lặp lại đều đặn
    if(elapsed%14===0)hitEffects.push({x:p.x,y:p.y+2,life:26,maxLife:26,color:"#FFD700",ring:true,big:false});
    // KHIÊN CHẮN: vòng tròn năng lượng bao quanh toàn thân, cho thấy rõ
    // ràng không con nào chọc vào được trong lúc đang tụ lực — khớp với
    // tickThunderChargeShield() đẩy bật địch ra ở cùng bán kính này.
    ctx.save();
    const shieldR=THUNDER_CHARGE_SHIELD_RADIUS*SR;
    ctx.globalAlpha=0.22+0.1*Math.sin(frameCount*0.15);
    ctx.strokeStyle="#FFD700";ctx.lineWidth=3;
    ctx.shadowColor="#FFD700";ctx.shadowBlur=16;
    ctx.beginPath();ctx.ellipse(p.x,p.y-40,shieldR,shieldR*0.85,0,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=0.10;
    ctx.fillStyle="#FFD700";
    ctx.beginPath();ctx.ellipse(p.x,p.y-40,shieldR,shieldR*0.85,0,0,Math.PI*2);ctx.fill();
    ctx.restore();
    if(prog>0.7)screenShake=Math.max(screenShake,2+4*prog);
    _text(p.x,p.y-190,"⚡ TỤ LỰC THIÊN LÔI ⚡","white","13px Arial bold");
    ctx.save();
    ctx.fillStyle="rgba(0,0,0,0.4)";ctx.fillRect(p.x-40,p.y-180,80,7);
    ctx.fillStyle="#FFD700";ctx.fillRect(p.x-40,p.y-180,80*prog,7);
    ctx.strokeStyle="white";ctx.lineWidth=1;ctx.strokeRect(p.x-40,p.y-180,80,7);
    ctx.restore();
    // KHOẢNH KHẮC BÙNG NỔ — đúng lúc tụ lực xong, chuyển sang bắn tia
    if(elapsed===THUNDER_CHARGE_FRAMES-1){
      screenShake=Math.max(screenShake,22);
      hitEffects.push({x:cx,y:cy,life:12,maxLife:12,color:"#ffffff",ring:true,big:true});
      for(let i=0;i<24;i++){const ang=rng()*Math.PI*2,spd=rng()*9+3;hitEffects.push({x:cx,y:cy,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,life:26,maxLife:26,particle:true,color:rndChoice(["#FFD700","white"])});}
    }
  }else{
    // ================================================================
    //  GIAI ĐOẠN BẮN TIA (3s) — 1 dải sáng lớn 3 lớp (viền mờ dày + lõi
    //  vàng + tâm trắng) chạy từ người ra tới hết map theo hướng mặt hiện
    //  tại (bám theo vị trí thật vì nhân vật vẫn di chuyển được), hơi lắc
    //  nhẹ dọc thân cho cảm giác "sống" thay vì 1 đường thẳng chết cứng.
    //  Mỗi mốc 0.5s (khớp đúng lúc thunderJudgmentTick gây damage) có 1
    //  nhịp chớp sáng + rung màn hình để người chơi CẢM được từng nhịp 10
    //  dmg chứ không chỉ thấy máu tự trừ âm thầm.
    // ================================================================
    // TIA PHÓNG TO 2.5x + đẹp hơn: thêm 1 lớp quầng ngoài cùng rất mờ để
    // tia trông dày/uy lực hơn, cộng tia chớp phụ tách nhánh dọc theo thân
    // tia và các hạt sáng rơi dày hơn dọc đường đi, tất cả vẫn bám theo
    // đúng p.direction hiện tại (nhân vật quay hướng nào tia theo hướng đó).
    const BEAM_SCALE=2.5;
    const beamElapsed=elapsed-THUNDER_CHARGE_FRAMES;
    const dir=p.direction;
    const bx=p.x,by=p.y-70;
    const endX=dir>=0?(W*MAP_SCALE)+200:-200;
    ctx.save();
    ctx.shadowColor="#FFD700";ctx.shadowBlur=26*BEAM_SCALE*0.6;
    const layers=[
      {th:60,alpha:0.16,color:"#FFF6C9",wob:2.0}, // quầng ngoài cùng, rất mờ, rất dày
      {th:34,alpha:0.30,color:"#FFF6C9",wob:1.6},
      {th:20,alpha:0.58,color:"#FFD700",wob:1.0},
      {th:9,alpha:0.95,color:"#ffffff",wob:0.6},
    ];
    for(const L of layers){
      ctx.globalAlpha=L.alpha;
      ctx.strokeStyle=L.color;
      ctx.lineWidth=L.th*BEAM_SCALE;
      ctx.beginPath();ctx.moveTo(bx,by);
      const steps=8;
      for(let i=1;i<=steps;i++){
        const t=i/steps,xx=bx+(endX-bx)*t;
        const yy=by+Math.sin(af*0.6+i*1.3)*4*L.wob;
        ctx.lineTo(xx,yy);
      }
      ctx.stroke();
    }
    ctx.restore();
    // Tia chớp nhánh nhỏ tách ra khỏi thân tia chính, cho cảm giác điện thật
    if(rng()<0.5){
      const t=rng(),xx=bx+(endX-bx)*t,yy=by+Math.sin(af*0.6+t*8)*4;
      const branchLen=(20+rng()*24)*BEAM_SCALE*0.5;
      const ang=(rng()-0.5)*1.4;
      spawnLightningArc(xx,yy,xx+Math.cos(ang)*branchLen,yy+Math.sin(ang)*branchLen*2);
    }
    if(rng()<0.85){
      const t=rng();
      hitEffects.push({x:bx+(endX-bx)*t,y:by+rndInt(-16,16),vx:0,vy:-rng()*1.2,life:12,maxLife:12,particle:true,size:3+rng()*3,color:rndChoice(["#FFD700","white","#FFF176"])});
    }
    if(beamElapsed%THUNDER_BEAM_TICK===0){
      screenShake=Math.max(screenShake,9);
      hitEffects.push({x:bx,y:by,life:10,maxLife:10,color:"#ffffff",ring:true,big:false});
    }
    _text(p.x,p.y-190,"⚡ THIÊN LÔI GIÁNG ⚡","#FFD700","13px Arial bold");
  }
}

function drawFrostDomain(p){
  if(p.charType!=="frost"||!p.frostDomainActive)return;
  // The game's actual walkable "floor" is the dark tiled band BELOW the
  // red line (drawFloor draws it from floorY down to the bottom of the
  // screen) — and a grounded character's y IS that floorY. So the ice
  // needs to be painted straight onto that floor band as a rectangle that
  // widens outward from the feet, not as a disc hovering near the ankles.
  const rad=Math.max(2,p.frostDomainRadius);
  const topY=p.y,botY=H,leftX=p.x-rad,rightX=p.x+rad,w=rightX-leftX;
  // Base ice fill over the floor band, fading out toward the bottom
  const grad=ctx.createLinearGradient(0,topY,0,botY);
  grad.addColorStop(0,"rgba(190,235,255,0.55)");
  grad.addColorStop(0.4,"rgba(150,215,255,0.35)");
  grad.addColorStop(1,"rgba(120,190,240,0.12)");
  ctx.save();ctx.fillStyle=grad;ctx.fillRect(leftX,topY,w,botY-topY);ctx.restore();
  // A brighter icy sheen right at the surface
  ctx.save();ctx.globalAlpha=0.4;ctx.fillStyle="white";ctx.fillRect(leftX,topY,w,20);ctx.restore();
  // Solid bright rim exactly along the floor line — reads as a frozen edge
  ctx.save();ctx.strokeStyle="#EAFBFF";ctx.lineWidth=3;ctx.shadowColor="deepskyblue";ctx.shadowBlur=8;
  ctx.beginPath();ctx.moveTo(leftX,topY);ctx.lineTo(rightX,topY);ctx.stroke();ctx.restore();
  // Ice-vein cracks spidering out across the floor from the feet
  if(!p._domainVeins||p._domainVeins.length<10){
    p._domainVeins=[];
    for(let i=0;i<10;i++)p._domainVeins.push({dx:rng()*2-1,depth:rng()*0.7+0.15});
  }
  ctx.save();ctx.globalAlpha=0.55;ctx.strokeStyle="white";ctx.lineWidth=1;
  p._domainVeins.forEach(v=>{
    const vx=p.x+v.dx*rad,vy=topY+v.depth*70;
    const mx=p.x+v.dx*rad*0.4,my=topY+v.depth*30;
    ctx.beginPath();ctx.moveTo(p.x,topY+4);ctx.lineTo(mx,my);ctx.lineTo(vx,vy);ctx.stroke();
  });
  ctx.restore();
  // A light dusting of frost sparkle sitting ON the floor surface
  if(p._domainSnow.length<20&&rng()<0.5)p._domainSnow.push({x:p.x+rndInt(-rad,rad),y:topY+rndInt(4,60),life:40});
  _compact(p._domainSnow,s=>{s.life--;return s.life>0;});
  p._domainSnow.forEach(s=>{const a=Math.min(1,s.life/40);ctx.save();ctx.globalAlpha=a*0.75;_oval(s.x-2,s.y-2,4,4,"white",null);ctx.restore();});
  _text(p.x,topY-14,"❄️ FROZEN DOMAIN ❄️","deepskyblue","10px Arial bold");
}

// ================================================================
//  WIND PER-FRAME TICK — dash trail fade + Lốc Giam Cầm cyclone trap
//  (skill 4 "Đại Phong Bạo" ticks inline in the ulti-timer blocks, same
//  pattern as thunder_s4/frost_s4/earth_s4, since it shares the generic
//  ultiTimer countdown wired into GAMEPLAY/CHALLENGE/ROAD.)
// ================================================================
function tickWind(p){
  if(p.charType!=="wind")return;
  if(p.windDashTimer>0)p.windDashTimer--;
  if(p.windDashTrail.length){
    p.windDashTrail.forEach(t=>t.life--);
    _compact(p.windDashTrail,t=>t.life>0);
  }
  // LỐC GIAM CẦM — stationary cyclone that pulls enemies toward its core,
  // chips damage every ~0.33s, then bursts them upward when it collapses
  if(p.windCycloneActive){
    p.windCycloneTimer--;
    p.windCycloneTick++;
    const cx=p.windCycloneX,cy=p.windCycloneY,pullR=300*SR;
    getAllEnemies(p).forEach(opp=>{
      if(opp.hp<=0)return;
      const d=dist(cx,cy,opp.x,opp.y);
      if(d<pullR){
        if(isPushable(opp)){const pd=opp.x>=cx?-1:1;opp.x=clamp(opp.x+pd*7,moveBoundLo(),moveBoundHi());}
        if(p.windCycloneTick%20===0)applyDamage(opp,10,p);
      }
    });
    if(p.windCycloneTimer<=0){
      p.windCycloneActive=false;
      aoeHitAt(p,20,cx,cy,300);
      getAllEnemies(p).forEach(opp=>{if(opp.hp>0&&dist(cx,cy,opp.x,opp.y)<300*SR){if(opp instanceof Fighter)opp.vy=-14;spawnHitEffect(opp.x,opp.y-40,"#90EE90");}});
      screenShake=Math.max(screenShake,10);
    }
  }
  // hai cơn lốc bắn ra hai bên khi Đại Phong Bạo kết thúc — đẩy văng đối
  // thủ ra xa để giữ khoảng cách tốt hơn sau khi xoay bão
  if(p.windSideCyclones.length){
    p.windSideCyclones.forEach(c=>{
      c.x+=16*c.dir;
      c.life--;
      getAllEnemies(p).forEach(opp=>{
        if(opp.hp<=0||c.hitSet.has(opp))return;
        if(dist(c.x,c.y,opp.x,opp.y)<95*SR){
          c.hitSet.add(opp);
          applyDamage(opp,14,p);
          if(isPushable(opp)){const pd=c.dir>=0?1:-1;opp.x=clamp(opp.x+pd*260,moveBoundLo(),moveBoundHi());}
          if(opp instanceof Fighter)opp.vy=-8;
          spawnHitEffect(opp.x,opp.y-40,"#90EE90");
        }
      });
    });
    _compact(p.windSideCyclones,c=>c.life>0&&c.x>moveBoundLo()-150&&c.x<moveBoundHi()+150);
  }
}
function spawnWindSideCyclones(p){
  p.windSideCyclones.push({x:p.x,y:p.y,dir:1,life:75,hitSet:new Set()});
  p.windSideCyclones.push({x:p.x,y:p.y,dir:-1,life:75,hitSet:new Set()});
  screenShake=Math.max(screenShake,10);
}

function drawWindDashTrail(p){

function drawWindCyclone(p){
  if(p.charType!=="wind"||!p.windCycloneActive)return;
  const cx=p.windCycloneX,cy=p.windCycloneY,af=p.animFrame,rad=300*SR;
  ctx.save();ctx.globalAlpha=0.20;ctx.fillStyle="#90EE90";
  ctx.beginPath();ctx.ellipse(cx,cy,rad,rad*0.5,0,0,Math.PI*2);ctx.fill();ctx.restore();
  ctx.save();ctx.globalAlpha=0.55;ctx.strokeStyle="#CCFFCC";ctx.lineWidth=2;ctx.setLineDash([7,5]);
  ctx.beginPath();ctx.ellipse(cx,cy,rad,rad*0.5,0,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.restore();
  for(let layer=0;layer<10;layer++){
    const frac=layer/10,layerY=cy+50-frac*260,baseR=rad*(1-frac*0.55)+10,spin=Math.sin(af*0.22+frac*Math.PI*2.4)*(26-frac*10);
    ctx.strokeStyle=["#0a330a","#0f4d0f","#166416","#228B22","#2fa82f","#32CD32","#57DE57","#7CFC00","#ADFF2F","#F0FFF0"][layer];
    ctx.lineWidth=3;ctx.save();ctx.shadowColor="#90EE90";ctx.shadowBlur=6;
    ctx.beginPath();ctx.ellipse(cx+spin,layerY,baseR,20,0,0,Math.PI*2);ctx.stroke();ctx.restore();
  }
  if(!p._cycloneDebris)p._cycloneDebris=[0,1,2,3,4].map(i=>({ang:i*72,r:rndInt(40,rad*0.9),s:rndInt(4,9)}));
  p._cycloneDebris.forEach(d=>{
    d.ang+=8;
    const dx=cx+Math.cos(d.ang*Math.PI/180)*d.r,dy=cy-10+Math.sin(d.ang*Math.PI/180)*d.r*0.45;
    ctx.save();ctx.shadowColor="#90EE90";ctx.shadowBlur=6;ctx.fillStyle="#E0FFE0";
    ctx.beginPath();ctx.ellipse(dx,dy,d.s,d.s*0.5,d.ang*Math.PI/180,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });
  _text(cx,cy-rad*0.5-22,"🌀 LỐC GIAM CẦM 🌀","#90EE90","12px Arial bold");
}

function tickV4(p){
  if(!p.transformActive)return;
  if(p.transformTimer>0)p.transformTimer--;
  else{
    p.transformActive=false;p.isFlying=false;p.v4LifestealPct=0;p.ghostHp=0;p.transformInvisActive=false;p.transformInvisTimer=0;p._shadowRedGlow=false;
    if(p.charType==="red"){
      // Small closing burst + distinct sound as the Hỏa Ma Thần fire dies down to embers.
      sfxTransformEnd();
      p.hoaChungStacks=0;p.hoaChungFlashTimer=0;p._fireFlyTrail=[];
      for(let i=0;i<16;i++){const ang=rng()*Math.PI*2,spd=rng()*3+1.5;hitEffects.push({x:p.x,y:p.y-60,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-1,life:28,maxLife:28,particle:true,color:rndChoice(["#FF6600","#FF9900","#FFCC33","#552200"])});}
      hitEffects.push({x:p.x,y:p.y-60,life:22,maxLife:22,color:"#FF6600",ring:true});
    }
    return;
  }
  if(p.charType==="thunder"){
    // V4 AURA (Storm Field): crackling field around the fighter — anyone
    // standing in it gets a light shock, builds Shock Stack, and takes
    // damage over time. Occasional random bolts crash nearby too, giving
    // the "storm following the god" feel.
    // Bán kính hạ từ 540 xuống 220 (quá bá — gần như phủ hết màn hình cũ) —
    // đổi lại F (S2 Lôi Ảnh) hồi chiêu gần như tức thời khi đang biến hình,
    // xem castSkill thunder skillNum===2.
    p.thunderAuraTick++;
    if(p.thunderAuraTick>=15){
      p.thunderAuraTick=0;
      getAllEnemies(p).forEach(opp=>{
        if(dist(p.x,p.y,opp.x,opp.y)<220){
          applyDamage(opp,2.5,p);
          addShock(opp,p);
        }
      });
    }
    if(rng()<0.10){
      const sx=p.x+rndInt(-120,120),sy=p.y-rndInt(100,180);
      spawnLightningArc(sx,sy,sx+rndInt(-20,20),p.y-30);
    }
  }
  if((p.charType==="frost"||p.charType==="red")&&!p.isFlying)p.isFlying=true;
  // RED V4 — HỎA PHI: while streaking through the air as a living flame, anyone
  // caught in the trail takes periodic burn damage (the "quái va vào luồng lửa" rule).
  if(p.charType==="red"&&p.isFlying){
    p.fireFlyDamageTick=(p.fireFlyDamageTick||0)+1;
    if(p.fireFlyDamageTick>=14){
      p.fireFlyDamageTick=0;
      getAllEnemies(p).forEach(opp=>{
        if(dist(p.x,p.y,opp.x,opp.y)<130*SR){
          applyDamage(opp,4,p);
          spawnHitEffect(opp.x,opp.y-40,"#FF6600");
        }
      });
    }
  }
  if(p.charType==="water"){p.waterRegenTick++;if(p.waterRegenTick>=15){p.waterRegenTick=0;p.hp=Math.min(p.maxHp||MAX_HP,p.hp+3);}p.waterSlowAuraTick++;if(p.waterSlowAuraTick>=30){p.waterSlowAuraTick=0;getAllEnemies(p).forEach(opp=>{if(dist(p.x,p.y,opp.x,opp.y)<320){opp.slowTimer=Math.max(opp.slowTimer||0,45);opp._slowPct=0.8;}});}}
  if(p.charType==="wind"){p.windMiniTornadoTick++;if(p.windMiniTornadoTick===1){getAllEnemies(p).forEach(opp=>{if(dist(p.x,p.y,opp.x,opp.y)<160){if(opp instanceof Fighter)opp.vy=-16;applyDamage(opp,5,p);}});}else if(p.windMiniTornadoTick>=120)p.windMiniTornadoTick=0;}
  // EARTH V4: slow aura + ground rumble
  if(p.charType==="earth"&&p.transformActive){
    p.waterSlowAuraTick++; // reusing this timer
    if(p.waterSlowAuraTick>=40){
      p.waterSlowAuraTick=0;
      getAllEnemies(p).forEach(opp=>{
        if(dist(p.x,p.y,opp.x,opp.y)<280){
          opp.slowTimer=Math.max(opp.slowTimer||0,30);
          opp._slowPct=Math.max(opp._slowPct||0,0.4);
        }
      });
    }
    // Ground rumble particles
    if(p.onGround&&p.waterSlowAuraTick%20===0){

// ================================================================
//  WATER RAIN CLOUD TICK (skill 2)
// ================================================================
function tickWaterCloud(p){
  if(p.dmgReduceTimer>0)p.dmgReduceTimer--;
  if(!p.waterCloudTimer||p.waterCloudTimer<=0){p.waterCloudTimer=0;return;}
  p.waterCloudTimer--;
  p.waterCloudTick=(p.waterCloudTick||0)+1;
  if(p.waterCloudTick>=60){p.waterCloudTick=0;p.hp=Math.min(p.maxHp||MAX_HP,p.hp+2);}
  if(!p.waterCloudDrops)p.waterCloudDrops=[];
  if(rng()<0.5&&p.waterCloudDrops.length<20)p.waterCloudDrops.push({x:p.x+rndInt(-45,45),y:p.y-rndInt(60,130),r:rndInt(2,4)});
  p.waterCloudDrops.forEach(d=>{d.y+=6;});
  _compact(p.waterCloudDrops,d=>d.y<p.y+10);
  getAllEnemies(p).forEach(opp=>{
    if(Math.abs(opp.x-p.x)<75&&Math.abs(opp.y-p.y)<100){
      opp.slowTimer=Math.max(opp.slowTimer||0,15);opp._slowPct=0.5;
    }
  });
}

function drawFloor(floorY,pvpMode,camX=0){
  const fc=frameCount;
  ctx.fillStyle="#1a1a2e";ctx.fillRect(camX,floorY,W,H-floorY);
  ctx.fillStyle="#2d2d44";ctx.fillRect(camX,floorY,W,22);
  ctx.strokeStyle=pvpMode?"#7b68ee":"#e84545";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(camX,floorY);ctx.lineTo(camX+W,floorY);ctx.stroke();
  ctx.strokeStyle=pvpMode?"#9b88ff":"#ff6666";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(camX,floorY+1);ctx.lineTo(camX+W,floorY+1);ctx.stroke();
  for(let row=0;row<4;row++){const fy2=floorY+22+row*28;ctx.strokeStyle="#252540";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(camX,fy2);ctx.lineTo(camX+W,fy2);ctx.stroke();}
  const tileW=120;const startCol=Math.floor(camX/tileW);for(let col=startCol;col<startCol+Math.ceil(W/tileW)+2;col++){const tx2=col*tileW;for(let row=0;row<5;row++){const fy2=floorY+22+row*28;if(fy2<H){ctx.strokeStyle="#252540";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(tx2,floorY+22);ctx.lineTo(tx2,Math.min(fy2+28,H));ctx.stroke();}}}
  const pulse=Math.abs(fc%120-60)/60,ga=Math.floor(80+pulse*60);
  ctx.strokeStyle=pvpMode?`rgba(${ga},${Math.floor(ga*0.6)},255,1)`:`rgba(${ga},${Math.floor(ga*0.15)},${Math.floor(ga*0.15)},1)`;
  ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(camX,floorY-1);ctx.lineTo(camX+W,floorY-1);ctx.stroke();
}

// EARTH's own rage bar: nền nâu đất thay vì đỏ, khi thanh gần đầy (70%+)
// các vết nứt vàng cam sáng dần lan trên bề mặt (như đá sắp vỡ), và khi
// đầy/đang biến hình thì bắn bụi đất + mảnh đá bay lên thay cho khói xám
// dùng chung — kept fully separate so every other character's bar is
// untouched.
function _drawEarthRageBar(bx,by,bw,bh,fighter){
  const cdMax=1200,cd=fighter.cds.s5||0;
  const ready=cd<=0;
  const fillFrac=ready?1:clamp(1-(cd/cdMax),0,1);
  _rect(bx,by,bw,bh,"#2a1e14","#111",1);
  const fillW=Math.max(0,bw*fillFrac);
  const grad=ctx.createLinearGradient(bx,by,bx+fillW,by);
  grad.addColorStop(0,"#4a3524");
  grad.addColorStop(1,ready?"#c68a4a":"#8a6a4a");
  ctx.fillStyle=grad;
  ctx.fillRect(bx,by,fillW,bh);
  _rectOutline(bx,by,bw,bh,"#000",1);
  // VẾT NỨT SÁNG DẦN — chỉ xuất hiện khi thanh đã đầy từ 70% trở lên, càng
  // gần đầy càng rõ, như đá sắp vỡ ra trước khi bung sức mạnh.
  if(fillFrac>0.7){
    const crackA=(fillFrac-0.7)/0.3;
    ctx.save();ctx.globalAlpha=crackA*0.85;ctx.strokeStyle="#ffcc66";ctx.shadowColor="#ffaa33";ctx.shadowBlur=4;ctx.lineWidth=1;
    for(let i=0;i<4;i++){
      const cx=bx+(i+0.5)*(bw/4);
      if(cx>bx+fillW+3)continue;
      ctx.beginPath();ctx.moveTo(cx,by+1);ctx.lineTo(cx+3,by+bh*0.4);ctx.lineTo(cx-2,by+bh-1);ctx.stroke();
    }
    ctx.restore();
  }
  // BỤI ĐẤT + MẢNH ĐÁ bay lên khi sẵn sàng hoặc đang biến hình — thay cho

  if(ready||fighter.transformActive){
    if(!fighter._earthRageDust)fighter._earthRageDust=[];
    if(rng()<0.6)fighter._earthRageDust.push({x:bx+rng()*bw,y:by,vx:(rng()-0.5)*0.4,vy:-rng()*0.8-0.3,life:30,r:rng()*3+2});
    _compact(fighter._earthRageDust,s=>s.life>0);
    fighter._earthRageDust.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.life--;ctx.beginPath();ctx.fillStyle=`rgba(140,106,74,${Math.max(0,s.life/30*0.6)})`;ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();});
  }
  _text(bx+bw/2,by+bh/2,ready?"NỘ (SẴN SÀNG)":"NỘ","white","9px Arial bold");
}
// SHADOW's own rage bar: near-black fill, small purple tentacles that wiggle
// along the filled edge, and black smoke (instead of the generic gray) once
// full — kept fully separate from drawRageBar() above so every other
// character's bar is untouched.
function _drawShadowRageBar(bx,by,bw,bh,fighter){
  const cdMax=1200,cd=fighter.cds.s5||0;
  const ready = cd<=0;
  const fillFrac = ready ? 1 : clamp(1-(cd/cdMax),0,1);
  _rect(bx,by,bw,bh,"#0a0612","#000",1);
  const fillW=Math.max(0,bw*fillFrac);
  const grad=ctx.createLinearGradient(bx,by,bx+fillW,by);
  grad.addColorStop(0,"#170a26");
  grad.addColorStop(1,ready?"#6a2fd9":"#3a1a5e");
  ctx.fillStyle=grad;
  ctx.fillRect(bx,by,fillW,bh);
  _rectOutline(bx,by,bw,bh,"#bb44ff",1);
  // wiggling tentacles poking up out of the filled portion
  const tentCount=Math.max(2,Math.round(fillFrac*8));
  for(let i=0;i<tentCount;i++){
    const tx=bx+(i+0.5)*(bw/8);
    if(tx>bx+fillW+3)continue;
    const wig=Math.sin(frameCount*0.15+i*1.7)*3;
    const tipLift=2+Math.abs(Math.sin(frameCount*0.08+i*0.9))*3;
    ctx.save();
    ctx.strokeStyle="#6654ff";ctx.lineWidth=2;ctx.lineCap="round";
    ctx.shadowColor="#bb44ff";ctx.shadowBlur=4;
    ctx.beginPath();
    ctx.moveTo(tx,by+1);
    ctx.quadraticCurveTo(tx+wig,by-bh*0.55,tx+wig*1.4,by-bh*0.9-tipLift);
    ctx.stroke();
    ctx.restore();
  }
  // black smoke once full/ready (or while actively transformed)
  if(ready||fighter.transformActive){
    if(!fighter._shadowRageSmoke)fighter._shadowRageSmoke=[];
    if(rng()<0.7)fighter._shadowRageSmoke.push({x:bx+rng()*bw,y:by,vx:(rng()-0.5)*0.4,vy:-rng()*0.9-0.3,life:34,r:rng()*5+3});
    _compact(fighter._shadowRageSmoke,s=>s.life>0);
    fighter._shadowRageSmoke.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.life--;ctx.beginPath();ctx.fillStyle=`rgba(8,4,14,${Math.max(0,s.life/34*0.75)})`;ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();});
  }
  _text(bx+bw/2,by+bh/2,ready?"NỘ (SẴN SÀNG)":"NỘ","white","9px Arial bold");
}
// THUNDER's own rage bar: nền vàng điện, các tia sét răng cưa nhỏ chạy dọc
// theo mép thanh đầy (thay cho xúc tu của Shadow), và khi đầy/đang biến
// hình thì bắn tia lửa điện trắng-vàng bay lên (thay cho khói xám chung) —
// tách riêng khỏi drawRageBar() y như cách _drawShadowRageBar() đã làm, để
// không đụng tới các nhân vật khác.
// Sinh 1 tia sét răng cưa (mảng điểm) đi từ (sx,sy) hắt CHÉO ra ngoài/lên
// trên — dùng chung cho cả tia nhỏ ven mép lẫn tia lớn "đánh ra ngoài".
function _thunderBoltPath(sx,sy,dirX,length,segments,dirY=-1){
  const pts=[{x:sx,y:sy}];
  let cx=sx,cy=sy;
  const segLen=length/segments;
  for(let i=0;i<segments;i++){
    cx+=dirX*segLen*(0.55+rng()*0.5)+(rng()-0.5)*8;
    cy+=dirY*segLen*(0.65+rng()*0.55);
    pts.push({x:cx,y:cy});
  }
  return pts;
}
function _strokeBoltPath(pts,coreColor,glowColor,coreW,glowW,glowBlur,alpha){
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.lineJoin="round";ctx.lineCap="round";
  // lớp glow dày, mờ, phía dưới
  ctx.strokeStyle=glowColor;ctx.lineWidth=glowW;
  ctx.shadowColor=glowColor;ctx.shadowBlur=glowBlur;
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
  ctx.stroke();
  // lõi trắng mảnh, sắc nét, phía trên
  ctx.strokeStyle=coreColor;ctx.lineWidth=coreW;
  ctx.shadowBlur=glowBlur*0.5;
  ctx.stroke();
  ctx.restore();
}
function _drawThunderRageBar(bx,by,bw,bh,fighter){
  const cdMax=1200,cd=fighter.cds.s5||0;
  const ready = cd<=0;
  const fillFrac = ready ? 1 : clamp(1-(cd/cdMax),0,1);
  _rect(bx,by,bw,bh,"#332b00","#000",1);
  const fillW=Math.max(0,bw*fillFrac);
  // chớp sáng nền ngắn khi vừa có tia sét lớn đánh ra (bên dưới phần fill)
  if(fighter._thunderRageFlash>0){
    const fa=fighter._thunderRageFlash/8;
    ctx.save();ctx.globalAlpha=fa*0.55;ctx.fillStyle=THUNDER_WHITE;ctx.fillRect(bx,by,fillW,bh);ctx.restore();
    fighter._thunderRageFlash--;
  }
  const grad=ctx.createLinearGradient(bx,by,bx+fillW,by);
  grad.addColorStop(0,"#7a5f00");
  grad.addColorStop(1,ready?THUNDER_YELLOW:"#c9a300");
  ctx.fillStyle=grad;
  ctx.fillRect(bx,by,fillW,bh);
  _rectOutline(bx,by,bw,bh,THUNDER_GOLD,1);
  // === TIA SÉT LỚN "ĐÁNH RA NGOÀI" — bật ra từ NGAY TRONG lòng thanh nộ,
  // phóng chéo ra ngoài ở CẢ mép TRÊN (hắt lên) lẫn mép DƯỚI (hắt xuống)
  // của thanh, thay hẳn cho các răng cưa nhỏ tĩnh trước đây (đã bỏ, tránh
  // trùng lặp 2 hiệu ứng làm cùng 1 việc). Chỉ nảy sinh khi thanh có phần
  // đầy (fillW>4), tần suất tăng dần theo fillFrac, dày đặc nhất khi
  // ready/đang biến hình.
  if(!fighter._thunderRageBolts)fighter._thunderRageBolts=[];
  if(fillW>4){
    const spawnChance = (ready||fighter.transformActive) ? 0.10 : 0.02*fillFrac;
    if(rng()<spawnChance){
      const ox=bx+rng()*fillW;
      const dirX=rng()<0.5?-1:1;
      const fromTop=rng()<0.5;
      const oy=fromTop?by:by+bh;
      const dirY=fromTop?-1:1;
      const len=14+rng()*10+(ready?6:0);
      const pts=_thunderBoltPath(ox,oy,dirX,len,3+Math.floor(rng()*2),dirY);
      fighter._thunderRageBolts.push({pts,life:9,maxLife:9});
      fighter._thunderRageFlash=8;
      // đôi khi thêm 1 nhánh rẽ ngắn cho tia thêm dữ dội
      if(rng()<0.5){
        const branchFrom=pts[Math.min(1,pts.length-1)];
        const bpts=_thunderBoltPath(branchFrom.x,branchFrom.y,-dirX,len*0.5,2,dirY);
        fighter._thunderRageBolts.push({pts:bpts,life:9,maxLife:9});
      }
    }
  }
  _compact(fighter._thunderRageBolts,b=>b.life>0);
  fighter._thunderRageBolts.forEach(b=>{
    const a=Math.max(0,b.life/b.maxLife);
    _strokeBoltPath(b.pts,THUNDER_WHITE,THUNDER_GOLD,1.4,4.5,9,a);
    b.life--;
  });
  // tia lửa điện trắng-vàng bắn lên khi đầy/ready hoặc đang biến hình (thay cho khói xám chung)
  if(ready||fighter.transformActive){
    if(!fighter._thunderRageSparks)fighter._thunderRageSparks=[];
    if(rng()<0.7)fighter._thunderRageSparks.push({x:bx+rng()*bw,y:by,vx:(rng()-0.5)*0.6,vy:-rng()*1.1-0.4,life:26,r:rng()*2.5+1});
    _compact(fighter._thunderRageSparks,s=>s.life>0);
    fighter._thunderRageSparks.forEach(s=>{
      s.x+=s.vx;s.y+=s.vy;s.life--;
      ctx.save();ctx.shadowColor=THUNDER_GOLD;ctx.shadowBlur=6;
      ctx.fillStyle=`rgba(255,${Math.floor(220+rng()*35)},${Math.floor(100*Math.max(0,s.life/26))},${Math.max(0,s.life/26)})`;
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
      ctx.restore();
    });
  }
  _text(bx+bw/2,by+bh/2,ready?"NỘ (SẴN SÀNG)":"NỘ","white","9px Arial bold");
}
// FROST's own rage bar: nền băng xanh nhạt, các mảnh băng nhọn (thay cho
// xúc tu của Shadow / tia sét của Thunder) mọc dọc mép thanh đầy, và khi
// đầy/đang biến hình thì bắn ra các hạt tuyết/sương lạnh bay lên (thay cho
// khói xám chung) — tách riêng khỏi drawRageBar() y hệt cách
// _drawShadowRageBar()/_drawThunderRageBar() đã làm, để không đụng tới các
// nhân vật khác.
function _drawFrostRageBar(bx,by,bw,bh,fighter){
  const cdMax=1200,cd=fighter.cds.s5||0;
  const ready = cd<=0;
  const fillFrac = ready ? 1 : clamp(1-(cd/cdMax),0,1);
  _rect(bx,by,bw,bh,"#031824","#000",1);
  const fillW=Math.max(0,bw*fillFrac);
  const grad=ctx.createLinearGradient(bx,by,bx+fillW,by);
  grad.addColorStop(0,"#0e4a66");
  grad.addColorStop(1,ready?"#66CCFF":"#2f7ea6");
  ctx.fillStyle=grad;
  ctx.fillRect(bx,by,fillW,bh);
  _rectOutline(bx,by,bw,bh,"#AEEBFF",1);
  // lớp vảy băng TĨNH (không hoạt hình, không nhô ra ngoài) nằm NGAY BÊN
  // TRONG thanh, phủ lên trên phần đã đầy — 2 hàng vảy hình thoi so le,
  // giữ nguyên vị trí cố định (không xúc tu, không nhấp nhô theo thời gian).
  if(fillW>1){
    ctx.save();
    ctx.beginPath();ctx.rect(bx,by,fillW,bh);ctx.clip();
    const scaleW=9,rows=2;
    for(let row=0;row<rows;row++){
      const rowCY=by+bh*(row+0.5)/rows;
      const rowHalf=bh/(rows*2);
      const offset=(row%2)*scaleW/2;
      for(let sx=bx-offset;sx<bx+bw+scaleW;sx+=scaleW){
        ctx.save();
        ctx.globalAlpha=0.3;
        ctx.fillStyle="white";
        ctx.strokeStyle="rgba(255,255,255,0.55)";ctx.lineWidth=0.7;
        ctx.beginPath();
        ctx.moveTo(sx,rowCY-rowHalf);
        ctx.lineTo(sx+scaleW/2,rowCY);
        ctx.lineTo(sx,rowCY+rowHalf);
        ctx.lineTo(sx-scaleW/2,rowCY);
        ctx.closePath();
        ctx.fill();ctx.stroke();
        ctx.restore();
      }
    }
    ctx.restore();
  }
  // hạt tuyết/sương lạnh bay lên khi đầy/ready hoặc đang biến hình (thay cho khói xám chung)
  if(ready||fighter.transformActive){
    if(!fighter._frostRageMist)fighter._frostRageMist=[];
    if(rng()<0.7)fighter._frostRageMist.push({x:bx+rng()*bw,y:by,vx:(rng()-0.5)*0.4,vy:-rng()*0.9-0.3,life:30,r:rng()*3+1.5});
    _compact(fighter._frostRageMist,s=>s.life>0);
    fighter._frostRageMist.forEach(s=>{
      s.x+=s.vx;s.y+=s.vy;s.life--;
      ctx.save();ctx.shadowColor="#AEEBFF";ctx.shadowBlur=5;
      ctx.fillStyle=`rgba(200,240,255,${Math.max(0,s.life/30*0.75)})`;
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
      ctx.restore();
    });
  }
  _text(bx+bw/2,by+bh/2,ready?"NỘ (SẴN SÀNG)":"NỘ","white","9px Arial bold");
}

function _hitTestVBtn(x,y,btn){ return btn && Math.hypot(x-btn.x, y-btn.y) <= ((btn.r||30)+6); }
function drawTouchEditor(){

  else if (vBtns1.joystick) drawJoystick(vBtns1.joystick, false);

  _rect(W-140,16,120,32,"#2d6a2d","white",1); _text(W-80,32,"XONG","white","11px Arial bold");

  if(touchEditorSelKey){
    const by=H-70;
    _text(W/2,by-22,`Đang chỉnh: ${_TOUCH_EDITOR_BTN_LABELS[touchEditorSelKey]}`,"white","11px Arial bold");
    _rect(W/2-140,by-16,44,44,"#333","white",2); _text(W/2-118,by+6,"−","white","20px Arial bold");
    _rect(W/2-40,by-16,80,44,"#444","#888",1); _text(W/2,by+6,`x${mobileLayoutCfg[touchEditorSelKey].scale.toFixed(1)}`,"white","10px Arial bold");
    _rect(W/2+96,by-16,44,44,"#333","white",2); _text(W/2+118,by+6,"+","white","20px Arial bold");
    _rect(W/2+160,by-16,110,44,"#7a3b3b","white",1); _text(W/2+215,by+6,"Đặt lại nút","white","9px Arial bold");
  }
}
function handleTouchEditorPointer(x,y,phase){
  if(phase==="down"){
    if(x>=20&&x<=160&&y>=16&&y<=48){
      Object.keys(mobileLayoutCfg).forEach(k=>{mobileLayoutCfg[k]={dx:0,dy:0,scale:1};});
      mobileLayoutVersion++; touchEditorSelKey=null; touchEditorDrag=null; return;
    }
    if(x>=W-140&&x<=W-20&&y>=16&&y<=48){ gameState="MENU"; touchEditorDrag=null; return; }
    if(x>=W/2-115&&x<=W/2+115&&y>=56&&y<=86){
      touchMoveStyle = touchMoveStyle==="dpad" ? "joystick" : "dpad"; return;
    }
    if(touchEditorSelKey){
      const by=H-70;
      if(x>=W/2-140&&x<=W/2-96&&y>=by-16&&y<=by+28){
        const c=mobileLayoutCfg[touchEditorSelKey]; c.scale=Math.max(0.6,+(c.scale-0.1).toFixed(2)); mobileLayoutVersion++; return;
      }
      if(x>=W/2+96&&x<=W/2+140&&y>=by-16&&y<=by+28){
        const c=mobileLayoutCfg[touchEditorSelKey]; c.scale=Math.min(1.8,+(c.scale+0.1).toFixed(2)); mobileLayoutVersion++; return;
      }
      if(x>=W/2+160&&x<=W/2+270&&y>=by-16&&y<=by+28){
        mobileLayoutCfg[touchEditorSelKey]={dx:0,dy:0,scale:1}; mobileLayoutVersion++; return;
      }
    }
    buildVBtns();
    const order=["joystick","s2","s3","s4","shield","v4"];
    for(const k of order){
      const testBtn = (k==="joystick"&&touchMoveStyle==="dpad") ? {x:vBtns1.joystick.x,y:vBtns1.joystick.y,r:vBtns1.joystick.r*1.6} : vBtns1[k];
      if(_hitTestVBtn(x,y,testBtn)){
        touchEditorSelKey=k;
        touchEditorDrag={key:k, startX:x, startY:y, baseDx:mobileLayoutCfg[k].dx, baseDy:mobileLayoutCfg[k].dy};
        return;
      }
    }
    touchEditorSelKey=null; touchEditorDrag=null;
  }else if(phase==="move"){
    if(!touchEditorDrag) return;
    const c=mobileLayoutCfg[touchEditorDrag.key];
    c.dx = touchEditorDrag.baseDx + (x-touchEditorDrag.startX);
    c.dy = touchEditorDrag.baseDy + (y-touchEditorDrag.startY);
    mobileLayoutVersion++;
  }else if(phase==="up"){
    touchEditorDrag=null;
  }
}

// ================================================================
//  MINIGAME: KHỦNG LONG (DINO) — đặt trong không gian tọa độ ảo
//  600x200, rồi co giãn/canh giữa vào canvas chính W x H
// ================================================================
const DINO_VW = 600, DINO_VH = 200;
const DINO_GROUND_Y = 160;
const DINO_GRAVITY = 0.6;
const DINO_JUMP_FORCE = -11;

let dinoScore = 0;
let dinoHighScore = 0;
let dinoSpeed = 6;
let dinoIsGameOver = false;
let dinoFrame = 0;
let dinoObstacles = [];
let dinoClouds = [];
let dinoStarted = false;

const dinoChar = {
  x:40, y:DINO_GROUND_Y-40, width:40, height:40, vy:0,
  isJumping:false, isDucking:false, legFrame:0
};

function dinoReset(){
  dinoScore=0; dinoSpeed=6; dinoObstacles=[]; dinoClouds=[];
  dinoChar.y=DINO_GROUND_Y-40; dinoChar.vy=0; dinoChar.isJumping=false; dinoChar.isDucking=false;
  dinoIsGameOver=false; dinoFrame=0; dinoStarted=true;
}
function dinoJump(){
  if(dinoIsGameOver)return;
  if(!dinoChar.isJumping){ dinoChar.vy=DINO_JUMP_FORCE; dinoChar.isJumping=true; }
}
function dinoDuck(state){
  if(dinoIsGameOver)return;
  dinoChar.isDucking = state && !dinoChar.isJumping;
}
function dinoSpawnObstacle(){
  const isBird = Math.random()<0.25 && dinoScore>150;
  if(isBird){
    const heights=[DINO_GROUND_Y-30,DINO_GROUND_Y-60,DINO_GROUND_Y-90];
    dinoObstacles.push({type:'bird',x:DINO_VW,y:heights[Math.floor(Math.random()*heights.length)],width:34,height:24,frame:0});
  }else{
    const wide=Math.random()<0.35;
    const h=30+Math.random()*20;
    dinoObstacles.push({type:'cactus',x:DINO_VW,y:DINO_GROUND_Y-h,width:wide?34:18,height:h});
  }
}
function dinoSpawnCloud(){
  dinoClouds.push({x:DINO_VW,y:20+Math.random()*50,width:46});
}
function dinoRectsCollide(a,b){
  const pad=6;
  return a.x+pad<b.x+b.width-pad && a.x+a.width-pad>b.x+pad && a.y+pad<b.y+b.height-pad && a.y+a.height-pad>b.y+pad;
}
function dinoDrawGround(){
  ctx.strokeStyle='#535353';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,DINO_GROUND_Y);ctx.lineTo(DINO_VW,DINO_GROUND_Y);ctx.stroke();
  ctx.fillStyle='#535353';
  for(let i=0;i<30;i++){
    const x=(i*40-(dinoFrame*dinoSpeed*0.5)%40+DINO_VW)%DINO_VW;
    ctx.fillRect(x,DINO_GROUND_Y+4,12,2);
  }
}
function dinoDrawChar(){
  ctx.fillStyle='#535353';
  const y=dinoChar.isDucking?DINO_GROUND_Y-20:dinoChar.y;
  const h=dinoChar.isDucking?20:dinoChar.height;
  const w=dinoChar.isDucking?55:dinoChar.width;
  ctx.fillRect(dinoChar.x,y,w,h);
  ctx.fillStyle='#f7f7f7';
  ctx.fillRect(dinoChar.x+w-12,y+6,4,4);
  ctx.fillStyle='#535353';
  if(!dinoChar.isJumping&&!dinoIsGameOver){ dinoChar.legFrame+=0.2; }
  if(!dinoChar.isDucking){
    const legOffset=Math.floor(dinoChar.legFrame)%2===0?0:6;
    ctx.fillRect(dinoChar.x+6,y+h,8,8-legOffset);
    ctx.fillRect(dinoChar.x+w-16,y+h,8,8+(legOffset?-legOffset:0));
  }
}
function dinoDrawObstacle(o){
  ctx.fillStyle='#535353';
  if(o.type==='cactus'){ ctx.fillRect(o.x,o.y,o.width,o.height); }
  else{
    o.frame+=0.15;
    const wingUp=Math.floor(o.frame)%2===0;
    ctx.fillRect(o.x,o.y+8,o.width,10);
    ctx.fillRect(o.x+8,wingUp?o.y:o.y+14,18,6);
  }
}
function dinoDrawCloud(c){
  ctx.fillStyle='#c8c8c8';
  ctx.fillRect(c.x,c.y,c.width,6);
  ctx.fillRect(c.x+8,c.y-4,c.width-16,6);
}
function dinoDrawScore(){
  ctx.fillStyle='#535353';
  ctx.font='16px Courier New';
  ctx.textAlign='right';ctx.textBaseline='alphabetic';
  const s=Math.floor(dinoScore).toString().padStart(5,'0');
  ctx.fillText(`HI ${Math.floor(dinoHighScore).toString().padStart(5,'0')}   ${s}`,DINO_VW-10,24);
}
function dinoUpdatePhysics(){
  dinoFrame++;
  dinoChar.vy+=DINO_GRAVITY; dinoChar.y+=dinoChar.vy;
  if(dinoChar.y>=DINO_GROUND_Y-dinoChar.height){
    dinoChar.y=DINO_GROUND_Y-dinoChar.height; dinoChar.vy=0; dinoChar.isJumping=false;
  }
  dinoScore+=0.15;
  if(dinoScore-dinoHighScore>0) dinoHighScore=dinoScore;
  dinoSpeed=6+dinoScore/200;
  if(dinoFrame%Math.max(50,Math.floor(90-dinoSpeed*3))===0) dinoSpawnObstacle();
  if(dinoFrame%150===0) dinoSpawnCloud();
  dinoObstacles.forEach(o=>o.x-=dinoSpeed);
  _compact(dinoObstacles,o=>o.x+o.width>0);
  dinoClouds.forEach(c=>c.x-=dinoSpeed*0.4);
  _compact(dinoClouds,c=>c.x+c.width>0);
  const dinoBox={
    x:dinoChar.x,
    y:dinoChar.isDucking?DINO_GROUND_Y-20:dinoChar.y,
    width:dinoChar.isDucking?55:dinoChar.width,
    height:dinoChar.isDucking?20:dinoChar.height
  };
  for(const o of dinoObstacles){ if(dinoRectsCollide(dinoBox,o)){ dinoIsGameOver=true; break; } }
}
function dinoGetTransform(){
  const availW=W*0.82, availH=H*0.5;
  const s=Math.min(availW/DINO_VW, availH/DINO_VH);
  const offX=W/2-(DINO_VW*s)/2;
  const offY=H*0.30;
  return {s,offX,offY};
}
const DINO_BACK_BTN={x:20,w:150,h:40};
function updateMinigameDino(){
  if(!dinoStarted) dinoReset();
  if(!dinoIsGameOver) dinoUpdatePhysics();

  const {s,offX,offY}=dinoGetTransform();
  ctx.save();
  ctx.fillStyle="#f7f7f7";
  ctx.fillRect(offX-14*s,offY-14*s,DINO_VW*s+28*s,DINO_VH*s+28*s);

// ---- Lưới (grid) vị trí thẻ nhân vật: xếp thành các hàng gọn (mặc định
// tối đa 3 thẻ/hàng) thay vì 1 hàng dài tràn màn hình. Dùng chung cho cả
// việc vẽ (drawCharSelect) và việc dò click (handleMenuClick) để 2 bên
// luôn khớp nhau. ----
const CHAR_CARD_W = 150, CHAR_CARD_H = 190, CHAR_GAP_X = 18, CHAR_GAP_Y = 20, CHAR_COLS = 3;
function getCharCardLayout(count){
  const cols = Math.min(CHAR_COLS, count);
  const rows = Math.ceil(count/cols);
  const totalH = rows*CHAR_CARD_H + (rows-1)*CHAR_GAP_Y;
  const startY = H/2 - totalH/2 + 10;
  const layout = [];
  for(let i=0;i<count;i++){
    const rowIdx = Math.floor(i/cols);
    const itemsInRow = Math.min(cols, count-rowIdx*cols);
    const rowW = itemsInRow*CHAR_CARD_W + (itemsInRow-1)*CHAR_GAP_X;
    const rowStartX = W/2 - rowW/2;
    const colIdx = i - rowIdx*cols;
    const cx = rowStartX + colIdx*(CHAR_CARD_W+CHAR_GAP_X);
    const cy = startY + rowIdx*(CHAR_CARD_H+CHAR_GAP_Y);
    layout.push({cx,cy,w:CHAR_CARD_W,h:CHAR_CARD_H});
  }
  return layout;
}
function drawCharSelect(title,borderColor){
  _text(W/2,60,title,"yellow","24px Arial bold");
  const layout = getCharCardLayout(CHARS.length);
  CHARS.forEach((ch,i)=>{
    const {cx,cy,w,h}=layout[i];
    const midX=cx+w/2;
    _rect(cx,cy,w,h,"#222",borderColor||"white",2);
    _rect(midX-22,cy+16,44,44,ch.color,"white",1);
    _text(midX,cy+78,ch.name,"white","11px Arial bold");
  });
}

function handleMenuClick(mx, my) {
  if(gameState==="MENU"){
    // Gear icon
    if(W-60<=mx&&mx<=W-20&&20<=my&&my<=60){showSettings=!showSettings;return;}
    if(showSettings){handleSettingsClick(mx,my);return;}
    const modes=MAIN_MENU_MODES;
    const btnW=340, btnH=90, gap=34;
    const startY=H/2-((modes.length-1)*(btnH+gap))/2;
    for(let i=0;i<modes.length;i++){
      const by1=startY+i*(btnH+gap);
      if(W/2-btnW/2<=mx&&mx<=W/2+btnW/2&&by1<=my&&my<=by1+btnH){
        if(i===0){gameState="MENU_GROUP1";return;}
        if(i===1){gameState="MENU_GROUP2";return;}
      }
    }
  }else if(gameState==="MENU_GROUP1"){
    const idx=handleMenuGroupClick(MENU_GROUP_1,mx,my);
    if(idx===0){gameState="BOT_SELECT";return;}
    if(idx===1){gameState="CHALLENGE_SELECT";return;}
    if(idx===2){gameState="ROAD_CHAR_SELECT";return;}
  }else if(gameState==="MENU_GROUP2"){
    const idx=handleMenuGroupClick(MENU_GROUP_2,mx,my);
    if(idx===0){window.location.href="https://khoidoan.site/minigame.html";return;}
    if(idx===1){window.open("https://khoidoan.site/huongdan.html","_blank");return;}
  }else if(gameState==="MINIGAME_SELECT"){
    handleMinigameSelectClick(mx,my);
  }else if(gameState==="MINIGAME_DINO"){
    handleMinigameDinoClick(mx,my);
  }else if(gameState==="BOT_SELECT"){
    for(let i=0;i<3;i++){const by1=H/2-80+i*80;if(W/2-100<=mx&&mx<=W/2+100&&by1<=my&&my<=by1+60){gameMode="PVE";botLevel=i+1;selectingPlayer=1;gameState="CHAR_SELECT";return;}}
  }else if(gameState==="ROAD_CHAR_SELECT"){
    const _layout=getCharCardLayout(CHARS.length);
    CHARS.forEach((ch,i)=>{const {cx,cy,w,h}=_layout[i];if(cx<=mx&&mx<=cx+w&&cy<=my&&my<=cy+h){selectedP1=ch.id;startRoadMode();}});
  }else if(gameState==="CHALLENGE_SELECT"){
    for(let i=0;i<7;i++){const by1=H/2-140+i*65;if(W/2-100<=mx&&mx<=W/2+100&&by1<=my&&my<=by1+52){challengeStage=i+1;gameState="CHALLENGE_CHAR_SELECT";return;}}
  }else if(gameState==="CHALLENGE_CHAR_SELECT"){
    const _layout=getCharCardLayout(CHARS.length);
    CHARS.forEach((ch,i)=>{const {cx,cy,w,h}=_layout[i];if(cx<=mx&&mx<=cx+w&&cy<=my&&my<=cy+h){selectedP1=ch.id;startChallengeMode(challengeStage);}});
  }else if(gameState==="CHAR_SELECT"){
    const _layout=getCharCardLayout(CHARS.length);
    CHARS.forEach((ch,i)=>{
      const {cx,cy,w,h}=_layout[i];
      if(cx<=mx&&mx<=cx+w&&cy<=my&&my<=cy+h){
        if(selectingPlayer===1){selectedP1=ch.id;if(gameMode==="PVP"){selectingPlayer=2;}else{const avail=CHARS.filter(c=>c.id!==ch.id);selectedP2=rndChoice(avail).id;startMatch();}}
        else{selectedP2=ch.id;startMatch();}
      }
    });
  }else if(gameState==="KEY_EDITOR"){
    handleKeyEditorClick(mx,my);
  }
}

function drawMinecraftBossBar(hp, maxHp, label, color) {
  const barWidth = W * 0.7;
  const barHeight = 24;
  const x = (W - barWidth) / 2;
  const y = 45;

  // Shadow/Border
  ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
  ctx.fillRect(x - 4, y - 4, barWidth + 8, barHeight + 8);

  // Background
  ctx.fillStyle = "#222";
  ctx.fillRect(x, y, barWidth, barHeight);

  // HP Bar
  const pct = Math.max(0, hp / maxHp);
  ctx.fillStyle = color;
  ctx.fillRect(x, y, barWidth * pct, barHeight);

  // Minecraft-style segments
  ctx.strokeStyle = "rgba(0, 0, 0, 0.4)";
  ctx.lineWidth = 2;
  for (let i = 1; i < 10; i++) {
    const lx = x + (barWidth * i) / 10;
    ctx.beginPath();
    ctx.moveTo(lx, y);
    ctx.lineTo(lx, y + barHeight);
    ctx.stroke();
  }

  // Text
  _text(W / 2, y - 18, label.toUpperCase(), "white", "18px Arial bold");
  _text(W / 2, y + barHeight / 2, `${Math.floor(hp)} / ${maxHp}`, "white", "12px Arial bold");
}

  _camShakeDx=dx;_camShakeDy=dy;
  frameCount++;
  if(globalTimeFreeze>0){globalTimeFreeze--;if(globalTimeFreeze===0)globalTimeFreezeCaster=null;}
  if(comboTimer>0){comboTimer--;if(comboTimer===0)comboCount=0;}
  if(_hitSfxCooldown>0)_hitSfxCooldown--;
  updateBurnEffects();

  else if(gameState==="GAMEPLAY")updateGameplay(floorY);

// ================================================================
//  GAMEPLAY UPDATE
// ================================================================
function updateGameplay(floorY){
  const worldW=W*MAP_SCALE;
  // GLOBAL TIME FREEZE: while active, every fighter except the caster
  // (globalTimeFreezeCaster) skips its own ticking/movement/gravity below —
  // see startTimeFreeze() in this file and its trigger in castSkill (06).
  const timeFrozen=globalTimeFreeze>0;
  const tfSkip=p=>timeFrozen&&p!==globalTimeFreezeCaster;
  if(frameCount%60===0){for(const p of[p1,p2]){if(!tfSkip(p)&&p.charType==="red"&&p.hp>0)p.hp=Math.min(p.maxHp||MAX_HP,p.hp+1);}}
  for(const p of[p1,p2]){if(!tfSkip(p)&&p.ultiTimer>0&&p.activeSkill==="water_s4"){p.tsunamiWaveXL-=8;p.tsunamiWaveXR+=8;}}
  for(const p of[p1,p2]){
    if(tfSkip(p))continue;
    if(p.slowTimer>0)p.slowTimer--;if(p.stunTimer>0)p.stunTimer--;
    if(p.thunderFTimer>0){p.thunderFTimer--;if(p.thunderFTimer===0)p.thunderFCount=0;}
    for(const s in p.cds)if(p.cds[s]>0)p.cds[s]--;
    tickV4(p);
    tickThunderDash(p);
    tickThunderS3(p);
    tickThunderShield(p);
    tickThunderChargeShield(p);
    tickThunderSpear(p);
    tickWaterCloud(p);
    tickFrost(p);
    tickWind(p);
    tickEarthMud(p);
    tickEarthShield(p);
    tickEarthGroundSlam(p);
    tickEarthMinions(p,worldW);
    updateFire(p);
    updateShadow(p);
  }
  for(const[attacker,pvpTarget]of[[p1,p2],[p2,p1]]){
    if(tfSkip(attacker))continue;
    if(attacker.ultiTimer>0){
      attacker.ultiTimer--;
      const d=dist(attacker.x,attacker.y,pvpTarget.x,pvpTarget.y);
      if(attacker.activeSkill==="thunder_s4")thunderJudgmentTick(attacker);
      else if(attacker.activeSkill==="frost_s4"&&d<450*SR){applyDamage(pvpTarget,0.18,attacker);pvpTarget.slowTimer=Math.max(pvpTarget.slowTimer,10);}
      else if(attacker.activeSkill==="wind_s4"&&d<600*SR){
        applyDamage(pvpTarget,0.20,attacker);
        attacker.windStormTick++;
        if(attacker.windStormTick%25===0&&isPushable(pvpTarget)){if(pvpTarget instanceof Fighter)pvpTarget.vy=-10;}
      }
      if(attacker.ultiTimer===0){if(attacker.charType==="wind"&&attacker.activeSkill==="wind_s4")spawnWindSideCyclones(attacker);if(attacker.charType==="thunder"&&attacker.activeSkill==="thunder_s3")triggerThunderS3Strike(attacker);attacker.isAttacking=false;attacker.activeSkill=null;if(attacker.charType==="earth"){attacker.earthPillars=[];attacker._groundSlamImpacted=false;attacker._groundSlamImpact2=false;attacker._groundSlamCracks=null;attacker._groundSlamFlash1=undefined;attacker._groundSlamFlash2=undefined;}}
    }

  }
  for(const p of[p1,p2]){if(!tfSkip(p)&&p.charType==="wind"&&p.windBoostTimer>0)p.windBoostTimer--;}
  const msb=4.3125;
  if(p1.hp>0&&p2.hp>0){
    const p1CanMove=!tfSkip(p1)&&(p1.ultiTimer===0||p1.activeSkill==="water_s4"||thunderUltiFiring(p1))&&p1.stunTimer===0&&p1.transformWindupTimer===0&&p1.transformLandingTimer===0;
    if(p1CanMove){
