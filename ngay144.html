<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Ngày Của Em</title>
<style>
  :root{
    --pink: #ff5c9e;
    --pink-bright: #ffb3d4;
    --pink-deep: #ff1f7a;
    --glow: #ff2e88;
  }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:#050308;
    overflow:hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  #stage{
    position:relative;
    width:100%; height:100vh;
    max-width:576px;
    margin:0 auto;
    background: radial-gradient(ellipse at 50% 30%, #150812 0%, #050308 55%, #020103 100%);
    overflow:hidden;
  }
  canvas{ position:absolute; top:0; left:0; width:100%; height:100%; }

  .title{
    position:absolute;
    top: 5%;
    left:50%;
    transform: translateX(-50%);
    text-align:center;
    z-index:30;
    width: 90%;
  }
  .title h1{
    margin:0;
    font-family: 'Brush Script MT', cursive;
    font-size: clamp(22px, 7vw, 34px);
    color: var(--pink-bright);
    text-shadow:
      0 0 6px #fff,
      0 0 14px var(--pink),
      0 0 26px var(--pink-deep),
      0 0 42px var(--glow);
    animation: flicker 3.2s ease-in-out infinite;
    letter-spacing: 1px;
  }
  @keyframes flicker{
    0%,100%{ opacity:1; }
    45%{ opacity:0.85; }
    50%{ opacity:1; }
    52%{ opacity:0.75; }
    55%{ opacity:1; }
  }

  /* ---------- start screen (tap to begin) ---------- */
  .start-screen{
    position:absolute; inset:0;
    z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 18px;
    background: radial-gradient(ellipse at 50% 45%, #150812 0%, #050308 60%, #020103 100%);
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
    transition: opacity 0.6s ease;
  }
  .start-screen.hide{
    opacity:0;
    pointer-events:none;
  }
  .start-heart{
    font-size: 64px;
    animation: start-beat 1.1s ease-in-out infinite;
    filter: drop-shadow(0 0 18px var(--glow)) drop-shadow(0 0 32px var(--pink-deep));
  }
  @keyframes start-beat{
    0%,100%{ transform: scale(1); }
    25%{ transform: scale(1.14); }
    40%{ transform: scale(0.96); }
    55%{ transform: scale(1.08); }
  }
  .start-text{
    color: var(--pink-bright);
    font-size: 15px;
    letter-spacing: 1px;
    text-shadow: 0 0 8px var(--pink);
    animation: flicker 3.2s ease-in-out infinite;
  }

  /* ---------- (nút nhạc đã gỡ — tự chèn nhạc riêng qua thẻ #bgm bên dưới) ---------- */

  /* the glowing vortex/portal near bottom — bright accretion-disk style ring */
  .portal-wrap{
    position:absolute;
    left:50%; top:47%;
    transform:translate(-50%,-50%);
    width: 210px; height: 92px;
    z-index:5;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .portal-hit{
    position:absolute;
    inset: -50px -20px;
  }
  .portal{
    position:absolute; inset:0;
    border-radius:50%;
    background: radial-gradient(ellipse at center,
      #0a0410 0%, #0a0410 27%,
      var(--pink-deep) 40%, #fff5f9 50%,
      var(--glow) 60%, rgba(255,46,136,0.28) 76%, transparent 84%);
    filter: blur(1px);
    animation: portal-pulse 2.6s ease-in-out infinite;
    transition: transform 0.25s ease;
    overflow:hidden;
  }
  .portal-shimmer{
    position:absolute; inset:0;
    border-radius:50%;
    background: conic-gradient(from 0deg,
      rgba(255,255,255,0) 0deg, rgba(255,255,255,0.6) 14deg, rgba(255,255,255,0) 34deg,
      rgba(255,255,255,0) 300deg, rgba(255,255,255,0.4) 330deg, rgba(255,255,255,0) 360deg);
    mix-blend-mode: screen;
    animation: shimmer-spin 3.2s linear infinite;
    pointer-events:none;
  }
  @keyframes shimmer-spin{ from{ transform:rotate(0deg);} to{ transform:rotate(360deg);} }
  .portal-wrap:active .portal{ transform: scale(0.92); }
  .portal::after{
    content:"";
    position:absolute; inset:-46px;
    border-radius:50%;
    background: radial-gradient(ellipse at center, rgba(255,46,136,0.35) 0%, transparent 65%);
    animation: portal-pulse 2.6s ease-in-out infinite reverse;
  }
  @keyframes portal-pulse{
    0%,100%{ transform: scale(1); opacity:0.9; }
    50%{ transform: scale(1.12); opacity:1; }
  }
  .portal.ripple::before{
    content:"";
    position:absolute; inset:0;
    border-radius:50%;
    border: 2px solid var(--pink-bright);
    animation: ripple-out 0.7s ease-out;
  }
  @keyframes ripple-out{
    0%{ transform:scale(0.6); opacity:0.9; }
    100%{ transform:scale(2.4); opacity:0; }
  }

  .portal-letter{
    position:absolute;
    left:50%; top:50%;
    transform:translate(-50%,-50%);
    z-index:6;
    font-family: 'Brush Script MT', cursive;
    font-weight:700;
    font-size: 30px;
    color: #fff5f9;
    text-shadow:
      0 0 6px #fff,
      0 0 14px var(--pink),
      0 0 24px var(--pink-deep),
      0 0 40px var(--glow);
    animation: flicker 3.2s ease-in-out infinite;
    pointer-events:none;
  }

  /* secret message bubble that appears when portal is tapped */
  .secret-message{
    position:absolute;
    left:50%; top:34%;
    transform:translate(-50%,10px);
    z-index: 35;
    max-width: 80%;
    text-align:center;
    padding: 10px 16px;
    border-radius: 16px;
    background: rgba(20,6,16,0.72);
    border: 1px solid rgba(255,179,212,0.45);
    color: #ffe6f2;
    font-size: 14px;
    line-height:1.4;
    box-shadow: 0 0 18px rgba(255,46,136,0.35);
    opacity:0;
    pointer-events:none;
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .secret-message.show{
    opacity:1;
    transform:translate(-50%,0);
  }

  /* ---- true 3D orbit disc ---- */
  .orbit-container{
    position:absolute;
    left:50%; top:47%;
    width:0; height:0;
    perspective: 900px;
    z-index:4;
  }
  .disc{
    position:absolute;
    left:0; top:0;
    width:0; height:0;
    transform-style: preserve-3d;
    transform: rotateX(66deg);
  }
  .ring-3d{
    position:absolute;
    left:0; top:0;
    border:1px solid rgba(255,255,255,0.14);
    border-radius:50%;
    transform: translate(-50%,-50%);
  }
  .floating-text{
    position:absolute;
    left:0; top:0;
    color: var(--pink-bright);
    text-shadow: 0 0 6px var(--pink), 0 0 14px var(--glow);
    font-weight:700;
    white-space:nowrap;
    pointer-events:none;
    will-change: transform, opacity;
    transform-style: preserve-3d;
  }
  .floating-text.phrase{
    font-weight:600;
    text-shadow: 0 0 5px var(--pink), 0 0 10px var(--glow);
  }

  /* cute bear couple, built from css shapes */
  .bears{
    position:absolute;
    left:50%; bottom:6%;
    transform:translateX(-50%);
    z-index:15;
    width:150px; height:110px;
    animation: sway 3.6s ease-in-out infinite;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .bears::after{
    content:"";
    position:absolute;
    left:50%; bottom:-6px;
    transform:translateX(-50%);
    width: 110px; height: 16px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 72%);
    filter: blur(1px);
  }
  @keyframes sway{
    0%,100%{ transform:translateX(-50%) rotate(-1.5deg); }
    50%{ transform:translateX(-50%) rotate(1.5deg); }
  }
  .bears.nuzzle .bear.tan{ animation: nuzzle-in-l 0.9s ease; }
  .bears.nuzzle .bear.white{ animation: nuzzle-in-r 0.9s ease; }
  @keyframes nuzzle-in-l{
    0%{ transform: translateX(0) rotate(0deg); }
    40%{ transform: translateX(14px) rotate(6deg); }
    100%{ transform: translateX(0) rotate(0deg); }
  }
  @keyframes nuzzle-in-r{
    0%{ transform: scaleX(-1) translateX(0) rotate(0deg); }
    40%{ transform: scaleX(-1) translateX(14px) rotate(6deg); }
    100%{ transform: scaleX(-1) translateX(0) rotate(0deg); }
  }
  .bear{
    position:absolute;
    bottom:0;
    width:72px; height:72px;
    filter: drop-shadow(0 6px 5px rgba(0,0,0,0.35));
  }
  .bear .head{
    position:absolute;
    width:72px; height:64px;
    border-radius:50% 50% 46% 46%;
    top:0; left:0;
  }
  .bear .ear{
    position:absolute;
    width:22px; height:22px;
    border-radius:50%;
    top:-8px;
  }
  .bear .ear.l{ left:-4px; }
  .bear .ear.r{ right:-4px; }
  .bear .blush{
    position:absolute;
    width:11px; height:7px;
    background: rgba(255,120,150,0.55);
    border-radius:50%;
    top:36px;
  }
  .bear .blush.l{ left:6px; }
  .bear .blush.r{ right:6px; }
  .bear .eye{
    position:absolute;
    width:4px; height:6px;
    background:#3a2a20;
    border-radius:50%;
    top:26px;
    animation: blink 4.6s ease-in-out infinite;
    transform-origin: center;
  }
  .bear.white .eye{ animation-delay: 1.4s; }
  @keyframes blink{
    0%, 92%, 100%{ transform: scaleY(1); }
    95%{ transform: scaleY(0.08); }
  }
  .bear .eye.l{ left:20px; }
  .bear .eye.r{ right:20px; }
  .bear .muzzle{
    position:absolute;
    width:26px; height:18px;
    background:#fff8f2;
    border-radius:50%;
    top:32px; left:23px;
  }
  .bear.tan .head, .bear.tan .ear{ background:#c99a6c; }
  .bear.white .head, .bear.white .ear{ background:#f4eeea; }
  .bear.tan{ left:16px; }
  .bear.white{ right:10px; transform: scaleX(-1); }
  .sparkle-heart{
    position:absolute;
    font-size:14px;
    color: var(--pink-bright);
    animation: floatup 2.4s ease-in infinite;
    opacity:0;
    z-index:16;
  }
  @keyframes floatup{
    0%{ opacity:0; transform:translateY(0) scale(0.6); }
    20%{ opacity:1; }
    100%{ opacity:0; transform:translateY(-40px) scale(1.1); }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="sky"></canvas>
  <canvas id="fx"></canvas>

  <div class="start-screen" id="startScreen">
    <div class="start-heart">💗</div>
    <div class="start-text">Chạm để bắt đầu</div>
  </div>

  <!-- Tự chèn nhạc riêng của bạn ở đây: đặt file mp3/m4a cùng thư mục với
       file HTML này, đổi "ten-file-nhac-cua-ban.mp3" thành đúng tên file,
       rồi bỏ dấu // ở dòng <source> bên dưới. Nhạc sẽ tự phát khi chạm
       "Chạm để bắt đầu". -->
  <audio id="bgm" loop preload="none" style="display:none">
    <!-- <source src="ten-file-nhac-cua-ban.mp3" type="audio/mpeg"> -->
  </audio>

  <div class="title">
    <h1>vuthithuhoai14/4</h1>
  </div>

  <div class="secret-message" id="secretMsg"></div>

  <div class="orbit-container" id="orbitContainer">
    <div class="disc" id="disc"></div>
  </div>

  <div class="portal-wrap" id="portalWrap">
    <div class="portal-hit"></div>
    <div class="portal" id="portalGlow">
      <div class="portal-shimmer"></div>
    </div>
    <div class="portal-letter">H</div>
  </div>

  <div class="bears" id="bears">
    <div class="bear tan">
      <div class="ear l"></div><div class="ear r"></div>
      <div class="head"></div>
      <div class="muzzle"></div>
      <div class="eye l"></div><div class="eye r"></div>
      <div class="blush l"></div><div class="blush r"></div>
    </div>
    <div class="bear white">
      <div class="ear l"></div><div class="ear r"></div>
      <div class="head"></div>
      <div class="muzzle"></div>
      <div class="eye l"></div><div class="eye r"></div>
      <div class="blush l"></div><div class="blush r"></div>
    </div>
  </div>
</div>

<script>
/* ---------- responsive canvas sizing ---------- */
const stage = document.getElementById('stage');
const skyCv = document.getElementById('sky');
const fxCv  = document.getElementById('fx');
const skyCtx = skyCv.getContext('2d');
const fxCtx  = fxCv.getContext('2d');

function resize(){
  const r = stage.getBoundingClientRect();
  [skyCv, fxCv].forEach(c=>{
    c.width = r.width;
    c.height = r.height;
  });
}
window.addEventListener('resize', resize);
resize();

/* ---------- starfield ---------- */
let stars = [];
function initStars(){
  stars = [];
  const n = Math.floor((skyCv.width*skyCv.height)/2600);
  for(let i=0;i<n;i++){
    stars.push({
      x: Math.random()*skyCv.width,
      y: Math.random()*skyCv.height,
      r: Math.random()*1.3+0.2,
      tw: Math.random()*Math.PI*2,
      speed: Math.random()*0.02+0.01
    });
  }
}
initStars();

function drawStars(t){
  skyCtx.clearRect(0,0,skyCv.width,skyCv.height);
  for(const s of stars){
    const a = 0.4 + 0.6*Math.abs(Math.sin(s.tw + t*s.speed));
    skyCtx.globalAlpha = a;
    skyCtx.fillStyle = '#fff';
    skyCtx.beginPath();
    skyCtx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    skyCtx.fill();
  }
  skyCtx.globalAlpha = 1;
}

/* ============================================================
   PARTICLE SYSTEM (fxCv) — stardust hut vao portal, phao hoa tim,
   vet sang cua chu bay, tim khi cham gau
   ============================================================ */
let particles = [];

function portalCenter(){
  const pr = document.getElementById('portalWrap').getBoundingClientRect();
  const sr = stage.getBoundingClientRect();
  return { x: pr.left - sr.left + pr.width/2, y: pr.top - sr.top + pr.height/2 };
}

function spawnStardust(){
  // spawn near edges, drift toward the portal (hut vao tam)
  const sr = { w: fxCv.width, h: fxCv.height };
  const edge = Math.random();
  let x,y;
  if(edge < 0.5){ x = Math.random()*sr.w; y = Math.random()*sr.h*0.5; }
  else{ x = Math.random()*sr.w; y = sr.h*0.5 + Math.random()*sr.h*0.5; }
  particles.push({
    type:'dust', x, y, life:0, maxLife: 90+Math.random()*60,
    size: 0.6+Math.random()*1.4,
    hue: Math.random()<0.5 ? '255,179,212' : '255,92,158'
  });
}

function spawnFirework(x,y){
  const n = 22;
  for(let i=0;i<n;i++){
    const a = (i/n)*Math.PI*2 + Math.random()*0.2;
    const speed = 2 + Math.random()*3.2;
    particles.push({
      type:'heart', x, y,
      vx: Math.cos(a)*speed, vy: Math.sin(a)*speed,
      life:0, maxLife: 46+Math.random()*20,
      size: 8+Math.random()*8
    });
  }
}

function spawnPopHearts(x,y){
  const n = 8;
  for(let i=0;i<n;i++){
    particles.push({
      type:'heart', x: x+(Math.random()*30-15), y: y+(Math.random()*10-5),
      vx: (Math.random()*1.4-0.7), vy: -1.4-Math.random()*1.4,
      life:0, maxLife: 50+Math.random()*20,
      size: 10+Math.random()*8
    });
  }
}

function spawnTrail(x,y){
  particles.push({
    type:'trail', x, y, life:0, maxLife: 26+Math.random()*10,
    size: 1.2+Math.random()*1.4
  });
}

/* ---- shape-morphing fountain: rises from the portal and forms
   a column of sparks, then a heart, then a flower, on repeat ---- */
const FOUNTAIN_SHAPES = ['column','heart','flower'];
let fountainShapeIdx = 0;
setInterval(()=>{ fountainShapeIdx = (fountainShapeIdx+1) % FOUNTAIN_SHAPES.length; }, 3200);

function fountainTargetOffset(shape){
  const rise = fxCv.height*0.30;
  if(shape === 'column'){
    return { dx: (Math.random()*18-9), dy: -(Math.random()*rise+10) };
  }
  if(shape === 'heart'){
    const t = Math.random()*Math.PI*2;
    const hx = 16*Math.pow(Math.sin(t),3);
    const hy = -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));
    const s = fxCv.width*0.052;
    return { dx: hx*s, dy: -rise + hy*s };
  }
  // flower
  const theta = Math.random()*Math.PI*2;
  const r = fxCv.width*0.16*(0.35+0.65*Math.abs(Math.cos(2.5*theta)));
  return { dx: Math.cos(theta)*r, dy: -rise + Math.sin(theta)*r*0.9 };
}

function spawnFountainParticle(){
  const shape = FOUNTAIN_SHAPES[fountainShapeIdx];
  const { dx, dy } = fountainTargetOffset(shape);
  const white = Math.random() < 0.22;
  particles.push({
    type:'fountain',
    dx, dy,
    life:0,
    maxLife: shape === 'column' ? (34+Math.random()*26) : (85+Math.random()*55),
    size: white ? (1.6+Math.random()*1.6) : (1.2+Math.random()*1.6),
    color: white ? '255,245,250' : (Math.random()<0.5 ? '255,92,158' : '255,31,122'),
    wiggle: Math.random()*Math.PI*2
  });
}

function updateAndDrawParticles(){
  const center = portalCenter();
  fxCtx.save();
  particles = particles.filter(p => p.life < p.maxLife);
  for(const p of particles){
    p.life++;
    const t = Math.min(1, p.life / p.maxLife);
    if(p.type === 'dust'){
      // gently pulled toward the portal center, fading in then out
      const dx = center.x - p.x, dy = center.y - p.y;
      const dist = Math.max(1, Math.hypot(dx,dy));
      const pull = 0.035;
      p.x += (dx/dist) * pull * (1+t*2);
      p.y += (dy/dist) * pull * (1+t*2);
      const alpha = t < 0.15 ? t/0.15 : (1 - (t-0.15)/0.85);
      const dustR = Math.max(0.01, p.size*(1-t*0.3));
      fxCtx.globalAlpha = Math.max(0, alpha) * 0.85;
      fxCtx.fillStyle = `rgb(${p.hue})`;
      fxCtx.beginPath();
      fxCtx.arc(p.x, p.y, dustR, 0, Math.PI*2);
      fxCtx.fill();
    } else if(p.type === 'heart'){
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.045; // gentle gravity
      p.vx *= 0.985;
      const alpha = 1 - t;
      fxCtx.globalAlpha = Math.max(0, alpha);
      fxCtx.font = `${p.size}px system-ui, sans-serif`;
      fxCtx.textAlign = 'center';
      fxCtx.textBaseline = 'middle';
      fxCtx.fillStyle = '#ff5c9e';
      fxCtx.shadowColor = '#ff2e88';
      fxCtx.shadowBlur = 8;
      fxCtx.fillText('♥', p.x, p.y);
      fxCtx.shadowBlur = 0;
    } else if(p.type === 'trail'){
      const alpha = (1-t)*0.6;
      const trailR = Math.max(0.01, p.size*(1-t));
      fxCtx.globalAlpha = Math.max(0, alpha);
      fxCtx.fillStyle = '#ffb3d4';
      fxCtx.beginPath();
      fxCtx.arc(p.x, p.y, trailR, 0, Math.PI*2);
      fxCtx.fill();
    } else if(p.type === 'fountain'){
      const ease = 1 - Math.pow(1-t, 3);
      const wig = Math.sin(t*10 + p.wiggle) * (1-t) * 3;
      const x = center.x + p.dx*ease + wig;
      const y = center.y + p.dy*ease;
      let alpha;
      if(t < 0.15) alpha = t/0.15;
      else if(t > 0.72) alpha = 1 - (t-0.72)/0.28;
      else alpha = 1;
      const fR = Math.max(0.01, p.size);
      fxCtx.globalAlpha = Math.max(0, alpha) * 0.9;
      fxCtx.fillStyle = `rgb(${p.color})`;
      fxCtx.shadowColor = `rgb(${p.color})`;
      fxCtx.shadowBlur = 5;
      fxCtx.beginPath();
      fxCtx.arc(x, y, fR, 0, Math.PI*2);
      fxCtx.fill();
      fxCtx.shadowBlur = 0;
    }
  }
  fxCtx.restore();
}

setInterval(()=>{ if(particles.length < 260) spawnStardust(); }, 140);
setInterval(()=>{
  if(particles.length < 420){
    spawnFountainParticle();
    spawnFountainParticle();
  }
}, 45);

/* ---------- real 3D orbiting text (H / 爱 / love) ---------- */
const SYMBOLS = ['H', '爱', 'love'];
const disc = document.getElementById('disc');

// build rings (visual guide circles) + text items, 3 rings, several items per ring
const ringDefs = [
  { R: 250, count: 10, speed: 0.0052 },
  { R: 180, count: 8,  speed: 0.0072 },
  { R: 115, count: 6,  speed: 0.0100 }
];

ringDefs.forEach(r=>{
  const ring = document.createElement('div');
  ring.className = 'ring-3d';
  ring.style.width = (r.R*2)+'px';
  ring.style.height = (r.R*2)+'px';
  disc.appendChild(ring);
});

const items = [];
ringDefs.forEach((r, ringIdx)=>{
  for(let i=0;i<r.count;i++){
    const el = document.createElement('div');
    el.className = 'floating-text';
    const sym = SYMBOLS[(ringIdx + i) % SYMBOLS.length];
    el.textContent = sym;
    el.style.fontSize = sym === 'love' ? '15px' : '20px';
    disc.appendChild(el);
    items.push({
      el,
      R: r.R,
      angle: (i / r.count) * Math.PI*2 + ringIdx,
      speed: r.speed
    });
  }
});

// extra outer rings carrying short love phrases + a couple of tiny bear icons,
// alternating pink/white like the reference video
const PHRASES = [
  'Mãi bên em', 'Người thương của anh', 'Chúc mừng ngày của em',
  'Em là tất cả', 'Yêu em thật nhiều', 'Mỗi ngày có em',
  'Trái tim anh thuộc về em', 'Em là điều đẹp nhất', 'Cảm ơn vì đã đến',
  'Bên nhau mãi mãi', '🧸', '14/4 của chúng mình', '🐻'
];
const phraseRingDefs = [
  { R: 300, count: 9, speed: 0.0044 },
  { R: 345, count: 7, speed: 0.0036 }
];
const phraseItems = [];
phraseRingDefs.forEach(r=>{
  const ring = document.createElement('div');
  ring.className = 'ring-3d';
  ring.style.width = (r.R*2)+'px';
  ring.style.height = (r.R*2)+'px';
  ring.style.borderColor = 'rgba(255,255,255,0.08)';
  disc.appendChild(ring);
});
phraseRingDefs.forEach((r, ringIdx)=>{
  for(let i=0;i<r.count;i++){
    const el = document.createElement('div');
    const txt = PHRASES[(ringIdx*7 + i) % PHRASES.length];
    const isEmoji = (txt === '🧸' || txt === '🐻');
    el.className = 'floating-text phrase';
    el.textContent = txt;
    el.style.fontSize = isEmoji ? '22px' : '12px';
    el.style.color = isEmoji ? '#fff' : (i % 2 === 0 ? 'var(--pink-bright)' : '#ffffff');
    disc.appendChild(el);
    phraseItems.push({
      el, R: r.R,
      angle: (i / r.count) * Math.PI*2 + ringIdx*0.6,
      speed: r.speed
    });
  }
});

const orbitOrigin = { x:0, y:0 };
function layoutOrbits(){
  const oc = document.getElementById('orbitContainer').getBoundingClientRect();
  const sr = stage.getBoundingClientRect();
  orbitOrigin.x = oc.left - sr.left;
  orbitOrigin.y = oc.top - sr.top;

  items.forEach(item=>{
    item.angle += item.speed;
    const x = Math.cos(item.angle)*item.R;
    const y = Math.sin(item.angle)*item.R;
    // depth cue: front half (y>0 in disc space) = closer to camera after tilt
    const depth = (Math.sin(item.angle)+1)/2; // 0..1
    const opacity = 0.35 + depth*0.65;
    item.el.style.opacity = opacity;
    item.el.style.transform =
      `translate3d(${x}px, ${y}px, 0) rotateX(${-tiltX}deg) translate(-50%,-50%) scale(${0.8+depth*0.5})`;

    // occasional trailing sparkle, roughly following the item on the front arc
    if(depth > 0.6 && Math.random() < 0.045){
      const scaleApprox = Math.sin(tiltX*Math.PI/180);
      spawnTrail(orbitOrigin.x + x*0.7, orbitOrigin.y + y*scaleApprox*0.5);
    }
  });

  phraseItems.forEach(item=>{
    item.angle += item.speed;
    const x = Math.cos(item.angle)*item.R;
    const y = Math.sin(item.angle)*item.R;
    const depth = (Math.sin(item.angle)+1)/2;
    const opacity = 0.3 + depth*0.7;
    item.el.style.opacity = opacity;
    item.el.style.transform =
      `translate3d(${x}px, ${y}px, 0) rotateX(${-tiltX}deg) translate(-50%,-50%) scale(${0.75+depth*0.45})`;
  });
}

/* ---------- drag-to-rotate 3D control (touch / mouse) ---------- */
let spinY = 0;
let tiltX = 66;
const AUTO_SPIN = 0.35;
let velX = AUTO_SPIN;
let velY = 0;
let isDragging = false;
let lastX = 0, lastY = 0;

stage.style.cursor = 'grab';
stage.style.touchAction = 'none';

function pointerDown(e){
  // don't hijack the pointer (and swallow its click) when the tap
  // lands on an interactive UI element — let those handle themselves
  if(e.target.closest('.start-screen, .portal-wrap, .bears')) return;
  isDragging = true;
  lastX = e.clientX; lastY = e.clientY;
  velX = 0; velY = 0;
  stage.style.cursor = 'grabbing';
  stage.setPointerCapture(e.pointerId);
}
function pointerMove(e){
  if(!isDragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  velX = dx * 0.5;
  velY = dy * 0.5;
  spinY += velX;
  tiltX = Math.max(15, Math.min(88, tiltX - velY * 0.5));
}
function pointerUp(){
  isDragging = false;
  stage.style.cursor = 'grab';
}
stage.addEventListener('pointerdown', pointerDown);
stage.addEventListener('pointermove', pointerMove);
stage.addEventListener('pointerup', pointerUp);
stage.addEventListener('pointercancel', pointerUp);

function swayCamera(){
  if(!isDragging){
    // momentum decay, then ease back into the gentle auto-spin
    spinY += velX;
    velX += (AUTO_SPIN - velX) * 0.02;
  }
  disc.style.transform = `rotateX(${tiltX}deg) rotateY(${spinY}deg)`;
}

/* ---------- occasional tiny hearts rising from the bears ---------- */
function spawnMiniHeart(){
  const h = document.createElement('div');
  h.className = 'sparkle-heart';
  h.textContent = Math.random()<0.5 ? '💗' : '💕';
  const baseX = stage.clientWidth/2 + (Math.random()*40-20);
  const baseY = stage.clientHeight - 130;
  h.style.left = baseX+'px';
  h.style.top = baseY+'px';
  stage.appendChild(h);
  setTimeout(()=>h.remove(), 2500);
}
setInterval(spawnMiniHeart, 1400);

/* ============================================================
   TOUCH / CLICK INTERACTIONS
   ============================================================ */
const secretMessages = [
  'Chạm vào cổng, và anh chạm vào ngày của em 💗',
  'Mỗi vòng xoay là một lời anh muốn nói với em',
  '14/4 — ngày anh mãi mãi muốn nhớ',
  'Em là ánh sáng ở giữa vũ trụ nhỏ này',
  'Cảm ơn em vì đã luôn ở đây'
];
let msgIndex = 0;
let msgTimer = null;
const secretEl = document.getElementById('secretMsg');

document.getElementById('portalWrap').addEventListener('click', (e)=>{
  const rect = stage.getBoundingClientRect();
  const cx = e.clientX - rect.left;
  const cy = e.clientY - rect.top;
  spawnFirework(cx, cy);

  const glow = document.getElementById('portalGlow');
  glow.classList.remove('ripple');
  void glow.offsetWidth; // restart animation
  glow.classList.add('ripple');

  secretEl.textContent = secretMessages[msgIndex % secretMessages.length];
  msgIndex++;
  secretEl.classList.add('show');
  clearTimeout(msgTimer);
  msgTimer = setTimeout(()=> secretEl.classList.remove('show'), 3200);

  playChime();
});

const bearsEl = document.getElementById('bears');
bearsEl.addEventListener('click', ()=>{
  bearsEl.classList.remove('nuzzle');
  void bearsEl.offsetWidth;
  bearsEl.classList.add('nuzzle');

  const rect = stage.getBoundingClientRect();
  const bRect = bearsEl.getBoundingClientRect();
  spawnPopHearts(bRect.left - rect.left + bRect.width/2, bRect.top - rect.top + 20);

  playPop();
});

/* ============================================================
   AMBIENT MUSIC + SFX (Web Audio API, no external files)
   ============================================================ */
let audioCtx = null;

function ensureCtx(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playChime(){
  const ctx = ensureCtx();
  const notes = [880, 1108.7, 1318.5];
  notes.forEach((f, i)=>{
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = f;
    const start = ctx.currentTime + i*0.06;
    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(0.05, start+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, start+0.9);
    osc.connect(gain).connect(ctx.destination);
    osc.start(start);
    osc.stop(start+0.9);
  });
}

function playPop(){
  const ctx = ensureCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(300, ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(650, ctx.currentTime+0.12);
  gain.gain.setValueAtTime(0.08, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.2);
  osc.connect(gain).connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime+0.22);
}

// (nhạc nền tổng hợp đã gỡ — chèn nhạc riêng qua thẻ #bgm ở phần HTML,
// nó sẽ tự phát khi chạm màn hình "Chạm để bắt đầu" bên dưới)

/* ---------- start screen: tap to begin the whole scene ---------- */
const startScreen = document.getElementById('startScreen');
startScreen.addEventListener('click', ()=>{
  startScreen.classList.add('hide');
  setTimeout(()=> startScreen.remove(), 700);

  // phát nhạc riêng nếu bạn đã chèn file ở thẻ #bgm (im lặng bỏ qua nếu chưa có)
  const bgm = document.getElementById('bgm');
  if(bgm){ bgm.play().catch(()=>{}); }

  const center = portalCenter();
  spawnFirework(center.x, center.y);
  const glow = document.getElementById('portalGlow');
  glow.classList.add('ripple');

  secretEl.textContent = secretMessages[0];
  secretEl.classList.add('show');
  clearTimeout(msgTimer);
  msgTimer = setTimeout(()=> secretEl.classList.remove('show'), 3200);
  msgIndex = 1;
}, { once:true });

/* ---------- main loop ---------- */
function loop(t){
  drawStars(t*0.06);
  swayCamera();
  layoutOrbits();
  fxCtx.clearRect(0,0,fxCv.width,fxCv.height);
  updateAndDrawParticles();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
