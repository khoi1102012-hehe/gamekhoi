<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hành Trình Toán Học · Cấp 2</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Space+Mono:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap');

:root{
  --board: #1f3a2e;
  --board-dark: #16291f;
  --chalk: #f5f1e8;
  --chalk-dim: #c9d8cd;
  --gold: #e8c468;
  --gold-dim: #9c8347;
  --ok: #7fb069;
  --bad: #d96c6c;
  --paper: #faf6ec;
  --paper-line: #e3dcc8;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  min-height:100vh;
  background:
    radial-gradient(ellipse at 20% 10%, rgba(255,255,255,0.04), transparent 40%),
    radial-gradient(ellipse at 80% 90%, rgba(255,255,255,0.03), transparent 40%),
    var(--board);
  background-image:
    linear-gradient(var(--board-dark) 1px, transparent 1px),
    linear-gradient(90deg, var(--board-dark) 1px, transparent 1px),
    var(--board);
  background-size: 42px 42px, 42px 42px, auto;
  font-family:'Nunito',sans-serif;
  color:var(--chalk);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
}

.stage{
  width:100%;
  max-width:760px;
}

/* ---------- Header ---------- */
.eyebrow{
  font-family:'Space Mono',monospace;
  font-size:12px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:var(--gold);
  text-align:center;
  margin-bottom:6px;
  opacity:0.9;
}
h1.title{
  font-family:'Patrick Hand',cursive;
  font-size:44px;
  text-align:center;
  margin:0 0 4px 0;
  color:var(--chalk);
  text-shadow: 0 0 18px rgba(245,241,232,0.15);
}
.subtitle{
  text-align:center;
  color:var(--chalk-dim);
  font-size:15px;
  margin-bottom:28px;
}

/* ---------- Card base ---------- */
.card{
  background:var(--paper);
  color:#2b2b26;
  border-radius:6px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.35), 0 2px 0 rgba(0,0,0,0.08);
  position:relative;
  overflow:hidden;
}
.card::before{
  content:"";
  position:absolute;
  left:0; top:0; bottom:0;
  width:46px;
  background:
    repeating-linear-gradient(to bottom, transparent 0 25px, #e0a1a1 25px 26px);
  border-right:2px solid #d8cfaf;
  opacity:0.5;
}
.card-inner{
  position:relative;
  padding:34px 34px 30px 62px;
}

/* ---------- Level path (start screen) ---------- */
.path-wrap{padding:38px 30px 30px 30px;}
.path{
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:relative;
  margin-bottom:10px;
}
.path::before{
  content:"";
  position:absolute;
  top:50%; left:6%; right:6%;
  height:0;
  border-top: 3px dashed var(--gold-dim);
  transform:translateY(-50%);
  z-index:0;
}
.node{
  position:relative;
  z-index:1;
  width:64px; height:64px;
  border-radius:50%;
  background:var(--board-dark);
  border:3px solid var(--gold-dim);
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Patrick Hand',cursive;
  font-size:26px;
  color:var(--chalk-dim);
  cursor:pointer;
  transition:transform .15s ease, border-color .15s ease, color .15s ease, box-shadow .15s ease;
  flex-shrink:0;
}
.node:hover{transform:translateY(-4px) scale(1.05); border-color:var(--gold); color:var(--chalk); box-shadow:0 8px 18px rgba(0,0,0,0.35);}
.node.unlocked{border-color:var(--gold); color:var(--chalk);}
.node.done{background:var(--ok); border-color:var(--ok); color:#16291f;}
.node.locked{cursor:not-allowed; opacity:0.55;}
.node.locked:hover{transform:none; box-shadow:none;}
.node-label{
  text-align:center;
  font-size:12px;
  color:var(--chalk-dim);
  margin-top:8px;
  font-family:'Space Mono',monospace;
}
.node-col{display:flex; flex-direction:column; align-items:center; z-index:1;}

.level-desc{
  text-align:center;
  color:var(--chalk-dim);
  font-size:14px;
  margin-top:26px;
  line-height:1.6;
}

/* ---------- Game header ---------- */
.game-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
  font-family:'Space Mono',monospace;
  font-size:13px;
  color:var(--chalk-dim);
}
.progress-track{
  height:8px;
  background:var(--board-dark);
  border-radius:4px;
  overflow:hidden;
  margin-bottom:22px;
  border:1px solid rgba(232,196,104,0.25);
}
.progress-fill{
  height:100%;
  background:linear-gradient(90deg, var(--gold-dim), var(--gold));
  width:0%;
  transition:width .35s ease;
}
.score-pill{
  font-family:'Space Mono',monospace;
  color:var(--gold);
  font-size:13px;
}

/* ---------- Question card ---------- */
.q-index{
  font-family:'Space Mono',monospace;
  font-size:12px;
  color:#9a8e6a;
  letter-spacing:0.1em;
  text-transform:uppercase;
  margin-bottom:10px;
}
.question{
  font-family:'Space Mono',monospace;
  font-size:26px;
  font-weight:700;
  color:#2b2b26;
  margin-bottom:26px;
  line-height:1.5;
  word-wrap:break-word;
}
.options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
@media (max-width:520px){ .options{grid-template-columns:1fr;} }
.opt{
  font-family:'Nunito',sans-serif;
  font-weight:700;
  font-size:17px;
  padding:16px 18px;
  border-radius:6px;
  border:2px solid var(--paper-line);
  background:#fff;
  color:#2b2b26;
  cursor:pointer;
  text-align:left;
  transition:transform .1s ease, border-color .15s ease, background .15s ease;
}
.opt:hover{border-color:var(--gold-dim); transform:translateY(-2px);}
.opt.correct{background:var(--ok); border-color:var(--ok); color:#16291f;}
.opt.wrong{background:var(--bad); border-color:var(--bad); color:#fff;}
.opt.disabled{pointer-events:none; opacity:0.55;}
.opt.disabled.correct, .opt.disabled.wrong{opacity:1;}

.feedback{
  min-height:26px;
  margin-top:16px;
  font-family:'Space Mono',monospace;
  font-size:13px;
  color:#5c6b52;
}
.next-btn-wrap{margin-top:18px; text-align:right;}

/* ---------- Buttons ---------- */
.btn{
  font-family:'Patrick Hand',cursive;
  font-size:20px;
  padding:11px 26px;
  border-radius:6px;
  border:none;
  cursor:pointer;
  background:var(--gold);
  color:#2b2412;
  transition:transform .12s ease, box-shadow .12s ease;
}
.btn:hover{transform:translateY(-2px); box-shadow:0 6px 14px rgba(0,0,0,0.25);}
.btn.ghost{
  background:transparent;
  border:2px solid var(--gold-dim);
  color:var(--chalk);
}
.btn.small{font-size:16px; padding:8px 18px;}

/* ---------- Result screen ---------- */
.result-wrap{
  text-align:center;
  padding:44px 34px;
}
.result-score{
  font-family:'Patrick Hand',cursive;
  font-size:64px;
  margin:6px 0 2px 0;
  color:#2b2b26;
}
.result-sub{color:#6b6b5e; margin-bottom:20px; font-size:15px;}
.stars{font-size:34px; letter-spacing:6px; margin-bottom:18px;}
.result-actions{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:22px;}
.chalk-mark{
  font-family:'Patrick Hand',cursive;
  font-size:15px;
  color:#8a8060;
}

.hidden{display:none !important;}

.top-actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}
.back-link{
  font-family:'Space Mono',monospace;
  font-size:12px;
  color:var(--chalk-dim);
  cursor:pointer;
  background:none;
  border:none;
  text-decoration:underline;
  padding:0;
}
.back-link:hover{color:var(--chalk);}

/* ---- Nút Trở Lại Game, phát sáng, nổi cố định góc trên phải ---- */
.back-to-game-float{
  position:fixed;
  top:14px; right:14px;
  z-index:9999;
  display:inline-flex; align-items:center; gap:8px;
  padding:9px 16px;
  border-radius:40px;
  text-decoration:none;
  font-family:'Nunito',sans-serif;
  font-size:13px; font-weight:800; letter-spacing:.3px;
  color:#fff;
  background:linear-gradient(90deg,#ff5a3c,#ff1a5e 50%,#7b68ee 100%);
  background-size:200% 100%;
  box-shadow:
    0 0 14px rgba(255,26,94,.55),
    0 0 30px rgba(123,104,238,.45),
    0 6px 18px -8px rgba(0,0,0,.6);
  animation: btnGlowFloat 2.2s ease-in-out infinite, btnGradientFloat 4s linear infinite;
  transition: transform .18s ease;
  user-select:none;
}
.back-to-game-float:hover{ transform:scale(1.05); }
.back-to-game-float:active{ transform:scale(.97); }
.back-to-game-float .icon{ font-size:15px; animation: iconPulseFloat 1.4s ease-in-out infinite; }

@keyframes btnGlowFloat{
  0%, 100% {
    box-shadow:
      0 0 14px rgba(255,26,94,.55),
      0 0 30px rgba(123,104,238,.45),
      0 6px 18px -8px rgba(0,0,0,.6);
  }
  50% {
    box-shadow:
      0 0 22px rgba(255,26,94,.85),
      0 0 46px rgba(123,104,238,.7),
      0 6px 18px -8px rgba(0,0,0,.6);
  }
}
@keyframes btnGradientFloat{
  0%   { background-position: 0% 50%; }
  100% { background-position: 200% 50%; }
}
@keyframes iconPulseFloat{
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.18); }
}
</style>
</head>
<body>

<a class="back-to-game-float" href="https://khoidoan.site/index">
  <span class="icon">🎮</span><span>Trở Lại Game</span>
</a>

<div class="stage">
  <div class="eyebrow">Toán Học · Trung Học Cơ Sở</div>
  <h1 class="title">Hành Trình Toán Học</h1>
  <div class="subtitle">5 chặng đường · mỗi chặng 10 câu hỏi · chinh phục từng cấp độ</div>

  <!-- SCREEN 1: LEVEL SELECT -->
  <div id="screen-select" class="card">
    <div class="path-wrap">
      <div class="path" id="path"></div>
      <div class="level-desc" id="level-desc">Chọn một cấp độ để bắt đầu. Hoàn thành cấp độ trước để mở khoá cấp độ tiếp theo.</div>
    </div>
  </div>

  <!-- SCREEN 2: GAME -->
  <div id="screen-game" class="card hidden">
    <div class="card-inner">
      <div class="top-actions">
        <button class="back-link" id="btn-quit">← Quay lại chọn cấp độ</button>
        <span class="score-pill" id="score-pill">Điểm: 0/10</span>
      </div>
      <div class="game-header">
        <span id="level-tag">Cấp độ 1</span>
        <span id="q-count">Câu 1/10</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>

      <div class="q-index" id="q-topic">Chủ đề</div>
      <div class="question" id="question-text">...</div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <div class="next-btn-wrap">
        <button class="btn hidden" id="btn-next">Câu tiếp theo →</button>
      </div>
    </div>
  </div>

  <!-- SCREEN 3: RESULT -->
  <div id="screen-result" class="card hidden">
    <div class="result-wrap">
      <div class="chalk-mark" id="result-level">Cấp độ 1 — hoàn thành</div>
      <div class="result-score" id="result-score">0/10</div>
      <div class="stars" id="result-stars">☆☆☆</div>
      <div class="result-sub" id="result-sub">Tiếp tục cố gắng nhé!</div>
      <div class="result-actions">
        <button class="btn ghost small" id="btn-retry">Làm lại cấp độ này</button>
        <button class="btn small" id="btn-next-level">Cấp độ tiếp theo →</button>
        <button class="btn ghost small" id="btn-home">Về trang chọn cấp độ</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   STATE
============================================================ */
const STORAGE_KEY = "mathgame_progress_v1";
let progress = loadProgress();

function loadProgress(){
  try{
    const raw = localStorageSafeGet();
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { unlocked: 1, best: {1:null,2:null,3:null,4:null,5:null} };
}
// Artifacts environment disallows localStorage; keep everything in-memory instead.
let memoryStore = { unlocked: 1, best: {1:null,2:null,3:null,4:null,5:null} };
function localStorageSafeGet(){ return null; }
progress = memoryStore;

let session = {
  level: 1,
  qIndex: 0,
  score: 0,
  questions: [],
  answered: false
};

/* ============================================================
   MATH HELPERS
============================================================ */
function randInt(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }
function randNonZero(min,max){ let v=0; while(v===0){ v = randInt(min,max);} return v; }
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){[a,b]=[b,a%b];} return a||1; }
function fracStr(num, den){
  if(den < 0){ num=-num; den=-den; }
  const g = gcd(num,den);
  num/=g; den/=g;
  if(den===1) return `${num}`;
  return `${num}/${den}`;
}
function fmt(n){
  // pretty print numbers, avoid -0
  if(Object.is(n,-0)) n = 0;
  return n.toString();
}

// Build a multiple-choice set given a correct value (number or string) and a distractor generator
function buildOptions(correctLabel, distractorFn){
  const set = new Set([correctLabel]);
  let guard = 0;
  while(set.size < 4 && guard < 60){
    guard++;
    const d = distractorFn();
    if(d !== undefined && d !== null) set.add(String(d));
  }
  // guard fallback if distinct distractors run out
  while(set.size < 4){
    set.add(correctLabel + "·" + set.size); // extremely unlikely fallback, kept unique
  }
  const options = shuffle(Array.from(set));
  return { options, correctIndex: options.indexOf(correctLabel) };
}

function makeQuestion(topic, questionText, correctLabel, distractorFn){
  const { options, correctIndex } = buildOptions(String(correctLabel), distractorFn);
  return { topic, text: questionText, options, correctIndex };
}

/* ============================================================
   LEVEL 1 — Lớp 6: số nguyên, phân số cơ bản, thứ tự thực hiện
============================================================ */
const level1Generators = [
  function addSubInt(){
    const a = randInt(-30,30), b = randInt(-30,30);
    const op = Math.random()<0.5 ? '+' : '-';
    const correct = op==='+' ? a+b : a-b;
    const text = `${a} ${op} (${b})`;
    return makeQuestion("Số nguyên", `Tính: ${text} = ?`, fmt(correct), () => correct + randInt(-6,6)||correct+1);
  },
  function mulDivInt(){
    const a = randInt(-12,12)||2, b = randNonZero(-9,9);
    const useMul = Math.random()<0.5;
    if(useMul){
      const correct = a*b;
      return makeQuestion("Số nguyên", `Tính: ${a} × (${b}) = ?`, fmt(correct), () => correct + randInt(-8,8)||correct+2);
    } else {
      const q = randInt(-9,9)||2;
      const product = q*b;
      return makeQuestion("Số nguyên", `Tính: ${product} : (${b}) = ?`, fmt(q), () => q + randInt(-5,5)||q+1);
    }
  },
  function orderOps(){
    const a = randInt(2,9), b = randInt(2,9), c = randInt(2,9);
    const correct = a + b*c;
    return makeQuestion("Thứ tự thực hiện", `Tính: ${a} + ${b} × ${c} = ?`, fmt(correct), () => {
      const wrong = (a+b)*c; // common mistake ignoring order
      const alt = correct + randInt(-6,6);
      return Math.random()<0.5 ? wrong : alt;
    });
  },
  function fracAddSimple(){
    const den = [2,3,4,5,6][randInt(0,4)];
    const n1 = randInt(1,den-1), n2 = randInt(1,den-1);
    const num = n1+n2;
    const correct = fracStr(num, den);
    return makeQuestion("Phân số", `Tính: ${n1}/${den} + ${n2}/${den} = ?`, correct, () => {
      const num2 = num + randInt(-2,2)||num+1;
      return fracStr(num2, den);
    });
  },
  function compareFrac(){
    const d1 = randInt(2,9), d2 = randInt(2,9);
    const n1 = randInt(1,d1-1<1?1:d1-1)||1, n2 = randInt(1,d2-1<1?1:d2-1)||1;
    const left = n1/d1, right = n2/d2;
    const correct = left>right ? ">" : (left<right ? "<" : "=");
    return makeQuestion("So sánh phân số", `So sánh: ${n1}/${d1} ___ ${n2}/${d2}`, correct, () => shuffle([">","<","="])[0]);
  },
  function simplifyFrac(){
    const g = randInt(2,6);
    const n = randInt(2,8), d = randInt(n+1,12);
    const num = n*g, den = d*g;
    const correct = fracStr(num,den);
    return makeQuestion("Rút gọn phân số", `Rút gọn phân số: ${num}/${den}`, correct, () => {
      const dn = n + randInt(-2,2)||n+1;
      return fracStr(Math.max(1,dn), d);
    });
  }
];

/* ============================================================
   LEVEL 2 — Lớp 7: số hữu tỉ, lũy thừa, tỉ lệ thức, căn đơn giản
============================================================ */
const level2Generators = [
  function powerCalc(){
    const base = randInt(2,6);
    const exp = randInt(2,3);
    const correct = Math.pow(base,exp);
    return makeQuestion("Luỹ thừa", `Tính: ${base}^${exp} = ?`, fmt(correct), () => correct + randInt(-10,10)||correct+3);
  },
  function powerMul(){
    const base = randInt(2,5);
    const e1 = randInt(2,4), e2 = randInt(1,3);
    const correct = `${base}^${e1+e2}`;
    return makeQuestion("Luỹ thừa", `Rút gọn: ${base}^${e1} × ${base}^${e2} = ?`, correct, () => `${base}^${e1+e2 + (randInt(-2,2)||1)}`);
  },
  function fracMulDiv(){
    const n1=randInt(1,8), d1=randInt(2,9), n2=randInt(1,8), d2=randInt(2,9);
    const isMul = Math.random()<0.5;
    if(isMul){
      const correct = fracStr(n1*n2, d1*d2);
      return makeQuestion("Số hữu tỉ", `Tính: ${n1}/${d1} × ${n2}/${d2} = ?`, correct, () => fracStr(n1*n2 + (randInt(-3,3)||1), d1*d2));
    } else {
      const correct = fracStr(n1*d2, d1*n2);
      return makeQuestion("Số hữu tỉ", `Tính: ${n1}/${d1} : ${n2}/${d2} = ?`, correct, () => fracStr(n1*d2 + (randInt(-3,3)||1), d1*n2));
    }
  },
  function proportion(){
    // a/b = x/d  -> find x
    const a = randInt(2,9), b = randInt(2,9), k = randInt(2,6);
    const d = b*k;
    const x = a*k;
    return makeQuestion("Tỉ lệ thức", `Tìm x biết: ${a}/${b} = x/${d}`, fmt(x), () => x + randInt(-6,6)||x+2);
  },
  function sqrtPerfect(){
    const r = randInt(2,12);
    const sq = r*r;
    return makeQuestion("Căn bậc hai", `Tính: √${sq} = ?`, fmt(r), () => r + randInt(-3,3)||r+1);
  },
  function ratioNeg(){
    const a = randInt(-9,-1), b = randInt(1,9);
    const correct = a+b;
    return makeQuestion("Số hữu tỉ", `Tính: (${a}) + ${b} = ?`, fmt(correct), () => correct + randInt(-5,5)||correct+2);
  }
];

/* ============================================================
   LEVEL 3 — Lớp 8: phương trình bậc nhất, hằng đẳng thức, đa thức
============================================================ */
const level3Generators = [
  function linearEq(){
    // ax + b = c  -> x = (c-b)/a, keep integer
    const a = randInt(2,9);
    const x = randInt(-10,10);
    const b = randInt(-15,15);
    const c = a*x + b;
    return makeQuestion("Phương trình bậc nhất", `Giải phương trình: ${a}x ${b>=0?'+':'-'} ${Math.abs(b)} = ${c}. Tìm x.`, fmt(x), () => x + randInt(-4,4)||x+1);
  },
  function squareSum(){
    const a = randInt(2,9), b = randInt(1,9);
    const correct = `${a}²x² + ${2*a*b}x + ${b*b}`;
    return makeQuestion("Hằng đẳng thức", `Khai triển: (${a}x + ${b})² = ?`, correct, () => `${a}²x² + ${2*a*b + (randInt(-4,4)||2)}x + ${b*b}`);
  },
  function squareDiff(){
    const a = randInt(2,9), b = randInt(1,9);
    const correct = `${a*a}x² - ${b*b}`;
    return makeQuestion("Hằng đẳng thức", `Khai triển: (${a}x - ${b})(${a}x + ${b}) = ?`, correct, () => `${a*a}x² - ${b*b + (randInt(-4,4)||2)}`);
  },
  function polyMul(){
    const a = randInt(2,7), b = randInt(1,7);
    const correct = fmt(a*b);
    return makeQuestion("Đa thức", `Hệ số của x trong (x + ${a})(x + ${b}) khi khai triển là bao nhiêu (hệ số của x, tức ${a}+${b})?`, fmt(a+b), () => a+b + (randInt(-3,3)||1));
  },
  function factorSimple(){
    const a = randInt(2,9), x = "x";
    const b = randInt(2,9);
    const g = gcd(a,b);
    const correct = `${g}(${a/g}x + ${b/g})`;
    return makeQuestion("Phân tích nhân tử", `Phân tích thành nhân tử: ${a}x + ${b} = ?`, correct, () => `${g}(${a/g + (randInt(-1,1)||1)}x + ${b/g})`);
  },
  function twoStepLinear(){
    const a = randInt(2,8), x = randInt(-9,9), b = randInt(-10,10), d = randInt(1,5);
    const c = a*x + b*d;
    return makeQuestion("Phương trình bậc nhất", `Giải: ${a}x + ${b} = ${c - b*d + b}  (rút gọn: ${a}x = ${a*x}). Tìm x.`, fmt(x), () => x + randInt(-3,3)||x+1);
  }
];

/* ============================================================
   LEVEL 4 — Lớp 9: căn thức, phương trình bậc hai, hệ phương trình, Pytago
============================================================ */
const level4Generators = [
  function simplifySqrt(){
    // sqrt(k^2 * n)
    const k = randInt(2,6), n = [2,3,5,6,7][randInt(0,4)];
    const inside = k*k*n;
    const correct = `${k}√${n}`;
    return makeQuestion("Căn thức", `Rút gọn: √${inside} = ?`, correct, () => `${k + (randInt(-1,1)||1)}√${n}`);
  },
  function quadFactor(){
    // (x - r1)(x - r2) = 0, integer roots
    const r1 = randInt(-8,8)||1, r2 = randInt(-8,8)||2;
    const b = -(r1+r2), c = r1*r2;
    const bTxt = b>=0? `+ ${b}x` : `- ${Math.abs(b)}x`;
    const cTxt = c>=0? `+ ${c}` : `- ${Math.abs(c)}`;
    const roots = [r1,r2].sort((a,b)=>a-b);
    const correct = `x = ${roots[0]} hoặc x = ${roots[1]}`;
    return makeQuestion("Phương trình bậc hai", `Giải phương trình: x² ${bTxt} ${cTxt} = 0`, correct, () => {
      const rr1 = r1 + (randInt(-2,2)||1), rr2 = r2;
      const s = [rr1,rr2].sort((a,b)=>a-b);
      return `x = ${s[0]} hoặc x = ${s[1]}`;
    });
  },
  function pythagoras(){
    const triples = [[3,4,5],[6,8,10],[5,12,13],[9,12,15],[8,15,17],[7,24,25]];
    const t = triples[randInt(0,triples.length-1)];
    const legs = Math.random()<0.5 ? [t[0],t[1]] : [t[1],t[0]];
    return makeQuestion("Định lý Pytago", `Tam giác vuông có hai cạnh góc vuông ${legs[0]} và ${legs[1]}. Tính cạnh huyền.`, fmt(t[2]), () => t[2] + randInt(-3,3)||t[2]+1);
  },
  function linearSystem(){
    // x+y = s, x-y = d -> nice integers
    const x = randInt(1,10), y = randInt(1,10);
    const s = x+y, d = x-y;
    const correct = `x = ${x}, y = ${y}`;
    return makeQuestion("Hệ phương trình", `Giải hệ: x + y = ${s} và x − y = ${d}. Tìm x, y.`, correct, () => `x = ${x + (randInt(-2,2)||1)}, y = ${y}`);
  },
  function rationalEqSimple(){
    const a = randInt(2,8), x = randInt(-6,6)||2;
    const c = a*x;
    return makeQuestion("Phương trình", `Giải: x/${a} = ${x} : 1 tương đương ${a}·(kết quả) = ${c}. Biết ${a}x = ${c}, tìm x.`, fmt(x), () => x + randInt(-3,3)||x+1);
  },
  function sqrtOps(){
    const a = randInt(2,6), n = [2,3,5][randInt(0,2)];
    const b = randInt(1,5);
    const coeff = a+b;
    return makeQuestion("Căn thức", `Tính: ${a}√${n} + ${b}√${n} = ?`, `${coeff}√${n}`, () => `${coeff + (randInt(-2,2)||1)}√${n}`);
  }
];

/* ============================================================
   LEVEL 5 — Tổng hợp nâng cao: bài toán thực tế, hình học, %
============================================================ */
const level5Generators = [
  function percentProblem(){
    const total = randInt(4,20)*25;
    const pct = [10,20,25,40,50,75][randInt(0,5)];
    const correct = total*pct/100;
    return makeQuestion("Phần trăm", `Một cửa hàng có ${total} sản phẩm, bán được ${pct}% số sản phẩm. Hỏi đã bán bao nhiêu sản phẩm?`, fmt(correct), () => correct + (randInt(-8,8)||4));
  },
  function speedDistance(){
    const v = randInt(30,80);
    const t = randInt(2,6);
    const correct = v*t;
    return makeQuestion("Chuyển động", `Một ô tô đi với vận tốc ${v} km/h trong ${t} giờ. Tính quãng đường đi được.`, `${correct} km`, () => `${correct + (randInt(-30,30)||10)} km`);
  },
  function rectangleArea(){
    const w = randInt(3,20), h = randInt(3,20);
    const correct = w*h;
    return makeQuestion("Hình học", `Một hình chữ nhật có chiều dài ${h} m và chiều rộng ${w} m. Tính diện tích.`, `${correct} m²`, () => `${correct + (randInt(-15,15)||6)} m²`);
  },
  function circlePerimeter(){
    const r = randInt(2,10);
    const correct = `${2*r}π`;
    return makeQuestion("Hình học", `Đường tròn bán kính ${r} cm. Tính chu vi (theo π).`, `${correct} cm`, () => `${2*r + (randInt(-3,3)||1)}π cm`);
  },
  function quadFactorHard(){
    const r1 = randInt(-9,9)||1, r2 = randInt(-9,9)||3;
    const b = -(r1+r2), c = r1*r2;
    const bTxt = b>=0? `+ ${b}x` : `- ${Math.abs(b)}x`;
    const cTxt = c>=0? `+ ${c}` : `- ${Math.abs(c)}`;
    const roots = [r1,r2].sort((a,b)=>a-b);
    const correct = `x = ${roots[0]} hoặc x = ${roots[1]}`;
    return makeQuestion("Phương trình bậc hai", `Giải phương trình: x² ${bTxt} ${cTxt} = 0`, correct, () => {
      const s = [r1 + (randInt(-2,2)||1), r2].sort((a,b)=>a-b);
      return `x = ${s[0]} hoặc x = ${s[1]}`;
    });
  },
  function mixedOrder(){
    const a=randInt(2,9), b=randInt(2,9), c=randInt(2,9), d=randInt(2,9);
    const correct = a*b - c + d;
    return makeQuestion("Tổng hợp", `Tính: ${a} × ${b} − ${c} + ${d} = ?`, fmt(correct), () => correct + (randInt(-7,7)||3));
  },
  function ageWordProblem(){
    const now = randInt(8,15);
    const years = randInt(3,10);
    const correct = now+years;
    return makeQuestion("Bài toán thực tế", `Năm nay An ${now} tuổi. Hỏi ${years} năm nữa An bao nhiêu tuổi?`, `${correct} tuổi`, () => `${correct + (randInt(-4,4)||2)} tuổi`);
  }
];

const LEVELS = {
  1: { title: "Cấp độ 1", subtitle: "Số nguyên & phân số (lớp 6)", gens: level1Generators },
  2: { title: "Cấp độ 2", subtitle: "Số hữu tỉ, luỹ thừa (lớp 7)", gens: level2Generators },
  3: { title: "Cấp độ 3", subtitle: "Phương trình & hằng đẳng thức (lớp 8)", gens: level3Generators },
  4: { title: "Cấp độ 4", subtitle: "Căn thức, bậc hai, hệ pt (lớp 9)", gens: level4Generators },
  5: { title: "Cấp độ 5", subtitle: "Tổng hợp nâng cao", gens: level5Generators }
};

function buildQuestionSet(level){
  const gens = LEVELS[level].gens;
  const qs = [];
  // cycle through generators, shuffled, to reach 10 with variety
  let pool = shuffle(gens);
  let idx = 0;
  while(qs.length < 10){
    if(idx >= pool.length){ pool = shuffle(gens); idx = 0; }
    qs.push(pool[idx]());
    idx++;
  }
  return qs;
}

/* ============================================================
   UI: LEVEL SELECT
============================================================ */
const pathEl = document.getElementById('path');
const levelDescEl = document.getElementById('level-desc');

function renderPath(){
  pathEl.innerHTML = "";
  for(let lv=1; lv<=5; lv++){
    const col = document.createElement('div');
    col.className = 'node-col';

    const node = document.createElement('div');
    const isUnlocked = lv <= progress.unlocked;
    const isDone = progress.best[lv] !== null;
    node.className = 'node ' + (isDone ? 'done' : (isUnlocked ? 'unlocked' : 'locked'));
    node.textContent = isDone ? '✓' : lv;
    node.addEventListener('click', () => {
      if(!isUnlocked) return;
      startLevel(lv);
    });
    col.appendChild(node);

    const label = document.createElement('div');
    label.className = 'node-label';
    label.textContent = LEVELS[lv].title;
    col.appendChild(label);

    pathEl.appendChild(col);
  }
}

pathEl.addEventListener('mouseover', (e) => {
  const col = e.target.closest('.node-col');
  if(!col) return;
});

// hover description update via delegation on nodes
document.addEventListener('mouseover', (e) => {
  const nodeCol = e.target.closest?.('.node-col');
});

function attachHoverDescriptions(){
  const cols = pathEl.querySelectorAll('.node-col');
  cols.forEach((col, i) => {
    const lv = i+1;
    col.addEventListener('mouseenter', () => {
      const best = progress.best[lv];
      const bestTxt = best !== null ? ` · Điểm cao nhất: ${best}/10` : '';
      levelDescEl.textContent = `${LEVELS[lv].title} — ${LEVELS[lv].subtitle}${bestTxt}`;
    });
  });
}

/* ============================================================
   SCREEN SWITCHING
============================================================ */
const screenSelect = document.getElementById('screen-select');
const screenGame = document.getElementById('screen-game');
const screenResult = document.getElementById('screen-result');

function showScreen(name){
  screenSelect.classList.add('hidden');
  screenGame.classList.add('hidden');
  screenResult.classList.add('hidden');
  if(name==='select') screenSelect.classList.remove('hidden');
  if(name==='game') screenGame.classList.remove('hidden');
  if(name==='result') screenResult.classList.remove('hidden');
}

/* ============================================================
   GAME LOGIC
============================================================ */
const levelTag = document.getElementById('level-tag');
const qCount = document.getElementById('q-count');
const progressFill = document.getElementById('progress-fill');
const scorePill = document.getElementById('score-pill');
const qTopic = document.getElementById('q-topic');
const questionText = document.getElementById('question-text');
const optionsEl = document.getElementById('options');
const feedbackEl = document.getElementById('feedback');
const btnNext = document.getElementById('btn-next');
const btnQuit = document.getElementById('btn-quit');

function startLevel(level){
  session = { level, qIndex: 0, score: 0, questions: buildQuestionSet(level), answered: false };
  levelTag.textContent = LEVELS[level].title + " · " + LEVELS[level].subtitle;
  showScreen('game');
  renderQuestion();
}

function renderQuestion(){
  const q = session.questions[session.qIndex];
  qCount.textContent = `Câu ${session.qIndex+1}/10`;
  scorePill.textContent = `Điểm: ${session.score}/10`;
  progressFill.style.width = `${(session.qIndex/10)*100}%`;
  qTopic.textContent = q.topic;
  questionText.textContent = q.text;
  feedbackEl.textContent = '';
  btnNext.classList.add('hidden');
  session.answered = false;

  optionsEl.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = opt;
    btn.addEventListener('click', () => handleAnswer(i));
    optionsEl.appendChild(btn);
  });
}

function handleAnswer(selectedIndex){
  if(session.answered) return;
  session.answered = true;
  const q = session.questions[session.qIndex];
  const optButtons = optionsEl.querySelectorAll('.opt');
  optButtons.forEach((b,i) => {
    b.classList.add('disabled');
    if(i === q.correctIndex) b.classList.add('correct');
    else if(i === selectedIndex) b.classList.add('wrong');
  });

  if(selectedIndex === q.correctIndex){
    session.score++;
    feedbackEl.textContent = '✓ Chính xác!';
    feedbackEl.style.color = '#4f7a3f';
  } else {
    feedbackEl.textContent = `✗ Chưa đúng. Đáp án đúng: ${q.options[q.correctIndex]}`;
    feedbackEl.style.color = '#a54545';
  }
  scorePill.textContent = `Điểm: ${session.score}/10`;
  progressFill.style.width = `${((session.qIndex+1)/10)*100}%`;
  btnNext.classList.remove('hidden');
  btnNext.textContent = session.qIndex === 9 ? 'Xem kết quả →' : 'Câu tiếp theo →';
}

btnNext.addEventListener('click', () => {
  if(session.qIndex < 9){
    session.qIndex++;
    renderQuestion();
  } else {
    finishLevel();
  }
});

btnQuit.addEventListener('click', () => {
  showScreen('select');
  renderPath();
  attachHoverDescriptions();
});

/* ============================================================
   RESULT SCREEN
============================================================ */
const resultLevel = document.getElementById('result-level');
const resultScore = document.getElementById('result-score');
const resultStars = document.getElementById('result-stars');
const resultSub = document.getElementById('result-sub');
const btnRetry = document.getElementById('btn-retry');
const btnNextLevel = document.getElementById('btn-next-level');
const btnHome = document.getElementById('btn-home');

function finishLevel(){
  const level = session.level;
  const score = session.score;

  if(progress.best[level] === null || score > progress.best[level]){
    progress.best[level] = score;
  }
  if(score >= 6 && level === progress.unlocked && progress.unlocked < 5){
    progress.unlocked = level + 1;
  }

  resultLevel.textContent = `${LEVELS[level].title} — hoàn thành`;
  resultScore.textContent = `${score}/10`;

  let stars = '☆☆☆';
  let sub = '';
  if(score >= 9){ stars = '★★★'; sub = 'Xuất sắc! Bạn đã nắm rất vững kiến thức này.'; }
  else if(score >= 7){ stars = '★★☆'; sub = 'Rất tốt! Chỉ còn vài chỗ cần ôn lại.'; }
  else if(score >= 5){ stars = '★☆☆'; sub = 'Khá ổn. Hãy luyện thêm để nắm chắc hơn nhé.'; }
  else { stars = '☆☆☆'; sub = 'Đừng nản! Hãy thử làm lại để cải thiện điểm số.'; }
  resultStars.textContent = stars;
  resultSub.textContent = sub;

  const canAdvance = level < 5;
  btnNextLevel.classList.toggle('hidden', !canAdvance);
  if(canAdvance){
    btnNextLevel.disabled = score < 6;
    btnNextLevel.style.opacity = score < 6 ? '0.5' : '1';
    btnNextLevel.textContent = score < 6
      ? 'Cần ≥ 6 điểm để mở khoá'
      : `${LEVELS[level+1].title} →`;
  }

  showScreen('result');
}

btnRetry.addEventListener('click', () => startLevel(session.level));
btnNextLevel.addEventListener('click', () => {
  if(session.score >= 6 && session.level < 5) startLevel(session.level + 1);
});
btnHome.addEventListener('click', () => {
  showScreen('select');
  renderPath();
  attachHoverDescriptions();
});

/* ============================================================
   INIT
============================================================ */
renderPath();
attachHoverDescriptions();
showScreen('select');
</script>
