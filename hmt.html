<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hệ Mặt Trời 3D</title>
<style>
:root{--ink:#eef4ff;--dim:#9fb2cc;--line:rgba(170,200,255,.28);--glass:rgba(5,9,24,.6);color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#02030a;color:var(--ink);font-family:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.top{position:fixed;left:18px;right:18px;top:calc(env(safe-area-inset-top,0px) + 14px);pointer-events:none}
.top h1{margin:0;font-size:clamp(1.6rem,5vw,2.8rem);font-weight:300;letter-spacing:.01em;text-shadow:0 2px 24px #000}
.top p{margin:4px 0 0;color:var(--dim);font-size:.9rem}
.bot{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);padding:0 14px 14px;display:flex;flex-direction:column;gap:10px;align-items:center}
.info{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:10px 16px;max-width:560px;width:100%;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:.95rem;line-height:1.45}
.info b{display:block;font-size:1.15rem;margin-bottom:2px}
.info span{color:var(--dim)}
.chips{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding:2px}
.chips button{flex:none;background:var(--glass);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font:inherit;font-size:.88rem;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.chips button.on{background:var(--ink);color:#050914;border-color:var(--ink)}
.chips button:focus-visible,input:focus-visible{outline:2px solid #6fd0ff;outline-offset:2px}
.sp{display:flex;gap:10px;align-items:center;color:var(--dim);font-size:.85rem}
.sp input{width:150px;accent-color:#6fd0ff}
.note{position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 18px);color:var(--dim);font-size:.75rem;text-align:right;max-width:170px;pointer-events:none}
#err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px}
@media (max-width:640px){.note{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top"><h1>Hệ Mặt Trời</h1><p>Kéo để xoay. Cuộn hoặc chụm hai ngón để phóng to.</p></div>
<div class="note">Kích thước và khoảng cách đã được thu gọn, không đúng tỉ lệ thật.</div>
<div class="bot">
<div class="info"><b id="nm"></b><span id="ft"></span></div>
<div class="chips" id="chips"></div>
<label class="sp">Tốc độ <input type="range" id="sp" min="0" max="8" step=".1" value="1"></label>
</div>
<div id="err">Không tải được thư viện 3D. Hãy kiểm tra kết nối mạng rồi tải lại trang.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
if(!window.THREE){document.getElementById("err").style.display="grid";return}
var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
var seed=11;function R(){seed=(seed*16807)%2147483647;return seed/2147483647}
function mix(a,b,k){return"rgb("+a.map(function(v,i){return Math.round(v+(b[i]-v)*k)}).join(",")+")"}
function mkTex(a,b,f,nb,bc){var c=document.createElement("canvas");c.width=512;c.height=256;var x=c.getContext("2d");
for(var y=0;y<256;y++){var k=.5+.5*Math.sin(y*f+Math.sin(y*.13)*2);x.fillStyle=mix(a,b,k);x.fillRect(0,y,512,1)}
for(var i=0;i<nb;i++){x.fillStyle=bc;x.globalAlpha=.25+R()*.4;x.beginPath();x.ellipse(R()*512,R()*256,10+R()*40,4+R()*18,0,0,7);x.fill()}
var t=new THREE.CanvasTexture(c);return t}
function glowTex(r,g,b){var c=document.createElement("canvas");c.width=c.height=128;var x=c.getContext("2d"),gr=x.createRadialGradient(64,64,0,64,64,64);
gr.addColorStop(0,"rgba("+r+","+g+","+b+",1)");gr.addColorStop(.3,"rgba("+r+","+g+","+b+",.35)");gr.addColorStop(1,"rgba("+r+","+g+","+b+",0)");
x.fillStyle=gr;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)}

var cv=document.getElementById("c"),ren=new THREE.WebGLRenderer({canvas:cv,antialias:true});
ren.setPixelRatio(Math.min(devicePixelRatio||1,2));
var scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(50,1,.1,8000);
function rs(){ren.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener("resize",rs);rs();

/* Sao nền + tinh vân */
var sp=new Float32Array(6000*3),sc=new Float32Array(6000*3);
for(var i=0;i<6000;i++){var u=R()*2-1,t=R()*6.283,s=Math.sqrt(1-u*u);sp[i*3]=1500*s*Math.cos(t);sp[i*3+1]=1500*u;sp[i*3+2]=1500*s*Math.sin(t);
var w=.6+R()*.4,tint=R();sc[i*3]=w*(tint<.3?1:.85);sc[i*3+1]=w*.9;sc[i*3+2]=w*(tint>.6?1:.8)}
var sg=new THREE.BufferGeometry();sg.setAttribute("position",new THREE.BufferAttribute(sp,3));sg.setAttribute("color",new THREE.BufferAttribute(sc,3));
var sky=new THREE.Group();scene.add(sky);
sky.add(new THREE.Points(sg,new THREE.PointsMaterial({size:1.6,sizeAttenuation:false,vertexColors:true,depthWrite:false})));
[[120,60,200],[40,120,220],[220,70,140]].forEach(function(c,i){var m=glowTex(c[0],c[1],c[2]);
for(var k=0;k<3;k++){var s=new THREE.Sprite(new THREE.SpriteMaterial({map:m,transparent:true,opacity:.22,blending:THREE.AdditiveBlending,depthWrite:false}));
var a=R()*6.283,e=(R()-.5)*1.2;s.position.set(1200*Math.cos(a),1200*Math.sin(e),1200*Math.sin(a));s.scale.setScalar(900+R()*700);sky.add(s)}});

/* Mặt Trời */
scene.add(new THREE.PointLight(0xfff0dc,1.7,0,0));scene.add(new THREE.AmbientLight(0x1b2740,.9));
var sun=new THREE.Mesh(new THREE.SphereGeometry(8,48,32),new THREE.MeshBasicMaterial({map:mkTex([255,140,30],[255,225,100],.6,90,"#ff6a00")}));scene.add(sun);
var gl1=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex(255,190,90),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));gl1.scale.setScalar(46);scene.add(gl1);

/* Hành tinh */
var P=[
{n:"Sao Thủy",r:.8,d:14,v:4.1,a:[110,100,95],b:[165,155,145],f:.5,nb:60,bc:"#4a4744",t:"Một năm chỉ dài 88 ngày Trái Đất."},
{n:"Sao Kim",r:1.5,d:20,v:1.6,a:[200,160,90],b:[238,208,145],f:.09,nb:30,bc:"#e8c27a",t:"Nóng nhất hệ, khoảng 465°C, và quay ngược chiều với phần lớn hành tinh."},
{n:"Trái Đất",r:1.6,d:28,v:1,a:[18,55,140],b:[32,95,185],f:.02,nb:70,bc:"#3b8f45",moon:1,t:"Hành tinh duy nhất được biết đến là có sự sống."},
{n:"Sao Hỏa",r:1.1,d:36,v:.53,a:[150,70,40],b:[205,115,62],f:.06,nb:50,bc:"#6b2f1a",t:"Có Olympus Mons, ngọn núi lửa cao khoảng 22 km."},
{n:"Sao Mộc",r:4.5,d:66,v:.084,a:[170,120,80],b:[242,218,184],f:.35,nb:20,bc:"#c0503a",t:"Lớn nhất hệ. Vết Đỏ Lớn là cơn bão đã được quan sát hơn 150 năm."},
{n:"Sao Thổ",r:3.8,d:88,v:.034,a:[200,175,120],b:[236,216,162],f:.25,nb:10,bc:"#d9b86a",ring:1,t:"Vành đai gồm băng và đá, trải rộng hàng trăm nghìn km."},
{n:"Sao Thiên Vương",r:2.6,d:108,v:.012,a:[130,200,210],b:[172,232,236],f:.05,nb:6,bc:"#bfffff",t:"Trục quay nghiêng gần 98°, nên nó gần như lăn trên quỹ đạo."},
{n:"Sao Hải Vương",r:2.5,d:126,v:.006,a:[40,70,200],b:[72,112,242],f:.12,nb:12,bc:"#8fb0ff",t:"Có gió mạnh nhất hệ, tốc độ có thể vượt 2.000 km/h."}];
P.forEach(function(p,i){
p.h=new THREE.Group();p.m=new THREE.Mesh(new THREE.SphereGeometry(p.r,48,32),new THREE.MeshStandardMaterial({map:mkTex(p.a,p.b,p.f,p.nb,p.bc),roughness:1,metalness:0}));p.h.add(p.m);
p.ang=R()*6.283;scene.add(p.h);
var pts=[];for(var k=0;k<=160;k++){var q=k/160*6.283;pts.push(new THREE.Vector3(Math.cos(q)*p.d,0,Math.sin(q)*p.d))}
scene.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x6c8cc8,transparent:true,opacity:.22})));
if(p.moon){p.mo=new THREE.Mesh(new THREE.SphereGeometry(.45,24,16),new THREE.MeshStandardMaterial({color:0xb9b9b9,roughness:1}));p.h.add(p.mo)}
if(p.ring){var rg=new THREE.RingGeometry(5,8.6,96),pp=rg.attributes.position,uv=rg.attributes.uv,v=new THREE.Vector3();
for(var j=0;j<pp.count;j++){v.fromBufferAttribute(pp,j);uv.setXY(j,(v.length()-5)/3.6,0)}
var rc=document.createElement("canvas");rc.width=256;rc.height=4;var rx=rc.getContext("2d");
for(var x=0;x<256;x++){var a=Math.max(0,.75*Math.sin(x*.19)*Math.sin(x*.047+1)+.35);if(x>150&&x<162)a=.04;rx.fillStyle="rgba(222,200,160,"+Math.min(a,.85)+")";rx.fillRect(x,0,1,4)}
var ring=new THREE.Mesh(rg,new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(rc),transparent:true,side:THREE.DoubleSide,depthWrite:false}));
ring.rotation.x=Math.PI/2.3;p.h.add(ring);p.m.rotation.z=.4}
});

/* Vành đai tiểu hành tinh */
var N=3000,bp=new Float32Array(N*3);
for(var i=0;i<N;i++){var a=R()*6.283,d=42+R()*11;bp[i*3]=Math.cos(a)*d;bp[i*3+1]=(R()-.5)*2.4;bp[i*3+2]=Math.sin(a)*d}
var bg=new THREE.BufferGeometry();bg.setAttribute("position",new THREE.BufferAttribute(bp,3));
var belt=new THREE.Points(bg,new THREE.PointsMaterial({color:0xa89c8c,size:.45,sizeAttenuation:true}));scene.add(belt);

/* Camera */
var th=.8,ph=1.1,dist=230,goal=230,tgt=new THREE.Vector3(),foc=-1;
var info=document.getElementById("nm"),ft=document.getElementById("ft"),chips=document.getElementById("chips"),cb=[];
var names=[["Tổng quan",-1],["Mặt Trời",-2]].concat(P.map(function(p,i){return[p.n,i]}));
function focus(k){foc=k;cb.forEach(function(b){b.classList.toggle("on",+b.dataset.k===k)});
if(k===-1){goal=230;info.textContent="Hệ Mặt Trời";ft.textContent="Tám hành tinh, một vành đai tiểu hành tinh và một ngôi sao. Chọn một thiên thể bên dưới để bay tới.";}
else if(k===-2){goal=34;info.textContent="Mặt Trời";ft.textContent="Chứa khoảng 99,86% khối lượng của cả hệ Mặt Trời.";}
else{goal=P[k].r*5+5;info.textContent=P[k].n;ft.textContent=P[k].t}}
names.forEach(function(n){var b=document.createElement("button");b.textContent=n[0];b.dataset.k=n[1];b.onclick=function(){focus(n[1])};cb.push(b);chips.appendChild(b)});
focus(-1);

var ptrs={},pd=0,cvs=cv;
cvs.addEventListener("pointerdown",function(e){ptrs[e.pointerId]=[e.clientX,e.clientY];cvs.setPointerCapture(e.pointerId);cvs.style.cursor="grabbing";pd=0});
cvs.addEventListener("pointerup",function(e){delete ptrs[e.pointerId];cvs.style.cursor="grab"});
cvs.addEventListener("pointercancel",function(e){delete ptrs[e.pointerId]});
cvs.addEventListener("pointermove",function(e){var o=ptrs[e.pointerId];if(!o)return;var ids=Object.keys(ptrs);
if(ids.length===1){th-=(e.clientX-o[0])*.006;ph=Math.min(3.0,Math.max(.15,ph-(e.clientY-o[1])*.006))}
else if(ids.length===2){var q=ptrs[ids.filter(function(i){return+i!==e.pointerId})[0]],d0=Math.hypot(o[0]-q[0],o[1]-q[1]),d1=Math.hypot(e.clientX-q[0],e.clientY-q[1]);goal=clampD(goal*d0/Math.max(d1,1))}
ptrs[e.pointerId]=[e.clientX,e.clientY]});
function clampD(v){return Math.min(3000,Math.max(3,v))}
cvs.addEventListener("wheel",function(e){e.preventDefault();goal=clampD(goal*Math.exp(e.deltaY*.0012))},{passive:false});

var spd=document.getElementById("sp");if(reduce)spd.value=.2;
var last=0,tmp=new THREE.Vector3();
function loop(now){var dt=Math.min((now-last)/1000,.05);last=now;var ts=+spd.value;
sun.rotation.y+=dt*.05*ts;belt.rotation.y+=dt*.01*ts;
P.forEach(function(p){p.ang+=dt*p.v*.05*ts;p.h.position.set(Math.cos(p.ang)*p.d,0,Math.sin(p.ang)*p.d);p.m.rotation.y+=dt*.6*ts;
if(p.mo)p.mo.position.set(Math.cos(p.ang*12)*3,0,Math.sin(p.ang*12)*3)});
if(foc>=0)tmp.copy(P[foc].h.position);else tmp.set(0,0,0);
tgt.lerp(tmp,.1);dist+=(goal-dist)*.07;
var s=Math.sin(ph);cam.position.set(tgt.x+dist*s*Math.cos(th),tgt.y+dist*Math.cos(ph),tgt.z+dist*s*Math.sin(th));cam.lookAt(tgt);sky.position.copy(cam.position);
ren.render(scene,cam);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
